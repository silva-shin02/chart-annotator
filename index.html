  /* B2: 分析モードの state (img にある場合はそこから復元 = Firebase同期対応) */
  var stAD=useState(function(){return (img&&img.analysisData)||null;});

  var stAT=useState('1m'); var analysisTf=stAT[0],setAnalysisTf=stAT[1];

  var analysisDataRef=useRef(analysisData);  // triggerAutoSave内で最新値参照用

     (元位置ではvar hoistingで refAnalysis=undefined を保持してしまい、
      ref側書込時に refAnalysisRef.current=null で早期returnする不具合があった) */

  var refAutoSaveTimerRef=useRef(null);

     同時にローカル IDB/memキャッシュにも反映 (再ロード時の stale 回避) */
  function triggerRefAutoSave(){
    var cfg=props.fbCfg;
    if(refAutoSaveTimerRef.current)clearTimeout(refAutoSaveTimerRef.current);
    refAutoSaveTimerRef.current=setTimeout(function(){
      var ref=refAnalysisRef.current;
      if(!ref||!ref.id)return;
      var newStrokes=ref.analysisStrokes||{'1m':[],'5m':[]};
      /* ローカルキャッシュ (IDB+mem) を最新化: 既存dataを読み取って analysisStrokes だけ差し替え */
      try{

      /* Firebase PATCH: paused中はFB書込のみスキップ (ローカルは更新済) */
      var cfg2=props.fbCfg;
      if(_fbIsPaused(cfg2))return;
      var auth=cfg2.secret?'?auth='+cfg2.secret:'';
      var dataBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts-data';
      var tsBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts';
      /* 2026-04-20 C8: ref書き込みも楽観ロック pre-check
         ref.loadedSavedAt 未管理のため、ref._savedAt (読込時にセット) を基準に */
      var refBase=ref._savedAt||0;
      fetch(tsBase+'/'+ref.id+'.json'+auth).then(function(r){return r.ok?r.json():null;})
        .then(function(tsPre){

          if(remoteT&&remoteT>refBase+200){

            console.warn('ref autoSave: version conflict, skipping write',ref.id);

          /* _v bump + ts 更新 (他端末同期用) */

            .catch(function(e){console.error('ref draft strokes sync:',e);});
          var savedAt=Date.now();

  var st4=useState(3);       var lineW=st4[0],setLineW=st4[1];
  var st5=useState(1);       var opacity=st5[0],setOpacity=st5[1];
  var st6=useState(false);    var horiz=st6[0],setHoriz=st6[1];

          var remoteT=tsPre&&tsPre.t;
          if(remoteT&&remoteT>loadedSavedAtRef.current+200){
            /* +200ms の grace period (自分直前の書き込みと端末時刻差を吸収) */
            setRemoteUpdate(true);
            setAutoSaveStatus(null);
            return;
          }
          doActualWrite();
        })
        .catch(function(){doActualWrite();}); /* pre-check失敗時は書き込み続行 (安全側) */

      function doActualWrite(){

      // 画像アップロード（初回のみ）
      var urlPromise;
      if(imageStorageUrlRef.current){
        urlPromise=Promise.resolve(imageStorageUrlRef.current);
      }else if(cfg2.storageBucket&&b64){
        urlPromise=uploadToStorage(cfg2,draftId,b64,mt).then(function(url){
          if(url)imageStorageUrlRef.current=url;
          return url;
        });
      }else{
        urlPromise=Promise.resolve(null);
      }

      urlPromise.then(function(imageUrl){
        var draftBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts';
        var draftDataBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts-data';
        var thumb=canvasRef.current?caGenThumb(compositeCanvas()):(img._thumb||'');
        /* 2026-04-20: thumb upload 30秒制限 (既存URL再利用で帯域削減) */
        var _nowThumb=Date.now();

        var _thumbP=_needUp?uploadThumbToStorage(cfg2,draftId,thumb):Promise.resolve(lastThumbUrlRef.current);
        // meta
        _thumbP.then(function(thumbUrl){
          if(_needUp&&thumbUrl){lastThumbUploadAtRef.current=_nowThumb;lastThumbUrlRef.current=thumbUrl;}
          var metaDb={ticker:img._ticker||'',name:img._name||img.name||'chart',savedAt:savedAt};
          if(thumbUrl)metaDb.thumbUrl=thumbUrl;
          var metaBody=JSON.stringify(metaDb);fetch(draftBase+'/'+draftId+'.json'+auth,{method:'PUT',
            headers:{'Content-Type':'application/json'},body:metaBody})
            .catch(function(e){console.error('draft meta sync:',e);});
        });
        // data — 2026-04-20 C8: _v を同梱 (polling側で競合検出に利用)
        var draftData=imageUrl
          ?{imageUrl:imageUrl,orig_mt:mt,strokes:strokes,name:img._name||img.name||'chart',_v:savedAt}
          :{orig_base64:b64,orig_mt:mt,strokes:strokes,name:img._name||img.name||'chart',_v:savedAt};
        /* B2+: 分析データがあれば同梱 (Firebase同期対応) */
        if(analysisDataRef.current)draftData.analysisData=analysisDataRef.current;
        /* B-drawing: 分析画面のストロークも同梱 (tf別オブジェクト) */
        if(analysisStrokesRef.current&&totalAnalysisStrokes(analysisStrokesRef.current)>0)draftData.analysisStrokes=analysisStrokesRef.current;
        var dataBody=JSON.stringify(draftData);fetch(draftDataBase+'/'+draftId+'.json'+auth,{method:'PUT',
          headers:{'Content-Type':'application/json'},body:dataBody})
          .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);
            setAutoSaveStatus('ok');setTimeout(function(){setAutoSaveStatus(null);},2000);
          })
          .catch(function(e){console.error('draft data sync:',e);
            setAutoSaveStatus('err');setTimeout(function(){setAutoSaveStatus(null);},3000);});
        // タイムスタンプ (version相当)
        var tsBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts';
        var tsBody=JSON.stringify({t:savedAt});fetch(tsBase+'/'+draftId+'.json'+auth,{method:'PUT',
          headers:{'Content-Type':'application/json'},body:tsBody}).catch(function(){});
        loadedSavedAtRef.current=savedAt;
        loadedVersionRef.current=savedAt;
      }).catch(function(e){
        console.error('triggerAutoSave:',e);
        setAutoSaveStatus('err');setTimeout(function(){setAutoSaveStatus(null);},3000);
      });
      } /* end doActualWrite */
    },1500);  /* 2026-04-20: 書込回数抑制のため 600 → 1500 (refAutoSaveと同値) */
  }

  function commit(strokes){
    histRef.current=histRef.current.slice(-19).concat([strokes]);
    futRef.current=[]; setCanUndo(true); setCanRedo(false);
    lastLocalCommitRef.current=Date.now();
    triggerAutoSave();
    try{
      var s=sessionStorage.getItem('ca_session');

  }

  // タイマークリーンアップ
  useEffect(function(){
    return function(){if(autoSaveTimerRef.current)clearTimeout(autoSaveTimerRef.current);};
  },[]);

  /* B2+: 分析データ(JSON)変更時の Firebase 自動保存トリガー
     初回mount時はskip (初期値は同期済みデータそのものなので重複保存しない) */
  var analysisDataInitSkip=useRef(true);

  // ── 別端末同期ポーリング（60秒ごとにタイムスタンプを確認）──
  useEffect(function(){
    var cfg=props.fbCfg;
    var draftId=img._draftId;
    if(_fbIsPaused(cfg)||!draftId)return;
    var auth=cfg.secret?'?auth='+cfg.secret:'';
    var tsUrl=cfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts/'+draftId+'.json'+auth;
    var dataUrl=cfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-data/'+draftId+'.json'+auth;

    function poll(){
      fetch(tsUrl).then(function(r){return r.ok?r.json():null;})
        .then(function(ts){
          if(!ts||!ts.t)return;
          var remoteT=ts.t;
          if(remoteT<=loadedSavedAtRef.current)return;
          var timeSinceCommit=Date.now()-lastLocalCommitRef.current;
          if(timeSinceCommit>45000){
            fetch(dataUrl).then(function(r){return r.ok?r.text():null;})
              .then(function(txt){
                if(!txt)return;var fbData; try{fbData=JSON.parse(txt);}catch(e){return;}
                if(!fbData||typeof fbData!=='object'||fbData.error)return;
                var newStrokes=Array.isArray(fbData.strokes)?fbData.strokes:[];
                strokesRef.current=newStrokes;
                histRef.current=[newStrokes]; futRef.current=[];
                setCanUndo(false); setCanRedo(false);
                rebuild(newStrokes);
                /* B2+: 分析データも同期 (自動保存トリガーは skip) */
                if(fbData.analysisData!==undefined){
                  analysisDataInitSkip.current=true;
                  setAnalysisData(fbData.analysisData||null);
                }
                /* B-drawing: 分析ストロークも同期 */
                if(fbData.analysisStrokes!==undefined){
                  analysisStrokesInitSkip.current=true;
                  setAnalysisStrokes(migrateAnalysisStrokes(fbData.analysisStrokes,'cur'));
                }
                loadedSavedAtRef.current=remoteT;
                /* 2026-04-20 C8: pull成功 → loadedVersionも同期 (以後の書き込みpre-checkの基準) */
                loadedVersionRef.current=(typeof fbData._v==='number')?fbData._v:remoteT;
                setRemoteUpdate(false);
                setAutoSaveStatus('ok');
                setTimeout(function(){setAutoSaveStatus(null);},2000);
                try{
                  var s=sessionStorage.getItem('ca_session');
                  if(s){var sd=JSON.parse(s);sd.strokes=newStrokes;sessionStorage.setItem('ca_session',JSON.stringify(sd));}
                }catch(e){}
              }).catch(function(){});
          } else {
            setRemoteUpdate(true);
          }
        }).catch(function(){});
    }

    /* 2026-04-20 C8: 楽観ロックと併用でポーリング間隔を5秒に短縮 (競合検出率向上) */
    var timer=setInterval(poll,5000);
    return function(){clearInterval(timer);};
  },[]);
  /* 分析モード用: ストローク変更を「現在のtfの履歴」に commit (C6: {cur,ref} 統合スナップショット)
     curStrokesObj: setAnalysisStrokes直後の全体オブジェクト
     refStrokesObj: setRefAnalysis直後の ref.analysisStrokes (refAnalysis無ければ null) */
  function analysisCommit(curStrokesObj, refStrokesObj){
    var tk=analysisTfRef.current||'1m';
    var curTfArr=((curStrokesObj&&curStrokesObj[tk])||[]).slice();
    /* refStrokesObj 未指定なら最新refAnalysisから取得 */
    var refSrc=refStrokesObj;
    if(refSrc===undefined){
      var ra=refAnalysisRef.current;
      refSrc=ra?ra.analysisStrokes:null;
    }
    var refTfArr=((refSrc&&refSrc[tk])||[]).slice();
    var hist=analysisHistRef.current[tk]||[];
    analysisHistRef.current[tk]=hist.slice(-19).concat([{cur:curTfArr,ref:refTfArr}]);
    analysisFutRef.current[tk]=[];
    if(modeTab==='analysis'){
      setCanUndo(analysisHistRef.current[tk].length>1);
      setCanRedo(false);
    }
  }
  function undo(){
    if(modeTab==='analysis'){
      var tk=analysisTfRef.current||'1m';
      var hist=analysisHistRef.current[tk]||[];
      if(hist.length<=1)return;
      var prev=hist[hist.length-2];
      var curObj=analysisStrokesRef.current||{'1m':[],'5m':[]};
      var curTfArrNow=((curObj[tk])||[]).slice();
      var ra=refAnalysisRef.current;
      var refTfArrNow=(ra&&ra.analysisStrokes&&(ra.analysisStrokes[tk]||[]).slice())||[];
      /* 現状をfutureへ退避 */
      analysisFutRef.current[tk]=[{cur:curTfArrNow,ref:refTfArrNow}].concat((analysisFutRef.current[tk]||[]).slice(0,19));
      analysisHistRef.current[tk]=hist.slice(0,-1);
      /* cur/ref 両方復元 */
      var nextCurObj=Object.assign({},curObj);
      nextCurObj[tk]=(prev.cur||[]).slice();
      setAnalysisStrokes(nextCurObj);
      if(ra){
        var nextRefStrokes=Object.assign({},(ra.analysisStrokes||{'1m':[],'5m':[]}));
        nextRefStrokes[tk]=(prev.ref||[]).slice();
        setRefAnalysis(Object.assign({},ra,{analysisStrokes:nextRefStrokes}));
        triggerRefAutoSave();
      }
      setCanUndo(analysisHistRef.current[tk].length>1);
      setCanRedo((analysisFutRef.current[tk]||[]).length>0);
      return;
    }
    if(histRef.current.length<=1)return;
    var prev2=histRef.current[histRef.current.length-2];
    futRef.current=[strokesRef.current].concat(futRef.current.slice(0,19));
    histRef.current=histRef.current.slice(0,-1);
    strokesRef.current=prev2;
    setSelIdxs(new Set()); setSelBounds(null); rebuild(prev2);
    setCanUndo(histRef.current.length>1); setCanRedo(true);
  }
  function redo(){
    if(modeTab==='analysis'){
      var tk=analysisTfRef.current||'1m';
      var fut=analysisFutRef.current[tk]||[];
      if(!fut.length)return;
      var next=fut[0], restFut=fut.slice(1);
      analysisFutRef.current[tk]=restFut;
      analysisHistRef.current[tk]=(analysisHistRef.current[tk]||[]).concat([{cur:(next.cur||[]).slice(),ref:(next.ref||[]).slice()}]);
      var curObj=analysisStrokesRef.current||{'1m':[],'5m':[]};
      var nextCurObj=Object.assign({},curObj);
      nextCurObj[tk]=(next.cur||[]).slice();
      setAnalysisStrokes(nextCurObj);
      var ra=refAnalysisRef.current;
      if(ra){
        var nextRefStrokes=Object.assign({},(ra.analysisStrokes||{'1m':[],'5m':[]}));
        nextRefStrokes[tk]=(next.ref||[]).slice();
        setRefAnalysis(Object.assign({},ra,{analysisStrokes:nextRefStrokes}));
        triggerRefAutoSave();
      }
      setCanUndo((analysisHistRef.current[tk]||[]).length>1);
      setCanRedo(restFut.length>0);
      return;
    }
    if(!futRef.current.length)return;
    var next2=futRef.current[0], rest=futRef.current.slice(1);
    futRef.current=rest;
    histRef.current=histRef.current.concat([next2]);
    strokesRef.current=next2;
    setSelIdxs(new Set()); setSelBounds(null); rebuild(next2);
    setCanUndo(true); setCanRedo(rest.length>0);
  }
  /* modeTab / analysisTf 切替時: canUndo/canRedo を現在モード・tfに同期 */
  useEffect(function(){

      var tk=analysisTf||'1m';

  function getPos(e){

  // ── リサイズハンドル ──
  function startResize(handleId,e){
    e.stopPropagation(); e.preventDefault();
    if(!selBounds||!canvasRef.current)return;
    var ob=Object.assign({},selBounds);
    var origStrokes=JSON.parse(JSON.stringify(strokesRef.current));
    var startX=e.clientX||(e.touches&&e.touches[0].clientX)||0;
    var startY=e.clientY||(e.touches&&e.touches[0].clientY)||0;
    resizeRef.current={handleId:handleId,ob:ob,origStrokes:origStrokes,startX:startX,startY:startY};

    // テキストストロークが単体選択 かつ ml/mr ハンドル → boxW のみ調整
    var isSingleText=selIdxs.size===1&&(function(){
      var idx=Array.from(selIdxs)[0];
      return origStrokes[idx]&&origStrokes[idx].type==="text";
    })();
    if(isSingleText&&(handleId==="ml"||handleId==="mr")){
      var tIdx=Array.from(selIdxs)[0];
      var origBoxW=origStrokes[tIdx].boxW||400;
      var origTX=origStrokes[tIdx].x;
      var rect0=canvasRef.current.getBoundingClientRect();
      var sw0=canvasRef.current.width/rect0.width/(dprRef.current||1);
      function onMovT(ev){
        ev.preventDefault&&ev.preventDefault();
        var cx0=ev.clientX||(ev.touches&&ev.touches[0].clientX)||0;
        var ddx=(cx0-startX)*sw0;
        var ns;
        if(handleId==="mr"){
          ns=origStrokes.map(function(s,i){return i===tIdx?Object.assign({},s,{boxW:Math.max(40,origBoxW+ddx)}):s;});
        } else {
          ns=origStrokes.map(function(s,i){return i===tIdx?Object.assign({},s,{x:origTX+ddx,boxW:Math.max(40,origBoxW-ddx)}):s;});
        }
        strokesRef.current=ns; rebuild(ns);
        var newIdxs=new Set([tIdx]);
        setSelBounds(getBoundsFromStrokes(newIdxs,ns));
      }
      function onUpT(){
        commit(strokesRef.current); resizeRef.current=null;
        window.removeEventListener("mousemove",onMovT);
        window.removeEventListener("mouseup",onUpT);
        window.removeEventListener("touchmove",onMovT);
        window.removeEventListener("touchend",onUpT);
        window.removeEventListener("touchcancel",onUpT);
      }
      window.addEventListener("mousemove",onMovT);
      window.addEventListener("mouseup",onUpT);
      window.addEventListener("touchmove",onMovT,{passive:false});
      window.addEventListener("touchend",onUpT);
      window.addEventListener("touchcancel",onUpT);
      return;
    }

    function onMov(ev){
      ev.preventDefault&&ev.preventDefault();
      var cx=ev.clientX||(ev.touches&&ev.touches[0].clientX)||0;
      var cy=ev.clientY||(ev.touches&&ev.touches[0].clientY)||0;
      var rect=canvasRef.current.getBoundingClientRect();
      var sw=canvasRef.current.width/rect.width/(dprRef.current||1), sh=canvasRef.current.height/rect.height/(dprRef.current||1);
      var sdx=(cx-resizeRef.current.startX)*sw, sdy=(cy-resizeRef.current.startY)*sh;
      var rb=resizeRef.current, nb=Object.assign({},rb.ob), hid=rb.handleId;
      if(hid.includes("l")){nb.x=rb.ob.x+sdx;nb.w=Math.max(10,rb.ob.w-sdx);}
      if(hid.includes("r")) nb.w=Math.max(10,rb.ob.w+sdx);
      if(hid.includes("t")){nb.y=rb.ob.y+sdy;nb.h=Math.max(10,rb.ob.h-sdy);}
      if(hid.includes("b")) nb.h=Math.max(10,rb.ob.h+sdy);
      var ns=rb.origStrokes.map(function(s,i){return selIdxs.has(i)?scaleStroke(s,rb.ob,nb):s;});
      strokesRef.current=ns; setSelBounds(nb); rebuild(ns);
    }
    function onUp(){
      commit(strokesRef.current); resizeRef.current=null;
      window.removeEventListener("mousemove",onMov);
      window.removeEventListener("mouseup",onUp);
      window.removeEventListener("touchmove",onMov);
      window.removeEventListener("touchend",onUp);
      window.removeEventListener("touchcancel",onUp);
    }
    window.addEventListener("mousemove",onMov);
    window.addEventListener("mouseup",onUp);
    window.addEventListener("touchmove",onMov,{passive:false});
    window.addEventListener("touchend",onUp);
    window.addEventListener("touchcancel",onUp);
  }

  // ── Build stroke ──
  function buildStroke(x1,y1,x2,y2){
    var b={color:color,lineW:lineW,opacity:opacity};
    switch(tool){
      case"line":   return Object.assign({},b,{type:"line",  x1:x1,y1:y1,x2:x2,y2:y2});
      case"dotted": return Object.assign({},b,{type:"dotted",x1:x1,y1:y1,x2:x2,y2:y2});
      case"arrow":  return Object.assign({},b,{type:"arrow", x1:x1,y1:y1,x2:x2,y2:y2});
      case"rect":   return Object.assign({},b,{type:"rect",  x1:x1,y1:y1,x2:x2,y2:y2});
      case"circle": return Object.assign({},b,{type:"circle",cx:(x1+x2)/2,cy:(y1+y2)/2,rx:Math.abs(x2-x1)/2,ry:Math.abs(y2-y1)/2});
      case"marker": return Object.assign({},b,{type:"marker",x1:x1,y1:y1,x2:x2,y2:y2});
      default:return null;
    }
  }

  // ── Event handlers ──
  var onStart=function(e){

    e.preventDefault();
    // Ctrl+ドラッグ → どのツールでもパン
    if((e.ctrlKey||e.metaKey)&&tool!=="pan"){
      var src00=e.touches?e.touches[0]:e;
      panRef.current={sx:src00.clientX,sy:src00.clientY,px:pan.x,py:pan.y};
      ctrlPanRef.current=true; return;
    }
    if(tool==="pan"){
      var src0=e.touches?e.touches[0]:e;
      panRef.current={sx:src0.clientX,sy:src0.clientY,px:pan.x,py:pan.y}; return;
    }
    var pos=getPos(e); lastPosRef.current=pos;
    if(tool==="lasso"){
      var er=IS_TOUCH?20:12;
      // テキストストロークは常に直接編集モードに（テキストツールと同じ動作）
      var hitIdxL=findStrokeAt(strokesRef.current,pos.x,pos.y,er);
      if(hitIdxL>=0&&strokesRef.current[hitIdxL].type==="text"){
        var hitTextL=strokesRef.current[hitIdxL];
        setSelIdxs(new Set()); setSelBounds(null);
        textDragRef.current={
          idx:hitIdxL, sx:pos.x, sy:pos.y,
          origX:hitTextL.x, origY:hitTextL.y,
          moved:false, stroke:hitTextL
        };
        return;
      }
      if(selBounds&&pos.x>=selBounds.x&&pos.x<=selBounds.x+selBounds.w&&pos.y>=selBounds.y&&pos.y<=selBounds.y+selBounds.h){
        selDragRef.current={sx:pos.x,sy:pos.y,dx:0,dy:0}; lassoModeRef.current="dragging_sel"; return;
      }
      if(hitIdxL>=0){
        var ni=new Set([hitIdxL]);
        setSelIdxs(ni); setSelBounds(getBoundsFromStrokes(ni,strokesRef.current));
        selDragRef.current={sx:pos.x,sy:pos.y,dx:0,dy:0}; lassoModeRef.current="dragging_sel"; return;
      }
      setSelIdxs(new Set()); setSelBounds(null); rebuild(strokesRef.current);
      // 空白クリック → パンモード開始
      var src0L=e.touches?e.touches[0]:e;
      panRef.current={sx:src0L.clientX,sy:src0L.clientY,px:pan.x,py:pan.y};
      lassoModeRef.current="panning"; return;
    }
    if(tool==="text"){
      var erT=IS_TOUCH?20:12, hiT=findStrokeAt(strokesRef.current,pos.x,pos.y,erT);
      var srcT=e.touches?e.touches[0]:e;
      var defBoxW=Math.round(canvasDimRef.current.w*0.6);
      if(hiT>=0&&strokesRef.current[hiT].type==="text"){
        var tsT=strokesRef.current[hiT];
        // まずドラッグ追跡モードに入る（ドラッグなら移動、クリックのみなら編集）
        textDragRef.current={
          idx:hiT, sx:pos.x, sy:pos.y,
          origX:tsT.x, origY:tsT.y,
          moved:false, stroke:tsT
        };
      } else {
        setTextInputState({x:pos.x,y:pos.y,idx:-1,text:"",
          fontSize:fontSize,fontBold:fontBold,color:color,opacity:opacity,
          boxW:null,
          screenX:srcT.clientX,screenY:srcT.clientY});
      }
      return;
    }
    drawRef.current={on:true,sx:pos.x,sy:pos.y};
    if(tool==="freehand"){
      freehandPts.current=[pos];
    }
  };

  var onMove=function(e){
    if(e.touches&&e.touches.length>=2)return;
    e.preventDefault();
    // Ctrl+ドラッグ中
    if(ctrlPanRef.current&&panRef.current){
      var src1c=e.touches?e.touches[0]:e;
      setPan({x:panRef.current.px+(src1c.clientX-panRef.current.sx),y:panRef.current.py+(src1c.clientY-panRef.current.sy)}); return;
    }
    if(tool==="pan"&&panRef.current){
      var src1=e.touches?e.touches[0]:e;
      setPan({x:panRef.current.px+(src1.clientX-panRef.current.sx),y:panRef.current.py+(src1.clientY-panRef.current.sy)}); return;
    }
    var rawPos=getPos(e); lastPosRef.current=rawPos;
    // テキストツール: 既存テキストのドラッグ移動（overlay canvas でプレビュー）
    if((tool==="text"||tool==="lasso")&&textDragRef.current){
      var tdx=rawPos.x-textDragRef.current.sx, tdy=rawPos.y-textDragRef.current.sy;
      if(!textDragRef.current.moved&&Math.hypot(tdx,tdy)>4){
        textDragRef.current.moved=true;
        // ドラッグ開始時に対象以外をメインキャンバスに一回だけ描画
        rebuild(strokesRef.current.filter(function(_,i){return i!==textDragRef.current.idx;}));
      }
      if(textDragRef.current.moved){
        var tNx=textDragRef.current.origX+tdx, tNy=textDragRef.current.origY+tdy;
        var tOc=overlayCtx();
        if(tOc){
          clearOverlay();
          drawStroke(tOc,Object.assign({},textDragRef.current.stroke,{x:tNx,y:tNy}));
        }
      }
      return;
    }
    if(tool==="lasso"){
      var mode2=lassoModeRef.current;
      if(mode2==="panning"&&panRef.current){
        var src1L=e.touches?e.touches[0]:e;
        setPan({x:panRef.current.px+(src1L.clientX-panRef.current.sx),y:panRef.current.py+(src1L.clientY-panRef.current.sy)}); return;
      }
      if(mode2==="dragging_sel"){
        var dx2=rawPos.x-selDragRef.current.sx,dy2=rawPos.y-selDragRef.current.sy;
        if(Math.hypot(dx2,dy2)>4){
          lassoModeRef.current="moving";
          // 移動開始時: メインキャンバスから選択ストロークを除外して再描画
          rebuild(strokesRef.current.filter(function(_,i){return !selIdxs.has(i);}));
        }
      } else if(mode2==="moving"){
        var mdx=rawPos.x-selDragRef.current.sx, mdy=rawPos.y-selDragRef.current.sy;
        selDragRef.current.dx=mdx; selDragRef.current.dy=mdy;
        var oc2=overlayCtx();
        if(oc2){clearOverlay();Array.from(selIdxs).forEach(function(i){drawStroke(oc2,shiftStroke(strokesRef.current[i],mdx,mdy));});}
        else{rebuild(strokesRef.current.filter(function(_,i){return !selIdxs.has(i);}));
          var mctx=canvasRef.current.getContext("2d");
          Array.from(selIdxs).forEach(function(i){drawStroke(mctx,shiftStroke(strokesRef.current[i],mdx,mdy));});}
      }
      return;
    }
    if(!drawRef.current.on)return;
    var pos2=snapPos(rawPos);
    var sdx=drawRef.current.sx, sdy=drawRef.current.sy;
    if(tool==="freehand"){
      var lp=freehandPts.current[freehandPts.current.length-1];
      if(!lp||Math.hypot(rawPos.x-lp.x,rawPos.y-lp.y)>1){
        freehandPts.current.push(rawPos);
        var oc_f=overlayCtx();
        if(oc_f){
          clearOverlay();
          drawStroke(oc_f,{type:"freehand",pts:freehandPts.current,color:color,lineW:lineW,opacity:opacity});
        }
      }
    } else if(tool==="eraser"){
      var er2=lineW*5;
      var after=strokesRef.current.filter(function(s){return !strokeHits(s,rawPos.x,rawPos.y,er2);});
      if(after.length!==strokesRef.current.length){strokesRef.current=after;rebuild(after);}
    } else {
      var ps=buildStroke(sdx,sdy,pos2.x,pos2.y);
      if(ps){
        var oc3=overlayCtx();
        if(oc3){clearOverlay();drawStroke(oc3,ps);}
        else{rebuild(strokesRef.current);drawStroke(canvasRef.current.getContext("2d"),ps);}
      }
    }
  };

  var onEnd=function(e){
    if(ctrlPanRef.current){ctrlPanRef.current=false;panRef.current=null;return;}
    // テキストツール: ドラッグ移動 or クリックで編集
    if((tool==="text"||tool==="lasso")&&textDragRef.current){
      var td=textDragRef.current; textDragRef.current=null;
      if(td.moved){
        // ドラッグ → 移動をコミット
        clearOverlay();
        var rawPosT=lastPosRef.current;
        var nx=td.origX+(rawPosT.x-td.sx), ny=td.origY+(rawPosT.y-td.sy);
        var ns=strokesRef.current.map(function(s,i){return i===td.idx?Object.assign({},s,{x:nx,y:ny}):s;});
        strokesRef.current=ns; commit(ns); rebuild(ns);
      } else {
        // クリックのみ → 編集モードへ
        var tsT2=strokesRef.current[td.idx];
        var sp2=canvasToScreen(tsT2.x,tsT2.y);
        var defBW=Math.round(canvasDimRef.current.w*0.6);
        setSelIdxs(new Set()); setSelBounds(null);
        setTextInputState({x:tsT2.x,y:tsT2.y,idx:td.idx,text:tsT2.text,
          fontSize:tsT2.fontSize||24,fontBold:tsT2.fontBold||false,
          color:tsT2.color||color,opacity:tsT2.opacity||1,
          boxW:tsT2.boxW||defBW,screenX:sp2.x,screenY:sp2.y});
      }
      return;
    }
    if(tool==="pan"){panRef.current=null;return;}
    if(tool==="lasso"){
      var mode3=lassoModeRef.current;
      if(mode3==="panning"){panRef.current=null;lassoModeRef.current="idle";return;}
      if(mode3==="moving"){
        var edx=selDragRef.current.dx,edy=selDragRef.current.dy;
        var ens=strokesRef.current.map(function(s,i){return selIdxs.has(i)?shiftStroke(s,edx,edy):s;});
        strokesRef.current=ens;
        var enb=selBounds?Object.assign({},selBounds,{x:selBounds.x+edx,y:selBounds.y+edy}):null;
        setSelBounds(enb); commit(ens); clearOverlay(); rebuild(ens); lassoModeRef.current="idle";
      } else {
        // ドラッグなしのクリック → テキストストローク単体選択なら即編集
        lassoModeRef.current="idle";
        if(selIdxs.size===1){
          var ltIdx=Array.from(selIdxs)[0];
          var ltS=strokesRef.current[ltIdx];
          if(ltS&&ltS.type==="text"){
            var ltSp=canvasToScreen(ltS.x,ltS.y);
            var ltBW=ltS.boxW||Math.round(canvasDimRef.current.w*0.6);
            setTextInputState({
              x:ltS.x,y:ltS.y,idx:ltIdx,text:ltS.text,
              fontSize:ltS.fontSize||24,fontBold:ltS.fontBold||false,
              color:ltS.color||color,opacity:ltS.opacity||1,
              boxW:ltBW,screenX:ltSp.x,screenY:ltSp.y
            });
          }
        }
      }
      return;
    }
    if(!drawRef.current.on)return;
    drawRef.current.on=false;
    var esx=drawRef.current.sx, esy=drawRef.current.sy;
    var rawPos2=e.changedTouches&&e.changedTouches.length
      ?getPos(Object.assign({},e,{touches:e.changedTouches}))
      :lastPosRef.current;
    if(tool==="freehand"){
      if(freehandPts.current.length>1){
        var fs2={type:"freehand",pts:freehandPts.current.slice(),color:color,lineW:lineW,opacity:opacity};
        var fns=strokesRef.current.concat([fs2]);
        strokesRef.current=fns; commit(fns); clearOverlay(); rebuild(fns);
      } else rebuild(strokesRef.current);
      freehandPts.current=[];
    } else if(tool==="eraser"){
      commit(strokesRef.current);
    } else {
      var ep=snapPos(rawPos2);
      var es=buildStroke(esx,esy,ep.x,ep.y);
      if(es&&(Math.abs(ep.x-esx)>1||Math.abs(ep.y-esy)>1)){
        var ens2=strokesRef.current.concat([es]);
        strokesRef.current=ens2; commit(ens2); clearOverlay(); rebuild(ens2);
      } else {clearOverlay(); rebuild(strokesRef.current);}
    }
  };

  var onTS=function(e){
    if(e.touches.length===2){
      drawRef.current.on=false;
      var tdx=e.touches[0].clientX-e.touches[1].clientX,tdy=e.touches[0].clientY-e.touches[1].clientY;
      var aRect=canvasAreaRef.current?canvasAreaRef.current.getBoundingClientRect():null;
      var acx=aRect?(aRect.left+aRect.width/2):0,acy=aRect?(aRect.top+aRect.height/2):0;
      pinchRef.current={d:Math.hypot(tdx,tdy),z:zoom,px:pan.x,py:pan.y,
        mx:(e.touches[0].clientX+e.touches[1].clientX)/2,my:(e.touches[0].clientY+e.touches[1].clientY)/2,
        acx:acx,acy:acy};
    } else onStart(e);
  };
  var onTM=function(e){
    if(e.touches.length===2&&pinchRef.current){
      e.preventDefault();
      var tdx2=e.touches[0].clientX-e.touches[1].clientX,tdy2=e.touches[0].clientY-e.touches[1].clientY;
      var td=Math.hypot(tdx2,tdy2),tmx=(e.touches[0].clientX+e.touches[1].clientX)/2,tmy=(e.touches[0].clientY+e.touches[1].clientY)/2;
      var p=pinchRef.current;
      var newZ=cZ(p.z*(td/p.d));
      var sc=newZ/p.z;
      // ピンチ位置を中心にズーム + パン移動
      var nx=p.px*sc+(p.mx-p.acx)*(1-sc)+(tmx-p.mx);
      var ny=p.py*sc+(p.my-p.acy)*(1-sc)+(tmy-p.my);
      setZoom(newZ);
      setPan({x:nx,y:ny});
    } else onMove(e);
  };
  var onTE=function(e){pinchRef.current=null;onEnd(e);};

  // ── タッチイベント: stable refパターン（onTS/TM/TE 定義後に置くこと）──
  useEffect(function(){
    var el=canvasRef.current; if(!el)return;
    function _ts(e){if(_tHandlers.current.ts)_tHandlers.current.ts(e);}
    function _tm(e){if(_tHandlers.current.tm)_tHandlers.current.tm(e);}
    function _te(e){if(_tHandlers.current.te)_tHandlers.current.te(e);}
    // ダブルタップ → 消しゴムトグル（ペン・指どちらでも）
    function _pd(e){
      if(e.pointerType==='mouse')return; // マウスは除外（PCはツールバー操作）
      if(textInputRef.current)return; // テキスト編集中は無視
      var now=Date.now();
      var pt=penTapRef.current;
      var dx=pt.x!==undefined?Math.abs(e.clientX-pt.x):0;
      var dy=pt.y!==undefined?Math.abs(e.clientY-pt.y):0;
      if(now-pt.time<300&&dx<30&&dy<30){
        // ダブルタップ検出 → トグル
        e.preventDefault();
        var cur=toolRef.current;
        if(cur==='eraser'){
          var restore=pt.prevTool||'freehand';
          setTool(restore);toolRef.current=restore;
          penTapRef.current={time:0,prevTool:null,x:0,y:0};
        }else{
          penTapRef.current={time:0,prevTool:cur,x:0,y:0};
          setTool('eraser');toolRef.current='eraser';
        }
      }else{
        penTapRef.current={time:now,prevTool:pt.prevTool,x:e.clientX,y:e.clientY};
      }
    }
    el.addEventListener("touchstart",_ts,{passive:false});
    el.addEventListener("touchmove",_tm,{passive:false});
    el.addEventListener("touchend",_te);
    el.addEventListener("touchcancel",_te);
    el.addEventListener("pointerdown",_pd);
    return function(){
      el.removeEventListener("touchstart",_ts);
      el.removeEventListener("touchmove",_tm);
      el.removeEventListener("touchend",_te);
      el.removeEventListener("touchcancel",_te);
      el.removeEventListener("pointerdown",_pd);
    };
  },[]);
  // 毎レンダー後に最新ハンドラを差し替え
  _tHandlers.current.ts=onTS;
  _tHandlers.current.tm=onTM;
  _tHandlers.current.te=onTE;

  var onWheel=function(e){
    e.preventDefault();
    if(e.ctrlKey||e.metaKey){
      // Ctrl+ホイール → 上下移動
      setPan(function(p){return{x:p.x,y:p.y-e.deltaY*0.8};});
    } else {
      // 通常ホイール → ズーム
      var factor=e.deltaY<0?1.1:0.9;
      var next=Math.min(Math.max(zoomRef.current*factor,0.1),20);
      setZoom(next);
    }
  };

  // ── Save & Download ──
  /* C9: 分析モード PNG出力 (統合chart再描画、bar幅12px固定、Firebase無通信)
     幅は uTotal (bar数) × 12px で決まり、uSpan全体表示。
     テキスト/線/EMAは px固定なので縦サイズ変化のみ。
     1m tf全体: ~9432px幅、5m tf全体: ~5924px幅 */
  function downloadAnalysisCombined(){
    var ad=analysisDataRef.current;
    if(!ad){window.caToast('分析データがありません','error');return;}
    var ra=refAnalysisRef.current;
    var tf=analysisTfRef.current||'1m';
    var barsKey=tf==='5m'?'bars_5m':'bars_1m';
    var bars=ad[barsKey]||[];
    if(!bars.length){window.caToast('バーデータがありません','error');return;}
    var refBars=(ra&&ra.analysisData&&ra.analysisData[barsKey])||[];
    var refData=ra?ra.analysisData:null;

    /* bar幅固定 12px → chart幅 = uTotal × 12 + padL + padR */
    var BAR_PX=12;
    var PAD_L=10, PAD_R=60;
    var HEADER_H=44;
    var H=1218;  // 高さ固定 (添付画像準拠)

    /* uTotal計算 (tf依存、getUTotalIA と同じロジック) */
    var g=(tf==='1m')?1:5;
    var tvs=390-(60-g);
    var uTotal=refBars.length?(tvs*2+g):tvs;
    var chartW=uTotal*BAR_PX;
    var W=chartW+PAD_L+PAD_R;

    var tc=document.createElement('canvas');
    tc.width=W; tc.height=H;
    var tctx=tc.getContext('2d');
    /* 背景 (2026-04-20: ca_chart_bg_v1 設定参照) */
    tctx.fillStyle=caLoadChartBg();
    tctx.fillRect(0,0,W,H);

    /* ヘッダー描画 (ticker + refDate ⇄ curDate) */
    var headerTxt=(ad.ticker||'?')+'　'+
      (ra&&ra.analysisData
        ?((ra.analysisData.date||'')+' ⇄ '+(ad.date||''))
        :(ad.date||''));
    tctx.save();
    tctx.fillStyle='#111';
    tctx.fillRect(0,0,W,HEADER_H);
    tctx.fillStyle='#ddd';
    tctx.font="bold 20px -apple-system,'Helvetica Neue',sans-serif";
    tctx.textBaseline='middle';
    tctx.fillText(headerTxt, 16, HEADER_H/2);
    tctx.strokeStyle='#222';
    tctx.lineWidth=1;
    tctx.beginPath();
    tctx.moveTo(0,HEADER_H+0.5);
    tctx.lineTo(W,HEADER_H+0.5);
    tctx.stroke();
    tctx.restore();

    /* chart描画領域 */
    var chartH=H-HEADER_H;
    var chartCanvas=document.createElement('canvas');
    chartCanvas.width=W; chartCanvas.height=chartH;

    /* window.devicePixelRatio を一時的に 1 に固定 (drawDataChart が参照するため) */
    var origDPR=window.devicePixelRatio;
    Object.defineProperty(window,'devicePixelRatio',{value:1,configurable:true});
    try{
      /* priceRange計算 (bars+refBars の外接 min/max) — B完全版: EMA 連続化後で scan */
      var mn=Infinity, mx=-Infinity;
      function scanBars(barsArr){
        barsArr.forEach(function(b){
          if(b.l<mn)mn=b.l; if(b.h>mx)mx=b.h;
          ['ema9','ema22','ema50','ema200','vwap'].forEach(function(k){
            var v=b[k]; if(v!=null){if(v<mn)mn=v;if(v>mx)mx=v;}
          });
        });
      }
      var enhBarsPng=computeEnhancedBars(bars, refBars.length?refBars:null);
      scanBars(enhBarsPng);
      if(refBars.length)scanBars(refBars);
      mn=Math.floor(mn/10)*10 - 5;
      mx=Math.ceil(mx/10)*10 + 5;
      var priceRange={min:mn, max:mx};

      var fullView={uS:0, uE:uTotal};
      var curStrokesArr=(analysisStrokesRef.current&&analysisStrokesRef.current[tf])||[];
      var refStrokesArr=(ra&&ra.analysisStrokes&&ra.analysisStrokes[tf])||[];

      var dummyLayoutRef={current:null};
      drawDataChart(
        chartCanvas,
        bars, ad,
        {w:W, h:chartH},
        tf,
        fullView,
        0,  /* pShift=0 */
        priceRange,
        dummyLayoutRef,
        curStrokesArr,
        null,
        null,
        refBars, refData,
        g,
        refStrokesArr
      );
    } finally {
      Object.defineProperty(window,'devicePixelRatio',{value:origDPR,configurable:true});
    }

    tctx.drawImage(chartCanvas, 0, HEADER_H);

    /* ファイル名 */
    var curDate=(ad.date||'').replace(/[^0-9a-zA-Z_-]/g,'');
    var refDate=ra&&ra.analysisData?(ra.analysisData.date||'').replace(/[^0-9a-zA-Z_-]/g,''):'';
    var fname=refDate?(refDate+'_to_'+curDate+'.png'):(curDate+'.png');

    tc.toBlob(function(blob){
      if(!blob){window.caToast('PNG生成失敗','error');return;}
      var url=URL.createObjectURL(blob);
      var lnk=document.createElement('a');
      lnk.href=url;
      lnk.download=fname;
      document.body.appendChild(lnk);
      lnk.click();
      document.body.removeChild(lnk);
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
    },'image/png');
  }

  function downloadCombined(){
    if(!(refPanel&&refPanel.url&&refImgDim))return;
    // 原画からフル解像度でメインチャートを描画（DPR非依存）
    var d=imgDataRef.current;
    var mainImg=new Image();
    mainImg.onload=function(){
      var nw=mainImg.naturalWidth, nh=mainImg.naturalHeight;
      var tc=document.createElement("canvas");
      tc.width=nw; tc.height=nh;
      var tctx=tc.getContext("2d");
      tctx.drawImage(mainImg,0,0,nw,nh);
      strokesRef.current.forEach(function(s){drawStroke(tctx,s);});
      // 参照画像と連結（参照画像は元のサイズを維持）
      var cw=tc.width, ch=tc.height;
      var rw=refImgDim.w, rh=refImgDim.h;
      // refOffsetYは表示座標系なので、メインキャンバスの自然ピクセル座標に変換
      var mNatH2=canvasDimRef.current&&canvasDimRef.current.h||ch;
      var offsetPx=Math.round(refOffsetY*(mNatH2/(dispH||mNatH2)));
      var refY, mainY;
      if(offsetPx>=0){refY=offsetPx; mainY=0;}
      else{refY=0; mainY=-offsetPx;}
      // 全体の高さは両画像を包含するサイズ

/* ── メモリキャッシュ（iPadのlocalStorage 5MB制限を回避）── */
var _dataMemCache={};  // id -> data object
var _thumbMemCache={}; // id -> thumb dataUrl
var CA_TICKERS_KEY='ca_tickers_v1';
var CA_META_KEY='ca_meta_v1';
var CA_DATA_PFX='ca_data_';
var CA_TRASH_KEY='ca_trash_v1';
var CA_DEF_TICKERS=['INPEX','JX金属','フジクラ','川崎重工業','IHI','ソフトバンク'];
function caLoadTickers(){try{var s=localStorage.getItem(CA_TICKERS_KEY);return s?JSON.parse(s):CA_DEF_TICKERS.slice();}catch(e){return CA_DEF_TICKERS.slice();}}
function caSaveTickers(t){try{localStorage.setItem(CA_TICKERS_KEY,JSON.stringify(t));}catch(e){}}
function caLoadMeta(){
  try{
    var s=localStorage.getItem(CA_META_KEY);if(!s)return[];
    var arr=JSON.parse(s);
    // 既存thumbをメモリキャッシュに退避
    arr.forEach(function(item){
      if(item.thumb&&typeof item.thumb==='string'&&item.thumb.length>500){
        _thumbMemCache[item.id]=item.thumb;
      }
    });
    return arr;
  }catch(e){return[];}
}
function caSaveMeta(m){
  var lite=m.map(function(item){
    // thumbはメモリキャッシュに退避、metaにはthumbUrlのみ残す
    if(item.thumb&&typeof item.thumb==='string'&&item.thumb.length>500){
      _thumbMemCache[item.id]=item.thumb;
    }
    return Object.assign({},item,{thumb:null});
  });
  try{localStorage.setItem(CA_META_KEY,JSON.stringify(lite));}catch(e){
    console.error('[caSaveMeta] save failed');
  }
}
function caLoadData(id){
  /* C8a: localStorage 層を廃止 (data は容量が大きく fullになりやすい)。mem only同期版。
     本格ロードは caLoadDataAsync を使う (IDBフォールバックあり) */
  if(_dataMemCache[id])return _dataMemCache[id];
  return null;
}
// 非同期版: メモリ → IndexedDB (C8a: localStorage層は廃止)
function caLoadDataAsync(id,cb){
  if(_dataMemCache[id]){cb(_dataMemCache[id]);return;}
  idbGet('data_'+id,function(val){
    if(val){_dataMemCache[id]=val;cb(val);}
    else{cb(null);}
  });
}
function caSaveData(id,d){
  _dataMemCache[id]=d;
  // IndexedDBに保存（容量制限なし）— C8a: localStorage書込は廃止 (full警告の原因)
  idbSet('data_'+id,d);
}
function caDeleteData(id){
  delete _dataMemCache[id];
  idbDel('data_'+id);
  /* C8a: 旧localStorageエントリが残ってる可能性があるのでクリーンアップ */
  try{localStorage.removeItem(CA_DATA_PFX+id);}catch(e){}
}
/* C8a: 起動時に旧 ca_data_* localStorageエントリを一括削除 (容量解放) */
(function _cleanupLegacyCaData(){
  try{
    var keys=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf(CA_DATA_PFX)===0)keys.push(k);
    }
    if(keys.length){
      keys.forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});
      console.log('[cleanup] removed',keys.length,'legacy ca_data_* localStorage entries');
    }
  }catch(e){}
})();
function caLoadTrash(){try{var s=localStorage.getItem(CA_TRASH_KEY);return s?JSON.parse(s):[];}catch(e){return[];}}
function caSaveTrash(t){try{localStorage.setItem(CA_TRASH_KEY,JSON.stringify(t));}catch(e){}}
function caGenId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function caGenThumb(canvasEl){
  var W=Math.min(canvasEl.width,800),ratio=W/canvasEl.width,H=Math.round(canvasEl.height*ratio);
  var tc=document.createElement('canvas');tc.width=W;tc.height=H;
  var ctx=tc.getContext('2d');
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  try{
    ctx.drawImage(canvasEl,0,0,W,H);
    return tc.toDataURL('image/png');
  }catch(e){
    /* 2026-04-20 C11: tainted canvas (SecurityError) → CORS未設定のStorage画像が混入
       fallback: 空の透明サムネイルを返す。警告はconsoleに一度だけ。 */
    if(!window._caCorsWarned){
      window._caCorsWarned=true;
      console.warn('[CORS] canvas toDataURL failed. Firebase Storage bucketにCORS設定が必要です。\n'+
        'gsutil cors set cors.json gs://YOUR_BUCKET を実行してください。'+
        '(詳細: https://firebase.google.com/docs/storage/web/download-files#cors_configuration)');
    }
    /* 空のtransparent thumbnail を返す (サムネ表示は欠けるが保存は継続可能) */
    var fc=document.createElement('canvas');fc.width=W;fc.height=H;
    try{return fc.toDataURL('image/png');}catch(e2){return '';}
  }
}
function caSaveThumb(id,dataUrl){_thumbMemCache[id]=dataUrl;idbSet('thumb_'+id,dataUrl);}
function caLoadThumb(id){return _thumbMemCache[id]||null;}
function caDeleteThumb(id){delete _thumbMemCache[id];idbDel('thumb_'+id);}

/* ============================================================
   Phase 2 (2026-04-20): 分析データ(JSON)から thumb を生成するヘルパー
   DataChart のオフスクリーンレンダリングで thumb PNG を作成
   ============================================================ */
function generateAnalysisThumb(analysisData, cb){
  try{
    if(!analysisData||!analysisData.bars_1m||!analysisData.bars_1m.length){cb('');return;}
    var W=800, H=500;
    var c=document.createElement('canvas');
    c.width=W; c.height=H;
    var bars=analysisData.bars_1m;
    /* priceRange算出 (EMA連続化を考慮しない単純版、refData無しなので問題なし) */
    var mn=Infinity, mx=-Infinity;
    bars.forEach(function(b){
      if(b.l<mn)mn=b.l; if(b.h>mx)mx=b.h;
      ['ema9','ema22','ema50','ema200','vwap'].forEach(function(k){
        var v=b[k]; if(v!=null){if(v<mn)mn=v;if(v>mx)mx=v;}
      });
    });
    if(!isFinite(mn)||!isFinite(mx)){cb('');return;}
    mn=Math.floor(mn/10)*10-5; mx=Math.ceil(mx/10)*10+5;
    var priceRange={min:mn,max:mx};
    /* uTotal (1m,hasRef=false) = 390-(60-1) = 331 */
    var uTotal=390-(60-1);
    /* DPR 固定 */
    var origDPR=window.devicePixelRatio;
    try{Object.defineProperty(window,'devicePixelRatio',{value:1,configurable:true});}catch(e){}
    try{
      drawDataChart(c, bars, analysisData, {w:W,h:H}, '1m',
        {uS:0,uE:uTotal}, 0, priceRange, {current:null},
        [], null, null, null, null, 1, null, null);
    }finally{
      try{Object.defineProperty(window,'devicePixelRatio',{value:origDPR,configurable:true});}catch(e){}
    }
    try{cb(c.toDataURL('image/png'));}
    catch(e){console.warn('[thumb] toDataURL failed:',e);cb('');}
  }catch(err){
    console.error('generateAnalysisThumb:',err);
    cb('');
  }
}

/* ============================================================
   Phase 1 (2026-04-20): PNG一括エクスポートヘルパー
   全draft を 画像+strokes 合成PNG として個別DL (参照画像・分析chartは含まない)
   ============================================================ */
/* draft の data から画像要素を非同期で生成 (orig_base64 or imageUrl) */
function _loadDraftImage(d, cb){
  if(!d){cb(null);return;}
  var src=null, needCross=false;
  if(d.orig_base64){
    src='data:'+(d.orig_mt||'image/png')+';base64,'+d.orig_base64;
  } else if(d.imageUrl){
    src=d.imageUrl; needCross=true;
  } else { cb(null); return; }
  var img=new Image();
  if(needCross)img.crossOrigin='anonymous';
  img.onload=function(){cb(img);};
  img.onerror=function(){cb(null);};
  img.src=src;
}
/* 画像+strokes を合成してPNG dataURL を返す (失敗時 null) */
function _generateCombinedPng(img, strokes){
  var c=document.createElement('canvas');
  c.width=img.naturalWidth||img.width; c.height=img.naturalHeight||img.height;
  var ctx=c.getContext('2d');
  ctx.drawImage(img,0,0);
  if(strokes&&strokes.length){
    strokes.forEach(function(s){try{drawStroke(ctx,s);}catch(e){}});
  }
  try{ return c.toDataURL('image/png'); }
  catch(e){ return null; }
}
/* ファイル名サニタイズ */
function _sanitizeFn(s){return (s||'').replace(/[\/\\?%*:|"<>\s]/g,'_');}
/* dataURL を <a download> でDL */
function _triggerDl(dataUrl, filename){
  var a=document.createElement('a');
  a.href=dataUrl; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
/* Firebase から data を取得 (IDBに無い場合のfallback) */
function _fetchDraftDataFromFb(fbCfg, id, cb){
  if(!fbCfg||!fbCfg.url||_fbIsPaused(fbCfg)){cb(null);return;}
  var auth=fbCfg.secret?'?auth='+fbCfg.secret:'';
  var url=fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-data/'+id+'.json'+auth;
  fetch(url).then(function(r){return r.ok?r.json():null;})
    .then(function(d){cb(d);})
    ["catch"](function(){cb(null);});
}
/* meta配列を1件ずつPNG化してDL連発
   onProgress(i, total, name), onDone(okCount, failCount) */
function exportAllDraftsAsPng(metaList, fbCfg, onProgress, onDone){
  var i=0, ok=0, fail=0;
  function next(){
    if(i>=metaList.length){onDone(ok,fail);return;}
    var m=metaList[i]; i++;
    if(onProgress)onProgress(i, metaList.length, m.name||m.ticker||m.id);
    function withData(d){
      if(!d){fail++;setTimeout(next,80);return;}
      _loadDraftImage(d, function(img){
        if(!img){fail++;setTimeout(next,80);return;}
        var png=_generateCombinedPng(img, d.strokes||[]);
        if(!png){fail++;setTimeout(next,80);return;}
        var dt=new Date(m.savedAt||Date.now());
        var ds=dt.getFullYear()+('0'+(dt.getMonth()+1)).slice(-2)+('0'+dt.getDate()).slice(-2);
        var fn=_sanitizeFn(ds+'_'+(m.ticker||'')+'_'+(m.name||'chart'))+'.png';
        _triggerDl(png, fn);
        ok++;
        /* ブラウザのダウンロード連打抑制 */
        setTimeout(next,400);
      });
    }
    caLoadDataAsync(m.id, function(d){
      if(d)withData(d);
      else _fetchDraftDataFromFb(fbCfg, m.id, withData);
    });
  }
  next();
}

  // ── IndexedDBからサムネイルキャッシュを復元 ──
  useEffect(function(){
    var current=caLoadMeta();
    var needRestore=current.filter(function(m){return m.thumbUrl&&!_thumbMemCache[m.id];});
    if(!needRestore.length)return;
    var restored=0;
    needRestore.forEach(function(m){
      idbGet('thumb_'+m.id,function(val){
        if(val){
          _thumbMemCache[m.id]=val;
          restored++;
          if(restored===needRestore.length){
            setMeta(function(prev){return prev.slice();});  // 再レンダリングトリガー
          }
        } else {
          // IndexedDBにない→thumbUrlからDLしてキャッシュ
          var tImg=new Image();
          tImg.crossOrigin='anonymous';
          tImg.onload=function(){
            var W=Math.min(tImg.width,800),ratio=W/tImg.width,H=Math.round(tImg.height*ratio);
            var tc=document.createElement('canvas');tc.width=W;tc.height=H;
            var tctx=tc.getContext('2d');tctx.imageSmoothingEnabled=true;tctx.imageSmoothingQuality='high';
            tctx.drawImage(tImg,0,0,W,H);
            try{
              var thumb=tc.toDataURL('image/png');
              caSaveThumb(m.id,thumb);  // メモリ+IndexedDB
            }catch(e){
              /* CORS未設定で tainted canvas → サムネキャッシュ失敗、次回再試行 */
              if(!window._caCorsWarned){window._caCorsWarned=true;
                console.warn('[CORS] thumb cache failed. Firebase Storage bucket に CORS設定が必要');}
            }
            restored++;
            if(restored===needRestore.length){
              setMeta(function(prev){return prev.slice();});
            }
          };
          tImg.onerror=function(){restored++;if(restored===needRestore.length){setMeta(function(prev){return prev.slice();});}};
          tImg.src=m.thumbUrl;
        }
      });
    });
  },[]);

  // ── サムネイル再生成: thumbUrlが無いアイテムのサムネイルをデータから生成→Storage UL ──
  useEffect(function(){
    var current=caLoadMeta();
    var missing=current.filter(function(m){return !m.thumbUrl&&!_thumbMemCache[m.id];});
    if(!missing.length)return;
    var auth=fbCfg.secret?'?auth='+fbCfg.secret:'';
    var dataBase=fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-data':'';
    var idx=0;

    function genThumb(m,src){
      var tImg=new Image();
      /* 2026-04-20 C11: Storage URL由来の画像は crossOrigin必要 */
      if(src.indexOf('data:')!==0)tImg.crossOrigin='anonymous';
      tImg.onload=function(){
        var W=Math.min(tImg.width,800),ratio=W/tImg.width,H=Math.round(tImg.height*ratio);
        var tc=document.createElement('canvas');tc.width=W;tc.height=H;
        var tctx=tc.getContext('2d');tctx.imageSmoothingEnabled=true;tctx.imageSmoothingQuality='high';
        tctx.drawImage(tImg,0,0,W,H);
        try{
          var thumb=tc.toDataURL('image/png');
          caSaveThumb(m.id,thumb);
          setMeta(function(prev){return prev.map(function(x){return x.id===m.id?Object.assign({},x,{thumb:null}):x;});});
          // Firebase Storageにアップロード→thumbUrlをmetaに保存
          uploadThumbToStorage(fbCfg,m.id,thumb).then(function(thumbUrl){
            if(thumbUrl){
              setMeta(function(prev){
                var nm=prev.map(function(x){return x.id===m.id?Object.assign({},x,{thumbUrl:thumbUrl}):x;});
                caSaveMeta(nm); return nm;
              });
            }
          });
        }catch(e){
          if(!window._caCorsWarned){window._caCorsWarned=true;
            console.warn('[CORS] thumb regen failed. Firebase Storage bucketにCORS設定が必要');}
        }
        setTimeout(processNext,100);
      };
      tImg.onerror=function(){setTimeout(processNext,100);};
      tImg.src=src;
    }

    function processNext(){
      if(idx>=missing.length)return;
      var m=missing[idx]; idx++;
      var d=caLoadData(m.id);
      if(d&&(d.orig_base64||d.base64)){
        genThumb(m,'data:'+(d.orig_mt||d.mt||'image/png')+';base64,'+(d.orig_base64||d.base64));
        return;
      }
      if(dataBase&&!_fbIsPaused(fbCfg)){
        fetch(dataBase+'/'+m.id+'.json'+auth).then(function(r){return r.ok?r.json():null;})
        .then(function(fbData){
          if(!fbData){processNext();return;}
          if(fbData.orig_base64||fbData.base64){
            genThumb(m,'data:'+(fbData.orig_mt||fbData.mt||'image/png')+';base64,'+(fbData.orig_base64||fbData.base64));
          } else if(fbData.imageUrl){
            genThumb(m,fbData.imageUrl);
          } else {processNext();}
        })["catch"](function(){processNext();});
        return;
      }
      processNext();
    }
    processNext();
  },[]);

  // ── 画像を保管庫に直接追加（画質劣化なし）──
  function addImageDirect(file){
    if(!file||!file.type.startsWith('image/'))return;
    if(!selTicker){window.caToast('銘柄を選択してください','info');return;}
    var id=caGenId();
    var savedAt=Date.now();
    var chartName=file.name.replace(/\.[^.]+$/,'')||'chart';
    // Phase 1: blob URLで即座にサムネイル表示（通信・変換なし）
    var tempThumb=URL.createObjectURL(file);
    setMeta(function(prev){
      return prev.concat([{id:id,ticker:selTicker,name:chartName,savedAt:savedAt,thumb:tempThumb}]);
    });
    // Phase 2: バックグラウンドで読み込み + 高品質サムネイル生成
    var reader=new FileReader();
    reader.onload=function(ev){
      var dataUrl=ev.target.result;
      var parts=dataUrl.split(',');
      var b64=parts[1];
      var mt=parts[0].match(/data:([^;]+)/)[1];
      var data={orig_base64:b64,orig_mt:mt,strokes:[],name:chartName};
      caSaveData(id,data);
      var tImg=new Image();
      tImg.onload=function(){
        URL.revokeObjectURL(tempThumb);
        // PNG（ロスレス）で高品質サムネイル生成
        var W=Math.min(tImg.width,800),ratio=W/tImg.width,H=Math.round(tImg.height*ratio);
        var tc=document.createElement('canvas');tc.width=W;tc.height=H;
        var tctx=tc.getContext('2d');
        tctx.imageSmoothingEnabled=true;
        tctx.imageSmoothingQuality='high';
        tctx.drawImage(tImg,0,0,W,H);
        var thumb=tc.toDataURL('image/png');
        var metaItem={id:id,ticker:selTicker,name:chartName,savedAt:savedAt,thumb:thumb};
        // localStorage を先に更新
        var stored=caLoadMeta().filter(function(m){return m.id!==id;});
        stored.push(metaItem);
        caSaveMeta(stored);
        // React state 更新（functional update で複数追加の競合回避）
        setMeta(function(prev){
          var updated=false;
          var nm=prev.map(function(m){if(m.id===id){updated=true;return metaItem;}return m;});
          if(!updated)nm=nm.concat([metaItem]);
          return nm;
        });
        fbSaveDraft(id,metaItem,data);
      };
      tImg.onerror=function(){
        URL.revokeObjectURL(tempThumb);
        var fallbackThumb=dataUrl.length<500000?dataUrl:'';
        var metaItem={id:id,ticker:selTicker,name:chartName,savedAt:savedAt,thumb:fallbackThumb};
        var stored=caLoadMeta().filter(function(m){return m.id!==id;});
        stored.push(metaItem);
        caSaveMeta(stored);
        setMeta(function(prev){
          return prev.map(function(m){return m.id===id?metaItem:m;});
        });
        fbSaveDraft(id,metaItem,data);
      };
      tImg.src=dataUrl;
    };
    reader.readAsDataURL(file);
  }

  /* 2026-04-20: JSON歩み値ファイルから新フォーマットdraft作成 (画像なし、Phase 2)
     data = {analysisData, analysisStrokes:{1m:[],5m:[]}, name, _v} */
  function addJsonDirect(file){
    if(!file){return;}
    if(!selTicker){window.caToast('銘柄を選択してください','info');return;}
    var fn=(file.name||'').toLowerCase();
    if(!/\.json$/.test(fn)&&file.type!=='application/json'){
      window.caToast('JSONファイルを選択してください','error');return;
    }
    var fr=new FileReader();
    fr.onload=function(ev){
      var j;
      try{ j=JSON.parse(ev.target.result); }
      catch(err){window.caToast('JSONパースエラー: '+err.message,'error');return;}
      if(!j||!Array.isArray(j.bars_1m)){
        window.caToast('形式が不正: bars_1m が配列ではありません','error');return;
      }
      var id=caGenId();
      var savedAt=Date.now();
      var chartName=(file.name||'chart').replace(/\.[^.]+$/,'')||'chart';
      /* 新フォーマット: 画像フィールドなし、analysisData+analysisStrokesのみ */
      var data={analysisData:j, analysisStrokes:{'1m':[],'5m':[]}, name:chartName, _v:savedAt};
      caSaveData(id,data);
      /* Phase 2: DataChartオフスクリーンレンダリングでthumb生成 */
      generateAnalysisThumb(j, function(thumb){
        var metaItem={id:id, ticker:selTicker, name:chartName, savedAt:savedAt,
          thumb:thumb||'', analysisDate:j.date||''};
        var stored=caLoadMeta().filter(function(m){return m.id!==id;});
        stored.push(metaItem);
        caSaveMeta(stored);
        setMeta(function(prev){
          var exists=prev.some(function(m){return m.id===id;});
          return exists?prev.map(function(m){return m.id===id?metaItem:m;}):prev.concat([metaItem]);
        });
        if(thumb)caSaveThumb(id,thumb);
        fbSaveDraft(id,metaItem,data);
        window.caToast('JSONを読み込みました: '+chartName,'success');
      });
    };
    fr.onerror=function(){window.caToast('ファイル読込エラー','error');};
    fr.readAsText(file);
  }

  var auth=fbCfg.secret?'?auth='+fbCfg.secret:'';
  function makeDraftsBase(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts':null;}
  function makeDraftsDataBase(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-data':null;}
  function makeTrashBase(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-trash':null;}
  function makeTrashDataBase(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-trash-data':null;}
  function makeFbTickersUrl(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-tickers.json'+auth:null;}
  function makeDraftsVUrl(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-v.json'+auth:null;}

  var localVRef=useRef(0); // 最後に確認したバージョン

  // バージョン番号を書き込む（保存時に呼ぶ）
  function fbWriteV(){
    var vUrl=makeDraftsVUrl(); if(!vUrl||_fbIsPaused(fbCfg))return;
    var v=Date.now();
    localVRef.current=v;
    var vBody=JSON.stringify({_v:v});fetch(vUrl,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:vBody}).catch(function(){});

  // ── バージョンチェック付きポーリング ──
  function pollFb(){
    if(_fbIsPaused(fbCfg))return;
    var vUrl=makeDraftsVUrl();
    if(!vUrl)return;
    // Step 1: バージョン番号だけ取得（~20バイト）
    fetch(vUrl).then(function(r){return r.ok?r.text():null;})
      .then(function(txt){
        if(!txt)return;var vData; try{vData=JSON.parse(txt);}catch(e){return;}
        if(!vData||!vData._v)return;
        var remoteV=vData._v;
        if(remoteV<=localVRef.current){setSyncStatus(null);return;}
        // Step 2: バージョン変化あり → フルメタ取得
        localVRef.current=remoteV;
        fetchFullMeta();
      }).catch(function(e){console.error('pollFb:',e);setSyncStatus(null);});
  }

  // フルメタ取得（初回ロード時 + バージョン変化時のみ）
  function fetchFullMeta(){
    if(_fbIsPaused(fbCfg))return;
    var base=makeDraftsBase(), trashBase=makeTrashBase();
    var now=Date.now();

    // ティッカー同期
    fetch(makeFbTickersUrl())
      .then(function(r){return r.ok?r.text():null;})
      .then(function(txt){
        if(!txt)return;var fbTickers; try{fbTickers=JSON.parse(txt);}catch(e){return;}
        if(fbTickers&&Array.isArray(fbTickers)&&fbTickers.length>0){setTickers(fbTickers);caSaveTickers(fbTickers);}
      }).catch(function(e){console.error('fetchFullMeta tickers:',e);});

    // ドラフトメタ同期
    fetch(base+'.json'+auth)
      .then(function(r){return r.ok?r.text():null;})
      .then(function(txt){
        setSyncStatus(null);
        if(!txt)return;var fbMeta; try{fbMeta=JSON.parse(txt);}catch(e){return;}
        if(!fbMeta||typeof fbMeta!=='object'||fbMeta.error||Array.isArray(fbMeta))return;
        var fbIds=Object.keys(fbMeta);
        var localMeta=caLoadMeta();
        var merged=[];
        fbIds.forEach(function(id){
          var d=fbMeta[id]; if(!d||typeof d!=='object')return;
          var local=localMeta.find(function(m){return m.id===id;});
          var resolvedThumb=(local&&local.thumb)?local.thumb:(d.thumbUrl||d.thumb||'');
          merged.push({id:id,ticker:d.ticker||'未分類',name:d.name||id,
            savedAt:d.savedAt||0,thumb:resolvedThumb,thumbUrl:d.thumbUrl||''});
        });
        localMeta.forEach(function(m){
          // Firebase側にないローカル項目: 直近5分以内に作成され、かつローカルデータが存在するもののみ保持
          // （別端末で削除されたものを復活させないため、データ存在チェックを追加）
          if(!fbIds.includes(m.id)&&(now-(m.savedAt||0)<300000)&&caLoadData(m.id))merged.push(m);
        });
        setMeta(merged);caSaveMeta(merged);
      })
      .catch(function(e){console.error('fetchFullMeta drafts:',e);setSyncStatus(null);});

    // ゴミ箱メタ同期
    fetch(trashBase+'.json'+auth)
      .then(function(r){return r.ok?r.text():null;})
      .then(function(txt){
        if(!txt)return;var fbTrashMeta; try{fbTrashMeta=JSON.parse(txt);}catch(e){return;}
        if(!fbTrashMeta||typeof fbTrashMeta!=='object'||fbTrashMeta.error||Array.isArray(fbTrashMeta))return;
        var localTrash=caLoadTrash();
        var fbIds=Object.keys(fbTrashMeta);
        var merged=[];
        // Firebase側のゴミ箱を基準にする
        fbIds.forEach(function(id){
          var d=fbTrashMeta[id]; if(!d||typeof d!=='object')return;
          var lt=localTrash.find(function(m){return m.id===id;});
          var rt=(lt&&lt.thumb)?lt.thumb:(d.thumbUrl||d.thumb||'');
          merged.push({id:id,ticker:d.ticker||'',name:d.name||id,savedAt:d.savedAt||0,thumb:rt,thumbUrl:d.thumbUrl||''});
        });
        // ローカルのみのゴミ箱アイテム: 直近5分以内のもののみ保持
        localTrash.forEach(function(m){
          if(!fbIds.includes(m.id)&&(now-(m.deletedAt||m.savedAt||0)<300000))merged.push(m);
        });
        setTrash(merged);caSaveTrash(merged);
      }).catch(function(e){console.error('fetchFullMeta trash:',e);});
  }

  // ── 自動停止コールバック登録 ──
  // ── ポーリング開始 ──
  useEffect(function(){
    if(_fbIsPaused(fbCfg))return;

  // ── Firebase ヘルパー（meta=旧パス / data=新パス 分離）──
  function fbSaveDraft(id,metaItem,data){
    var base=makeDraftsBase(), dataBase=makeDraftsDataBase();
    if(!base||_fbIsPaused(fbCfg))return;
    // ① サムネイルアップロード → メタ書き込み（thumbUrl含む）→ TS/V書き込み の順序保証
    var thumbP=metaItem.thumb?uploadThumbToStorage(fbCfg,id,metaItem.thumb):Promise.resolve(null);
    thumbP.then(function(thumbUrl){
      var metaDb={ticker:metaItem.ticker,name:metaItem.name,savedAt:metaItem.savedAt};
      if(thumbUrl)metaDb.thumbUrl=thumbUrl;
      var body=JSON.stringify(metaDb);return fetch(base+'/'+id+'.json'+auth,{method:'PUT',headers:{'Content-Type':'application/json'},body:body});
    }).then(function(){
      var tsBase=fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts';
      var tsBody=JSON.stringify({t:metaItem.savedAt||Date.now()});fetch(tsBase+'/'+id+'.json'+auth,{method:'PUT',headers:{'Content-Type':'application/json'},body:tsBody})
        .catch(function(){});
      fbWriteV();
    }).catch(function(e){console.error('fbSaveDraft:',e);});
    // ② データ書き込み（メタとは独立、並行でOK）
    if(data){
      var b64=data.orig_base64||data.base64;
      var mt=data.orig_mt||data.mt||'image/png';
      if(b64&&fbCfg.storageBucket){
        uploadToStorage(fbCfg,id,b64,mt).then(function(imageUrl){
          var dbData={imageUrl:imageUrl,orig_mt:mt,strokes:data.strokes||[],name:data.name||''};
          var body2=JSON.stringify(dbData);fetch(dataBase+'/'+id+'.json'+auth,{method:'PUT',headers:{'Content-Type':'application/json'},body:body2})
            .catch(function(e){console.error('fbSaveDraft data:',e);});
        });
      }else{
        var body3=JSON.stringify(data);fetch(dataBase+'/'+id+'.json'+auth,{method:'PUT',headers:{'Content-Type':'application/json'},body:body3})
          .catch(function(e){console.error('fbSaveDraft data:',e);});
      }
    }
  }
  function fbDeleteDraft(id){

    var tsBase=fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts';fetch(tsBase+'/'+id+'.json'+auth,{method:'DELETE'}).catch(function(){});

  function fbMoveToTrash(id,metaItem,data){

  function deleteTicker(t){

  // ── チャート操作 ──
  function deleteChart(id){
    var mi=meta.find(function(m){return m.id===id;});
    if(!mi)return;
    var data=caLoadData(id);
    var trashMeta={id:id,ticker:mi.ticker,name:mi.name,savedAt:mi.savedAt,thumb:mi.thumb,deletedAt:Date.now()};
    var nt=caLoadTrash().filter(function(x){return x.id!==id;});
    nt.push(trashMeta);caSaveTrash(nt);setTrash(nt);
    caDeleteData(id);fbDeleteDraft(id);fbMoveToTrash(id,trashMeta,data);
    var nm=meta.filter(function(m){return m.id!==id;});
    setMeta(nm);caSaveMeta(nm);

  function openChart(id){
    var mi=meta.find(function(m){return m.id===id;});
    var extra={_draftId:id,_ticker:mi?mi.ticker:'',_name:mi?mi.name:'',_thumb:mi?mi.thumb:'',_savedAt:mi?mi.savedAt:0};
    /* ローカルデータから画像なし draft (新フォーマット) 判定ヘルパー */
    function isJsonOnly(d){return !!(d&&d.analysisData&&!(d.orig_base64||d.base64||d.imageUrl));}
    /* 2026-04-20: 画像mode撤去後、画像draftを開く時は警告して中断 */
    function handleLegacyImageDraft(d){
      if(d&&(d.orig_base64||d.base64||d.imageUrl)&&!d.analysisData){
        window.caToast('このチャートは旧画像形式です。⚙ Firebase設定から「旧画像draftを削除」で整理してください','error');
        return true;  /* 中断 */
      }
      return false;  /* 続行 */
    }
    // 同期OFFまたはFirebase未設定 → ローカルデータのみ
    if(_fbIsPaused(fbCfg)||!fbCfg.url){
      var d0=caLoadData(id);
      if(handleLegacyImageDraft(d0))return;  /* 旧画像-only draft: 中断 */
      if(d0&&(d0.orig_base64||d0.base64)){onOpen(Object.assign({},d0,extra));return;}
      if(isJsonOnly(d0)){onOpen(Object.assign({},d0,extra));return;}  /* JSONのみdraft */
      // IndexedDB非同期フォールバック
      caLoadDataAsync(id,function(ad){
        if(handleLegacyImageDraft(ad))return;  /* 旧画像-only draft: 中断 */
        if(ad&&(ad.orig_base64||ad.base64)){onOpen(Object.assign({},ad,extra));return;}
        if(isJsonOnly(ad)){onOpen(Object.assign({},ad,extra));return;}  /* JSONのみdraft */
        window.caToast('データが見つかりません（Firebase未設定または同期停止中）','error');
      });
      return;
    }
    // 同期ON → 常にRTDBから最新のstrokesを取得
    var dataBase=makeDraftsDataBase();
    var oldBase=makeDraftsBase();
    setSyncStatus('loading');
    // ローカルデータを先に非同期で取得し、Firebase取得と合流
    caLoadDataAsync(id,function(d){
      fetch(dataBase+'/'+id+'.json'+auth).then(function(r){return r.ok?r.text():null;})
        .then(function(txt){
          var fbData=txt?JSON.parse(txt):null;
          if(!fbData){
            // 新パスにデータなし → 旧パスフォールバック
            return fetch(oldBase+'/'+id+'.json'+auth).then(function(r2){return r2.ok?r2.text():null;})
              .then(function(txt2){
                setSyncStatus(null);
                var fbOld=txt2?JSON.parse(txt2):null;
                var od=fbOld&&fbOld.data?fbOld.data:null;
                if(od&&(od.orig_base64||od.base64)){caSaveData(id,od);onOpen(Object.assign({},od,extra));}
                else if(d&&(d.orig_base64||d.base64)){onOpen(Object.assign({},d,extra));}
                else{window.caToast('データが見つかりません','error');}
              });
          }
          // base64が直接ある場合
          if(fbData.orig_base64||fbData.base64){
            caSaveData(id,fbData);setSyncStatus(null);
            onOpen(Object.assign({},fbData,extra));return;
          }
          /* 2026-04-20: 画像なし(JSONのみ)draft */
          if(fbData.analysisData&&!fbData.imageUrl){
            caSaveData(id,fbData);setSyncStatus(null);
            onOpen(Object.assign({},fbData,extra));return;
          }
          // imageUrl（Storage）+ リモートstrokes
          if(fbData.imageUrl){
            // ローカルに画像があればそれを使い、strokesだけリモートから取得（Storage DL不要）
            if(d&&(d.orig_base64||d.base64)){
              var merged={orig_base64:d.orig_base64||d.base64,orig_mt:d.orig_mt||d.mt||fbData.orig_mt||'image/png',
                strokes:fbData.strokes||[],name:fbData.name||'',
                analysisData:fbData.analysisData||null,
                analysisStrokes:migrateAnalysisStrokes(fbData.analysisStrokes,'cur')};  /* B-drawing */
              caSaveData(id,merged);setSyncStatus(null);
              onOpen(Object.assign({},merged,extra));return;
            }
          // ローカルに画像なし → Storageからダウンロード
          return storageUrlToBase64(fbData.imageUrl).then(function(res){
            var localData={orig_base64:res.base64,orig_mt:res.mt||fbData.orig_mt||'image/png',
              strokes:fbData.strokes||[],name:fbData.name||'',
              analysisData:fbData.analysisData||null,
              analysisStrokes:migrateAnalysisStrokes(fbData.analysisStrokes,'cur')};  /* B-drawing */
            caSaveData(id,localData);setSyncStatus(null);
            onOpen(Object.assign({},localData,extra));
          }).catch(function(e){
            // Storage URL直接変換失敗 → Image経由でbase64化を試行
            console.warn('[openChart] storageUrlToBase64 failed, trying Image fallback:',e);
            return new Promise(function(resolve,reject){
              var fi=new Image(); fi.crossOrigin='anonymous';
              fi.onload=function(){
                var tc=document.createElement('canvas');tc.width=fi.naturalWidth;tc.height=fi.naturalHeight;
                tc.getContext('2d').drawImage(fi,0,0);
                try{
                  var du=tc.toDataURL('image/png');var b64=du.split(',')[1];
                  var localData={orig_base64:b64,orig_mt:'image/png',strokes:fbData.strokes||[],name:fbData.name||'',
                    analysisData:fbData.analysisData||null,
                    analysisStrokes:migrateAnalysisStrokes(fbData.analysisStrokes,'cur')};  /* B-drawing */
                  caSaveData(id,localData);setSyncStatus(null);
                  onOpen(Object.assign({},localData,extra));resolve();
                }catch(e2){reject(e2);}
              };
              fi.onerror=function(){reject(new Error('Image load failed: '+fbData.imageUrl.substring(0,60)));};
              fi.src=fbData.imageUrl;
            });
          });
        }
        setSyncStatus(null);window.caToast('データが見つかりません','error');
      }).catch(function(e){setSyncStatus(null);console.error('[openChart] Error:',e);window.caToast('読込失敗: '+(e&&e.message?e.message:'不明なエラー'),'error');});
    }); // caLoadDataAsync
  }

/* ─── VirtualJoystick ──────────────────────────────────────── */
function VirtualJoystick(props){
  var onPanDelta=props.onPanDelta;
  var RING_R=44, STICK_R=32, SPEED=3;
  var ringRef=useRef(null);
  var knobRef=useRef(null);
  var stateRef=useRef({active:false,off:{x:0,y:0},moveMode:false,lastTap:0,
    pos:{x:72,y:72},touchId:null});
  var rafRef=useRef(null);
  var s0=useState({x:72,y:72}); var pos=s0[0],setPos=s0[1];
  var s1=useState(false);       var moveMode=s1[0],setMoveMode=s1[1];

  function setKnob(x,y){
    if(knobRef.current)knobRef.current.style.transform="translate(calc(-50% + "+x+"px),calc(-50% + "+y+"px))";
  }

  useEffect(function(){
    function loop(){
      var s=stateRef.current;
      if(s.active&&Math.hypot(s.off.x,s.off.y)>3)
        onPanDelta(s.off.x*SPEED/STICK_R, s.off.y*SPEED/STICK_R);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
    return function(){if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[]);

  // ネイティブタッチで登録（canvas のネイティブリスナーと競合しないようにする）
  useEffect(function(){
    var ring=ringRef.current; if(!ring)return;
    function onTS(e){
      e.stopPropagation(); e.preventDefault();
      var t=e.touches[0], s=stateRef.current, now=Date.now();
      if(now-s.lastTap<400){s.moveMode=true;setMoveMode(true);}
      s.lastTap=now; s.touchId=t.identifier; s.active=true; s.off={x:0,y:0}; setKnob(0,0);
    }
    function onTM(e){
      e.stopPropagation(); e.preventDefault();
      var s=stateRef.current; if(!s.active)return;
      var t=null;
      for(var i=0;i<e.touches.length;i++){if(e.touches[i].identifier===s.touchId){t=e.touches[i];break;}}
      if(!t)return;
      if(s.moveMode){
        var r=ring.getBoundingClientRect();
        var nx=s.pos.x+(t.clientX-(r.left+r.width/2));
        var ny=s.pos.y-(t.clientY-(r.top+r.height/2)); // bottom基準なので反転
        s.pos={x:nx,y:ny}; setPos({x:nx,y:ny}); return;
      }
      var r2=ring.getBoundingClientRect();
      var ox=t.clientX-(r2.left+r2.width/2), oy=t.clientY-(r2.top+r2.height/2);
      var dist=Math.hypot(ox,oy);
      if(dist>STICK_R){ox=ox/dist*STICK_R;oy=oy/dist*STICK_R;}
      s.off={x:ox,y:oy}; setKnob(ox,oy);
    }
    function onTE(e){
      e.stopPropagation();
      var s=stateRef.current;
      s.active=false; s.off={x:0,y:0}; setKnob(0,0);
      if(s.moveMode){s.moveMode=false;setMoveMode(false);}
    }
    ring.addEventListener("touchstart",onTS,{passive:false});
    ring.addEventListener("touchmove",onTM,{passive:false});
    ring.addEventListener("touchend",onTE);
    ring.addEventListener("touchcancel",onTE);
    return function(){
      ring.removeEventListener("touchstart",onTS);
      ring.removeEventListener("touchmove",onTM);
      ring.removeEventListener("touchend",onTE);
      ring.removeEventListener("touchcancel",onTE);
    };
  },[]);

  return ReactDOM.createPortal(
    ce("div",{style:{
      position:"fixed",left:pos.x,bottom:pos.y,
      zIndex:10006,width:RING_R*2,height:RING_R*2,
      userSelect:"none",touchAction:"none",pointerEvents:"auto"
    }},
      ce("div",{ref:ringRef,
        style:{position:"relative",width:RING_R*2,height:RING_R*2,borderRadius:"50%",
          background:"rgba(255,255,255,0.08)",
          border:"2px solid "+(moveMode?"#f97316":"rgba(255,255,255,0.25)"),
          boxShadow:"0 2px 12px rgba(0,0,0,0.4)",backdropFilter:"blur(8px)"}
      },
        ce("div",{ref:knobRef,
          style:{position:"absolute",top:"50%",left:"50%",
            width:28,height:28,borderRadius:"50%",
            background:moveMode?"#f97316":"rgba(255,255,255,0.6)",
            transform:"translate(-50%,-50%)",
            boxShadow:"0 1px 4px rgba(0,0,0,0.4)",pointerEvents:"none"}
        })
      )
    ),
    document.body
  );
}

/* ─── App (drop zone) ──────────────────────────────────────── */
function App(){
  // 起動時に画面上部のクリックブロッカーを検出・除去
  useEffect(function(){
    
    // body直下の不要要素を検出除去（500ms後にチェック）
    var tid=setTimeout(function(){
      var root=document.getElementById('root');
      var cx=window.innerWidth/2, cy=40;
      var el=document.elementFromPoint(cx,cy);
      if(el&&el!==document.body&&el!==document.documentElement&&root&&!root.contains(el)){
        console.warn('[CA] Removed blocking element at center-top:',el.tagName,el.id,el.className,el.style.cssText);
        el.remove();
      }
    },500);
    return function(){clearTimeout(tid);};
  },[]);
  var s0=useState(function(){
    // リロード時にセッションから復元
    try{
      var s=sessionStorage.getItem('ca_session');
      if(s){var d=JSON.parse(s);if(d.orig_base64||d.base64)return d;}
    }catch(e){}
    return null;
  }); var img=s0[0],setImg=s0[1];
  var s1=useState(false); var drag=s1[0],setDrag=s1[1];
  var FB_DEFAULTS={url:'',secret:'',apiKey:'',storageBucket:'scalping-notebbok.firebasestorage.app',paused:true};
  var s2=useState(function(){try{var s=localStorage.getItem(FB_CFG_KEY);if(s){var p=JSON.parse(s);return Object.assign({},FB_DEFAULTS,p);}return FB_DEFAULTS;}catch(e){return FB_DEFAULTS;}}); var fbCfg=s2[0],setFbCfg=s2[1];
  var s3=useState(false); var showFbSettings=s3[0],setShowFbSettings=s3[1];
  /* 2026-04-20: 表示・動作設定モーダル */
  var sDS=useState(false); var showDisplaySettings=sDS[0],setShowDisplaySettings=sDS[1];
  var s4=useState(function(){try{return sessionStorage.getItem('ca_screen')==='drafts';}catch(e){return false;}}); var showDrafts=s4[0],setShowDrafts=s4[1];
  var s5=useState(function(){try{return sessionStorage.getItem('ca_draftTicker')||null;}catch(e){return null;}}); var draftInitTicker=s5[0],setDraftInitTicker=s5[1];
  var fileRef=useRef(null);
  useEffect(function(){
    try{sessionStorage.setItem('ca_screen',img?'editor':showDrafts?'drafts':'home');
    if(draftInitTicker)sessionStorage.setItem('ca_draftTicker',draftInitTicker);
    else sessionStorage.removeItem('ca_draftTicker');}catch(e){}
  },[img,showDrafts,draftInitTicker]);

  function loadFile(file){
    if(!file||!file.type.startsWith("image/"))return;
    var reader=new FileReader();
    reader.onload=function(ev){
      var dataUrl=ev.target.result;
      var parts=dataUrl.split(",");
      var b64=parts[1];
      var mt=parts[0].match(/data:([^;]+)/)[1];
      setImg({base64:b64,mt:mt,name:file.name.replace(/\.[^.]+$/,""),strokes:[]});
    };
    reader.readAsDataURL(file);
  }

  // clipboard paste
  useEffect(function(){
    function pasteHandler(e){
      var items=e.clipboardData&&e.clipboardData.items;
      if(!items)return;
      for(var i=0;i<items.length;i++){
        if(items[i].type.startsWith("image/")){
          var f=items[i].getAsFile();
          if(f){loadFile(f);break;}
        }
      }
    }
    window.addEventListener("paste",pasteHandler);
    return function(){window.removeEventListener("paste",pasteHandler);};
  },[]);

  // ── スワイプ戻る/進むを横取り ──
  useEffect(function(){
    function onPopState(){
      // 常にガードエントリを再積みしてブラウザから離れるのを防ぐ
      window.history.pushState({caApp:true},'');
      // アプリ内の「戻る」処理をトリガー
      window.dispatchEvent(new CustomEvent('ca_back'));
    }
    window.addEventListener('popstate',onPopState);
    return function(){window.removeEventListener('popstate',onPopState);};
  },[]);

  if(img){
    return ce(ImageAnnotator,{
      img:img,
      fbCfg:fbCfg,
      onSave:function(saved){setImg(function(prev){return Object.assign({},prev,saved);});},
      onClose:function(ticker){
        try{sessionStorage.removeItem('ca_session');}catch(e){}
        setImg(null);
        setDraftInitTicker(ticker||null);
        setShowDrafts(true);
      }
    });
  }

  /* 2026-04-20: ホーム画面廃止、起動時から DraftLibrary (チャート一覧) を表示
     img がある場合は ImageAnnotator。それ以外は常時 DraftLibrary + FbSettingsModal */
  return ce(Fragment,null,
    ce(DraftLibrary,{
      fbCfg:fbCfg,
      initialTicker:draftInitTicker,
      onOpen:function(d){setImg(d);setDraftInitTicker(null);},
      onClose:function(){/* no-op: DraftLibrary がホームなので戻り先なし */},
      onOpenFbSettings:function(){setShowFbSettings(true);},
      onOpenDisplaySettings:function(){setShowDisplaySettings(true);}
    }),
    /* Firebase設定モーダル */
    showFbSettings&&ce(FbSettingsModal,{
      cfg:fbCfg,
      onSave:function(nc){setFbCfg(nc);},
      onClose:function(){setShowFbSettings(false);}
    }),
    /* 2026-04-20: 表示・動作設定モーダル */
    showDisplaySettings&&ce(DisplaySettingsModal,{
      onClose:function(){setShowDisplaySettings(false);}
    })
  );
}
