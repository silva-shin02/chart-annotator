<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="チャート分析ツール 完全版"/>
<meta name="theme-color" content="#111111"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>チャート分析ツール 完全版</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#111;color:#fff;
  font-family:-apple-system,'Helvetica Neue',sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  /* 2026-04-20: iOS Safari ブラウザジェスチャー抑止 (エッジスワイプ/プルリフレッシュ/ダブルタップズーム/長押しメニュー)
     ピンチ(2本指)は touch-action:pinch-zoom で残す */
  touch-action:pinch-zoom;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  overscroll-behavior-x:contain;overscroll-behavior-y:contain}
/* 入力フィールドはテキスト選択許可 */
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
[contenteditable]{-webkit-user-select:text;user-select:text;}
.ca-rme-img-del{pointer-events:auto;}
.ca-rme-img-wrap{display:inline-block;position:relative;float:left;}
#root{width:100%;height:100%}
input[type=range]{accent-color:#6366F1}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.toolbar-row::-webkit-scrollbar{height:8px}
.toolbar-row::-webkit-scrollbar-thumb{background:#555;border-radius:4px}
.toolbar-row::-webkit-scrollbar-track{background:#1a1a1a}
canvas{image-rendering:high-quality;-webkit-image-rendering:high-quality}
/* スタンプ矢印: 根元選択段階の枠線パルス */
@keyframes caPtrPulse{
  0%{box-shadow:0 0 0 0 rgba(99,102,241,0.55);border-color:#818cf8;}
  70%{box-shadow:0 0 0 7px rgba(99,102,241,0);border-color:#6366F1;}
  100%{box-shadow:0 0 0 0 rgba(99,102,241,0);border-color:#818cf8;}
}
.ca-ptr-frame{animation:caPtrPulse 1.2s ease-out infinite;}
@keyframes caPtrBanner{0%{opacity:0;transform:translateY(4px);}100%{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script>
/* =====================================================================
   書き込みツール – ImageAnnotator standalone
   元: Scalping Notebook の ImageAnnotator を完全移植
===================================================================== */
(function(){
'use strict';
var R = React;
var useState   = R.useState;
var useRef     = R.useRef;
var useEffect  = R.useEffect;
var useMemo    = R.useMemo;
var Fragment   = R.Fragment;

/* 2026-04-20 C12: alert/confirm 置き換え用ヘルパー (React外から呼べるDOM直接操作)
   caToast(msg, level): 画面右下にToast表示 (level: 'info'|'success'|'error'、自動消滅)
   caConfirm(msg, onYes, onNo): モーダル表示、はい/いいえで callback */
if(!window.caToast){
  window.caToast=function(msg,level){
    level=level||'info';
    var container=document.getElementById('ca-toast-container');
    if(!container){
      container=document.createElement('div');
      container.id='ca-toast-container';
      container.style.cssText='position:fixed;bottom:20px;right:20px;z-index:999999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:90vw;';
      document.body.appendChild(container);
    }
    var toast=document.createElement('div');
    var bg=level==='error'?'#7f1d1d':level==='success'?'#14532d':'#1e3a5f';
    var fg=level==='error'?'#fca5a5':level==='success'?'#86efac':'#93c5fd';
    var border=level==='error'?'#b91c1c':level==='success'?'#16a34a':'#2563eb';
    toast.style.cssText='background:'+bg+';color:'+fg+';padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;max-width:400px;box-shadow:0 4px 16px rgba(0,0,0,.5);pointer-events:auto;opacity:0;transition:opacity 0.2s,transform 0.2s;transform:translateX(20px);white-space:pre-line;border:1px solid '+border+';line-height:1.5;';
    toast.textContent=msg;
    /* クリックで即消す */
    toast.onclick=function(){
      toast.style.opacity='0';toast.style.transform='translateX(20px)';
      setTimeout(function(){if(toast.parentNode)toast.parentNode.removeChild(toast);},200);
    };
    container.appendChild(toast);
    requestAnimationFrame(function(){
      toast.style.opacity='1';toast.style.transform='translateX(0)';
    });
    var ttl=level==='error'?5000:level==='success'?2500:3000;
    setTimeout(function(){
      toast.style.opacity='0';toast.style.transform='translateX(20px)';
      setTimeout(function(){if(toast.parentNode)toast.parentNode.removeChild(toast);},300);
    },ttl);
  };
}
if(!window.caConfirm){
  window.caConfirm=function(msg,onYes,onNo,opts){
    opts=opts||{};
    var yesLabel=opts.yesLabel||'はい';
    var noLabel=opts.noLabel||'キャンセル';
    var danger=opts.danger!==false; /* デフォルト危険色 (赤)、false で青 */
    var overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);';
    var modal=document.createElement('div');
    modal.style.cssText='background:#1f1f1f;border:1px solid #2a2a2a;border-radius:12px;padding:22px;max-width:420px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.7);animation:caModalIn 0.15s ease-out;';
    var msgEl=document.createElement('div');
    msgEl.style.cssText='font-size:14px;color:#fff;line-height:1.7;margin-bottom:20px;white-space:pre-line;';
    msgEl.textContent=msg;
    var btnRow=document.createElement('div');
    btnRow.style.cssText='display:flex;gap:8px;justify-content:flex-end;';
    function mkBtn(label,primary,cb){
      var b=document.createElement('button');
      b.textContent=label;
      var bg=primary?(danger?'#dc2626':'#2563eb'):'#2a2a2a';
      var col=primary?'#fff':'#aaa';
      b.style.cssText='padding:10px 18px;font-size:13px;font-weight:'+(primary?'700':'600')+';background:'+bg+';color:'+col+';border:none;border-radius:8px;cursor:pointer;min-width:90px;';
      b.onclick=function(){cleanup();cb&&cb();};
      return b;
    }
    var cancelBtn=mkBtn(noLabel,false,onNo);
    var okBtn=mkBtn(yesLabel,true,onYes);
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(okBtn);
    modal.appendChild(msgEl);
    modal.appendChild(btnRow);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    function cleanup(){if(overlay.parentNode)overlay.parentNode.removeChild(overlay);}
    overlay.onclick=function(e){if(e.target===overlay){cleanup();onNo&&onNo();}};
    /* Escキー対応 */
    function onKey(e){if(e.key==='Escape'){cleanup();onNo&&onNo();window.removeEventListener('keydown',onKey);}}
    window.addEventListener('keydown',onKey);
  };
}
var ce         = R.createElement;   // ← h ではなく ce を使う

var IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
var HAS_HOVER = typeof matchMedia!=='undefined' && matchMedia('(hover: hover)').matches;
/* C-uaxis+C6+C7: 過去chartと現在chartを同一キャンバスに連結表示 (旧左右分離レイアウトはC7で削除) */
/* C8a: 隙間幅はローソク足1本分 (1m=1分, 5m=5分)。昼休み(60分)と夜間gapの両方に適用 */
function getCandleGap(tf){ return tf==='1m'?1:5; }

/* 2026-04-21: 地図モデルズーム仕様 (X/Y同倍率)
   Z=1.0 時: ローソク実幅 12px, 10円ピッチ 35px
   uPx (1uあたりpx) = (Z_BASE_BAR_PX/0.8) * Z / baseStep — 中心間隔 = barW/0.8
   pxPerYen = (Z_BASE_PRICE_PX/10) * Z = 3.5 * Z
   フィット倍率 = chartW/縦priceH に応じて自動算出 (初期表示) */
var Z_BASE_BAR_PX=12;
var Z_BASE_PRICE_PX=35;
var Z_MIN=0.10;
var Z_MAX=3.0;
var Z_FACTOR=1.176;  /* ホイール/ピンチ 1段で約 17.6% */
var Z_STEP_FINE=1.05;  /* ＋/− ボタン 1回で 5% 刻み */

/* ─── IndexedDB キャッシュ（localStorage 5MB制限回避）──────── */
var _idb=null, _idbReady=false, _idbQueue=[];
var IDB_NAME='ca_cache_v1', IDB_STORE='blobs';
(function(){
  try{
    var req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=function(e){e.target.result.createObjectStore(IDB_STORE);};
    req.onsuccess=function(e){_idb=e.target.result;_idbReady=true;
      _idbQueue.forEach(function(fn){try{fn();}catch(ex){}});_idbQueue=[];};
    req.onerror=function(){_idbReady=true;_idbQueue=[];};
  }catch(e){_idbReady=true;}
})();
function _idbRun(fn){if(_idbReady){try{fn();}catch(e){}}else{_idbQueue.push(fn);}}
function idbGet(key,cb){
  _idbRun(function(){
    if(!_idb){cb(null);return;}
    try{
      var tx=_idb.transaction(IDB_STORE,'readonly');
      var rq=tx.objectStore(IDB_STORE).get(key);
      rq.onsuccess=function(){cb(rq.result||null);};
      rq.onerror=function(){cb(null);};
    }catch(e){cb(null);}
  });
}
function idbSet(key,val){
  _idbRun(function(){
    if(!_idb)return;
    try{var tx=_idb.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(val,key);}catch(e){}
  });
}
function idbDel(key){
  _idbRun(function(){
    if(!_idb)return;
    try{var tx=_idb.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(key);}catch(e){}
  });
}

/* ─── Firebase Storage ヘルパー ────────────────────────────── */
var _fbApp=null, _fbStorage=null;
function getFirebaseStorage(cfg){
  if(!cfg||!cfg.storageBucket||!cfg.apiKey)return null;
  if(_fbStorage)return _fbStorage;
  try{
    if(!_fbApp){
      try{_fbApp=firebase.app();}catch(e2){
        _fbApp=firebase.initializeApp({apiKey:cfg.apiKey,storageBucket:cfg.storageBucket});
      }
    }
    _fbStorage=firebase.storage(_fbApp);
  }catch(e){console.error('Firebase Storage init:',e);}
  return _fbStorage;
}
function base64ToBlob(b64,mimeType){
  var bc=atob(b64),ba=new Uint8Array(bc.length);
  for(var i=0;i<bc.length;i++)ba[i]=bc.charCodeAt(i);
  return new Blob([ba],{type:mimeType});
}
/* 2026-04-20 Phase10: uploadToStorage 撤去 (画像base64アップロード専用、呼び出しゼロ) */
function storageUrlToBase64(url){
  return fetch(url).then(function(r){
    if(!r.ok)throw new Error('Storage HTTP '+r.status);
    return r.blob();
  })
    .then(function(blob){return new Promise(function(resolve,reject){
        var rd=new FileReader();
        rd.onload=function(){var parts=rd.result.split(',');resolve({base64:parts[1],mt:blob.type||'image/png'});};
        rd.onerror=function(){reject(new Error('FileReader failed'));};
        rd.readAsDataURL(blob);
      });
    });
}
function uploadThumbToStorage(cfg,id,thumbDataUrl){
  if(!cfg||!cfg.storageBucket||!thumbDataUrl||thumbDataUrl.indexOf(',')<0)return Promise.resolve(null);
  var b64=thumbDataUrl.split(',')[1]; if(!b64)return Promise.resolve(null);
  var st=getFirebaseStorage(cfg); if(!st)return Promise.resolve(null);
  var blob=base64ToBlob(b64,'image/png');
  var ref=st.ref('chart-thumbs/'+id+'.png');
  return ref.put(blob).then(function(){return ref.getDownloadURL();})
    .catch(function(e){console.error('Thumb upload:',e);return null;});
}

/* ─── Firebase ヘルパー ───────────────── */
function _fbIsPaused(cfg){
  if(!cfg||!cfg.url)return true;
  return cfg.paused!==false;
}

/* ─── Color Picker ─────────────────────────────────────────── */
var ANNOT_PRESET_KEY = 'scalping_annot_presets_v1';
var DEF_PRESETS = [
  "#000000","#555555","#888888","#bbbbbb","#ffffff",
  "#b71c1c","#f44336","#e91e63","#f48fb1","#ff6d00",
  "#2196f3","#0d47a1","#1b5e20","#76ff03","#ffeb3b",
  "#f57f17","#ce93d8","#1a237e","#37474f","#558b2f"
];
var LIGHT_COLS = ["#ffffff","#ffeb3b","#f48fb1","#bbbbbb","#76ff03","#ce93d8"];

function ColorPicker(props){
  var value=props.value, onChange=props.onChange, history=props.history,
      onHistory=props.onHistory, quickColors=props.quickColors, onQuickColors=props.onQuickColors;

  var s0=useState(false);  var open=s0[0],setOpen=s0[1];
  var s1=useState("preset"); var tab=s1[0],setTab=s1[1];
  var s2=useState(false);  var editMode=s2[0],setEditMode=s2[1];
  var s3=useState(value);  var customVal=s3[0],setCustomVal=s3[1];
  var s4=useState(null);   var editingSlot=s4[0],setEditingSlot=s4[1];
  var s5=useState(null);   var dragIdx=s5[0],setDragIdx=s5[1];
  var s6=useState(null);   var dragOverIdx=s6[0],setDragOverIdx=s6[1];
  var s7=useState(function(){
    try{ var p=localStorage.getItem(ANNOT_PRESET_KEY); return p?JSON.parse(p):DEF_PRESETS; }
    catch(e){ return DEF_PRESETS; }
  }); var presets=s7[0],setPresets=s7[1];

  function savePresets(p){ setPresets(p); try{localStorage.setItem(ANNOT_PRESET_KEY,JSON.stringify(p));}catch(e){} }
  function closeAll(){ setOpen(false);setEditMode(false);setEditingSlot(null);setDragIdx(null);setDragOverIdx(null); }
  function pick(c){
    onChange(c); onHistory(c);
    if(editingSlot!==null){ var nq=quickColors.slice(); nq[editingSlot]=c; onQuickColors(nq); }
    else if(!quickColors.includes(c)) onQuickColors([c].concat(quickColors).slice(0,8));
    closeAll();
  }
  function addCustom(){
    if(!presets.includes(customVal)) savePresets(presets.concat([customVal]));
    onChange(customVal); onHistory(customVal);
    if(!quickColors.includes(customVal)) onQuickColors([customVal].concat(quickColors).slice(0,8));
    setTab("preset");
  }
  function remPreset(c){ savePresets(presets.filter(function(x){return x!==c;})); }
  function reorder(f,t){
    if(f===t)return;
    var np=presets.slice(); var r=np.splice(f,1)[0]; np.splice(t,0,r); savePresets(np);
  }
  function onQClick(c,i){
    if(value===c&&quickColors[i]===c){ setEditingSlot(i);setCustomVal(c);setTab("preset");setOpen(true); }
    else{ onChange(c);onHistory(c); }
  }

  var DS=IS_TOUCH?46:40, QSZ=IS_TOUCH?30:26;

  function PDot(p2){
    var c=p2.c,i=p2.i;
    var sel=c===value,isd=dragIdx===i,iso=dragOverIdx===i&&dragIdx!==null&&dragIdx!==i;
    return ce("span",{style:{position:"relative",flexShrink:0}},
      ce("span",{
        draggable:editMode,
        onDragStart:function(e){e.dataTransfer.setData("t","");setDragIdx(i);},
        onDragOver:function(e){e.preventDefault();if(dragIdx!==null&&dragIdx!==i)setDragOverIdx(i);},
        onDrop:function(e){e.preventDefault();if(dragIdx!==null)reorder(dragIdx,i);setDragIdx(null);setDragOverIdx(null);},
        onDragEnd:function(){setDragIdx(null);setDragOverIdx(null);},
        onClick:function(){if(!editMode)pick(c);},
        style:{width:DS,height:DS,borderRadius:"50%",background:c,display:"flex",alignItems:"center",justifyContent:"center",
          cursor:editMode?"grab":"pointer",boxSizing:"border-box",opacity:isd?0.3:1,
          border:iso?"3.5px dashed #007AFF":sel&&!editMode?"3.5px solid #007AFF":"1.5px solid rgba(0,0,0,.14)"}
      },
        sel&&!editMode&&ce("span",{style:{fontSize:20,color:LIGHT_COLS.includes(c)?"#000":"#fff",fontWeight:700,lineHeight:1}},"✓"),
        editMode&&ce("span",{style:{fontSize:16,color:"rgba(255,255,255,.5)",userSelect:"none",pointerEvents:"none"}},"⠿")
      ),
      (sel&&!editMode||editMode)&&ce("span",{
        onClick:function(e){e.stopPropagation();remPreset(c);},
        style:{position:"absolute",top:-5,right:-5,width:20,height:20,borderRadius:"50%",background:"#ff3b30",color:"#fff",
          fontSize:12,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",border:"2px solid #fff",zIndex:2,lineHeight:1}
      },"✕")
    );
  }

  var GRID={display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"};

  return ce(Fragment,null,
    // Quick color dots
    ce("div",{style:{display:"flex",gap:IS_TOUCH?10:8,alignItems:"center"}},
      quickColors.map(function(c,i){
        var isA=value===c;
        return ce("span",{key:i,onClick:function(){onQClick(c,i);},
          style:{width:QSZ,height:QSZ,borderRadius:"50%",background:c,cursor:"pointer",flexShrink:0,
            boxShadow:isA?"0 0 0 2px #111,0 0 0 4px #fff,0 0 0 5.5px #6366F1":"0 1px 3px rgba(0,0,0,.4)",
            border:"2px solid rgba(255,255,255,.5)",transform:isA?"scale(1.2)":"scale(1)",transition:"transform .1s"}});
      })
    ),
    // Modal
    open&&ReactDOM.createPortal(
      ce("div",{onClick:closeAll,style:{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:11000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
        ce("div",{onClick:function(e){e.stopPropagation();},
          style:{background:"#f2f2f7",borderRadius:20,padding:"20px 20px 24px",width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,.5)"}},
          ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
            tab==="preset"
              ?ce("button",{onClick:function(){setEditMode(function(m){return !m;});},style:{fontSize:14,color:"#007AFF",fontWeight:600,background:"none",border:"none",cursor:"pointer"}},editMode?"完了":"編集")
              :ce("span",null),
            ce("span",{style:{fontSize:17,fontWeight:700,color:"#000"}},editingSlot!==null?"スロット"+(editingSlot+1)+"の色を変更":"カラーを変更"),
            ce("button",{onClick:closeAll,style:{fontSize:14,color:"#007AFF",fontWeight:600,background:"none",border:"none",cursor:"pointer"}},"閉じる")
          ),
          // Tabs
          ce("div",{style:{display:"flex",background:"rgba(0,0,0,.08)",borderRadius:11,padding:2,marginBottom:20}},
            [["preset","プリセット"],["custom","カスタム"],["history","履歴"]].map(function(pair){
              return ce("button",{key:pair[0],onClick:function(){setTab(pair[0]);setEditMode(false);},
                style:{flex:1,padding:"7px 0",fontSize:14,fontWeight:600,border:"none",borderRadius:9,cursor:"pointer",
                  background:tab===pair[0]?"#fff":"transparent",color:tab===pair[0]?"#000":"#666",
                  boxShadow:tab===pair[0]?"0 1px 5px rgba(0,0,0,.2)":"none"}},pair[1]);
            })
          ),
          tab==="preset"&&ce("div",{style:GRID},
            presets.map(function(c,i){return ce(PDot,{key:i,c:c,i:i});}),
            ce("span",{onClick:function(){setTab("custom");setEditMode(false);},
              style:{width:DS,height:DS,borderRadius:"50%",background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",border:"1.5px dashed #aaa",flexShrink:0}},
              ce("span",{style:{fontSize:24,color:"#aaa",lineHeight:1,fontWeight:300}},"+")
            )
          ),
          tab==="custom"&&ce("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:16}},
            ce("div",{style:{display:"flex",gap:12,alignItems:"center"}},
              ce("span",{style:{width:56,height:56,borderRadius:12,background:customVal,display:"block",border:"1px solid rgba(0,0,0,.12)"}}),
              ce("div",null,
                ce("div",{style:{fontSize:12,color:"#999",marginBottom:4}},"現在の色"),
                ce("div",{style:{fontSize:13,fontFamily:"monospace",color:"#333"}},customVal.toUpperCase())
              )
            ),
            ce("label",{style:{cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8}},
              ce("input",{type:"color",value:customVal,onChange:function(e){setCustomVal(e.target.value);},
                style:{width:220,height:IS_TOUCH?80:60,cursor:"pointer",border:"none",borderRadius:8}}),
              ce("span",{style:{fontSize:12,color:"#666"}},"タップして色を選択")
            ),
            ce("div",{style:{display:"flex",gap:10}},
              ce("button",{onClick:addCustom,style:{padding:"10px 20px",background:"#34C759",color:"#fff",border:"none",borderRadius:12,fontSize:15,fontWeight:600,cursor:"pointer"}},"この色を追加"),
              ce("button",{onClick:function(){pick(customVal);},style:{padding:"10px 20px",background:"#007AFF",color:"#fff",border:"none",borderRadius:12,fontSize:15,fontWeight:600,cursor:"pointer"}},"この色を使用")
            )
          ),
          tab==="history"&&(history.length>0
            ?ce("div",{style:GRID},
                history.map(function(c,i){
                  return ce("span",{key:i,onClick:function(){pick(c);},
                    style:{width:DS,height:DS,borderRadius:"50%",background:c,cursor:"pointer",
                      border:c===value?"3.5px solid #007AFF":"1.5px solid rgba(0,0,0,.14)",
                      display:"flex",alignItems:"center",justifyContent:"center",boxSizing:"border-box",flexShrink:0}},

/* ─── Geometry ─────────────────────────────────────────────── */
function distSeg(px,py,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  if(!l2)return Math.hypot(px-x1,py-y1);
  var t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l2));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function strokeHits(s,px,py,er){
  var hw=(s.type==="marker"?s.lineW*4:s.lineW/2)+2, r=er+hw;
  switch(s.type){
    case"line":case"dotted":case"arrow":case"marker":
      return distSeg(px,py,s.x1,s.y1,s.x2,s.y2)<r;
    case"rect":
      return Math.min(distSeg(px,py,s.x1,s.y1,s.x2,s.y1),distSeg(px,py,s.x2,s.y1,s.x2,s.y2),
                      distSeg(px,py,s.x1,s.y2,s.x2,s.y2),distSeg(px,py,s.x1,s.y1,s.x1,s.y2))<r;
    case"circle":{
      var nd=Math.sqrt(Math.pow((px-s.cx)/Math.max(s.rx,1),2)+Math.pow((py-s.cy)/Math.max(s.ry,1),2));
      return Math.abs(nd-1)*Math.min(s.rx,s.ry)<r;
    }
    case"freehand":
      return (s.pts||[]).some(function(p,i){
        return i===0?Math.hypot(px-p.x,py-p.y)<r:distSeg(px,py,s.pts[i-1].x,s.pts[i-1].y,p.x,p.y)<r;
      });
    case"text":{
      var fs=s.fontSize||24,tw=s.measuredWidth||Math.max(fs*0.8*(s.text||"").length,fs),pad=er+12;
      return px>=s.x-pad&&px<=s.x+tw+pad&&py>=s.y-pad&&py<=s.y+fs*1.5+pad;
    }
    default:return false;
  }
}
function findStrokeAt(strokes,px,py,er){
  for(var i=strokes.length-1;i>=0;i--){if(strokeHits(strokes[i],px,py,er))return i;}
  return -1;

  var mx=Infinity,my=Infinity,Mx=-Infinity,My=-Infinity;
  idxs.forEach(function(i){
    var s=strokes[i]; if(!s)return;
    var pts=[];
    switch(s.type){
      case"line":case"dotted":case"arrow":case"marker":pts=[{x:s.x1,y:s.y1},{x:s.x2,y:s.y2}];break;
      case"rect":pts=[{x:s.x1,y:s.y1},{x:s.x2,y:s.y2}];break;
      case"circle":pts=[{x:s.cx-s.rx,y:s.cy-s.ry},{x:s.cx+s.rx,y:s.cy+s.ry}];break;
      case"freehand":pts=s.pts||[];break;
      case"text":{
        var fsz=s.fontSize||24;
        var bw=s.boxW||Math.max(fsz*0.8*(s.text||'').length,fsz);
        var bh=textBoxHeight(s.text,fsz,s.fontBold,s.boxW);
        pts=[{x:s.x,y:s.y},{x:s.x+bw,y:s.y+bh}];break;
      }
    }
    pts.forEach(function(p){mx=Math.min(mx,p.x);my=Math.min(my,p.y);Mx=Math.max(Mx,p.x);My=Math.max(My,p.y);});
  });
  if(mx===Infinity)return null;
  return{x:mx-10,y:my-10,w:Mx-mx+20,h:My-my+20};
}
/* テキストボックスの高さをキャンバスpxで算出 */
function textBoxHeight(text,fontSize,fontBold,boxW){
  var fs=fontSize||24, lh=fs*1.45, mW=boxW||999999;
  var tc=document.createElement("canvas").getContext("2d");
  tc.font=(fontBold?"bold ":"")+fs+"px -apple-system,sans-serif";
  var lines=0;
  (text||"").split("\n").forEach(function(para){
    if(!para.length){lines++;return;}
    var line="";
    for(var ci=0;ci<para.length;ci++){
      var test=line+para[ci];
      if(tc.measureText(test).width>mW&&line.length>0){lines++;line=para[ci];}

  switch(s.type){
    case"line":case"dotted":case"arrow":case"marker":return Object.assign({},s,{x1:s.x1+dx,y1:s.y1+dy,x2:s.x2+dx,y2:s.y2+dy});
    case"rect":return Object.assign({},s,{x1:s.x1+dx,y1:s.y1+dy,x2:s.x2+dx,y2:s.y2+dy});
    case"circle":return Object.assign({},s,{cx:s.cx+dx,cy:s.cy+dy});
    case"freehand":return Object.assign({},s,{pts:s.pts.map(function(p){return{x:p.x+dx,y:p.y+dy};})});
    case"text":return Object.assign({},s,{x:s.x+dx,y:s.y+dy});

function scalePoint(px,py,ob,nb){
  var rx=ob.w>1?(px-ob.x)/ob.w:0.5, ry=ob.h>1?(py-ob.y)/ob.h:0.5;
  return{x:nb.x+rx*nb.w, y:nb.y+ry*nb.h};

function scaleStroke(s,ob,nb){
  function sp(px,py){return scalePoint(px,py,ob,nb);}
  switch(s.type){

      return Object.assign({},s,{cx:c2.x,cy:c2.y,rx:rx2,ry:ry2});
    }
    case"freehand":
      return Object.assign({},s,{pts:s.pts.map(function(p){var q=sp(p.x,p.y);return{x:q.x,y:q.y};})});
    case"text":{
      var pt=sp(s.x,s.y),sc=ob.h>1?nb.h/ob.h:1,wsc=ob.w>1?nb.w/ob.w:1;
      return Object.assign({},s,{x:pt.x,y:pt.y,

/* ─── Draw stroke on canvas ────────────────────────────────── */
function drawStroke(ctx,s){

    case"arrow":{

      ctx.beginPath(); ctx.moveTo(s.x1,s.y1);
      ctx.lineTo(s.x1-hl*Math.cos(ang-Math.PI/7),s.y1-hl*Math.sin(ang-Math.PI/7));
      ctx.lineTo(s.x1-hl*Math.cos(ang+Math.PI/7),s.y1-hl*Math.sin(ang+Math.PI/7));

        else if(s.pts.length===2){ctx.lineTo(s.pts[1].x,s.pts[1].y);}
        else{

/* ─── URLパラメータ解析 (2026-04-20: scalping-notebook連携用) ──
   対応フォーマット:
   - ?5016_2025-04-19         (code_date)
   - ?5016_2025-04-19&id=abc  (code_date + id)
   戻り値: {code, date, id} または null
   パース後URLから即座にパラメータをクリアする (履歴/リロードで再適用させない) */
function caParseUrlParams(){
  try{
    var search=window.location.search||'';
    if(!search||search.length<2)return null;
    var raw=search.slice(1); /* 先頭の?を除去 */
    /* id=XXX を抽出して除去 */
    var id='';
    var idMatch=raw.match(/(?:^|&)id=([^&]*)/);
    if(idMatch){
      id=decodeURIComponent(idMatch[1]||'');
      raw=raw.replace(/(?:^|&)id=[^&]*/,'');
    }
    /* 先頭の & を除去 */
    raw=raw.replace(/^&+/,'').replace(/&+$/,'');
    if(!raw)return null;
    /* 残った文字列を第1セグメントとして扱う (& で複数ある場合は先頭のみ) */
    var first=raw.split('&')[0];
    try{first=decodeURIComponent(first);}catch(e){}
    if(!first||first.indexOf('_')<=0)return null;
    /* code_date 分解: 最初の_で分割 */
    var u=first.indexOf('_');
    if(u<=0)return null;
    var code=first.slice(0,u).trim();
    var date=first.slice(u+1).trim();
    if(!code||!date)return null;
    /* date 形式チェック: YYYY-MM-DD */
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return null;
    return {code:code,date:date,id:id||''};
  }catch(e){console.warn('[caParseUrlParams] error:',e);return null;}
}

/* 2026-05: スタンプ用 id 生成 (案C: id参照型 + text/colorバックアップ) */
function caUid(){return 'sn_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);}
function caLoadSnippets(){
  try{
    var v=JSON.parse(localStorage.getItem(CA_SNIPPETS_KEY));
    if(v&&v.length){
      if(typeof v[0]==='string'){
        v=v.map(function(s){return {id:caUid(),text:s,color:'#ff9500'};});
        caSaveSnippets(v);
        return v;
      }
      var changed=false;
      v=v.map(function(s){
        if(!s.id){changed=true;return Object.assign({id:caUid()},s);}
        return s;
      });
      if(changed)caSaveSnippets(v);
      return v;
    }
  }catch(e){}
  return CA_DEFAULT_SNIPPETS.map(function(s){return Object.assign({id:caUid()},s);});
}
function caSaveSnippets(arr){
  try{localStorage.setItem(CA_SNIPPETS_KEY,JSON.stringify(arr));}catch(e){}
}

var CA_TICKER_NOTES_KEY='ca_ticker_notes_v1';
function caLoadTickerNotes(){
  try{var v=JSON.parse(localStorage.getItem(CA_TICKER_NOTES_KEY));if(v&&typeof v==='object')return v;}catch(e){}
  return {};
}
function caSaveTickerNotes(obj){
  try{localStorage.setItem(CA_TICKER_NOTES_KEY,JSON.stringify(obj));}catch(e){}
}
function caGetTickerNote(ticker){
  if(!ticker)return '';
  var notes=caLoadTickerNotes();
  return notes[ticker]||'';
}
function caSetTickerNote(ticker,text){
  if(!ticker)return;
  var notes=caLoadTickerNotes();
  if(text)notes[ticker]=text; else delete notes[ticker];
  caSaveTickerNotes(notes);
}

/* ─── RefAnalysisPicker（F1: 過去の分析データを選択） ───────── */
function RefAnalysisPicker(props){
  var onSelect=props.onSelect, onClose=props.onClose, fbCfg=props.fbCfg||{};
  var currentTicker=props.currentTicker;        // 現在分析中の ticker (必須)
  var currentDraftId=props.currentDraftId;      // 現在開いてる draft の id (自分自身を除外用)
  var currentDate=props.currentDate||'';        // 現在開いてるチャートの日付
  var s2=useState(caLoadMeta);    var meta=s2[0];
  var s3=useState(null);          var loading=s3[0],setLoading=s3[1];
  var BT2={border:"none",cursor:"pointer",fontFamily:"inherit"};

  // 現在のticker かつ 自分自身以外 のチャートのみ表示
  // ソート: name の新しい順 (降順、localeCompare)
  var charts=meta.filter(function(m){
    if(!currentTicker||m.ticker!==currentTicker)return false;
    if(currentDraftId&&m.id===currentDraftId)return false;
    return true;
  }).sort(function(a,b){
    return (b.name||'').localeCompare(a.name||'');
  });

  function pickAnalysis(id, chartMeta){
    setLoading(id);
    // ローカル (IndexedDB) から取得試行
    caLoadDataAsync(id, function(d){
      if(d && d.analysisData){
        setLoading(null);
        onSelect({
          id:id, ticker:chartMeta.ticker, name:chartMeta.name,
          analysisData:d.analysisData,
          /* C6: ref側strokeに side='ref' を付与 */
          analysisStrokes:migrateAnalysisStrokes(d.analysisStrokes,'ref'),
          savedAt:chartMeta.savedAt||0,
          /* 2026-04-20 C8: 楽観ロック基準値 (書き込み前pre-checkで使用) */
          _savedAt:(d._v||chartMeta.savedAt||0)
        });
        return;
      }
      // ローカルにない → Firebase から取得
      if(fbCfg.url){
        var dataBase=fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-data';
        var auth=fbCfg.secret?'?auth='+fbCfg.secret:'';
        fetch(dataBase+'/'+id+'.json'+auth).then(function(r){return r.ok?r.text():null;})
          .then(function(txt){
            var fbData=txt?JSON.parse(txt):null;
            setLoading(null);
            if(fbData && fbData.analysisData){
              onSelect({
                id:id, ticker:chartMeta.ticker, name:chartMeta.name,
                analysisData:fbData.analysisData,
                /* C6: ref側strokeに side='ref' を付与 */
                analysisStrokes:migrateAnalysisStrokes(fbData.analysisStrokes,'ref'),
                savedAt:chartMeta.savedAt||0,
                /* 2026-04-20 C8: 楽観ロック基準値 */
                _savedAt:(fbData._v||chartMeta.savedAt||0)
              });
            }else{
              window.caToast('このチャートには過去データ(JSON)が紐付いていません。\nF5機能「過去データを追加する」は未実装です。','info');
            }
          }).catch(function(e){
            setLoading(null);
            window.caToast('読込失敗: '+(e&&e.message?e.message:'不明'),'error');
          });
      }else{
        setLoading(null);
        window.caToast('このチャートには過去データ(JSON)が紐付いていません。','info');
      }
    });
  }

  return ReactDOM.createPortal(
    ce("div",{onClick:function(e){if(e.target===e.currentTarget)onClose();},
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:22000,
        display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
      ce("div",{onClick:function(e){e.stopPropagation();},
        style:{background:"#1c1c1e",borderRadius:18,width:"100%",maxWidth:700,maxHeight:"80vh",
          boxShadow:"0 24px 64px rgba(0,0,0,.8)",border:"1px solid #2a2a2a",
          display:"flex",flexDirection:"column",overflow:"hidden"}},
        /* header */
        ce("div",{style:{padding:"16px 18px",borderBottom:"1px solid #2a2a2a",display:"flex",flexDirection:"column",gap:6,flexShrink:0}},
          ce("div",{style:{display:"flex",alignItems:"center",gap:10}},
            ce("span",{style:{fontSize:16,fontWeight:700,color:"#fff",flex:1}},
              "📊 過去チャートを開く — "+(currentTicker||'(ticker未設定)')
            ),
            ce("button",{onClick:onClose,style:Object.assign({},BT2,{fontSize:13,fontWeight:700,
              background:"#2a2a2a",color:"#aaa",padding:"7px 14px",borderRadius:8})},"閉じる")
          ),
          currentDate&&ce("div",{style:{fontSize:12,color:"#86efac",fontWeight:600}},
            "📅 現在表示中: "+currentDate)
        ),
        /* body: 過去データ一覧 */
        ce("div",{style:{flex:1,overflowY:"auto",padding:14,
          display:"flex",flexWrap:"wrap",gap:10,alignContent:"flex-start"}},
          charts.length===0
            ?ce(Fragment,null,
                ce("div",{style:{width:"100%",textAlign:"center",color:"#888",fontSize:14,paddingTop:40}},"過去のデータがありません"),
                ce("div",{style:{width:"100%",textAlign:"center",color:"#555",fontSize:11,marginTop:8}},currentTicker+" に紐付いた他のチャートは見つかりません"),
                ce("div",{style:{width:"100%",textAlign:"center",marginTop:24}},
                  ce("button",{
                    onClick:function(){window.caToast('F5機能: 過去データを追加する、は未実装です。','info');},
                    style:{padding:"11px 22px",fontSize:13,fontWeight:700,border:"none",borderRadius:8,
                      background:"#10b981",color:"#fff",cursor:"pointer",fontFamily:"inherit"}

              var isLoading=loading===m.id;
              return ce("div",{key:m.id,
                onClick:function(){if(!isLoading)pickAnalysis(m.id,m);},
                style:{width:IS_TOUCH?200:220,background:"#1a1a1a",borderRadius:8,
                  border:"1px solid #2a2a2a",overflow:"hidden",cursor:isLoading?"wait":"pointer",flexShrink:0,

                onMouseEnter:function(e){if(!isLoading)e.currentTarget.style.borderColor='#10b981';},
                onMouseLeave:function(e){e.currentTarget.style.borderColor='#2a2a2a';}},
                (m.thumbUrl||_thumbMemCache[m.id]||m.thumb)?ce("img",{src:_thumbMemCache[m.id]||m.thumbUrl||m.thumb,style:{width:"100%",display:"block",height:"auto"},draggable:false,onError:function(e){e.target.style.display="none";caClearBrokenThumbUrl(m.id);}})

                    alignItems:"center",justifyContent:"center",color:"#555",fontSize:10}},"no preview"),
                ce("div",{style:{padding:"5px 7px"}},
                  ce("div",{style:{fontSize:11,fontWeight:600,color:"#ddd",
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},m.name||''),
                  ce("div",{style:{fontSize:9,color:"#666",marginTop:2}},
                    isLoading?'読込中…':(m.savedAt?new Date(m.savedAt).toLocaleDateString():''))

            })
        )
      )
    ),
    document.body

}

  var sMH=useState(null); var moveHint=sMH[0],setMoveHint=sMH[1];

  // C1+: 統合chart用 — refData から refBars を算出
  var refData=props.refData;

  var refStrokes=props.refStrokes||[];
  function getStrokeByHit(hit){
    if(!hit)return null;

  }

  // データロード時: 全バーから priceRange を算出 (10円境界に丸める)
  // C1+: hasRef時は refBars も含めて外接 min/max で両chart共通レンジに (仕様①a)
  // B完全版: bars は EMA 連続化後の値で priceRange を算出 (refBars は原本でOK)
  // 2026-04-21: 地図モデルズーム化 — pricePx 縮減ロジック削除 (pricePx は最小ラベル間隔px に転用)
  //             priceRange = 外接そのまま、縦寸法は zoom と pxPerYen で決まる
  useEffect(function(){
    /* シミュレーション: 当日足0本でも refBars(前日) があれば前日のみで priceRange を算出して描画 */
    if(!bars.length&&!hasRef){setPriceRange(null);return;}
    var mn=Infinity, mx=-Infinity;
    function scan(barsArr){
      barsArr.forEach(function(b){
        if(b.l<mn)mn=b.l; if(b.h>mx)mx=b.h;
        ['ema9','ema22','ema50','ema200','vwap'].forEach(function(k){
          var v=b[k]; if(v!=null){if(v<mn)mn=v;if(v>mx)mx=v;}
        });

    }
    var enhBars=computeEnhancedBars(bars, hasRef?refBars:null);
    scan(enhBars);
    if(hasRef)scan(refBars);

    mn=Math.floor(mn/10)*10 - 5;
    mx=Math.ceil(mx/10)*10 + 5;

  },[data,tf,refData,hasRef]);

  /* 2026-04-21: 地図モデルズーム用ヘルパー
     getFitZoom: chartW と priceH に対し、1日全体 (uTotal×priceRange) を収めるZ
     uSpanFromZoom: zoom と chartW から表示u幅を算出
     派生: barW=12*Z, uPx=(12/0.8)*Z/baseStep=15Z/baseStep, pxPerYen=3.5*Z */
  function getFitZoom(){
    var rect=containerRef.current?containerRef.current.getBoundingClientRect():null;
    var W=rect?rect.width:(dim.w||1280);
    var H=rect?rect.height:(dim.h||720);
    var padL=40, padR=40, padT=10, padB=22;
    var chartW=W-padL-padR;
    /* 2026-04-22: 出来高エリア高さを 13%→18% に拡大 (ローソク足エリアと同期、3018行と同値) */
    var volH=Math.max(44,Math.round((H-padT-padB)*0.18));
    var priceH=H-padT-padB-volH-6;
    if(chartW<50||priceH<50)return 1.0;
    var baseStep=(tf==='5m'?5:1);
    var uTotalNow=getUTotal(hasRef);
    /* 横: chartW = uTotalNow * (Z_BASE_BAR_PX/0.8) * Z / baseStep
       → zX = chartW * baseStep * 0.8 / (Z_BASE_BAR_PX * uTotalNow) */
    var zX=chartW*baseStep*0.8/(Z_BASE_BAR_PX*uTotalNow);
    if(!priceRange)return Math.max(Z_MIN,Math.min(Z_MAX,zX));
    var pSpan=priceRange.max-priceRange.min;
    if(pSpan<=0)return Math.max(Z_MIN,Math.min(Z_MAX,zX));
    /* 縦: priceH = pSpan * (Z_BASE_PRICE_PX/10) * Z
       → zY = priceH * 10 / (Z_BASE_PRICE_PX * pSpan) */
    var zY=priceH*10/(Z_BASE_PRICE_PX*pSpan);
    var z=Math.min(zX,zY);
    return Math.max(Z_MIN,Math.min(Z_MAX,z));
  }
  /* zoom と chartW から表示 u幅を算出 (barW=Z_BASE_BAR_PX*zoom 時のuSpan)
     chartW = uSpan * (Z_BASE_BAR_PX/0.8) * zoom / baseStep
     → uSpan = chartW * baseStep * 0.8 / (Z_BASE_BAR_PX * zoom) */
  function uSpanFromZoom(z, chartW){
    var baseStep=(tf==='5m'?5:1);
    return chartW*baseStep*0.8/(Z_BASE_BAR_PX*z);
  }

  // データロード時: 全バーから priceRange を算出 (10円境界に丸める)
  // (上の priceRange useEffect はこの下に残る — 構造的にはここに挟まった形)

  // tf 変更時にビューリセット (controlled 時は親が制御するのでスキップ) — C8a: tf依存uTotal
  // 2026-04-21: 地図モデルズーム化 — フィット倍率で初期化、uS=0
  //             props.zoom==null (親が未保存状態) のときも setZoom(fz) を呼び、親に通知
  useEffect(function(){
    if(props.view===undefined){
      setView({uS:0,uE:getUTotal(hasRef)});
    }
    if(props.zoom==null){
      var fz=getFitZoom();
      setZoom(fz);
    }
    if(props.pShift===undefined)setPShift(0);
  },[tf,data]);

  /* 2026-04-21: priceRange / dim 確定後にフィット倍率を再算出 (初回データロード時)
     refData open/close で priceRange が変わるタイミングも追従
     props.zoom==null (親未保存) のときに発火 — 一度 setZoom が走ると props.zoom が設定され発火しなくなる */
  useEffect(function(){
    if(!priceRange||!dim.w||!dim.h)return;
    if(props.zoom==null){
      var fz=getFitZoom();
      setZoom(fz);
    }
  },[priceRange,dim.w,dim.h,hasRef,tf,props.zoom]);

  // コンテナサイズ追従 (ResizeObserver で display:none → 表示切替も捉える)
  useEffect(function(){
    var el=containerRef.current; if(!el)return;
    function update(){
      var r=el.getBoundingClientRect();
      // 非表示中 (display:none や極小) は更新しない — blur回避
      if(r.width<100||r.height<100)return;
      var w=Math.floor(r.width);
      var h=Math.floor(r.height);
      setDim(function(prev){return(prev.w===w&&prev.h===h)?prev:{w:w,h:h};});
    }
    update();

    return function(){

  useEffect(function(){
    if((!bars.length&&!hasRef)||!priceRange)return;

       RAF にまとめて1フレームに1回だけ描画 */
    var rafId=requestAnimationFrame(function(){
      /* 2026-04-21: 地図モデルズーム化 — dim に zoom を追加 (drawDataChart 内で派生値計算)
         pricePx は最小ラベル間隔px として転用 */
      var dimWithPx=Object.assign({},dim,{pricePx:pricePx,zoom:zoom});

  // 十字カーソル + 描画プレビュー (オーバーレイCanvas)
  function drawCrosshair(){

    var dpr=window.devicePixelRatio||1;
    var W=dim.w, H=dim.h;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    ctx._strokeZoom=(L&&typeof L.zoom==='number'&&L.zoom>0)?L.zoom:1.0;

    if(L&&drawRef.current&&drawRef.current.on){

      var dSide=d.side||'cur';

      function pToYloc(p){

    /* lasso 移動中プレビュー (移動後位置を点線で表示) — C6: side対応

    if(L&&moveRef.current&&moveRef.current.moving){
      var m=moveRef.current;

      var s=mSrcArr[m.idx];

        var mSide=m.side||s.side||'cur';
        function minToXloc2(mm){return minToXWithSide(mm,mSide);}
        /* 2026-04-22: 地図モデル pToY 式 */
        function pToYloc2(pp){
          if(typeof L.dpmax==='number'&&typeof L.pxPerYen==='number'&&L.pxPerYen>0){

        if(tp2==='freehand'||tp2==='text'){

        } else {

        }

    }
    /* eraser: 赤枠プレビューは廃止 — なぞった瞬間に即削除する方式 */

    /* 2026-04-29: 投げ縄パス描画 (破線) + マルチ移動プレビュー

      ctx.restore();
    }

      ctx.save();
      ctx.globalAlpha=0.5;
      lassoSel.forEach(function(sel){
        var arr2=(sel.side==='ref')?(refStrokes||[]):(strokes||[]);
        var s2=arr2[sel.idx]; if(!s2)return;
        var moved=Object.assign({},s2,{
          anchors:s2.anchors.map(function(a){return {tm:a.tm+(lmv.dtm||0),p:a.p+(lmv.dp||0)};})
        });
        var minFn=function(m){return minToXWithSide(m,sel.side);};
        function pToYm(p){
          if(typeof L.dpmax==='number'&&typeof L.pxPerYen==='number'&&L.pxPerYen>0)return L.priceTop+(L.dpmax-p)*L.pxPerYen;
          return L.priceTop+(1-(p-L.pmin)/(L.pmax-L.pmin))*L.priceH;
        }
        var tp2=s2.type||s2.tool;
        if(tp2==='freehand'||tp2==='text')drawAnalysisStrokeExt(ctx,moved,minFn,pToYm,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
        else drawAnalysisStroke(ctx,moved,minFn,pToYm,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);

    if(L&&measureDragRef.current){

      var mSide2=md2.startSide||'cur';
      var mX2=minToXWithSide(md2.startTm,mSide2);
      function pToYmeas(p){
        if(typeof L.dpmax==='number'&&typeof L.pxPerYen==='number'&&L.pxPerYen>0)
          return L.priceTop+(L.dpmax-p)*L.pxPerYen;

    var _pePl=ptrEditRef.current;
    if(L&&_pePl&&_pePl.phase==='placing'){

      if(_drPl&&_drPl.mode==='move'&&_drPl.curTm!=null&&_drPl.curP!=null){

          ctx.globalAlpha=0.92;
          drawAnalysisStrokeExt(ctx,_prevStk,_minFnPl,pToYcss,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);

    }

    var _pe=ptrEditRef.current;
    if(L&&_pe&&_pe.phase==='editing'){

      if(_hh&&_hh.stroke){
        var _s=_hh.stroke, _box=getSnippetBoxCss(_s,_hh.side);
        var _dr=ptrDragRef.current;

          ?{rootSide:(_dr.rootSide!=null?_dr.rootSide:(_s.pointer&&_s.pointer.rootSide)),rootFrac:_dr.rootFrac,rootOff:_dr.rootOff}
          :(_s.pointer||{});

        var _tP=(_dr&&_dr.tipP!=null)?_dr.tipP:(_s.pointer?_s.pointer.tipP:null);
        if(_box&&_tTm!=null&&_tP!=null){

          var _tx=minToXWithSide(_tTm,_hh.side), _ty=pToYcss(_tP);
          var _col=_s.color||'#ff9500';

    /* F2: 連動cursor が親から来ていればそれを自分の画面座標に変換して描く。

    var cx, cy, tmForLabel;
    var extRef=props.externalCursorRef;
    if(!L.hasRef && extRef && extRef.current){

      cx=minToXWithSide(ec.tm,'cur');

      if(cx<L.padL||cx>L.padL+L.chartW)return;
    } else {
      var pos=cursorRef.current; if(!pos)return;
      cx=pos.x; cy=pos.y;

      if(cy<L.padT||cy>L.volBot)return;

    ctx.stroke();
    if(cy>=L.priceTop&&cy<=L.priceBot){
      ctx.beginPath();
      ctx.moveTo(L.padL,Math.round(cy)+0.5);
      ctx.lineTo(L.padL+L.chartW,Math.round(cy)+0.5);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    var hh=Math.floor(tmForLabel/60), mm=Math.round(tmForLabel%60);
    if(mm>=60){hh++;mm-=60;}
    var tStr=(data.date?data.date.replace(/-/g,'/')+' ':'')+(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
    ctx.font='bold 11px -apple-system,Helvetica,sans-serif';
    ctx.textBaseline='middle'; ctx.textAlign='center';
    var tw=ctx.measureText(tStr).width+10;
    var ty=L.priceBot+3;
    ctx.fillStyle=CROSS;
    ctx.fillRect(cx-tw/2,ty,tw,14);
    ctx.fillStyle='#000';
    ctx.fillText(tStr,cx,ty+7);
    if(cy>=L.priceTop&&cy<=L.priceBot){
      var fracY=(cy-L.priceTop)/L.priceH;
      var priceAt=L.pmax-fracY*(L.pmax-L.pmin);
      var pStr=priceAt.toFixed(0);
      var pw=ctx.measureText(pStr).width+10;
      ctx.textAlign='left';
      ctx.fillStyle=CROSS;
      ctx.fillRect(L.padL+L.chartW+2,cy-8,pw,16);
      ctx.fillStyle='#000';
      ctx.fillText(pStr,L.padL+L.chartW+7,cy);
    }
  }

  /* 2026-04-20: 分離モード用 drawCrosshair — price/vol 両overlay に分割描画
     priceOverlay: preview + 十字(price部分) + 水平ライン + 時刻ラベル + 価格ラベル
     volOverlay: 十字縦線(vol部分) のみ */
  function _drawCrosshairSplit(){
    var pov=priceOverlayRef.current;
    var vov=volOverlayRef.current;
    if(!pov&&!vov)return;
    var dpr=window.devicePixelRatio||1;
    var W=dim.w;
    var L=layoutRef.current;
    var boundary=L?(L.priceBot+6):0;
    /* 2026-04-20: volAreaH は実描画域のみ (volH + padB) */
    var volAreaH=L?((L.volBot-L.priceBot-6)+L.padB):0;
    /* priceOverlay サイズ同期 (2026-04-20: 同値時再設定スキップ、iPad 負荷軽減) */
    if(pov){
      var povW=Math.round(W*dpr), povH=Math.round(boundary*dpr);
      if(pov.width!==povW)pov.width=povW;
      if(pov.height!==povH)pov.height=povH;
      try{
        if(pov.style.width!==W+'px')pov.style.width=W+'px';
        if(pov.style.height!==boundary+'px')pov.style.height=boundary+'px';
      }catch(e){}
    }
    if(vov&&volAreaH>0){
      var vovW=Math.round(W*dpr), vovH=Math.round(volAreaH*dpr);
      if(vov.width!==vovW)vov.width=vovW;
      if(vov.height!==vovH)vov.height=vovH;
      try{
        if(vov.style.width!==W+'px')vov.style.width=W+'px';
        if(vov.style.height!==volAreaH+'px')vov.style.height=volAreaH+'px';
      }catch(e){}
    }
    if(!L){return;}
    var pctx=pov?pov.getContext('2d'):null;
    var vctx=vov?vov.getContext('2d'):null;
    if(pctx){pctx.setTransform(dpr,0,0,dpr,0,0);pctx.clearRect(0,0,W,boundary);}
    if(vctx){vctx.setTransform(dpr,0,0,dpr,0,0);vctx.clearRect(0,0,W,volAreaH);}
    /* 2026-04-22: pctx にも _strokeZoom を適用 (書込オブジェクト zoom 連動) */
    if(pctx)pctx._strokeZoom=(L&&typeof L.zoom==='number'&&L.zoom>0)?L.zoom:1.0;
    if(pctx)pctx._snippetsById=props&&props.snippetsById?props.snippetsById:null;

    /* ── preview / 移動プレビュー: priceOverlay にのみ描画 (Y は price 座標系そのまま) ── */
    if(pctx){
      if(drawRef.current&&drawRef.current.on){
        var d=drawRef.current;
        var dSide=d.side||'cur';
        (function(){
          function minToXloc(m){return minToXWithSide(m,dSide);}
          /* 2026-04-22: 地図モデル pToY 式 */
          function pToYloc(p){
            if(typeof L.dpmax==='number'&&typeof L.pxPerYen==='number'&&L.pxPerYen>0){
              return L.priceTop+(L.dpmax-p)*L.pxPerYen;
            }
            return L.priceTop+(1-(p-L.pmin)/(L.pmax-L.pmin))*L.priceH;
          }
          if(d.freehand&&d.pts&&d.pts.length){
            var preview={type:'freehand',anchors:d.pts,
              color:drawColor,width:drawWidth,opacity:drawOpacity};
            drawAnalysisStrokeExt(pctx,preview,minToXloc,pToYloc,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
          } else {
            var preview2={type:drawTool,
              anchors:[{tm:d.sTM,p:d.sP},{tm:d.cTM,p:d.cP}],
              color:drawColor,width:drawWidth,opacity:drawOpacity};
            drawAnalysisStroke(pctx,preview2,minToXloc,pToYloc,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
          }
        })();
      }
      if(moveRef.current&&moveRef.current.moving){
        var m=moveRef.current;
        var mSrcArr=(m.side==='ref')?(refStrokes||[]):(strokes||[]);
        var sm=mSrcArr[m.idx];
        if(sm){
          (function(){
            var mSide=m.side||sm.side||'cur';
            function minToXloc2(mm){return minToXWithSide(mm,mSide);}
            /* 2026-04-22: 地図モデル pToY 式 */
            function pToYloc2(pp){
              if(typeof L.dpmax==='number'&&typeof L.pxPerYen==='number'&&L.pxPerYen>0){
                return L.priceTop+(L.dpmax-pp)*L.pxPerYen;
              }
              return L.priceTop+(1-(pp-L.pmin)/(L.pmax-L.pmin))*L.priceH;
            }
            var shifted=Object.assign({},sm,{
              anchors:sm.anchors.map(function(a){return {tm:a.tm+m.dtm, p:a.p+m.dp};})
            });
            var tp2=shifted.type||shifted.tool;
            if(tp2==='freehand'||tp2==='text'){
              drawAnalysisStrokeExt(pctx,shifted,minToXloc2,pToYloc2,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
            } else {
              drawAnalysisStroke(pctx,shifted,minToXloc2,pToYloc2,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
            }
            drawSelectionHighlight(pctx,shifted,minToXloc2,pToYloc2,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
          })();
        }
      }
    }

    /* ── 十字カーソル ── */
    if(!showCrosshair)return;
    var cx, cy, tmForLabel;
    var extRef=props.externalCursorRef;
    if(!L.hasRef && extRef && extRef.current){
      var ec=extRef.current;
      cx=minToXWithSide(ec.tm,'cur');
      cy=L.priceTop+ec.yOffset;
      tmForLabel=ec.tm;
      if(cx<L.padL||cx>L.padL+L.chartW)return;
    } else {
      var pos=cursorRef.current; if(!pos)return;
      cx=pos.x; cy=pos.y;
      if(cx<L.padL||cx>L.padL+L.chartW)return;
      /* pricePx>0 時、cursor は priceCanvas 内座標 (0..boundary)。vol エリア上では cursor 無効 */
      if(cy<L.padT||cy>boundary)return;
      var xst=xToSideTm(cx);
      tmForLabel=xst.tm;
    }
    var CROSS='#4a9de3';
    /* 縦線: priceOverlay 全域 + volOverlay 全域 (2 canvas 跨ぎ) */
    if(pctx){
      pctx.strokeStyle=CROSS; pctx.setLineDash([3,3]); pctx.lineWidth=1;
      pctx.beginPath();
      pctx.moveTo(Math.round(cx)+0.5,L.priceTop);
      pctx.lineTo(Math.round(cx)+0.5,boundary);
      pctx.stroke();
      if(cy>=L.priceTop&&cy<=L.priceBot){
        pctx.beginPath();
        pctx.moveTo(L.padL,Math.round(cy)+0.5);
        pctx.lineTo(L.padL+L.chartW,Math.round(cy)+0.5);
        pctx.stroke();
      }
      pctx.setLineDash([]);
      /* 時刻ラベル (priceBot の直下 = priceOverlay の下端付近) */
      var hh=Math.floor(tmForLabel/60), mm=Math.round(tmForLabel%60);
      if(mm>=60){hh++;mm-=60;}
      var tStr=(data.date?data.date.replace(/-/g,'/')+' ':'')+(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
      pctx.font='bold 11px -apple-system,Helvetica,sans-serif';
      pctx.textBaseline='middle'; pctx.textAlign='center';
      var tw=pctx.measureText(tStr).width+10;
      var ty=L.priceBot+3;
      if(ty+14<=boundary){
        pctx.fillStyle=CROSS;
        pctx.fillRect(cx-tw/2,ty,tw,14);
        pctx.fillStyle='#000';
        pctx.fillText(tStr,cx,ty+7);
      }
      /* 価格ラベル */
      if(cy>=L.priceTop&&cy<=L.priceBot){
        var fracY=(cy-L.priceTop)/L.priceH;
        var priceAt=L.pmax-fracY*(L.pmax-L.pmin);
        var pStr=priceAt.toFixed(0);
        var pw=pctx.measureText(pStr).width+10;
        pctx.textAlign='left';
        pctx.fillStyle=CROSS;
        pctx.fillRect(L.padL+L.chartW+2,cy-8,pw,16);
        pctx.fillStyle='#000';
        pctx.fillText(pStr,L.padL+L.chartW+7,cy);
      }
    }
    /* volOverlay: 縦線のみ (Y は 0..volAreaH 範囲全域) */
    if(vctx&&volAreaH>0){
      vctx.strokeStyle=CROSS; vctx.setLineDash([3,3]); vctx.lineWidth=1;
      vctx.beginPath();
      vctx.moveTo(Math.round(cx)+0.5,0);
      vctx.lineTo(Math.round(cx)+0.5,volAreaH);
      vctx.stroke();
      vctx.setLineDash([]);
    }
  }

  // F2: 自分の cursorRef.current から親に {tm, yOffset} を通知 (両チャート連動)
  // C-uaxis: 統合chart時 (L.hasRef=true) は外部cursor不要 (過去chart container非render)。
  //   gap にいる場合は通知しない。
  function notifyExternalCursorFromLocal(){
    var onCh=props.onExternalCursorChange; if(!onCh)return;
    var L=layoutRef.current; var p=cursorRef.current;
    if(!p||!L){onCh(null);return;}
    if(p.x<L.padL||p.x>L.padL+L.chartW||p.y<L.padT||p.y>L.volBot){onCh(null);return;}
    var xst=xToSideTm(p.x);
    if(xst.tm==null){onCh(null);return;}
    onCh({tm:xst.tm, yOffset:p.y-L.priceTop});
  }
  // マウスムーブハンドラ (十字カーソル座標更新専用)
  function onChartMouseMove(e){
    var rect=getCanvasRect();
    cursorRef.current={x:e.clientX-rect.left,y:e.clientY-rect.top};
    notifyExternalCursorFromLocal();
    if(!rafRef.current){
      rafRef.current=requestAnimationFrame(function(){
        drawCrosshair();
        rafRef.current=null;
      });
    }
  }
  function onChartMouseLeave(){
    cursorRef.current=null;
    if(props.onExternalCursorChange)props.onExternalCursorChange(null);
    drawCrosshair();
  }

  // ホイール: ズーム (カーソル位置中心) — 2026-04-21: 地図モデル (X/Y同倍率)
  // 通常 = zoom、Ctrl/Meta = 縦pan (pShift)、Shift = 横pan (uS)
  useEffect(function(){
    var el=containerRef.current; if(!el)return;
    function handler(e){
      e.preventDefault();
      var L=layoutRef.current;
      if(!L)return;
      var rect=el.getBoundingClientRect();
      var cxAbs=e.clientX-rect.left;
      var cyAbs=e.clientY-rect.top;
      var cx=cxAbs-L.padL;
      if(cx<0||cx>L.chartW)return;
      /* Ctrl+ホイール = 縦pan (pShift) */
      if(e.ctrlKey||e.metaKey){
        var step=(L.priceH*0.1)/L.pxPerYen;  /* priceH の10%を円に換算 */
        setPShift(function(ps){
          var next=ps + (e.deltaY<0?step:-step);
          return clampPShift(next, L);
        });
        return;
      }
      /* Shift+ホイール = 横pan (uS) */
      if(e.shiftKey){
        var stepU=L.uSpan*0.1;
        setView(function(v){
          var uS=(v&&v.uS!=null)?v.uS:0;
          var newUS=uS + (e.deltaY<0?-stepU:stepU);
          if(newUS<0)newUS=0;
          if(newUS>L.uTotal-L.uSpan)newUS=Math.max(0, L.uTotal-L.uSpan);
          return {uS:newUS, uE:newUS+L.uSpan};
        });
        return;
      }
      /* 通常 = zoom (cursor中心) */
      var factor=e.deltaY<0?Z_FACTOR:1/Z_FACTOR;
      setZoom(function(z){
        var newZ=z*factor;
        if(newZ<Z_MIN)newZ=Z_MIN;
        if(newZ>Z_MAX)newZ=Z_MAX;
        if(Math.abs(newZ-z)<0.001)return z;
        /* cursor位置の u値 / p値 を固定してzoom */
        var curU=L.uS + (cxAbs-L.padL-L.halfBarPx)/L.innerW*L.uSpan;
        var curP=L.dpmax - (cyAbs-L.priceTop)/L.pxPerYen;
        /* 新 uSpan */
        var newUSpan=L.chartW*(tf==='5m'?5:1)*0.8/(Z_BASE_BAR_PX*newZ);
        if(newUSpan>L.uTotal)newUSpan=L.uTotal;
        var cxRatio=(cxAbs-L.padL)/L.chartW;
        if(cxRatio<0)cxRatio=0; if(cxRatio>1)cxRatio=1;
        var newUS=curU - cxRatio*newUSpan;
        if(newUS<0)newUS=0;
        if(newUS+newUSpan>L.uTotal)newUS=Math.max(0, L.uTotal-newUSpan);
        /* 新 pxPerYen / pShift 再計算 (cursor位置のp値を固定) */
        var newPxPerYen=(Z_BASE_PRICE_PX/10)*newZ;
        var cyRatio=(cyAbs-L.priceTop)/L.priceH;
        /* dpmax_new = curP + cyRatio * (priceH/newPxPerYen)
           pShift = dpmax_new - priceRange.max */
        var newDpmax=curP + cyRatio*(L.priceH/newPxPerYen);
        var newPShift=newDpmax - L.dataPmax;
        setView({uS:newUS, uE:newUS+newUSpan});
        /* clamp は layoutRef 更新後の pxPerYen 基準でやるべきだが、
           簡易近似: dataPmin/dataPmax を使って clamp する */
        setPShift(clampPShiftForZoom(newPShift, newZ, L.priceH, L.dataPmin, L.dataPmax));
        return newZ;
      });
    }
    el.addEventListener('wheel',handler,{passive:false});
    return function(){el.removeEventListener('wheel',handler);};
  },[tf]);
  /* 2026-04-21: pShift clamp ヘルパー — データ範囲±0.5倍でclamp (H=2設計) */
  function clampPShift(ps, L){
    if(!L)return ps;
    return clampPShiftForZoom(ps, L.zoom, L.priceH, L.dataPmin, L.dataPmax);
  }
  function clampPShiftForZoom(ps, z, priceH, dataPmin, dataPmax){
    if(z==null||priceH==null||dataPmin==null||dataPmax==null)return ps;
    var pxPY=(Z_BASE_PRICE_PX/10)*z;
    var visSpan=priceH/pxPY;
    var dataSpan=dataPmax-dataPmin;
    /* dpmax = dataPmax + ps
       dpmin = dpmax - visSpan = dataPmax + ps - visSpan
       制約:
         dpmax <= dataPmax + dataSpan*0.5   → ps <= dataSpan*0.5
         dpmin >= dataPmin - dataSpan*0.5   → ps >= dataPmin - dataPmax + visSpan - dataSpan*0.5
                                            = visSpan - dataSpan*1.5 */
    var maxPs=dataSpan*0.5;
    var minPs=visSpan - dataSpan*1.5;
    if(visSpan>=dataSpan){
      /* データ全部が画面に収まる場合: 中央配置レンジに制限
         ps=(visSpan-dataSpan)/2 でデータ中央が画面中央 */
      minPs=(visSpan-dataSpan)*0 - dataSpan*0.3;   /* 若干の余裕 */
      maxPs=(visSpan-dataSpan)*1 + dataSpan*0.3;
    }
    if(ps>maxPs)ps=maxPs;
    if(ps<minPs)ps=minPs;
    return ps;
  }

  /* Pointer → 時刻+価格に変換 */
  function pxToTimePrice(clientX,clientY){
    var L=layoutRef.current; if(!L)return null;
    var rect=getCanvasRect();
    var cx=clientX-rect.left, cy=clientY-rect.top;
    /* C-uaxis: u軸対応で side/tm/u 算出 */
    var xst=xToSideTm(cx);
    var tm=xst.tm, side=xst.side, u=xst.u;
    var price;
    if(cy>=L.priceTop&&cy<=L.priceBot){
      price=L.pmax-((cy-L.priceTop)/L.priceH)*(L.pmax-L.pmin);
    } else {
      price=null;
    }
    return {tm:tm, p:price, cx:cx, cy:cy, side:side, u:u};
  }

  /* 2026-04-20: 親コンポーネント (ImageAnnotator) からpxToTimePrice を呼ぶ用のAPI 
     editor overlayの「…」ボタンdrag終了時に新screen座標を tm/p 変換するのに使用 */
  useEffect(function(){
    if(props.chartAPIRef){
      props.chartAPIRef.current={
        pxToTimePrice:function(cx,cy){return pxToTimePrice(cx,cy);}
      };
    }
    return function(){
      if(props.chartAPIRef)props.chartAPIRef.current=null;
    };
  },[]);

  /* ヒットテスト: クリック位置に近いストロークを返す (全ツール対応)
     C6: {side, idx} を返す。hasRef時は クリック側の strokes (cur or ref) のみ対象。
         gap領域は null。hit無しも null。 */

  /* 2026-04-20: stroke anchor位置 → screen座標変換ヘルパー
     テキスト編集モード起動時に、クリック位置ではなくテキスト実位置にtextareaを配置する用途
     2026-04-22: dprRef は撤去済 (3837行参照) → 削除。canvas CSS size = container size = 100% なので
                 描画座標 (CSS px) がそのまま rect 内の相対px になる (sw=sh=1 相当) */
  function anchorToScreen(stk, stkSide){
    try{
      if(!stk||!stk.anchors||!stk.anchors[0])return null;
      var lay=layoutRef.current, cvs=canvasRef.current;
      if(!lay||!cvs)return null;
      var rect=cvs.getBoundingClientRect();
      if(!rect||!rect.width)return null;
      var a=stk.anchors[0];
      var cvsX=minToXWithSide(a.tm, stkSide||'cur');
      /* 2026-04-22: 地図モデル pToY 式 (dpmax/pxPerYen) を使用 — 旧式 (pmin/pmax線形) はサムネ以外では誤差が出る */
      var cvsY;
      if(typeof lay.dpmax==='number'&&typeof lay.pxPerYen==='number'&&lay.pxPerYen>0){
        cvsY=lay.priceTop+(lay.dpmax-a.p)*lay.pxPerYen;
      }else{
        /* フォールバック (layoutRef が古い場合) */
        var den=(lay.pmax-lay.pmin)||1;
        cvsY=lay.priceTop+(1-(a.p-lay.pmin)/den)*lay.priceH;
      }
      return {
        screenX: rect.left+cvsX,
        screenY: rect.top+cvsY,
        tm: a.tm, p: a.p
      };
    }catch(err){return null;}
  }

  /* ─── スタンプ矢印 編集: 座標ヘルパー (CSS px、layoutRef基準) ─── */
  function pToYcss(p){
    var L=layoutRef.current; if(!L)return 0;
    if(typeof L.dpmax==='number'&&typeof L.pxPerYen==='number'&&L.pxPerYen>0)
      return L.priceTop+(L.dpmax-p)*L.pxPerYen;
    return L.priceTop+(1-(p-L.pmin)/((L.pmax-L.pmin)||1))*L.priceH;
  }
  /* スタンプ枠を CSS px で算出 {x,y,w,h}。時間プレフィックス込み。失敗時 null */
  function getSnippetBoxCss(s, side){
    var L=layoutRef.current, cnv=canvasRef.current;
    if(!L||!cnv||!s||!s.anchors||!s.anchors[0])return null;
    var hitZoom=(typeof L.zoom==='number'&&L.zoom>0)?L.zoom:1.0;
    var a=s.anchors[0];
    var tx=minToXWithSide(a.tm, side||'cur'), ty=pToYcss(a.p);
    var fs=(s.fontSize||15)*hitZoom;
    var fb=s.fontBold?'bold ':'';
    var rawLines=snippetDisplayText(s, s.text||(s._snippet&&s.snipId&&props.snippetsById&&props.snippetsById[s.snipId]?props.snippetsById[s.snipId].text:'')||'').split('\n');
    var boxW=(s.boxW&&s.boxW>0)?s.boxW*hitZoom:0;
    var mctx=cnv.getContext('2d'); mctx.save();
    mctx.font=fb+fs+"px -apple-system,'Helvetica Neue',sans-serif";
    var lines=[];
    if(boxW>0){
      rawLines.forEach(function(para){var cur='';for(var ci=0;ci<para.length;ci++){var t=cur+para[ci];if(mctx.measureText(t).width>boxW&&cur.length>0){lines.push(cur);cur=para[ci];}else cur=t;}lines.push(cur);});
    }else lines=rawLines;
    var mW=0; lines.forEach(function(l){var w=mctx.measureText(l).width;if(w>mW)mW=w;});
    mctx.restore();
    if(boxW>mW)mW=boxW;
    var tH=lines.length*fs*1.3;
    var bpad=3*hitZoom;
    return {x:tx-bpad, y:ty-bpad, w:mW+bpad*2, h:tH+bpad*2};
  }
  /* strokeId から現在の {idx,side,stroke} を引く (cur側のみ対応) */
  function findSnippetById(id){
    if(!id)return null;
    for(var i=0;i<(strokes||[]).length;i++){if(strokes[i]&&strokes[i].id===id)return {idx:i,side:'cur',stroke:strokes[i]};}
    return null;
  }
  /* 確定: ドラッグ結果(pointer)を stroke に反映して undo履歴へ */
  function commitPointer(strokeId, pointer){
    var hit=findSnippetById(strokeId); if(!hit||!props.onStrokeUpdate)return;
    var ns=Object.assign({},hit.stroke,{pointer:pointer});
    props.onStrokeUpdate(hit.side, hit.idx, ns);
  }
  function _ptrSchedDraw(){
    if(!rafRef.current){rafRef.current=requestAnimationFrame(function(){drawCrosshair();rafRef.current=null;});}
  }
  /* スタンプ矢印編集の pointerdown 相当。処理したら true (通常ツール動作を抑止) */
  function ptrPointerDown(clientX,clientY){
    var pe=ptrEditRef.current; if(!pe)return false;
    var hit=findSnippetById(pe.strokeId);
    if(!hit){setPtrEdit(null);return false;}
    var box=getSnippetBoxCss(hit.stroke,hit.side); if(!box)return true;
    var rect=getCanvasRect(); var px=clientX-rect.left, py=clientY-rect.top;
    var s=hit.stroke;
    if(pe.phase==='placing'){
      /* スタンプ配置ステージ: 本体タップ→移動ドラッグ / 空白タップ→矢印の根元選択へ */
      var inBox=(px>=box.x-10&&px<=box.x+box.w+10&&py>=box.y-10&&py<=box.y+box.h+10);
      if(inBox){
        var tpm=pxToTimePrice(clientX,clientY);
        var a0m=s.anchors&&s.anchors[0]?s.anchors[0]:{tm:0,p:0};
        ptrDragRef.current={strokeId:pe.strokeId,side:hit.side,idx:hit.idx,mode:'move',
          offTm:(tpm&&tpm.tm!=null?a0m.tm-tpm.tm:0),
          offP:(tpm&&tpm.p!=null?a0m.p-tpm.p:0),
          curTm:a0m.tm, curP:a0m.p};
        return true;
      }
      /* 空白タップ → 配置確定して矢印の根元選択ステージへ */
      setPtrEdit({strokeId:pe.strokeId,phase:'pickRoot',side:hit.side});
      return true;
    }
    var _Zd=(layoutRef.current&&layoutRef.current.zoom>0)?layoutRef.current.zoom:1;
    if(pe.phase==='editing'&&s.pointer){
      var tipX=minToXWithSide(s.pointer.tipTm,hit.side), tipY=pToYcss(s.pointer.tipP);
      if(Math.hypot(px-tipX,py-tipY)<=18){
        ptrDragRef.current={strokeId:pe.strokeId,side:hit.side,idx:hit.idx,mode:'tip',
          tipTm:s.pointer.tipTm,tipP:s.pointer.tipP,rootSide:s.pointer.rootSide,rootFrac:s.pointer.rootFrac,rootOff:s.pointer.rootOff};
        return true;
      }
      var rp=pointerRootPtZ(box,s.pointer,_Zd);
      if(Math.hypot(px-rp.x,py-rp.y)<=18){
        ptrDragRef.current={strokeId:pe.strokeId,side:hit.side,idx:hit.idx,mode:'root',
          tipTm:s.pointer.tipTm,tipP:s.pointer.tipP,rootSide:s.pointer.rootSide,rootFrac:s.pointer.rootFrac,rootOff:s.pointer.rootOff};
        return true;
      }
      /* ハンドル外タップ:
         (配置直後) クリックした場所をそのまま矢先にする＝ドラッグ不要で1クリック確定。
         (選択再編集) 従来通り通常動作(移動/文字編集)へ。 */
      if(!pe.fromSelect){
        var tpClk=pxToTimePrice(clientX,clientY);
        if(tpClk&&typeof tpClk.tm==='number'&&tpClk.p!=null){
          commitPointer(pe.strokeId,{
            rootSide:s.pointer.rootSide, rootFrac:s.pointer.rootFrac, rootOff:s.pointer.rootOff,
            tipTm:tpClk.tm, tipP:tpClk.p
          });
          _ptrSchedDraw();
        }
        return true;
      }
      return false;
    }
    if(pe.phase==='pickRoot'){
      /* 枠線付近のタップで根元確定。rootOff(左端からの論理px)で保存するので
         後で文字数/プレフィックスが変わっても根元はズレない。 */
      var proj0=projectBoxPerimeterOff(box,px,py,_Zd);
      var rpc0=pointerRootPtZ(box,{rootSide:proj0.side,rootOff:proj0.off},_Zd);
      if(Math.hypot(px-rpc0.x,py-rpc0.y)<=22){
        /* 既定の矢先: 根元から外向き法線に約70px。チャート時間に変換 */
        var nx=0,ny=0;
        if(proj0.side==='top')ny=-1; else if(proj0.side==='bottom')ny=1;
        else if(proj0.side==='left')nx=-1; else nx=1;
        var tipScreenX=rpc0.x+nx*70, tipScreenY=rpc0.y+ny*70;
        var tp=pxToTimePrice(rect.left+tipScreenX, rect.top+tipScreenY);
        var a0=s.anchors&&s.anchors[0]?s.anchors[0]:{tm:0,p:0};
        var tipTm=(tp&&typeof tp.tm==='number')?tp.tm:a0.tm;
        var tipP=(tp&&tp.p!=null)?tp.p:a0.p;
        commitPointer(pe.strokeId,{rootSide:proj0.side,rootFrac:proj0.frac,rootOff:proj0.off,tipTm:tipTm,tipP:tipP});
        setPtrEdit({strokeId:pe.strokeId,phase:'editing',side:hit.side});
        return true;
      }
      return true; /* 枠から離れたタップは無視 (スキップは✕ボタン) */
    }
    return true;
  }
  function ptrPointerMove(clientX,clientY){
    var d=ptrDragRef.current; if(!d)return false;
    var rect=getCanvasRect(); var px=clientX-rect.left, py=clientY-rect.top;
    if(d.mode==='move'){
      var tpv=pxToTimePrice(clientX,clientY);
      if(tpv){ if(tpv.tm!=null)d.curTm=tpv.tm+d.offTm; if(tpv.p!=null)d.curP=tpv.p+d.offP; }
    } else if(d.mode==='tip'){
      var tp=pxToTimePrice(clientX,clientY);
      if(tp){ if(typeof tp.tm==='number')d.tipTm=tp.tm; if(tp.p!=null)d.tipP=tp.p; }
    } else if(d.mode==='root'){
      var hit=findSnippetById(d.strokeId);
      if(hit){var box=getSnippetBoxCss(hit.stroke,hit.side);
        if(box){var _Zm=(layoutRef.current&&layoutRef.current.zoom>0)?layoutRef.current.zoom:1;
          var pr=projectBoxPerimeterOff(box,px,py,_Zm); d.rootSide=pr.side; d.rootFrac=pr.frac; d.rootOff=pr.off;}}
    }
    _ptrSchedDraw();
    return true;
  }
  function ptrPointerUp(){
    var d=ptrDragRef.current; if(!d)return false;
    if(d.mode==='move'){
      var hitM=findSnippetById(d.strokeId);
      if(hitM&&d.curTm!=null&&d.curP!=null&&props.onStrokeUpdate){
        var aM=hitM.stroke.anchors&&hitM.stroke.anchors[0];
        var movedM=!aM||Math.abs(aM.tm-d.curTm)>0.001||Math.abs(aM.p-d.curP)>0.0001;
        if(movedM){
          var nsM=Object.assign({},hitM.stroke,{anchors:[{tm:d.curTm,p:d.curP}]});
          props.onStrokeUpdate(hitM.side,hitM.idx,nsM);
        }
      }
      ptrDragRef.current=null; _ptrSchedDraw(); return true;
    }
    var hit=findSnippetById(d.strokeId);
    if(hit){
      var base=hit.stroke.pointer||{};
      commitPointer(d.strokeId,{
        rootSide:d.rootSide!=null?d.rootSide:base.rootSide,
        rootFrac:d.rootFrac!=null?d.rootFrac:base.rootFrac,
        rootOff:d.rootOff!=null?d.rootOff:base.rootOff,
        tipTm:d.tipTm!=null?d.tipTm:base.tipTm,
        tipP:d.tipP!=null?d.tipP:base.tipP
      });
    }
    ptrDragRef.current=null;
    _ptrSchedDraw();
    return true;
  }
  /* 「選択」ツールでスタンプをタップ → pointer編集を再開 (pointer有時) */
  function ptrTryReedit(clientX,clientY){
    var hitIdx=hitTestStroke(clientX,clientY); if(hitIdx==null)return false;
    var s=getStrokeByHit(hitIdx);
    if(s&&s._snippet&&s.pointer&&hitIdx.side==='cur'){
      setPtrEdit({strokeId:s.id,phase:'editing',side:'cur'});
      _ptrSchedDraw();
      return true;
    }
    return false;
  }

  function hitTestStroke(clientX,clientY){
    var L=layoutRef.current; if(!L)return null;
    var rect=getCanvasRect();
    var cx=clientX-rect.left, cy=clientY-rect.top;
    /* C6+C8a: クリック側を判定。xToSideTmがgap帯も近い側に境界clampするので 'gap'返しは無し */
    var clickSide='cur';
    if(L.hasRef){
      var xst=xToSideTm(cx);
      if(xst.side==null)return null;
      clickSide=xst.side;
    }
    var targetArr=(clickSide==='ref')?(refStrokes||[]):(strokes||[]);
    if(!targetArr.length)return null;
    var TOL=8;
    function minToXloc(m){return minToXWithSide(m,clickSide);}
    function pToYloc(p){return L.priceTop+(1-(p-L.pmin)/(L.pmax-L.pmin))*L.priceH;}
    function distPtToSeg(px,py,x1,y1,x2,y2){
      var dx=x2-x1, dy=y2-y1, lenSq=dx*dx+dy*dy;
      if(lenSq===0)return Math.hypot(px-x1,py-y1);
      var t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/lenSq));
      return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
    }
    for(var i=targetArr.length-1;i>=0;i--){
      var s=targetArr[i]; if(!s||!s.anchors||!s.anchors.length)continue;
      var tp=s.type||s.tool;  // 後方互換
      if(tp==='horizontal'){
        var y=pToYloc(s.anchors[0].p);
        if(Math.abs(cy-y)<=TOL)return {side:clickSide,idx:i};
      } else if((tp==='line'||tp==='dotted'||tp==='arrow'||tp==='marker'||tp==='trade')&&s.anchors.length>=2){
        var a1=s.anchors[0], a2=s.anchors[1];
        var x1=minToXloc(a1.tm), y1=pToYloc(a1.p);
        var x2=minToXloc(a2.tm), y2=pToYloc(a2.p);
        var tol=tp==='marker'?(s.width||2)*5+4:TOL;
        if(distPtToSeg(cx,cy,x1,y1,x2,y2)<=tol)return {side:clickSide,idx:i};
      } else if(tp==='rect'&&s.anchors.length>=2){
        var a1=s.anchors[0], a2=s.anchors[1];
        var x1=minToXloc(a1.tm), y1=pToYloc(a1.p);
        var x2=minToXloc(a2.tm), y2=pToYloc(a2.p);
        var rx=Math.min(x1,x2), ry=Math.min(y1,y2);
        var rw=Math.abs(x2-x1), rh=Math.abs(y2-y1);
        // 4辺のいずれかに近いか
        var d=Math.min(
          distPtToSeg(cx,cy,rx,ry,rx+rw,ry),
          distPtToSeg(cx,cy,rx+rw,ry,rx+rw,ry+rh),
          distPtToSeg(cx,cy,rx+rw,ry+rh,rx,ry+rh),
          distPtToSeg(cx,cy,rx,ry+rh,rx,ry)
        );
        if(d<=TOL)return {side:clickSide,idx:i};
      } else if(tp==='circle'&&s.anchors.length>=2){
        var a1=s.anchors[0], a2=s.anchors[1];
        var x1=minToXloc(a1.tm), y1=pToYloc(a1.p);
        var x2=minToXloc(a2.tm), y2=pToYloc(a2.p);
        var ccx=(x1+x2)/2, ccy=(y1+y2)/2;
        var rx=Math.abs(x2-x1)/2, ry=Math.abs(y2-y1)/2;
        if(rx<=0||ry<=0)continue;
        // 楕円周との距離近似: ノーマライズ空間で円からの距離
        var ndx=(cx-ccx)/rx, ndy=(cy-ccy)/ry;
        var nd=Math.hypot(ndx,ndy);
        // 半径1の円との距離 → 絶対距離に戻す (ざっくり)
        var diff=Math.abs(nd-1)*Math.min(rx,ry);
        if(diff<=TOL)return {side:clickSide,idx:i};
      } else if(tp==='freehand'&&s.anchors.length>=2){
        // 各セグメントとの距離の最小値
        var minD=Infinity;
        for(var j=1;j<s.anchors.length;j++){
          var pa=s.anchors[j-1], pb=s.anchors[j];
          var xa=minToXloc(pa.tm), ya=pToYloc(pa.p);
          var xb=minToXloc(pb.tm), yb=pToYloc(pb.p);
          var dd=distPtToSeg(cx,cy,xa,ya,xb,yb);
          if(dd<minD)minD=dd;
        }
        if(minD<=TOL)return {side:clickSide,idx:i};
      } else if(tp==='text'){
        /* 2026-04-22: 地図モデルズーム連動 — 描画時の fontSize/boxW は zoom 倍されるので、
           hitTest bbox も zoom 倍にして画面上の実描画サイズと一致させる */
        var hitZoom=(L&&typeof L.zoom==='number'&&L.zoom>0)?L.zoom:1.0;
        var a=s.anchors[0];
        var tx=minToXloc(a.tm), ty=pToYloc(a.p);
        var fsRaw=s.fontSize||15;
        var fs=fsRaw*hitZoom;  /* 画面上の実フォントサイズ */
        var fb=s.fontBold?'bold ':'';
        var rawLines=snippetDisplayText(s, s.text||'').split('\n');
        /* 2026-04-20: boxW指定時は wordBreak wrap (描画と一致させる)
           2026-04-22: boxW も zoom 倍 (描画側と同じ) */
        var hitBoxW=(s.boxW&&s.boxW>0)?s.boxW*hitZoom:0;
        var displayLines=[];
        var cnv=canvasRef.current;
        var mctx=null;
        if(cnv){
          mctx=cnv.getContext('2d');
          mctx.save();
          mctx.font=fb+fs+"px -apple-system,'Helvetica Neue',sans-serif";
        }
        if(hitBoxW>0&&mctx){
          rawLines.forEach(function(para){
            var cur='';
            for(var ci=0;ci<para.length;ci++){
              var test=cur+para[ci];
              if(mctx.measureText(test).width>hitBoxW&&cur.length>0){displayLines.push(cur);cur=para[ci];}
              else{cur=test;}
            }
            displayLines.push(cur);
          });
        }else{
          displayLines=rawLines;
        }
        /* C6-bugfix: measureText で実測幅。ざっくり想定 (fs*0.6) は日本語/半角混在で崩れる */
        var mW=0;
        if(mctx){
          displayLines.forEach(function(l){
            var w=mctx.measureText(l).width;
            if(w>mW)mW=w;
          });
          mctx.restore();
        } else {
          displayLines.forEach(function(l){if(l.length*fs*0.6>mW)mW=l.length*fs*0.6;});
        }
        /* boxWが設定されていればそれを優先 (折返し後の実描画幅) */
        if(hitBoxW>0&&hitBoxW>mW)mW=hitBoxW;
        var tH=displayLines.length*fs*1.3;
        var PAD=6;  // 当たり判定パディング (元は4、タッチ操作にも余裕を持たせる)
        if(cx>=tx-PAD&&cx<=tx+mW+PAD&&cy>=ty-PAD&&cy<=ty+tH+PAD)return {side:clickSide,idx:i};
      }
    }
    return null;
  }

  /* 2026-04-21: 選択済ストロークのハンドル hitTest — mouseDown で最優先に判定
     戻り値: {handleId, side, idx} | null */
  function hitTestSelectedHandle(clientX,clientY){
    if(!selectedIdx)return null;
    var L=layoutRef.current; if(!L)return null;
    var rect=getCanvasRect();
    var cx=clientX-rect.left, cy=clientY-rect.top;
    var selSide=selectedIdx.side||'cur';
    var srcArr=(selSide==='ref')?(refStrokes||[]):(strokes||[]);
    var s=srcArr[selectedIdx.idx]; if(!s)return null;
    var handles=getHandleAnchors(s);
    if(!handles.length)return null;
    var HS=IS_TOUCH?20:14;  /* ヒット領域は描画ハンドルより少し大きめ */
    function minToXloc(m){return minToXWithSide(m,selSide);}
    function pToYloc(p){return L.priceTop+(1-(p-L.pmin)/(L.pmax-L.pmin))*L.priceH;}
    for(var i=0;i<handles.length;i++){
      var h=handles[i];
      var hx=minToXloc(h.tm), hy=pToYloc(h.p);
      if(Math.hypot(cx-hx,cy-hy)<=HS/2+2){
        return {handleId:h.id, side:selSide, idx:selectedIdx.idx};
      }
    }
    return null;
  }

  /* 水平スナップ (horizトグルON時) */
  function applyHorizSnap(sTM,sP,cTM,cP){
    var L=layoutRef.current; if(!L)return {tm:cTM, p:cP};
    /* C5+: cur側想定で x計算 (描画中stroke は drawRef.side に依存するが、minToXWithSideで統一) */
    var sx=minToXWithSide(sTM,'cur');
    var sy=L.priceTop+(1-(sP-L.pmin)/(L.pmax-L.pmin))*L.priceH;
    var cx=minToXWithSide(cTM,'cur');
    var cy=L.priceTop+(1-(cP-L.pmin)/(L.pmax-L.pmin))*L.priceH;
    var dx=Math.abs(cx-sx), dy=Math.abs(cy-sy);
    if(dx>dy)return {tm:cTM, p:sP};   // 水平: 価格固定
    else return {tm:sTM, p:cP};       // 垂直: 時刻固定
  }

  /* ───── ドラッグ式 描画ハンドラ ─────
     画像画面と同じ: 押下→ドラッグ→離すで1本のストロークを確定 */
  function onMouseDown(e){
    // テキスト入力中はpan/zoom/描画をすべてロック
    if(props.textInputActive)return;
    // スタンプ矢印 編集モード優先
    if(ptrEditRef.current&&ptrPointerDown(e.clientX,e.clientY))return;
    // Ctrl+ドラッグ = どのツールでもパン
    if(e.ctrlKey||e.metaKey){
      panStartRef.current={x:e.clientX,y:e.clientY,uS:view.uS,uE:view.uE,ps:pShift};
      ctrlPanRef.current=true;
      return;
    }
    // 左右同時押しドラッグ = どのツールでもパン (e.buttons===3: 左1+右2)
    if(e.buttons===3){
      panStartRef.current={x:e.clientX,y:e.clientY,uS:view.uS,uE:view.uE,ps:pShift};
      bothBtnPanRef.current=true;
      drawRef.current={on:false};
      pendingTextReqRef.current=null;  // テキスト/スタンプの pending をキャンセル
      pendingSnipRef.current=null;
      measureDragRef.current=null;     // 計測の pending をキャンセル
      lassoPathRef.current=null;       // 投げ縄パス描画をキャンセル
      lassoMoveRef.current=null;       // 投げ縄マルチ移動をキャンセル
      moveRef.current=null;            // ストローク単体移動をキャンセル
      return;
    }
    /* 2026-04-22: text/lasso ツール時のみ既存textをhitしたらeditor overlay扱い
       line/dotted/arrow/rect/circle/marker/freehand/pan/eraser では通常描画/pan動作を優先
       tap (dragなし) → editor open / drag>=3px → text stroke 移動 */
    if(drawTool==='text'||drawTool==='lasso'){
      var gHit=hitTestStroke(e.clientX,e.clientY);
      if(gHit!=null){
        var gArr=(gHit.side==='ref')?(refStrokes||[]):(strokes||[]);
        var gStk=gArr[gHit.idx];
        if(gStk&&(gStk.type||gStk.tool)==='text'){
          if(drawTool==='lasso')setSelectedIdx(gHit);
          /* 矢印付きスタンプ + 選択ツール: 初回タップは選択+矢印ハンドル表示
             (テキスト編集は2回目のタップ)。ハンドル(根本/矢先)で矢印を編集できる。 */
          if(drawTool==='lasso'&&gStk._snippet&&gStk.pointer&&gHit.side==='cur'){
            var _alreadyPEg=ptrEditRef.current&&ptrEditRef.current.fromSelect&&ptrEditRef.current.strokeId===gStk.id;
            if(!_alreadyPEg){
              var gTp0=pxToTimePrice(e.clientX,e.clientY);
              setPtrEdit({strokeId:gStk.id,phase:'editing',side:'cur',fromSelect:true});
              moveRef.current={side:gHit.side, idx:gHit.idx,
                startTM:(gTp0&&gTp0.tm!=null?gTp0.tm:0), startP:(gTp0&&gTp0.p!=null?gTp0.p:0),
                dtm:0, dp:0, moving:false};
              return;
            }
            /* 2回目以降: 通常のテキスト編集へフォールスルー */
          }
          var gScr=anchorToScreen(gStk,gHit.side);
          var gTp=pxToTimePrice(e.clientX,e.clientY);
          moveRef.current={
            side:gHit.side, idx:gHit.idx,
            startTM:(gTp&&gTp.tm!=null?gTp.tm:0),
            startP:(gTp&&gTp.p!=null?gTp.p:0),
            dtm:0, dp:0, moving:false,
            _isTextTool:true,
            _editReq:{
              tm:(gScr?gScr.tm:(gTp?gTp.tm:0)),
              p:(gScr?gScr.p:(gTp?gTp.p:0)),
              screenX:(gScr?gScr.screenX:e.clientX),
              screenY:(gScr?gScr.screenY:e.clientY),
              editIdx:gHit.idx, side:gHit.side
            }
          };
          return;
        }
      }
    }
    if(drawTool==='pan'){
      panStartRef.current={x:e.clientX,y:e.clientY,uS:view.uS,uE:view.uE,ps:pShift};
      return;
    }
    /* 2026-04-27: 投げ縄ツール (tpチェック前に処理) — iPad等で出来高/padding領域からも開始可能に
       lassoSel hit時のみ tp 必要 (マルチ移動開始)、空白→パス開始は画面座標のみで処理 */
    if(drawTool==='lassoFree'){
      var lfHi=hitTestStroke(e.clientX,e.clientY);
      var lfInSel=false;
      if(lassoSel&&lassoSel.length>0){
        /* (1) ストローク本体 hit */
        if(lfHi){
          lfInSel=lassoSel.some(function(s){return s.side===lfHi.side&&s.idx===lfHi.idx;});
        }
        /* (2) 2026-04-27: 統合bbox 内 hit (iPad対策、ストローク本体に外しても掴めるように) */
        if(!lfInSel){
          var L0=layoutRef.current;
          var canvas0=canvasRef.current;
          var ctx0=canvas0?canvas0.getContext('2d'):null;
          if(L0&&ctx0){
            var rect0=getCanvasRect();
            var lx=e.clientX-rect0.left, ly=e.clientY-rect0.top;
            var _pToY0=function(p){

  function onMouseMove(e){

            var dyp=Math.abs(((tp.p-last.p)/(L1.pmax-L1.pmin))*L1.priceH);

    if(drawTool!=='pan'&&!ctrlPanRef.current&&!bothBtnPanRef.current){panStartRef.current=null;return;}

    var chartW=rect2.width-padL-padR;

    var uSpan0=L?L.uSpan:(p.uE-p.uS);
    var dU=-(e.clientX-p.x)/chartW*uSpan0;
    var newUS=p.uS+dU, newUE=newUS+uSpan0;

    if(newUE>uTotalNow){newUE=uTotalNow;newUS=Math.max(0,newUE-uSpan0);}
    setView({uS:newUS,uE:newUE});
    if(priceRange&&L){
      /* 2026-04-21: yenPerPx = 1/pxPerYen (地図モデル) + 縦clamp */
      var yenPerPx=1/L.pxPerYen;
