<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Scalping NB"/>
<meta name="theme-color" content="#1a1a1a"/>
<title>Scalping Notebook</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100vh}
body{padding:8px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));padding-bottom:max(8px,env(safe-area-inset-bottom));font-family:-apple-system,'Helvetica Neue',sans-serif;background:#fafaf8;color:#1a1a1a;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit}
#root{width:100%;margin:0 auto}
@media(max-width:480px){.cal-cell{min-height:48px!important;padding:3px 4px!important}.cal-date{font-size:12px!important}body{padding:4px;padding-bottom:max(4px,env(safe-area-inset-bottom))}}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}
.news-hscroll::-webkit-scrollbar{height:14px}
.news-hscroll::-webkit-scrollbar-track{background:#f0efeb;border-radius:7px}
.news-hscroll::-webkit-scrollbar-thumb{background:#b8b5ac;border-radius:7px;border:2px solid #f0efeb}
.news-hscroll::-webkit-scrollbar-thumb:hover{background:#8a877d}
.news-hscroll{scrollbar-width:auto;scrollbar-color:#b8b5ac #f0efeb}
canvas{image-rendering:high-quality;-webkit-image-rendering:high-quality}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
</head>
<body>
