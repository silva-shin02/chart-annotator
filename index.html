<script>
/* =====================================================================
   書き込みツール – ImageAnnotator standalone
   元: Scalping Notebook の ImageAnnotator を完全移植
===================================================================== */
(function(){
'use strict';
var R = React;
var useState   = R.useState;
var useRef     = R.useRef;
var useEffect  = R.useEffect;
var useMemo    = R.useMemo;
var Fragment   = R.Fragment;

/* 2026-04-20 C12: alert/confirm 置き換え用ヘルパー (React外から呼べるDOM直接操作)
   caToast(msg, level): 画面右下にToast表示 (level: 'info'|'success'|'error'、自動消滅)
   caConfirm(msg, onYes, onNo): モーダル表示、はい/いいえで callback */
if(!window.caToast){
  window.caToast=function(msg,level){
    level=level||'info';
    var container=document.getElementById('ca-toast-container');
    if(!container){
      container=document.createElement('div');
      container.id='ca-toast-container';
      container.style.cssText='position:fixed;bottom:20px;right:20px;z-index:999999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:90vw;';
      document.body.appendChild(container);
    }
    var toast=document.createElement('div');
    var bg=level==='error'?'#7f1d1d':level==='success'?'#14532d':'#1e3a5f';
    var fg=level==='error'?'#fca5a5':level==='success'?'#86efac':'#93c5fd';
    var border=level==='error'?'#b91c1c':level==='success'?'#16a34a':'#2563eb';
    toast.style.cssText='background:'+bg+';color:'+fg+';padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;max-width:400px;box-shadow:0 4px 16px rgba(0,0,0,.5);pointer-events:auto;opacity:0;transition:opacity 0.2s,transform 0.2s;transform:translateX(20px);white-space:pre-line;border:1px solid '+border+';line-height:1.5;';
    toast.textContent=msg;
    /* クリックで即消す */
    toast.onclick=function(){
      toast.style.opacity='0';toast.style.transform='translateX(20px)';
      setTimeout(function(){if(toast.parentNode)toast.parentNode.removeChild(toast);},200);
    };
    container.appendChild(toast);
    requestAnimationFrame(function(){
      toast.style.opacity='1';toast.style.transform='translateX(0)';
    });
    var ttl=level==='error'?5000:level==='success'?2500:3000;
    setTimeout(function(){
      toast.style.opacity='0';toast.style.transform='translateX(20px)';
      setTimeout(function(){if(toast.parentNode)toast.parentNode.removeChild(toast);},300);
    },ttl);
  };
}
if(!window.caConfirm){
  window.caConfirm=function(msg,onYes,onNo,opts){
    opts=opts||{};
    var yesLabel=opts.yesLabel||'はい';
    var noLabel=opts.noLabel||'キャンセル';
    var danger=opts.danger!==false; /* デフォルト危険色 (赤)、false で青 */
    var overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);';
    var modal=document.createElement('div');
    modal.style.cssText='background:#1f1f1f;border:1px solid #2a2a2a;border-radius:12px;padding:22px;max-width:420px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.7);animation:caModalIn 0.15s ease-out;';
    var msgEl=document.createElement('div');
    msgEl.style.cssText='font-size:14px;color:#fff;line-height:1.7;margin-bottom:20px;white-space:pre-line;';
    msgEl.textContent=msg;
    var btnRow=document.createElement('div');
    btnRow.style.cssText='display:flex;gap:8px;justify-content:flex-end;';
    function mkBtn(label,primary,cb){
      var b=document.createElement('button');
      b.textContent=label;
      var bg=primary?(danger?'#dc2626':'#2563eb'):'#2a2a2a';
      var col=primary?'#fff':'#aaa';
      b.style.cssText='padding:10px 18px;font-size:13px;font-weight:'+(primary?'700':'600')+';background:'+bg+';color:'+col+';border:none;border-radius:8px;cursor:pointer;min-width:90px;';
      b.onclick=function(){cleanup();cb&&cb();};
      return b;
    }
    var cancelBtn=mkBtn(noLabel,false,onNo);
    var okBtn=mkBtn(yesLabel,true,onYes);
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(okBtn);
    modal.appendChild(msgEl);
    modal.appendChild(btnRow);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    function cleanup(){if(overlay.parentNode)overlay.parentNode.removeChild(overlay);}
    overlay.onclick=function(e){if(e.target===overlay){cleanup();onNo&&onNo();}};
    /* Escキー対応 */
    function onKey(e){if(e.key==='Escape'){cleanup();onNo&&onNo();window.removeEventListener('keydown',onKey);}}
    window.addEventListener('keydown',onKey);
  };
}
var ce         = R.createElement;   // ← h ではなく ce を使う

var IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
var HAS_HOVER = typeof matchMedia!=='undefined' && matchMedia('(hover: hover)').matches;
/* C-uaxis+C6+C7: 過去chartと現在chartを同一キャンバスに連結表示 (旧左右分離レイアウトはC7で削除) */
/* C8a: 隙間幅はローソク足1本分 (1m=1分, 5m=5分)。昼休み(60分)と夜間gapの両方に適用 */
function getCandleGap(tf){ return tf==='1m'?1:5; }

/* ─── IndexedDB キャッシュ（localStorage 5MB制限回避）──────── */
var _idb=null, _idbReady=false, _idbQueue=[];
var IDB_NAME='ca_cache_v1', IDB_STORE='blobs';
(function(){
  try{
    var req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=function(e){e.target.result.createObjectStore(IDB_STORE);};
    req.onsuccess=function(e){_idb=e.target.result;_idbReady=true;
      _idbQueue.forEach(function(fn){try{fn();}catch(ex){}});_idbQueue=[];};
    req.onerror=function(){_idbReady=true;_idbQueue=[];};
  }catch(e){_idbReady=true;}
})();
function _idbRun(fn){if(_idbReady){try{fn();}catch(e){}}else{_idbQueue.push(fn);}}
function idbGet(key,cb){
  _idbRun(function(){
    if(!_idb){cb(null);return;}
    try{
      var tx=_idb.transaction(IDB_STORE,'readonly');
      var rq=tx.objectStore(IDB_STORE).get(key);
      rq.onsuccess=function(){cb(rq.result||null);};
      rq.onerror=function(){cb(null);};
    }catch(e){cb(null);}
  });
}
function idbSet(key,val){
  _idbRun(function(){
    if(!_idb)return;
    try{var tx=_idb.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(val,key);}catch(e){}
  });
}
function idbDel(key){
  _idbRun(function(){
    if(!_idb)return;
    try{var tx=_idb.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(key);}catch(e){}
  });
}

/* ─── Firebase Storage ヘルパー ────────────────────────────── */
var _fbApp=null, _fbStorage=null;
function getFirebaseStorage(cfg){
  if(!cfg||!cfg.storageBucket||!cfg.apiKey)return null;
  if(_fbStorage)return _fbStorage;
  try{
    if(!_fbApp){
      try{_fbApp=firebase.app();}catch(e2){
        _fbApp=firebase.initializeApp({apiKey:cfg.apiKey,storageBucket:cfg.storageBucket});
      }
    }
    _fbStorage=firebase.storage(_fbApp);
  }catch(e){console.error('Firebase Storage init:',e);}
  return _fbStorage;
}
function base64ToBlob(b64,mimeType){
  var bc=atob(b64),ba=new Uint8Array(bc.length);
  for(var i=0;i<bc.length;i++)ba[i]=bc.charCodeAt(i);
  return new Blob([ba],{type:mimeType});
}
/* 2026-04-20 Phase10: uploadToStorage 撤去 (画像base64アップロード専用、呼び出しゼロ) */
function storageUrlToBase64(url){
  return fetch(url).then(function(r){
    if(!r.ok)throw new Error('Storage HTTP '+r.status);
    return r.blob();
  })
    .then(function(blob){return new Promise(function(resolve,reject){
        var rd=new FileReader();
        rd.onload=function(){var parts=rd.result.split(',');resolve({base64:parts[1],mt:blob.type||'image/png'});};
        rd.onerror=function(){reject(new Error('FileReader failed'));};
        rd.readAsDataURL(blob);
      });
    });
}
function uploadThumbToStorage(cfg,id,thumbDataUrl){
  if(!cfg||!cfg.storageBucket||!thumbDataUrl||thumbDataUrl.indexOf(',')<0)return Promise.resolve(null);
  var b64=thumbDataUrl.split(',')[1]; if(!b64)return Promise.resolve(null);
  var st=getFirebaseStorage(cfg); if(!st)return Promise.resolve(null);
  var blob=base64ToBlob(b64,'image/png');
  var ref=st.ref('chart-thumbs/'+id+'.png');
  return ref.put(blob).then(function(){return ref.getDownloadURL();})
    .catch(function(e){console.error('Thumb upload:',e);return null;});
}

/* ─── Firebase ヘルパー ───────────────── */
function _fbIsPaused(cfg){
  if(!cfg||!cfg.url)return true;
  return cfg.paused!==false;
}

/* ─── Color Picker ─────────────────────────────────────────── */
var ANNOT_PRESET_KEY = 'scalping_annot_presets_v1';
var DEF_PRESETS = [
  "#000000","#555555","#888888","#bbbbbb","#ffffff",
  "#b71c1c","#f44336","#e91e63","#f48fb1","#ff6d00",
  "#2196f3","#0d47a1","#1b5e20","#76ff03","#ffeb3b",
  "#f57f17","#ce93d8","#1a237e","#37474f","#558b2f"
];
var LIGHT_COLS = ["#ffffff","#ffeb3b","#f48fb1","#bbbbbb","#76ff03","#ce93d8"];

function ColorPicker(props){
  var value=props.value, onChange=props.onChange, history=props.history,
      onHistory=props.onHistory, quickColors=props.quickColors, onQuickColors=props.onQuickColors;

  var s0=useState(false);  var open=s0[0],setOpen=s0[1];
  var s1=useState("preset"); var tab=s1[0],setTab=s1[1];
  var s2=useState(false);  var editMode=s2[0],setEditMode=s2[1];
  var s3=useState(value);  var customVal=s3[0],setCustomVal=s3[1];
  var s4=useState(null);   var editingSlot=s4[0],setEditingSlot=s4[1];
  var s5=useState(null);   var dragIdx=s5[0],setDragIdx=s5[1];
  var s6=useState(null);   var dragOverIdx=s6[0],setDragOverIdx=s6[1];
  var s7=useState(function(){
    try{ var p=localStorage.getItem(ANNOT_PRESET_KEY); return p?JSON.parse(p):DEF_PRESETS; }
    catch(e){ return DEF_PRESETS; }
  }); var presets=s7[0],setPresets=s7[1];

  function savePresets(p){ setPresets(p); try{localStorage.setItem(ANNOT_PRESET_KEY,JSON.stringify(p));}catch(e){} }
  function closeAll(){ setOpen(false);setEditMode(false);setEditingSlot(null);setDragIdx(null);setDragOverIdx(null); }
  function pick(c){
    onChange(c); onHistory(c);
    if(editingSlot!==null){ var nq=quickColors.slice(); nq[editingSlot]=c; onQuickColors(nq); }
    else if(!quickColors.includes(c)) onQuickColors([c].concat(quickColors).slice(0,7));
    closeAll();
  }
  function addCustom(){
    if(!presets.includes(customVal)) savePresets(presets.concat([customVal]));
    onChange(customVal); onHistory(customVal);
    if(!quickColors.includes(customVal)) onQuickColors([customVal].concat(quickColors).slice(0,7));
    setTab("preset");
  }
  function remPreset(c){ savePresets(presets.filter(function(x){return x!==c;})); }
  function reorder(f,t){
    if(f===t)return;
    var np=presets.slice(); var r=np.splice(f,1)[0]; np.splice(t,0,r); savePresets(np);
  }
  function onQClick(c,i){
    if(value===c&&quickColors[i]===c){ setEditingSlot(i);setCustomVal(c);setTab("preset");setOpen(true); }
    else{ onChange(c);onHistory(c); }
  }

  var DS=IS_TOUCH?46:40, QSZ=IS_TOUCH?30:26;

  function PDot(p2){
    var c=p2.c,i=p2.i;
    var sel=c===value,isd=dragIdx===i,iso=dragOverIdx===i&&dragIdx!==null&&dragIdx!==i;
    return ce("span",{style:{position:"relative",flexShrink:0}},
      ce("span",{
        draggable:editMode,
        onDragStart:function(e){e.dataTransfer.setData("t","");setDragIdx(i);},
        onDragOver:function(e){e.preventDefault();if(dragIdx!==null&&dragIdx!==i)setDragOverIdx(i);},
        onDrop:function(e){e.preventDefault();if(dragIdx!==null)reorder(dragIdx,i);setDragIdx(null);setDragOverIdx(null);},
        onDragEnd:function(){setDragIdx(null);setDragOverIdx(null);},
        onClick:function(){if(!editMode)pick(c);},
        style:{width:DS,height:DS,borderRadius:"50%",background:c,display:"flex",alignItems:"center",justifyContent:"center",
          cursor:editMode?"grab":"pointer",boxSizing:"border-box",opacity:isd?0.3:1,
          border:iso?"3.5px dashed #007AFF":sel&&!editMode?"3.5px solid #007AFF":"1.5px solid rgba(0,0,0,.14)"}
      },
        sel&&!editMode&&ce("span",{style:{fontSize:20,color:LIGHT_COLS.includes(c)?"#000":"#fff",fontWeight:700,lineHeight:1}},"✓"),
        editMode&&ce("span",{style:{fontSize:16,color:"rgba(255,255,255,.5)",userSelect:"none",pointerEvents:"none"}},"⠿")
      ),
      (sel&&!editMode||editMode)&&ce("span",{
        onClick:function(e){e.stopPropagation();remPreset(c);},
        style:{position:"absolute",top:-5,right:-5,width:20,height:20,borderRadius:"50%",background:"#ff3b30",color:"#fff",
          fontSize:12,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",border:"2px solid #fff",zIndex:2,lineHeight:1}
      },"✕")
    );
  }

  var GRID={display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"};

  return ce(Fragment,null,
    // Quick color dots
    ce("div",{style:{display:"flex",gap:IS_TOUCH?10:8,alignItems:"center"}},
      quickColors.map(function(c,i){
        var isA=value===c;
        return ce("span",{key:i,onClick:function(){onQClick(c,i);},
          style:{width:QSZ,height:QSZ,borderRadius:"50%",background:c,cursor:"pointer",flexShrink:0,
            boxShadow:isA?"0 0 0 2px #111,0 0 0 4px #fff,0 0 0 5.5px #6366F1":"0 1px 3px rgba(0,0,0,.4)",
            border:"2px solid rgba(255,255,255,.5)",transform:isA?"scale(1.2)":"scale(1)",transition:"transform .1s"}});
      })
    ),
    // Modal
    open&&ReactDOM.createPortal(
      ce("div",{onClick:closeAll,style:{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:11000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
        ce("div",{onClick:function(e){e.stopPropagation();},
          style:{background:"#f2f2f7",borderRadius:20,padding:"20px 20px 24px",width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,.5)"}},
          ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
            tab==="preset"
              ?ce("button",{onClick:function(){setEditMode(function(m){return !m;});},style:{fontSize:14,color:"#007AFF",fontWeight:600,background:"none",border:"none",cursor:"pointer"}},editMode?"完了":"編集")
              :ce("span",null),
            ce("span",{style:{fontSize:17,fontWeight:700,color:"#000"}},editingSlot!==null?"スロット"+(editingSlot+1)+"の色を変更":"カラーを変更"),
            ce("button",{onClick:closeAll,style:{fontSize:14,color:"#007AFF",fontWeight:600,background:"none",border:"none",cursor:"pointer"}},"閉じる")
          ),
          // Tabs
          ce("div",{style:{display:"flex",background:"rgba(0,0,0,.08)",borderRadius:11,padding:2,marginBottom:20}},
            [["preset","プリセット"],["custom","カスタム"],["history","履歴"]].map(function(pair){
              return ce("button",{key:pair[0],onClick:function(){setTab(pair[0]);setEditMode(false);},
                style:{flex:1,padding:"7px 0",fontSize:14,fontWeight:600,border:"none",borderRadius:9,cursor:"pointer",
                  background:tab===pair[0]?"#fff":"transparent",color:tab===pair[0]?"#000":"#666",
                  boxShadow:tab===pair[0]?"0 1px 5px rgba(0,0,0,.2)":"none"}},pair[1]);
            })
          ),
          tab==="preset"&&ce("div",{style:GRID},
            presets.map(function(c,i){return ce(PDot,{key:i,c:c,i:i});}),
            ce("span",{onClick:function(){setTab("custom");setEditMode(false);},
              style:{width:DS,height:DS,borderRadius:"50%",background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",border:"1.5px dashed #aaa",flexShrink:0}},
              ce("span",{style:{fontSize:24,color:"#aaa",lineHeight:1,fontWeight:300}},"+")
            )
          ),
          tab==="custom"&&ce("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:16}},
            ce("div",{style:{display:"flex",gap:12,alignItems:"center"}},
              ce("span",{style:{width:56,height:56,borderRadius:12,background:customVal,display:"block",border:"1px solid rgba(0,0,0,.12)"}}),
              ce("div",null,
                ce("div",{style:{fontSize:12,color:"#999",marginBottom:4}},"現在の色"),
                ce("div",{style:{fontSize:13,fontFamily:"monospace",color:"#333"}},customVal.toUpperCase())
              )
            ),
            ce("label",{style:{cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8}},
              ce("input",{type:"color",value:customVal,onChange:function(e){setCustomVal(e.target.value);},
                style:{width:220,height:IS_TOUCH?80:60,cursor:"pointer",border:"none",borderRadius:8}}),
              ce("span",{style:{fontSize:12,color:"#666"}},"タップして色を選択")
            ),
            ce("div",{style:{display:"flex",gap:10}},
              ce("button",{onClick:addCustom,style:{padding:"10px 20px",background:"#34C759",color:"#fff",border:"none",borderRadius:12,fontSize:15,fontWeight:600,cursor:"pointer"}},"この色を追加"),
              ce("button",{onClick:function(){pick(customVal);},style:{padding:"10px 20px",background:"#007AFF",color:"#fff",border:"none",borderRadius:12,fontSize:15,fontWeight:600,cursor:"pointer"}},"この色を使用")
            )
          ),
          tab==="history"&&(history.length>0
            ?ce("div",{style:GRID},
                history.map(function(c,i){
                  return ce("span",{key:i,onClick:function(){pick(c);},
                    style:{width:DS,height:DS,borderRadius:"50%",background:c,cursor:"pointer",
                      border:c===value?"3.5px solid #007AFF":"1.5px solid rgba(0,0,0,.14)",
                      display:"flex",alignItems:"center",justifyContent:"center",boxSizing:"border-box",flexShrink:0}},
                    c===value&&ce("span",{style:{fontSize:20,color:LIGHT_COLS.includes(c)?"#000":"#fff",fontWeight:700}},"✓")
                  );
                })
              )
            :ce("div",{style:{textAlign:"center",padding:"32px 0",color:"#aaa",fontSize:14}},"履歴なし")
          )
        )
      ),
      document.body
    )
  );
}

/* ─── Geometry ─────────────────────────────────────────────── */
function distSeg(px,py,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  if(!l2)return Math.hypot(px-x1,py-y1);
  var t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l2));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function strokeHits(s,px,py,er){
  var hw=(s.type==="marker"?s.lineW*4:s.lineW/2)+2, r=er+hw;
  switch(s.type){
    case"line":case"dotted":case"arrow":case"marker":
      return distSeg(px,py,s.x1,s.y1,s.x2,s.y2)<r;
    case"rect":
      return Math.min(distSeg(px,py,s.x1,s.y1,s.x2,s.y1),distSeg(px,py,s.x2,s.y1,s.x2,s.y2),
                      distSeg(px,py,s.x1,s.y2,s.x2,s.y2),distSeg(px,py,s.x1,s.y1,s.x1,s.y2))<r;
    case"circle":{
      var nd=Math.sqrt(Math.pow((px-s.cx)/Math.max(s.rx,1),2)+Math.pow((py-s.cy)/Math.max(s.ry,1),2));
      return Math.abs(nd-1)*Math.min(s.rx,s.ry)<r;
    }
    case"freehand":

function drawStroke(ctx,s){

      ctx.lineTo(s.x1-hl*Math.cos(ang+Math.PI/7),s.y1-hl*Math.sin(ang+Math.PI/7));

        else if(s.pts.length===2){ctx.lineTo(s.pts[1].x,s.pts[1].y);}

/* ─── URLパラメータ解析 (2026-04-20: scalping-notebook連携用) ──
   対応フォーマット:
   - ?5016_2025-04-19         (code_date)
   - ?5016_2025-04-19&id=abc  (code_date + id)
   戻り値: {code, date, id} または null
   パース後URLから即座にパラメータをクリアする (履歴/リロードで再適用させない) */
function caParseUrlParams(){
  try{
    var search=window.location.search||'';
    if(!search||search.length<2)return null;
    var raw=search.slice(1); /* 先頭の?を除去 */
    /* id=XXX を抽出して除去 */
    var id='';
    var idMatch=raw.match(/(?:^|&)id=([^&]*)/);
    if(idMatch){
      id=decodeURIComponent(idMatch[1]||'');
      raw=raw.replace(/(?:^|&)id=[^&]*/,'');
    }
    /* 先頭の & を除去 */
    raw=raw.replace(/^&+/,'').replace(/&+$/,'');
    if(!raw)return null;
    /* 残った文字列を第1セグメントとして扱う (& で複数ある場合は先頭のみ) */
    var first=raw.split('&')[0];
    try{first=decodeURIComponent(first);}catch(e){}
    if(!first||first.indexOf('_')<=0)return null;
    /* code_date 分解: 最初の_で分割 */
    var u=first.indexOf('_');
    if(u<=0)return null;
    var code=first.slice(0,u).trim();
    var date=first.slice(u+1).trim();
    if(!code||!date)return null;
    /* date 形式チェック: YYYY-MM-DD */
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return null;
    return {code:code,date:date,id:id||''};
  }catch(e){console.warn('[caParseUrlParams] error:',e);return null;}
}

/* ─── RefAnalysisPicker（F1: 過去の分析データを選択） ───────── */
function RefAnalysisPicker(props){
  var onSelect=props.onSelect, onClose=props.onClose, fbCfg=props.fbCfg||{};
  var currentTicker=props.currentTicker;        // 現在分析中の ticker (必須)
  var currentDraftId=props.currentDraftId;      // 現在開いてる draft の id (自分自身を除外用)
  var s2=useState(caLoadMeta);    var meta=s2[0];
  var s3=useState(null);          var loading=s3[0],setLoading=s3[1];
  var BT2={border:"none",cursor:"pointer",fontFamily:"inherit"};

  // 現在のticker かつ 自分自身以外 のチャートのみ表示
  // ソート: name の新しい順 (降順、localeCompare)
  var charts=meta.filter(function(m){
    if(!currentTicker||m.ticker!==currentTicker)return false;
    if(currentDraftId&&m.id===currentDraftId)return false;
    return true;
  }).sort(function(a,b){
    return (b.name||'').localeCompare(a.name||'');
  });

  function pickAnalysis(id, chartMeta){
    setLoading(id);
    // ローカル (IndexedDB) から取得試行
    caLoadDataAsync(id, function(d){
      if(d && d.analysisData){
        setLoading(null);
        onSelect({
          id:id, ticker:chartMeta.ticker, name:chartMeta.name,
          analysisData:d.analysisData,
          /* C6: ref側strokeに side='ref' を付与 */
          analysisStrokes:migrateAnalysisStrokes(d.analysisStrokes,'ref'),
          savedAt:chartMeta.savedAt||0,
          /* 2026-04-20 C8: 楽観ロック基準値 (書き込み前pre-checkで使用) */
          _savedAt:(d._v||chartMeta.savedAt||0)
        });
        return;
      }
      // ローカルにない → Firebase から取得
      if(fbCfg.url){
        var dataBase=fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-data';
        var auth=fbCfg.secret?'?auth='+fbCfg.secret:'';
        fetch(dataBase+'/'+id+'.json'+auth).then(function(r){return r.ok?r.text():null;})
          .then(function(txt){
            var fbData=txt?JSON.parse(txt):null;
            setLoading(null);
            if(fbData && fbData.analysisData){
              onSelect({
                id:id, ticker:chartMeta.ticker, name:chartMeta.name,
                analysisData:fbData.analysisData,
                /* C6: ref側strokeに side='ref' を付与 */
                analysisStrokes:migrateAnalysisStrokes(fbData.analysisStrokes,'ref'),
                savedAt:chartMeta.savedAt||0,
                /* 2026-04-20 C8: 楽観ロック基準値 */
                _savedAt:(fbData._v||chartMeta.savedAt||0)
              });
            }else{
              window.caToast('このチャートには過去データ(JSON)が紐付いていません。\nF5機能「過去データを追加する」は未実装です。','info');
            }
          }).catch(function(e){

function DataChart(props){

  /* C8a: 昼休み(11:30=690〜12:30=750)の60分を g分(=ローソク1本分) に圧縮した仮想時間軸
     drawDataChart と同じ定義 (props.tf依存) */
  function tmToVis(t){
    var g=getCandleGap(tf);

  // 2026-04-20: pricePx>0 の時は priceH (画面フィット) / pricePx × 10円 の priceRange に縮減

  useEffect(function(){
