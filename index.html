function RefAnalysisPicker(props){
  var onSelect=props.onSelect, onClose=props.onClose, fbCfg=props.fbCfg||{};
  var currentTicker=props.currentTicker;        // 現在分析中の ticker (必須)
  var currentDraftId=props.currentDraftId;      // 現在開いてる draft の id (自分自身を除外用)
  var s2=useState(caLoadMeta);    var meta=s2[0];
  var s3=useState(null);          var loading=s3[0],setLoading=s3[1];
  var BT2={border:"none",cursor:"pointer",fontFamily:"inherit"};

  // 現在のticker かつ 自分自身以外 のチャートのみ表示
  // ソート: name の新しい順 (降順、localeCompare)
  var charts=meta.filter(function(m){
    if(!currentTicker||m.ticker!==currentTicker)return false;
    if(currentDraftId&&m.id===currentDraftId)return false;
    return true;
  }).sort(function(a,b){
    return (b.name||'').localeCompare(a.name||'');
  });

  function pickAnalysis(id, chartMeta){
    setLoading(id);
    // ローカル (IndexedDB) から取得試行
    caLoadDataAsync(id, function(d){
      if(d && d.analysisData){
        setLoading(null);
        onSelect({
          id:id, ticker:chartMeta.ticker, name:chartMeta.name,
          analysisData:d.analysisData,
          /* C6: ref側strokeに side='ref' を付与 */
          analysisStrokes:migrateAnalysisStrokes(d.analysisStrokes,'ref'),
          savedAt:chartMeta.savedAt||0,
          /* 2026-04-20 C8: 楽観ロック基準値 (書き込み前pre-checkで使用) */
          _savedAt:(d._v||chartMeta.savedAt||0)
        });
        return;
      }
      // ローカルにない → Firebase から取得
      if(fbCfg.url){
        var dataBase=fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-data';
        var auth=fbCfg.secret?'?auth='+fbCfg.secret:'';
        fetch(dataBase+'/'+id+'.json'+auth).then(function(r){return r.ok?r.text():null;})
          .then(function(txt){
            var fbData=txt?JSON.parse(txt):null;
            setLoading(null);
            if(fbData && fbData.analysisData){
              onSelect({
                id:id, ticker:chartMeta.ticker, name:chartMeta.name,
                analysisData:fbData.analysisData,
                /* C6: ref側strokeに side='ref' を付与 */
                analysisStrokes:migrateAnalysisStrokes(fbData.analysisStrokes,'ref'),
                savedAt:chartMeta.savedAt||0,
                /* 2026-04-20 C8: 楽観ロック基準値 */
                _savedAt:(fbData._v||chartMeta.savedAt||0)
              });
            }else{
              window.caToast('このチャートには過去データ(JSON)が紐付いていません。\nF5機能「過去データを追加する」は未実装です。','info');
            }
          }).catch(function(e){
            setLoading(null);
            window.caToast('読込失敗: '+(e&&e.message?e.message:'不明'),'error');
          });
      }else{
        setLoading(null);
        window.caToast('このチャートには過去データ(JSON)が紐付いていません。','info');
      }
    });
  }

  return ReactDOM.createPortal(
    ce("div",{onClick:function(e){if(e.target===e.currentTarget)onClose();},
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:22000,
        display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
      ce("div",{onClick:function(e){e.stopPropagation();},
        style:{background:"#1c1c1e",borderRadius:18,width:"100%",maxWidth:700,maxHeight:"80vh",
          boxShadow:"0 24px 64px rgba(0,0,0,.8)",border:"1px solid #2a2a2a",
          display:"flex",flexDirection:"column",overflow:"hidden"}},
        /* header */
        ce("div",{style:{padding:"16px 18px",borderBottom:"1px solid #2a2a2a",display:"flex",alignItems:"center",gap:10,flexShrink:0}},
          ce("span",{style:{fontSize:16,fontWeight:700,color:"#fff",flex:1}},
            "📊 過去チャートを開く — "+(currentTicker||'(ticker未設定)')
          ),
          ce("button",{onClick:onClose,style:Object.assign({},BT2,{fontSize:13,fontWeight:700,
            background:"#2a2a2a",color:"#aaa",padding:"7px 14px",borderRadius:8})},"閉じる")
        ),
        /* body: 過去データ一覧 */
        ce("div",{style:{flex:1,overflowY:"auto",padding:14,
          display:"flex",flexWrap:"wrap",gap:10,alignContent:"flex-start"}},
          charts.length===0
            ?ce(Fragment,null,
                ce("div",{style:{width:"100%",textAlign:"center",color:"#888",fontSize:14,paddingTop:40}},"過去のデータがありません"),
                ce("div",{style:{width:"100%",textAlign:"center",color:"#555",fontSize:11,marginTop:8}},currentTicker+" に紐付いた他のチャートは見つかりません"),
                ce("div",{style:{width:"100%",textAlign:"center",marginTop:24}},
                  ce("button",{
                    onClick:function(){window.caToast('F5機能: 過去データを追加する、は未実装です。','info');},
                    style:{padding:"11px 22px",fontSize:13,fontWeight:700,border:"none",borderRadius:8,
                      background:"#10b981",color:"#fff",cursor:"pointer",fontFamily:"inherit"}
                  },"📥 過去データを追加する")
                )
              )
            :charts.map(function(m){
              var isLoading=loading===m.id;
              return ce("div",{key:m.id,
                onClick:function(){if(!isLoading)pickAnalysis(m.id,m);},
                style:{width:IS_TOUCH?200:220,background:"#1a1a1a",borderRadius:8,
                  border:"1px solid #2a2a2a",overflow:"hidden",cursor:isLoading?"wait":"pointer",flexShrink:0,
                  opacity:isLoading?0.5:1,
                  transition:"border-color .15s"},
                onMouseEnter:function(e){if(!isLoading)e.currentTarget.style.borderColor='#10b981';},
                onMouseLeave:function(e){e.currentTarget.style.borderColor='#2a2a2a';}},
                (m.thumbUrl||_thumbMemCache[m.id]||m.thumb)?ce("img",{src:_thumbMemCache[m.id]||m.thumbUrl||m.thumb,style:{width:"100%",display:"block",height:"auto"},draggable:false,onError:function(e){e.target.style.display="none";}})
                  :ce("div",{style:{width:"100%",height:60,background:"#222",display:"flex",
                    alignItems:"center",justifyContent:"center",color:"#555",fontSize:10}},"no preview"),
                ce("div",{style:{padding:"5px 7px"}},
                  ce("div",{style:{fontSize:11,fontWeight:600,color:"#ddd",
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},m.name||''),
                  ce("div",{style:{fontSize:9,color:"#666",marginTop:2}},
                    isLoading?'読込中…':(m.savedAt?new Date(m.savedAt).toLocaleDateString():''))
                )
              );
            })
        )
      )
    ),
    document.body
  );
}

function DataChart(props){
  /* B2+: 歩み値JSON → Canvas描画 (HSBI2色、ズーム・パン対応、十字カーソル、時刻+価格ベース描画) */
  var data=props.data;
  var tf=props.tf||'1m';
  var showCrosshair=props.showCrosshair;  // 親からの ON/OFF のみで判定
  var drawTool=props.drawTool||'pan';     // 'pan'|'line'|'dotted'|'arrow'|'rect'|'circle'|'marker'|'freehand'|'text'|'lasso'|'eraser'
  var drawColor=props.drawColor||'#ff3b30';
  var drawWidth=props.drawWidth||2;
  var drawOpacity=props.drawOpacity!=null?props.drawOpacity:1;
  var drawFontSize=props.drawFontSize||18;
  var drawFontBold=!!props.drawFontBold;
  var strokes=props.strokes||[];
  var onStrokeAdd=props.onStrokeAdd;
  var onStrokeDelete=props.onStrokeDelete;
  var onStrokeUpdate=props.onStrokeUpdate;  // (idx, newStroke) → 選択ストローク更新用
  var barsKey=tf==='5m'?'bars_5m':'bars_1m';
  var bars=(data&&data[barsKey])||[];

  var canvasRef=useRef(null);
  var overlayRef=useRef(null);     // 十字カーソル + 描画プレビュー兼用
  var layoutRef=useRef(null);      // drawDataChart が書き込むレイアウト情報
  var cursorRef=useRef(null);      // {x,y} or null
  var rafRef=useRef(null);
  var drawRef=useRef({on:false});  // ドラッグ式描画状態 {on, sTM, sP, cTM, cP, pts(freehand用)}
  var ctrlPanRef=useRef(false);    // Ctrl+drag パン状態
  /* 2026-04-20: パームリジェクション用 — Apple Pencil 最終検知タイムスタンプ */
  var lastPenAtRef=useRef(0);
  /* 2026-04-20: 出来高下端固定モード用 refs (pricePx>0 時のみ使用)
     - hiddenCanvasRef: 従来通りの単一canvas描画先 (display:none)
     - priceCanvasRef: 上段 (scrollable 内)、hidden の price 部分を drawImage 転写
     - volCanvasRef:   下段 (fixed bottom)、hidden の vol+時間軸部分を drawImage 転写
     - priceOverlayRef/volOverlayRef: 十字+preview 用
     - priceScrollRef: scrollable 領域 (内部に priceCanvas+priceOverlay) */
  var hiddenCanvasRef=useRef(null);
  var priceCanvasRef=useRef(null);
  var volCanvasRef=useRef(null);
  var priceOverlayRef=useRef(null);
  var volOverlayRef=useRef(null);
  var priceScrollRef=useRef(null);
  /* 2026-04-20: volFixedArea の実高さ (state) — 描画後 volDrawH で更新、
     volCanvas と volFix の高さを同期させて出来高が切り取られないように */
  var sVFH=useState(120); var volFixedH=sVFH[0],setVolFixedH=sVFH[1];
  /* 2026-04-20: 価格軸ラベル固定ピクセル設定 (localStorage連動、設定変更で再描画) */
  var stPPx=useState(caLoadPricePx()); var pricePx=stPPx[0],setPricePx=stPPx[1];
  useEffect(function(){
    function handler(e){setPricePx(caLoadPricePx());}
    window.addEventListener('ca_price_px_changed',handler);
    return function(){window.removeEventListener('ca_price_px_changed',handler);};
  },[]);
  /* 2026-04-20: ca_chart_bg_changed listener — 背景色変更時に再描画トリガ */
  var stBg=useState(caLoadChartBg()); var chartBg=stBg[0],setChartBg=stBg[1];
  useEffect(function(){
    function handler(e){setChartBg(caLoadChartBg());}
    window.addEventListener('ca_chart_bg_changed',handler);
    return function(){window.removeEventListener('ca_chart_bg_changed',handler);};
  },[]);
  /* C8a: 昼休み(11:30=690〜12:30=750)の60分を g分(=ローソク1本分) に圧縮した仮想時間軸
     drawDataChart と同じ定義 (props.tf依存) */
  function tmToVis(t){
    var g=getCandleGap(tf);
    if(t<=690)return t;
    if(t<=750)return 690+(t-690)*(g/60);   // 60min→g min
    return t-(60-g);                        // 12:30以降 -(60-g) 分シフト
  }
  function visToTm(v){
    var g=getCandleGap(tf);
    if(v<=690)return v;
    if(v<=690+g)return 690+(v-690)*(60/g);  // tmVis 690〜690+g → tm 690〜750 展開
    return v+(60-g);
  }
  /* C-uaxis: layoutRefベースで u軸対応の tm→x 変換 (side='cur'|'ref')
     DataChart内 hitTest/crosshair/applyHorizSnap 等から使う */
  function minToXWithSide(m, side){
    var L=layoutRef.current; if(!L)return 0;
    var tv=tmToVis(m)-L.tmVisStart;   // 0..tmVisSpan
    var u;
    if(!L.hasRef) u=tv;
    else if(side==='ref') u=tv;
    else u=tv+L.tmVisSpan+L.gapVis;
    return L.padL+(u-L.uS)/L.uSpan*L.chartW;
  }
  /* x(canvas内 px) → {side,tm,u} 変換
     C8a: hasRef時 gap領域 [tmVisSpan, tmVisSpan+gapVis] は近い側にclamp
          gap前半 (ref側寄り) → side='ref', tm=15:30
          gap後半 (cur側寄り) → side='cur', tm=9:00
          pan/cursorは自由通過、書込時は境界tmで止まる */
  function xToSideTm(xLocal){
    var L=layoutRef.current; if(!L)return {side:null,tm:null,u:null};
    var u=L.uS+(xLocal-L.padL)/L.chartW*L.uSpan;
    if(!L.hasRef)return {side:'cur',tm:visToTm(u+L.tmVisStart),u:u};
    if(u<L.tmVisSpan)return {side:'ref',tm:visToTm(u+L.tmVisStart),u:u};
    if(u<L.tmVisSpan+L.gapVis){
      /* gap帯: 中央より手前はref境界(15:30)、以降はcur境界(9:00)にclamp */
      var half=L.tmVisSpan+L.gapVis/2;
      if(u<half)return {side:'ref',tm:visToTm(L.tmVisSpan+L.tmVisStart),u:u};  // ref側15:30
      return {side:'cur',tm:visToTm(L.tmVisStart),u:u};                         // cur側9:00
    }
    return {side:'cur',tm:visToTm(u-L.tmVisSpan-L.gapVis+L.tmVisStart),u:u};
  }
  var moveRef=useRef(null);        // lasso: 選択ストローク移動状態 {idx, startTM, startP, origAnchors}
  var pinchRef=useRef(null);       // 2本指ピンチ状態 {d0,s0,e0,ps0,tmC,midX,midY,active}
  var containerRef=useRef(null);

  /* 2026-04-20: 座標計算用の rect 取得 — 分離モード (pricePx>0) では priceCanvas の rect、
     それ以外 (pricePx=0) は従来 containerRef の rect を返す。
     getBoundingClientRect は clientY ベースなのでスクロール位置は自動的に反映される */
  function getCanvasRect(){
    if(pricePx>0&&priceCanvasRef.current){
      return priceCanvasRef.current.getBoundingClientRect();
    }
    if(containerRef.current)return containerRef.current.getBoundingClientRect();
    return {left:0,top:0,width:0,height:0};
  }
  var sD=useState({w:800,h:520}); var dim=sD[0],setDim=sD[1];
  /* C8a: tf依存の tmVisSpan (390 - (60-g)) と uTotal計算helper */
  function getTmVisSpan(){
    var g=getCandleGap(tf);
    return 390-(60-g);  // 9:00-15:30全体 390分 - 昼休み圧縮分
  }
  function getUTotal(hasRefFlag){
    var tvs=getTmVisSpan();
    var g=getCandleGap(tf);
    return hasRefFlag?(tvs*2+g):tvs;
  }
  /* C-uaxis: 時間軸ビューレンジを u軸単位で管理 {uS, uE}
     u軸: 0..uTotal (hasRef無時 uTotal=tmVisSpan、hasRef時 tmVisSpan*2+gap)
     初期値は hasRef無時の全体表示
     refAnalysis の open/close で親 (ImageAnnotator) が reset する
     controlled: props.view / props.onViewChange があればそれを使う */
  var sV=useState({uS:0,uE:getTmVisSpan()}); var viewLocal=sV[0],setViewLocal=sV[1];
  var view=props.view!==undefined?props.view:viewLocal;
  var setView=props.onViewChange||setViewLocal;
  var panStartRef=useRef(null);
  /* 価格軸の縦シフト (yen単位、タイム軸ズーム非依存)
     controlled: props.pShift / props.onPShiftChange があればそれを使う */
  var sPY=useState(0); var pShiftLocal=sPY[0],setPShiftLocal=sPY[1];
  var pShift=props.pShift!==undefined?props.pShift:pShiftLocal;
  var setPShift=props.onPShiftChange||setPShiftLocal;
  /* 価格レンジ (全バーから算出、タイム軸ズーム・パンに影響されない固定値) */
  var sPR=useState(null); var priceRange=sPR[0],setPriceRange=sPR[1];
  /* 選択ストロークの index (lasso用) */
  var sSI=useState(null); var selectedIdx=sSI[0],setSelectedIdx=sSI[1];
  /* 2026-04-20: 移動中のストローク非表示用ヒント — moveRefの{side,idx}と同期、
     drawDataChartに渡してforEachで該当stroke描画をskipする */
  var sMH=useState(null); var moveHint=sMH[0],setMoveHint=sMH[1];

  // C1+: 統合chart用 — refData から refBars を算出
  var refData=props.refData;
  var refBars=(refData&&refData[barsKey])||null;
  var hasRef=!!(refBars&&refBars.length);
  // C3+: 過去chart側ストローク (hasRef時のみ描画、書込みはC6で対応)
  var refStrokes=props.refStrokes||[];

  // データロード時: 全バーから priceRange を算出 (10円境界に丸める)
  // C1+: hasRef時は refBars も含めて外接 min/max で両chart共通レンジに (仕様①a)
  // B完全版: bars は EMA 連続化後の値で priceRange を算出 (refBars は原本でOK)
  useEffect(function(){
    if(!bars.length){setPriceRange(null);return;}
    var mn=Infinity, mx=-Infinity;
    function scan(barsArr){
      barsArr.forEach(function(b){
        if(b.l<mn)mn=b.l; if(b.h>mx)mx=b.h;
        ['ema9','ema22','ema50','ema200','vwap'].forEach(function(k){
          var v=b[k]; if(v!=null){if(v<mn)mn=v;if(v>mx)mx=v;}
        });
      });
    }
    var enhBars=computeEnhancedBars(bars, hasRef?refBars:null);
    scan(enhBars);
    if(hasRef)scan(refBars);
    // 10円境界に丸める + 余白 (±5円: 10円1マスが画面上広く見えるよう最小限)
    mn=Math.floor(mn/10)*10 - 5;
    mx=Math.ceil(mx/10)*10 + 5;
    var pr={min:mn, max:mx};
    setPriceRange(pr);
  },[data,tf,refData,hasRef]);

  // tf 変更時にビューリセット (controlled 時は親が制御するのでスキップ) — C8a: tf依存uTotal
  useEffect(function(){
    if(props.view===undefined)setView({uS:0,uE:getUTotal(hasRef)});
    if(props.pShift===undefined)setPShift(0);
  },[tf,data]);

  // コンテナサイズ追従 (ResizeObserver で display:none → 表示切替も捉える)
  useEffect(function(){
    var el=containerRef.current; if(!el)return;
    function update(){
      var r=el.getBoundingClientRect();
      // 非表示中 (display:none や極小) は更新しない — blur回避
      if(r.width<100||r.height<100)return;
      var w=Math.floor(r.width);
      var h=Math.floor(r.height);
      setDim(function(prev){return(prev.w===w&&prev.h===h)?prev:{w:w,h:h};});
    }
    update();
    var t=setTimeout(update,50);
    var ro=null;
    if(typeof ResizeObserver!=='undefined'){
      ro=new ResizeObserver(update);
      ro.observe(el);
    }
    window.addEventListener('resize',update);
    return function(){
      clearTimeout(t);
      if(ro)ro.disconnect();
      window.removeEventListener('resize',update);
    };
  },[]);

  // メインチャート描画
  useEffect(function(){
    if(!bars.length||!priceRange)return;
    /* 2026-04-20: pricePx 設定を dim に含めて渡す (drawDataChart 内でpriceH拡張判定) */
    var dimWithPx=Object.assign({},dim,{pricePx:pricePx});
    if(pricePx>0){
      /* 分離モード: hidden canvas に従来通り全描画 → price/vol canvas に drawImage クロップ転写 */
      var hidden=hiddenCanvasRef.current;
      if(!hidden)return;
      drawDataChart(hidden,bars,data,dimWithPx,tf,view,pShift,priceRange,layoutRef,strokes,selectedIdx,props.editingTextIdx,refBars,refData,getCandleGap(tf),refStrokes,moveHint);
      var L=layoutRef.current; if(!L){drawCrosshair();return;}
      var dpr=window.devicePixelRatio||1;
      var W=dim.w;
      /* 境界: priceBot + 6 以上の部分が vol+時間軸エリア */
      var boundary=L.priceBot+6;  /* CSS px */
      /* 2026-04-20: volAreaH は「実描画域のみ」に限定 (hidden canvas の下端余白を含めない)
         = volH + padB (volTop=boundary から volBot+padB まで) */
      var volAreaH=(L.volBot-L.priceBot-6)+L.padB;
      if(volAreaH<10){drawCrosshair();return;}  /* 異常値保護 */
      /* volFixedH state を同期 (描画結果に応じて volFix 高さ更新) */
      if(Math.abs(volAreaH-volFixedH)>1){
        setVolFixedH(volAreaH);
      }
      /* priceCanvas: 上半分を転写 (高さ=boundary) */
      var pc=priceCanvasRef.current;
      if(pc){
        pc.width=Math.round(W*dpr);
        pc.height=Math.round(boundary*dpr);
        try{pc.style.width=W+'px';pc.style.height=boundary+'px';}catch(e){}
        var pctx=pc.getContext('2d');
        pctx.clearRect(0,0,pc.width,pc.height);
        pctx.drawImage(hidden, 0,0, Math.round(W*dpr),Math.round(boundary*dpr),
                               0,0, Math.round(W*dpr),Math.round(boundary*dpr));
      }
      /* volCanvas: 下半分を転写 (高さ=volAreaH、hidden 内 Y offset=boundary から) */
      var vc=volCanvasRef.current;
      if(vc){
        vc.width=Math.round(W*dpr);
        vc.height=Math.round(volAreaH*dpr);
        try{vc.style.width=W+'px';vc.style.height=volAreaH+'px';}catch(e){}
        var vctx=vc.getContext('2d');
        vctx.clearRect(0,0,vc.width,vc.height);
        vctx.drawImage(hidden, 0,Math.round(boundary*dpr), Math.round(W*dpr),Math.round(volAreaH*dpr),
                               0,0, Math.round(W*dpr),Math.round(volAreaH*dpr));
      }
    } else {
      /* 従来モード: 表示canvasに直接描画 */
      var canvas=canvasRef.current; if(!canvas)return;
      drawDataChart(canvas,bars,data,dimWithPx,tf,view,pShift,priceRange,layoutRef,strokes,selectedIdx,props.editingTextIdx,refBars,refData,getCandleGap(tf),refStrokes,moveHint);
    }
    // 描画直後に十字カーソルも再描画 (リサイズ・ズーム等でレイアウト変わった時)
    drawCrosshair();
  },[data,bars,dim,tf,view,pShift,priceRange,strokes,selectedIdx,props.editingTextIdx,refData,refBars,refStrokes,moveHint,pricePx,chartBg]);

  // showCrosshair 切替時: OFFなら消す、ONなら再描画
  useEffect(function(){
    drawCrosshair();
  },[showCrosshair]);
  // F2: 親(他チャート)が cursor を更新したら自分も再描画
  useEffect(function(){
    if(!rafRef.current){
      rafRef.current=requestAnimationFrame(function(){drawCrosshair();rafRef.current=null;});
    }
  },[props.externalCursorBump]);

  // 十字カーソル + 描画プレビュー (オーバーレイCanvas)
  function drawCrosshair(){
    /* 2026-04-20: 分離モード (pricePx>0) 時は priceOverlay と volOverlay の2つに描画、
       非分離モードは従来通り overlayRef に描画 */
    if(pricePx>0){
      _drawCrosshairSplit();
      return;
    }
    var overlay=overlayRef.current; if(!overlay)return;
    var dpr=window.devicePixelRatio||1;
    var W=dim.w, H=dim.h;
    overlay.width=Math.round(W*dpr);
    overlay.height=Math.round(H*dpr);
    var ctx=overlay.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);

    var L=layoutRef.current;

    /* 描画中プレビュー (最優先で描く — 背面) */
    if(L&&drawRef.current&&drawRef.current.on){
      var d=drawRef.current;
      /* C5+: drawRef.side に応じた minToX を使う (side未指定は 'cur') */
      var dSide=d.side||'cur';
      function minToXloc(m){return minToXWithSide(m,dSide);}
      function pToYloc(p){return L.priceTop+(1-(p-L.pmin)/(L.pmax-L.pmin))*L.priceH;}
      if(d.freehand&&d.pts&&d.pts.length){
        // freehand: 多点プレビュー
        var preview={type:'freehand',anchors:d.pts,
          color:drawColor,width:drawWidth,opacity:drawOpacity};
        drawAnalysisStrokeExt(ctx,preview,minToXloc,pToYloc,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
      } else {
        // 2点ツール: line/dotted/arrow/rect/circle/marker
        var preview2={type:drawTool,
          anchors:[{tm:d.sTM,p:d.sP},{tm:d.cTM,p:d.cP}],
          color:drawColor,width:drawWidth,opacity:drawOpacity};
        drawAnalysisStroke(ctx,preview2,minToXloc,pToYloc,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
      }
    }
    /* lasso 移動中プレビュー (移動後位置を点線で表示) — C6: side対応 */
    if(L&&moveRef.current&&moveRef.current.moving){
      var m=moveRef.current;
      var mSrcArr=(m.side==='ref')?(refStrokes||[]):(strokes||[]);
      var s=mSrcArr[m.idx];
      if(s){
        var mSide=m.side||s.side||'cur';
        function minToXloc2(mm){return minToXWithSide(mm,mSide);}
        function pToYloc2(pp){return L.priceTop+(1-(pp-L.pmin)/(L.pmax-L.pmin))*L.priceH;}
        var shifted=Object.assign({},s,{
          anchors:s.anchors.map(function(a){return {tm:a.tm+m.dtm, p:a.p+m.dp};})
        });
        var tp2=shifted.type||shifted.tool;
        if(tp2==='freehand'||tp2==='text'){
          drawAnalysisStrokeExt(ctx,shifted,minToXloc2,pToYloc2,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
        } else {
          drawAnalysisStroke(ctx,shifted,minToXloc2,pToYloc2,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
        }
        drawSelectionHighlight(ctx,shifted,minToXloc2,pToYloc2,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
      }
    }
    /* eraser: 赤枠プレビューは廃止 — なぞった瞬間に即削除する方式 */

    /* 十字カーソル */
    if(!showCrosshair||!L)return;
    /* F2: 連動cursor が親から来ていればそれを自分の画面座標に変換して描く。
       無ければ従来の cursorRef (自分のpointer位置) を使う
       C5+: 統合chart(L.hasRef=true)時は外部cursor不要 (親は現在chartのみ) */
    var cx, cy, tmForLabel;
    var extRef=props.externalCursorRef;
    if(!L.hasRef && extRef && extRef.current){
      var ec=extRef.current;
      /* C-uaxis: minToXWithSide経由 (旧layoutRef tmVisSプロパティ廃止) */
      cx=minToXWithSide(ec.tm,'cur');
      cy=L.priceTop+ec.yOffset;
      tmForLabel=ec.tm;
      // 縦線は時間軸外なら描かない (view範囲外)
      if(cx<L.padL||cx>L.padL+L.chartW)return;
    } else {
      var pos=cursorRef.current; if(!pos)return;
      cx=pos.x; cy=pos.y;
      if(cx<L.padL||cx>L.padL+L.chartW)return;
      if(cy<L.padT||cy>L.volBot)return;
      /* C8a: u軸対応でtm算出。xToSideTmがgap帯も近い側に境界clampするのでそのまま使える */
      var xst=xToSideTm(cx);
      tmForLabel=xst.tm;
    }
    var CROSS='#4a9de3';
    ctx.strokeStyle=CROSS; ctx.setLineDash([3,3]); ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(Math.round(cx)+0.5,L.priceTop);
    ctx.lineTo(Math.round(cx)+0.5,L.volBot);
    ctx.stroke();
    if(cy>=L.priceTop&&cy<=L.priceBot){
      ctx.beginPath();
      ctx.moveTo(L.padL,Math.round(cy)+0.5);
      ctx.lineTo(L.padL+L.chartW,Math.round(cy)+0.5);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    var hh=Math.floor(tmForLabel/60), mm=Math.round(tmForLabel%60);
    if(mm>=60){hh++;mm-=60;}
    var tStr=(data.date?data.date.replace(/-/g,'/')+' ':'')+(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
    ctx.font='bold 11px -apple-system,Helvetica,sans-serif';
    ctx.textBaseline='middle'; ctx.textAlign='center';
    var tw=ctx.measureText(tStr).width+10;
    var ty=L.priceBot+3;
    ctx.fillStyle=CROSS;
    ctx.fillRect(cx-tw/2,ty,tw,14);
    ctx.fillStyle='#000';
    ctx.fillText(tStr,cx,ty+7);
    if(cy>=L.priceTop&&cy<=L.priceBot){
      var fracY=(cy-L.priceTop)/L.priceH;
      var priceAt=L.pmax-fracY*(L.pmax-L.pmin);
      var pStr=priceAt.toFixed(0);
      var pw=ctx.measureText(pStr).width+10;
      ctx.textAlign='left';
      ctx.fillStyle=CROSS;
      ctx.fillRect(L.padL+L.chartW+2,cy-8,pw,16);
      ctx.fillStyle='#000';
      ctx.fillText(pStr,L.padL+L.chartW+7,cy);
    }
  }

  /* 2026-04-20: 分離モード用 drawCrosshair — price/vol 両overlay に分割描画
     priceOverlay: preview + 十字(price部分) + 水平ライン + 時刻ラベル + 価格ラベル
     volOverlay: 十字縦線(vol部分) のみ */
  function _drawCrosshairSplit(){
    var pov=priceOverlayRef.current;
    var vov=volOverlayRef.current;
    if(!pov&&!vov)return;
    var dpr=window.devicePixelRatio||1;
    var W=dim.w;
    var L=layoutRef.current;
    var boundary=L?(L.priceBot+6):0;
    /* 2026-04-20: volAreaH は実描画域のみ (volH + padB) */
    var volAreaH=L?((L.volBot-L.priceBot-6)+L.padB):0;
    /* priceOverlay サイズ同期 */
    if(pov){
      pov.width=Math.round(W*dpr);
      pov.height=Math.round(boundary*dpr);
      try{pov.style.width=W+'px';pov.style.height=boundary+'px';}catch(e){}
    }
    if(vov&&volAreaH>0){
      vov.width=Math.round(W*dpr);
      vov.height=Math.round(volAreaH*dpr);
      try{vov.style.width=W+'px';vov.style.height=volAreaH+'px';}catch(e){}
    }
    if(!L){return;}
    var pctx=pov?pov.getContext('2d'):null;
    var vctx=vov?vov.getContext('2d'):null;
    if(pctx){pctx.setTransform(dpr,0,0,dpr,0,0);pctx.clearRect(0,0,W,boundary);}
    if(vctx){vctx.setTransform(dpr,0,0,dpr,0,0);vctx.clearRect(0,0,W,volAreaH);}

    /* ── preview / 移動プレビュー: priceOverlay にのみ描画 (Y は price 座標系そのまま) ── */
    if(pctx){
      if(drawRef.current&&drawRef.current.on){
        var d=drawRef.current;
        var dSide=d.side||'cur';
        (function(){
          function minToXloc(m){return minToXWithSide(m,dSide);}
          function pToYloc(p){return L.priceTop+(1-(p-L.pmin)/(L.pmax-L.pmin))*L.priceH;}
          if(d.freehand&&d.pts&&d.pts.length){
            var preview={type:'freehand',anchors:d.pts,
              color:drawColor,width:drawWidth,opacity:drawOpacity};
            drawAnalysisStrokeExt(pctx,preview,minToXloc,pToYloc,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
          } else {
            var preview2={type:drawTool,
              anchors:[{tm:d.sTM,p:d.sP},{tm:d.cTM,p:d.cP}],
              color:drawColor,width:drawWidth,opacity:drawOpacity};
            drawAnalysisStroke(pctx,preview2,minToXloc,pToYloc,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
          }
        })();
      }
      if(moveRef.current&&moveRef.current.moving){
        var m=moveRef.current;
        var mSrcArr=(m.side==='ref')?(refStrokes||[]):(strokes||[]);
        var sm=mSrcArr[m.idx];
        if(sm){
          (function(){
            var mSide=m.side||sm.side||'cur';
            function minToXloc2(mm){return minToXWithSide(mm,mSide);}
            function pToYloc2(pp){return L.priceTop+(1-(pp-L.pmin)/(L.pmax-L.pmin))*L.priceH;}
            var shifted=Object.assign({},sm,{
              anchors:sm.anchors.map(function(a){return {tm:a.tm+m.dtm, p:a.p+m.dp};})
            });
            var tp2=shifted.type||shifted.tool;
            if(tp2==='freehand'||tp2==='text'){
              drawAnalysisStrokeExt(pctx,shifted,minToXloc2,pToYloc2,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
            } else {
              drawAnalysisStroke(pctx,shifted,minToXloc2,pToYloc2,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
            }
            drawSelectionHighlight(pctx,shifted,minToXloc2,pToYloc2,L.padL,L.padR,L.padT,L.padB,L.chartW,L.priceTop,L.priceBot,L.priceH);
          })();
        }
      }
    }

    /* ── 十字カーソル ── */
    if(!showCrosshair)return;
    var cx, cy, tmForLabel;
    var extRef=props.externalCursorRef;
    if(!L.hasRef && extRef && extRef.current){
      var ec=extRef.current;
      cx=minToXWithSide(ec.tm,'cur');
      cy=L.priceTop+ec.yOffset;
      tmForLabel=ec.tm;
      if(cx<L.padL||cx>L.padL+L.chartW)return;
    } else {
      var pos=cursorRef.current; if(!pos)return;
      cx=pos.x; cy=pos.y;
      if(cx<L.padL||cx>L.padL+L.chartW)return;
      /* pricePx>0 時、cursor は priceCanvas 内座標 (0..boundary)。vol エリア上では cursor 無効 */
      if(cy<L.padT||cy>boundary)return;
      var xst=xToSideTm(cx);
      tmForLabel=xst.tm;
    }
    var CROSS='#4a9de3';
    /* 縦線: priceOverlay 全域 + volOverlay 全域 (2 canvas 跨ぎ) */
    if(pctx){
      pctx.strokeStyle=CROSS; pctx.setLineDash([3,3]); pctx.lineWidth=1;
      pctx.beginPath();
      pctx.moveTo(Math.round(cx)+0.5,L.priceTop);
      pctx.lineTo(Math.round(cx)+0.5,boundary);
      pctx.stroke();
      if(cy>=L.priceTop&&cy<=L.priceBot){
        pctx.beginPath();
        pctx.moveTo(L.padL,Math.round(cy)+0.5);
        pctx.lineTo(L.padL+L.chartW,Math.round(cy)+0.5);
        pctx.stroke();
      }
      pctx.setLineDash([]);
      /* 時刻ラベル (priceBot の直下 = priceOverlay の下端付近) */
      var hh=Math.floor(tmForLabel/60), mm=Math.round(tmForLabel%60);
      if(mm>=60){hh++;mm-=60;}
      var tStr=(data.date?data.date.replace(/-/g,'/')+' ':'')+(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
      pctx.font='bold 11px -apple-system,Helvetica,sans-serif';
      pctx.textBaseline='middle'; pctx.textAlign='center';
      var tw=pctx.measureText(tStr).width+10;
      var ty=L.priceBot+3;
      if(ty+14<=boundary){
        pctx.fillStyle=CROSS;
        pctx.fillRect(cx-tw/2,ty,tw,14);
        pctx.fillStyle='#000';
        pctx.fillText(tStr,cx,ty+7);
      }
      /* 価格ラベル */
      if(cy>=L.priceTop&&cy<=L.priceBot){
        var fracY=(cy-L.priceTop)/L.priceH;
        var priceAt=L.pmax-fracY*(L.pmax-L.pmin);
        var pStr=priceAt.toFixed(0);
        var pw=pctx.measureText(pStr).width+10;
        pctx.textAlign='left';
        pctx.fillStyle=CROSS;
        pctx.fillRect(L.padL+L.chartW+2,cy-8,pw,16);
        pctx.fillStyle='#000';
        pctx.fillText(pStr,L.padL+L.chartW+7,cy);
      }
    }
    /* volOverlay: 縦線のみ (Y は 0..volAreaH 範囲全域) */
    if(vctx&&volAreaH>0){
      vctx.strokeStyle=CROSS; vctx.setLineDash([3,3]); vctx.lineWidth=1;
      vctx.beginPath();
      vctx.moveTo(Math.round(cx)+0.5,0);
      vctx.lineTo(Math.round(cx)+0.5,volAreaH);
      vctx.stroke();
      vctx.setLineDash([]);
    }
  }

  // F2: 自分の cursorRef.current から親に {tm, yOffset} を通知 (両チャート連動)
  // C-uaxis: 統合chart時 (L.hasRef=true) は外部cursor不要 (過去chart container非render)。
  //   gap にいる場合は通知しない。
  function notifyExternalCursorFromLocal(){
    var onCh=props.onExternalCursorChange; if(!onCh)return;
    var L=layoutRef.current; var p=cursorRef.current;
    if(!p||!L){onCh(null);return;}
    if(p.x<L.padL||p.x>L.padL+L.chartW||p.y<L.padT||p.y>L.volBot){onCh(null);return;}
    var xst=xToSideTm(p.x);
    if(xst.tm==null){onCh(null);return;}
    onCh({tm:xst.tm, yOffset:p.y-L.priceTop});
  }
  // マウスムーブハンドラ (十字カーソル座標更新専用)
  function onChartMouseMove(e){
    var rect=getCanvasRect();
    cursorRef.current={x:e.clientX-rect.left,y:e.clientY-rect.top};
    notifyExternalCursorFromLocal();
    if(!rafRef.current){
      rafRef.current=requestAnimationFrame(function(){
        drawCrosshair();
        rafRef.current=null;
      });
    }
  }
  function onChartMouseLeave(){
    cursorRef.current=null;
    if(props.onExternalCursorChange)props.onExternalCursorChange(null);
    drawCrosshair();
  }

  // ホイール: ズーム (カーソル位置中心) — C-uaxis: u軸直接
  useEffect(function(){
    var el=containerRef.current; if(!el)return;
    function handler(e){
      e.preventDefault();
      var rect=el.getBoundingClientRect();
      var padL=40, padR=40;
      var chartW=rect.width-padL-padR;
      var cxAbs=e.clientX-rect.left;
      var cx=cxAbs-padL;
      if(cx<0||cx>chartW)return;
      var L=layoutRef.current;
      setView(function(v){
        var uS=v.uS||0, uE=v.uE!=null?v.uE:(L?L.uTotal:getTmVisSpan());
        var uSpan=uE-uS;
        var frac=cx/chartW;
        var uCenter=uS+frac*uSpan;
        // Ctrl+ホイール = 価格軸シフト
        if(e.ctrlKey||e.metaKey){
          setPShift(function(p){return p + (e.deltaY>0?-0.02:0.02);});
          return v;
        }
        var uTotalNow=(L&&L.uTotal)||getUTotal(hasRef);
        var factor=e.deltaY<0?0.85:1/0.85;
        var newUSpan=Math.max(2,Math.min(uTotalNow,uSpan*factor));
        var newUS=uCenter-frac*newUSpan;
        var newUE=newUS+newUSpan;
        if(newUS<0){newUS=0;newUE=newUS+newUSpan;}
        if(newUE>uTotalNow){newUE=uTotalNow;newUS=newUE-newUSpan;}
        if(newUS<0)newUS=0;
        return {uS:newUS,uE:newUE};
      });
    }
    el.addEventListener('wheel',handler,{passive:false});
    return function(){el.removeEventListener('wheel',handler);};
  },[]);

  /* Pointer → 時刻+価格に変換 */
  function pxToTimePrice(clientX,clientY){
    var L=layoutRef.current; if(!L)return null;
    var rect=getCanvasRect();
    var cx=clientX-rect.left, cy=clientY-rect.top;
    /* C-uaxis: u軸対応で side/tm/u 算出 */
    var xst=xToSideTm(cx);
    var tm=xst.tm, side=xst.side, u=xst.u;
    var price;
    if(cy>=L.priceTop&&cy<=L.priceBot){
      price=L.pmax-((cy-L.priceTop)/L.priceH)*(L.pmax-L.pmin);
    } else {
      price=null;
    }
    return {tm:tm, p:price, cx:cx, cy:cy, side:side, u:u};
  }

  /* 2026-04-20: 親コンポーネント (ImageAnnotator) からpxToTimePrice を呼ぶ用のAPI 
     editor overlayの「…」ボタンdrag終了時に新screen座標を tm/p 変換するのに使用 */
  useEffect(function(){
    if(props.chartAPIRef){
      props.chartAPIRef.current={
        pxToTimePrice:function(cx,cy){return pxToTimePrice(cx,cy);}
      };
    }
    return function(){
      if(props.chartAPIRef)props.chartAPIRef.current=null;
    };
  },[]);

  /* ヒットテスト: クリック位置に近いストロークを返す (全ツール対応)
     C6: {side, idx} を返す。hasRef時は クリック側の strokes (cur or ref) のみ対象。
         gap領域は null。hit無しも null。 */

  /* 2026-04-20: stroke anchor位置 → screen座標変換ヘルパー
     テキスト編集モード起動時に、クリック位置ではなくテキスト実位置にtextareaを配置する用途 */
  function anchorToScreen(stk, stkSide){
    try{
      if(!stk||!stk.anchors||!stk.anchors[0])return null;
      var lay=layoutRef.current, cvs=canvasRef.current;
      if(!lay||!cvs)return null;
      var rect=cvs.getBoundingClientRect();
      if(!rect||!rect.width)return null;
      var dpr=dprRef.current||1;
      var sw=rect.width/(cvs.width/dpr);
      var sh=rect.height/(cvs.height/dpr);
      var a=stk.anchors[0];
      var cvsX=minToXWithSide(a.tm, stkSide||'cur');
      var den=(lay.pmax-lay.pmin)||1;
      var cvsY=lay.priceTop+(1-(a.p-lay.pmin)/den)*lay.priceH;
      return {
        screenX: rect.left+cvsX*sw,
        screenY: rect.top+cvsY*sh,
        tm: a.tm, p: a.p
      };
    }catch(err){return null;}
  }

  function hitTestStroke(clientX,clientY){
    var L=layoutRef.current; if(!L)return null;
    var rect=getCanvasRect();
    var cx=clientX-rect.left, cy=clientY-rect.top;
    /* C6+C8a: クリック側を判定。xToSideTmがgap帯も近い側に境界clampするので 'gap'返しは無し */
    var clickSide='cur';
    if(L.hasRef){
      var xst=xToSideTm(cx);
      if(xst.side==null)return null;
      clickSide=xst.side;
    }
    var targetArr=(clickSide==='ref')?(refStrokes||[]):(strokes||[]);
    if(!targetArr.length)return null;
    var TOL=8;
    function minToXloc(m){return minToXWithSide(m,clickSide);}
    function pToYloc(p){return L.priceTop+(1-(p-L.pmin)/(L.pmax-L.pmin))*L.priceH;}
    function distPtToSeg(px,py,x1,y1,x2,y2){
      var dx=x2-x1, dy=y2-y1, lenSq=dx*dx+dy*dy;
      if(lenSq===0)return Math.hypot(px-x1,py-y1);
      var t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/lenSq));
      return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
    }
    for(var i=targetArr.length-1;i>=0;i--){
      var s=targetArr[i]; if(!s||!s.anchors||!s.anchors.length)continue;
      var tp=s.type||s.tool;  // 後方互換
      if(tp==='horizontal'){
        var y=pToYloc(s.anchors[0].p);
        if(Math.abs(cy-y)<=TOL)return {side:clickSide,idx:i};
      } else if((tp==='line'||tp==='dotted'||tp==='arrow'||tp==='marker')&&s.anchors.length>=2){
        var a1=s.anchors[0], a2=s.anchors[1];
        var x1=minToXloc(a1.tm), y1=pToYloc(a1.p);
        var x2=minToXloc(a2.tm), y2=pToYloc(a2.p);
        var tol=tp==='marker'?(s.width||2)*5+4:TOL;
        if(distPtToSeg(cx,cy,x1,y1,x2,y2)<=tol)return {side:clickSide,idx:i};
      } else if(tp==='rect'&&s.anchors.length>=2){
        var a1=s.anchors[0], a2=s.anchors[1];
        var x1=minToXloc(a1.tm), y1=pToYloc(a1.p);
        var x2=minToXloc(a2.tm), y2=pToYloc(a2.p);
        var rx=Math.min(x1,x2), ry=Math.min(y1,y2);
        var rw=Math.abs(x2-x1), rh=Math.abs(y2-y1);
        // 4辺のいずれかに近いか
        var d=Math.min(
          distPtToSeg(cx,cy,rx,ry,rx+rw,ry),
          distPtToSeg(cx,cy,rx+rw,ry,rx+rw,ry+rh),
          distPtToSeg(cx,cy,rx+rw,ry+rh,rx,ry+rh),
          distPtToSeg(cx,cy,rx,ry+rh,rx,ry)
        );
        if(d<=TOL)return {side:clickSide,idx:i};
      } else if(tp==='circle'&&s.anchors.length>=2){
        var a1=s.anchors[0], a2=s.anchors[1];
        var x1=minToXloc(a1.tm), y1=pToYloc(a1.p);
        var x2=minToXloc(a2.tm), y2=pToYloc(a2.p);
        var ccx=(x1+x2)/2, ccy=(y1+y2)/2;
        var rx=Math.abs(x2-x1)/2, ry=Math.abs(y2-y1)/2;
        if(rx<=0||ry<=0)continue;
        // 楕円周との距離近似: ノーマライズ空間で円からの距離
        var ndx=(cx-ccx)/rx, ndy=(cy-ccy)/ry;
        var nd=Math.hypot(ndx,ndy);
        // 半径1の円との距離 → 絶対距離に戻す (ざっくり)
        var diff=Math.abs(nd-1)*Math.min(rx,ry);
        if(diff<=TOL)return {side:clickSide,idx:i};
      } else if(tp==='freehand'&&s.anchors.length>=2){
        // 各セグメントとの距離の最小値
        var minD=Infinity;
        for(var j=1;j<s.anchors.length;j++){
          var pa=s.anchors[j-1], pb=s.anchors[j];
          var xa=minToXloc(pa.tm), ya=pToYloc(pa.p);
          var xb=minToXloc(pb.tm), yb=pToYloc(pb.p);
          var dd=distPtToSeg(cx,cy,xa,ya,xb,yb);
          if(dd<minD)minD=dd;
        }
        if(minD<=TOL)return {side:clickSide,idx:i};
      } else if(tp==='text'){
        var a=s.anchors[0];
        var tx=minToXloc(a.tm), ty=pToYloc(a.p);
        var fs=s.fontSize||15;
        var fb=s.fontBold?'bold ':'';
        var rawLines=(s.text||'').split('\n');
        /* 2026-04-20: boxW指定時は wordBreak wrap (描画と一致させる) */
        var displayLines=[];
        var cnv=canvasRef.current;
        var mctx=null;
        if(cnv){
          mctx=cnv.getContext('2d');
          mctx.save();
          mctx.font=fb+fs+"px -apple-system,'Helvetica Neue',sans-serif";
        }
        if(s.boxW&&s.boxW>0&&mctx){
          rawLines.forEach(function(para){
            var cur='';
            for(var ci=0;ci<para.length;ci++){
              var test=cur+para[ci];
              if(mctx.measureText(test).width>s.boxW&&cur.length>0){displayLines.push(cur);cur=para[ci];}
              else{cur=test;}
            }
            displayLines.push(cur);
          });
        }else{
          displayLines=rawLines;
        }
        /* C6-bugfix: measureText で実測幅。ざっくり想定 (fs*0.6) は日本語/半角混在で崩れる */
        var mW=0;
        if(mctx){
          displayLines.forEach(function(l){
            var w=mctx.measureText(l).width;
            if(w>mW)mW=w;
          });
          mctx.restore();
        } else {
          displayLines.forEach(function(l){if(l.length*fs*0.6>mW)mW=l.length*fs*0.6;});
        }
        /* boxWが設定されていればそれを優先 (折返し後の実描画幅) */
        if(s.boxW&&s.boxW>mW)mW=s.boxW;
        var tH=displayLines.length*fs*1.3;
        var PAD=6;  // 当たり判定パディング (元は4、タッチ操作にも余裕を持たせる)
        if(cx>=tx-PAD&&cx<=tx+mW+PAD&&cy>=ty-PAD&&cy<=ty+tH+PAD)return {side:clickSide,idx:i};
      }
    }
    return null;
  }

  /* 水平スナップ (horizトグルON時) */
  function applyHorizSnap(sTM,sP,cTM,cP){
    var L=layoutRef.current; if(!L)return {tm:cTM, p:cP};
    /* C5+: cur側想定で x計算 (描画中stroke は drawRef.side に依存するが、minToXWithSideで統一) */
    var sx=minToXWithSide(sTM,'cur');
    var sy=L.priceTop+(1-(sP-L.pmin)/(L.pmax-L.pmin))*L.priceH;
    var cx=minToXWithSide(cTM,'cur');
    var cy=L.priceTop+(1-(cP-L.pmin)/(L.pmax-L.pmin))*L.priceH;
    var dx=Math.abs(cx-sx), dy=Math.abs(cy-sy);
    if(dx>dy)return {tm:cTM, p:sP};   // 水平: 価格固定
    else return {tm:sTM, p:cP};       // 垂直: 時刻固定
  }

  /* ───── ドラッグ式 描画ハンドラ ─────
     画像画面と同じ: 押下→ドラッグ→離すで1本のストロークを確定 */
  function onMouseDown(e){
    // テキスト入力中はpan/zoom/描画をすべてロック
    if(props.textInputActive)return;
    // Ctrl+ドラッグ = どのツールでもパン
    if(e.ctrlKey||e.metaKey){
      panStartRef.current={x:e.clientX,y:e.clientY,uS:view.uS,uE:view.uE,ps:pShift};
      ctrlPanRef.current=true;
      return;
    }
    /* 2026-04-20: どのツールでも既存textをhitしたらeditor overlay扱い (eraser除外)
       tap (dragなし) → editor open / drag>=3px → text stroke 移動 */
    if(drawTool!=='eraser'){
      var gHit=hitTestStroke(e.clientX,e.clientY);
      if(gHit!=null){
        var gArr=(gHit.side==='ref')?(refStrokes||[]):(strokes||[]);
        var gStk=gArr[gHit.idx];
        if(gStk&&(gStk.type||gStk.tool)==='text'){
          if(drawTool==='lasso')setSelectedIdx(gHit);
          var gScr=anchorToScreen(gStk,gHit.side);
          var gTp=pxToTimePrice(e.clientX,e.clientY);
          moveRef.current={
            side:gHit.side, idx:gHit.idx,
            startTM:(gTp&&gTp.tm!=null?gTp.tm:0),
            startP:(gTp&&gTp.p!=null?gTp.p:0),
            dtm:0, dp:0, moving:false,
            _isTextTool:true,
            _editReq:{
              tm:(gScr?gScr.tm:(gTp?gTp.tm:0)),
              p:(gScr?gScr.p:(gTp?gTp.p:0)),
              screenX:(gScr?gScr.screenX:e.clientX),
              screenY:(gScr?gScr.screenY:e.clientY),
              editIdx:gHit.idx, side:gHit.side
            }
          };
          return;
        }
      }
    }
    if(drawTool==='pan'){
      panStartRef.current={x:e.clientX,y:e.clientY,uS:view.uS,uE:view.uE,ps:pShift};
      return;
    }
    var tp=pxToTimePrice(e.clientX,e.clientY);
    if(!tp||tp.p==null)return;
    /* C8a: xToSideTmでgap帯は近い側に境界clamp済み — gap block不要 */
    var tpSide=tp.side||'cur';
    if(drawTool==='eraser'){
      // 即時削除: hit を見つけたら silent で消し、ドラッグ中ずっと続ける
      drawRef.current={on:true, eraser:true, didDelete:false};
      var eHit=hitTestStroke(e.clientX,e.clientY);
      if(eHit!=null&&onStrokeDelete){
        onStrokeDelete(eHit.side, eHit.idx, true); // silent=true: 履歴コミットしない
        drawRef.current.didDelete=true;
      }
      return;
    }
    if(drawTool==='lasso'){
      // クリック位置にストロークがあれば選択、無ければ選択解除
      var hi=hitTestStroke(e.clientX,e.clientY);
      if(hi==null){
        setSelectedIdx(null);
        return;
      }
      setSelectedIdx(hi);
      /* 2026-04-20: 既存textをhitした場合はtext modeと同じ挙動 (moveRefに_isTextTool+_editReq)
         — mouseUpで moving=false なら editor overlay open、movingなら通常移動
         — screenX/screenY は stroke anchor位置から計算 (テキスト位置を保持) */
      var hiArr=(hi.side==='ref')?(refStrokes||[]):(strokes||[]);
      var hiStk=hiArr[hi.idx];
      if(hiStk&&(hiStk.type||hiStk.tool)==='text'){
        var lScr=anchorToScreen(hiStk,hi.side);
        moveRef.current={
          side:hi.side, idx:hi.idx, startTM:tp.tm, startP:tp.p, dtm:0, dp:0, moving:false,
          _isTextTool:true,
          _editReq:{
            tm:(lScr?lScr.tm:tp.tm), p:(lScr?lScr.p:tp.p),
            screenX:(lScr?lScr.screenX:e.clientX), screenY:(lScr?lScr.screenY:e.clientY),
            editIdx:hi.idx, side:hi.side
          }
        };
        return;
      }
      // 選択したストロークをドラッグで移動 → moveRef開始 (C6: side 保持)
      moveRef.current={side:hi.side, idx:hi.idx, startTM:tp.tm, startP:tp.p, dtm:0, dp:0, moving:false};
      return;
    }
    if(drawTool==='text'){
      // C8a-fix: 既存textをhitしたら moveRef 開始 (lasso と同じ挙動、3px以下でeditモード、超えたら移動)
      var hitT=hitTestStroke(e.clientX,e.clientY);
      var editIdxT=-1;
      var editSideT='cur';
      if(hitT!=null){
        var hitArr=(hitT.side==='ref')?(refStrokes||[]):(strokes||[]);
        var hitStk=hitArr[hitT.idx];
        if(hitStk&&(hitStk.type||hitStk.tool)==='text'){
          editIdxT=hitT.idx;
          editSideT=hitT.side;
          /* moveRef で move/edit を切り分け — mouseUpで moving=true なら移動、false ならedit portal open
             screenX/screenY は anchor位置から計算 (#2+#4 テキスト位置保持) */
          var tScr=anchorToScreen(hitStk,editSideT);
          moveRef.current={
            side:editSideT, idx:editIdxT, startTM:tp.tm, startP:tp.p, dtm:0, dp:0, moving:false,
            /* text移動用フラグ: mouseUp時に moving=false ならedit、true なら通常の stroke update */
            _isTextTool:true,
            _editReq:{
              tm:(tScr?tScr.tm:tp.tm), p:(tScr?tScr.p:tp.p),
              screenX:(tScr?tScr.screenX:e.clientX), screenY:(tScr?tScr.screenY:e.clientY),
              editIdx:editIdxT, side:editSideT
            }
          };
          return;
        }
      }
      /* 既存text hitでなければ従来通り新規作成 portal */
      if(props.onRequestTextInput){
        props.onRequestTextInput({
          tm:tp.tm, p:tp.p,
          screenX:e.clientX, screenY:e.clientY,
          editIdx:-1,
          side:tpSide
        });
      }
      return;
    }
    if(drawTool==='freehand'){
      drawRef.current={on:true, freehand:true, side:tpSide, pts:[{tm:tp.tm,p:tp.p}]};
      drawCrosshair();
      return;
    }
    // 2点ツール: ドラッグ開始 (C6: side 記録)
    if(drawTool==='line'||drawTool==='dotted'||drawTool==='arrow'||
       drawTool==='rect'||drawTool==='circle'||drawTool==='marker'){
      drawRef.current={on:true, side:tpSide, sTM:tp.tm, sP:tp.p, cTM:tp.tm, cP:tp.p};
      drawCrosshair();
    }
  }
  function onMouseMove(e){
    if(props.textInputActive)return;
    // 十字カーソル座標更新 (hoverでも描画中でも)
    if(containerRef.current){
      var rect=getCanvasRect();
      cursorRef.current={x:e.clientX-rect.left,y:e.clientY-rect.top};
      notifyExternalCursorFromLocal();
    }
    // lasso 移動中
    if(moveRef.current){
      var tpm=pxToTimePrice(e.clientX,e.clientY);
      if(tpm&&tpm.p!=null){
        var mref=moveRef.current;
        mref.dtm=tpm.tm-mref.startTM;
        mref.dp=tpm.p-mref.startP;
        // 微小移動は無視 (クリック選択時に意図せず動かないように) — C6: u軸対応
        var L0=layoutRef.current;
        if(L0){
          var mSide=mref.side||'cur';
          var mx0=minToXWithSide(mref.startTM,mSide);
          var mx1=minToXWithSide(tpm.tm,mSide);
          var dxPx=Math.abs(mx1-mx0);
          var dyPx=Math.abs(((tpm.p-mref.startP)/(L0.pmax-L0.pmin))*L0.priceH);
          if(!mref.moving&&Math.hypot(dxPx,dyPx)>=3){
            mref.moving=true;
            /* 2026-04-20: 元位置のstroke描画を抑制するため moveHint を同期 */
            setMoveHint({side:mref.side||'cur', idx:mref.idx});
          }
        }
      }
      if(!rafRef.current){
        rafRef.current=requestAnimationFrame(function(){drawCrosshair();rafRef.current=null;});
      }
      return;
    }
    // eraser ドラッグ中: hitしたら即削除 (silent) — C6: side対応
    if(drawRef.current.on&&drawRef.current.eraser){
      var eHit2=hitTestStroke(e.clientX,e.clientY);
      if(eHit2!=null&&onStrokeDelete){
        onStrokeDelete(eHit2.side, eHit2.idx, true);
        drawRef.current.didDelete=true;
      }
      return;
    }
    // ドラッグ描画中 — C8a: cursor が描画開始と逆side に行ったら境界tmでclamp
    if(drawRef.current.on){
      var tp=pxToTimePrice(e.clientX,e.clientY);
      if(tp&&tp.p!=null){
        /* drawRef.side と tp.side が違う場合、drawRef.side の境界tmにclamp
           ref側描画中にcur側へ → tm=930(15:30)、cur側描画中にref側へ → tm=540(9:00) */
        var dSide=drawRef.current.side||'cur';
        var etm=tp.tm;
        if(tp.side!==dSide){
          etm=(dSide==='ref')?930:540;
        }
        if(drawRef.current.freehand){
          // freehand: 距離閾値超えたら点追加 — C6: u軸対応
          var pts=drawRef.current.pts;
          var last=pts[pts.length-1];
          var L1=layoutRef.current;
          if(L1){
            var fx0=minToXWithSide(last.tm,dSide);
            var fx1=minToXWithSide(etm,dSide);
            var dxp=Math.abs(fx1-fx0);
            var dyp=Math.abs(((tp.p-last.p)/(L1.pmax-L1.pmin))*L1.priceH);
            if(Math.hypot(dxp,dyp)>=1.5)pts.push({tm:etm,p:tp.p});
          }
        } else {
          // 2点ツール
          var ep=tp.p;
          if(props.horiz){
            var snapped=applyHorizSnap(drawRef.current.sTM,drawRef.current.sP,etm,ep);
            etm=snapped.tm; ep=snapped.p;
          }
          drawRef.current.cTM=etm;
          drawRef.current.cP=ep;
        }
      }
      if(!rafRef.current){
        rafRef.current=requestAnimationFrame(function(){
          drawCrosshair();
          rafRef.current=null;
        });
      }
      return;
    }
    // パン (ctrl or pan tool)
    var p=panStartRef.current;
    if(!p){
      // hover 時の十字カーソル更新
      if(!rafRef.current){
        rafRef.current=requestAnimationFrame(function(){
          drawCrosshair();
          rafRef.current=null;
        });
      }
      return;
    }
    if(drawTool!=='pan'&&!ctrlPanRef.current){panStartRef.current=null;return;}
    var rect2=getCanvasRect();
    var padL=40, padR=40;
    var chartW=rect2.width-padL-padR;
    /* C-uaxis: u軸上でpan — 画面1chartW幅のswipeで 1uSpan分のpan */
    var uSpan0=p.uE-p.uS;
    var dU=-(e.clientX-p.x)/chartW*uSpan0;
    var newUS=p.uS+dU, newUE=p.uE+dU;
    var L=layoutRef.current;
    var uTotalNow=(L&&L.uTotal)||getUTotal(hasRef);
    if(newUS<0){newUS=0;newUE=newUS+uSpan0;}
    if(newUE>uTotalNow){newUE=uTotalNow;newUS=newUE-uSpan0;}
    if(newUS<0)newUS=0;
    setView({uS:newUS,uE:newUE});
    if(priceRange){
      var L=layoutRef.current;
      var priceH=L?L.priceH:(rect2.height-34-22-Math.max(44,Math.round((rect2.height-56)*0.13))-6);
      var yenPerPx=(priceRange.max-priceRange.min)/priceH;
      setPShift(p.ps + (e.clientY-p.y)*yenPerPx);
    }
  }
  function onMouseUp(){
    // eraser ドラッグ終了: 1件以上消したら履歴コミット
    if(drawRef.current.on&&drawRef.current.eraser){
      if(drawRef.current.didDelete&&props.onEraserSessionEnd){
        props.onEraserSessionEnd();
      }
      drawRef.current={on:false};
      drawCrosshair();
      return;
    }
    // lasso/text 移動終了 → 確定 (C6: side対応、C8a: text toolの移動/edit切替)
    if(moveRef.current){
      var m=moveRef.current;
      if(m.moving&&onStrokeUpdate){
        var srcArr=(m.side==='ref')?(refStrokes||[]):(strokes||[]);
        var s=srcArr[m.idx];
        if(s){
          var newStroke=Object.assign({},s,{
            anchors:s.anchors.map(function(a){return {tm:a.tm+m.dtm, p:a.p+m.dp};})
          });
          onStrokeUpdate(m.side,m.idx,newStroke);
        }
      } else if(m._isTextTool&&m._editReq&&props.onRequestTextInput){
        /* textツール: 未移動 (moving=false) ならedit portal open */
        props.onRequestTextInput(m._editReq);
      }
      moveRef.current=null;
      /* 2026-04-20: 移動終了したら元位置表示抑制を解除 */
      setMoveHint(null);
      drawCrosshair();
      return;
    }
    // ドラッグ描画終了 → ストローク確定 (C6: side埋め込み)
    if(drawRef.current.on){
      var d=drawRef.current;
      var commitSide=d.side||'cur';
      if(d.freehand){
        // freehand: 2点以上あれば確定
        if(d.pts&&d.pts.length>=2){
          var stroke={id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
            type:'freehand',side:commitSide,anchors:d.pts,
            color:drawColor,width:drawWidth,opacity:drawOpacity};
          if(onStrokeAdd)onStrokeAdd(stroke);
        }
      } else {
        // 微小ドラッグは無視 (誤クリック防止) — C-uaxis: minToXWithSide経由
        var L=layoutRef.current;
        var minDragOK=false;
        if(L){
          var sx=minToXWithSide(d.sTM,commitSide);
          var sy=L.priceTop+(1-(d.sP-L.pmin)/(L.pmax-L.pmin))*L.priceH;
          var cx=minToXWithSide(d.cTM,commitSide);
          var cy=L.priceTop+(1-(d.cP-L.pmin)/(L.pmax-L.pmin))*L.priceH;
          minDragOK=Math.hypot(cx-sx,cy-sy)>=3;
        }
        if(minDragOK){
          var stroke={id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
            type:drawTool,side:commitSide,
            anchors:[{tm:d.sTM,p:d.sP},{tm:d.cTM,p:d.cP}],
            color:drawColor,width:drawWidth,opacity:drawOpacity};
          if(onStrokeAdd)onStrokeAdd(stroke);
        }
      }
      drawRef.current={on:false};
      drawCrosshair();
    }
    panStartRef.current=null;
    ctrlPanRef.current=false;
  }
  // タッチ (iPad/スマホ) - 1本指: 描画、2本指: ピンチズーム＋パン
  function onTouchStart(e){
    if(props.textInputActive)return;
    /* 2026-04-20: パームリジェクション — ペン検知直後の touch は全て無視
       (iPad + 設定ON のみ、ピンチズームも無視される点注意) */
    if(shouldRejectTouch())return;
    if(e.touches.length===2){
      // ピンチ開始
      if(e.preventDefault)e.preventDefault();
      var t1=e.touches[0], t2=e.touches[1];
      var dx=t2.clientX-t1.clientX, dy=t2.clientY-t1.clientY;
      var d0=Math.hypot(dx,dy);
      var cx0=(t1.clientX+t2.clientX)/2, cy0=(t1.clientY+t2.clientY)/2;
      var tpC=pxToTimePrice(cx0,cy0);
      /* C8a: gap帯も pinch 中心OK (xToSideTmが境界にclamp済) */
      if(!tpC||tpC.u==null)return;
      pinchRef.current={
        d0:d0, cx0:cx0, cy0:cy0,
        uS0:view.uS, uE0:view.uE, ps0:pShift,
        uSpan0:view.uE-view.uS,
        uCenter:tpC.u,           // ピンチ開始時の指位置のu値 (ズーム中この u が cxRatio位置に固定)
        pCenter:tpC.p,           // ピンチ中心の価格
        side:tpC.side             // 参考 (cur/ref)
      };
      // 既存の描画/パン/移動をキャンセル
      drawRef.current={on:false};
      panStartRef.current=null;
      moveRef.current=null;
      return;
    }
    if(e.touches.length!==1)return;
    var t=e.touches[0];
    onMouseDown({clientX:t.clientX,clientY:t.clientY,ctrlKey:false,metaKey:false});
  }
  function onTouchMove(e){
    if(props.textInputActive)return;
    /* 2026-04-20: パームリジェクション — ペン検知直後の touch は全て無視 */
    if(shouldRejectTouch())return;
    // ピンチ中
    if(pinchRef.current&&e.touches.length>=2){
      if(e.preventDefault)e.preventDefault();
      var t1=e.touches[0], t2=e.touches[1];
      var dxp=t2.clientX-t1.clientX, dyp=t2.clientY-t1.clientY;
      var d=Math.hypot(dxp,dyp);
      var cx=(t1.clientX+t2.clientX)/2, cy=(t1.clientY+t2.clientY)/2;
      var pr=pinchRef.current;
      if(!d||!pr.d0)return;
      var r=d/pr.d0;
      if(r<0.1)r=0.1; if(r>20)r=20;
      var L=layoutRef.current;
      if(!L||!containerRef.current){return;}
      /* C-uaxis: u軸ズーム — uCenter を cxRatio 位置に固定 */
      var uTotalNow=L.uTotal||getUTotal(hasRef);
      var newUSpan=pr.uSpan0/r;
      if(newUSpan<2)newUSpan=2;
      if(newUSpan>uTotalNow)newUSpan=uTotalNow;
      var rect=getCanvasRect();
      var cxLocal=pr.cx0-rect.left;
      var cxRatio=(cxLocal-L.padL)/L.chartW;
      if(cxRatio<0)cxRatio=0; if(cxRatio>1)cxRatio=1;
      var newUS=pr.uCenter-cxRatio*newUSpan;
      var newUE=newUS+newUSpan;
      if(newUS<0){newUS=0;newUE=newUS+newUSpan;}
      if(newUE>uTotalNow){newUE=uTotalNow;newUS=newUE-newUSpan;}
      if(newUS<0)newUS=0;
      setView({uS:newUS,uE:newUE});
      // 価格軸縦シフト: 中心のy移動量で pShift 変化
      var priceH=L.priceH;
      var yenPerPx=(L.pmax-L.pmin)/priceH;
      setPShift(pr.ps0 + (cy-pr.cy0)*yenPerPx);
      return;
    }
    if(!e.touches.length)return;
    var t=e.touches[0];
    onMouseMove({clientX:t.clientX,clientY:t.clientY});
  }
  function onTouchEnd(e){
    if(pinchRef.current){
      if(!e.touches||e.touches.length<2){pinchRef.current=null;panStartRef.current=null;}
      return;
    }
    onMouseUp();
  }
  // ペンのホバー (Apple Pencil / S Pen 等) - 触れず浮かせている時に十字カーソル追従
  function onPointerMoveHover(e){
    /* 2026-04-20: パームリジェクション用 — pen pointer 検出時タイムスタンプ更新
       (hover / press 中問わず) */
    if(e.pointerType==='pen'){lastPenAtRef.current=Date.now();}
    if(props.textInputActive)return;
    if(e.pointerType!=='pen'||e.buttons!==0)return;
    if(!containerRef.current)return;
    var rect=getCanvasRect();
    cursorRef.current={x:e.clientX-rect.left,y:e.clientY-rect.top};
    notifyExternalCursorFromLocal();
    if(!rafRef.current){
      rafRef.current=requestAnimationFrame(function(){drawCrosshair();rafRef.current=null;});
    }
  }
  /* 2026-04-20: onPointerDown — pen 押下時も lastPenAtRef 更新
     (ホバーせず直接タッチしたケース対策) */
  function onPointerDownPalm(e){
    if(e.pointerType==='pen'){lastPenAtRef.current=Date.now();}
  }
  /* 2026-04-20: パームリジェクション判定ヘルパー — 設定ON + iPad + 直近 CA_PALM_REJECT_MS 内にペン検知あり */
  function shouldRejectTouch(){
    if(!caLoadPalmReject())return false;
    if(!caIsIPad())return false;
    var dt=Date.now()-lastPenAtRef.current;
    return dt>=0&&dt<CA_PALM_REJECT_MS;
  }
  // ダブルクリック: (機能削除、ユーザー要望)

  /* ツール切替時 / データ切替時: 選択状態をリセット */
  useEffect(function(){setSelectedIdx(null);},[drawTool,data,tf]);

  /* Delete/Escapeキー: 選択削除・解除 (C6: side対応) */
  useEffect(function(){
    function onKey(e){
      if(e.key==='Escape'){setSelectedIdx(null);return;}
      if((e.key==='Delete'||e.key==='Backspace')&&selectedIdx!=null){
        // input/textarea にフォーカス中は無視
        var ae=document.activeElement;
        if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable))return;
        if(onStrokeDelete)onStrokeDelete(selectedIdx.side,selectedIdx.idx);
        setSelectedIdx(null);
      }
    }
    window.addEventListener('keydown',onKey);
    return function(){window.removeEventListener('keydown',onKey);};
  },[selectedIdx,onStrokeDelete]);

  if(!data||!bars.length){
    return ce("div",{ref:containerRef,style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"#555"}},
      ce("div",null,"データなし"));
  }

  /* 2026-04-20: 分離モード判定 — pricePx>0 時は price/vol 2canvas 分離構造 */
  var isSplit=pricePx>0;
  /* volFixedArea の高さは volFixedH state (描画後に volDrawH で同期更新) */
  return ce("div",{
    ref:containerRef,
    onMouseDown:onMouseDown,
    onMouseMove:onMouseMove,
    onMouseUp:onMouseUp,
    onMouseLeave:function(){onMouseUp();onChartMouseLeave();},
    onTouchStart:onTouchStart,
    onTouchMove:onTouchMove,
    onTouchEnd:onTouchEnd,
    onTouchCancel:onTouchEnd,
    onPointerMove:onPointerMoveHover,
    /* 2026-04-20: パームリジェクション用 — pen 押下検出タイムスタンプ更新 */
    onPointerDown:onPointerDownPalm,
    onPointerLeave:function(e){
      // ペンのホバーがチャート外に出たら十字カーソル消す
      if(e.pointerType==='pen'){
        cursorRef.current=null;
        if(props.onExternalCursorChange)props.onExternalCursorChange(null);
        drawCrosshair();
      }
    },
    style:isSplit
      ? {flex:1,position:"relative",background:chartBg,minHeight:0,
         overflow:"hidden",cursor:drawTool==='pan'?"grab":"default",
         touchAction:"none",userSelect:"none"}
      : {flex:1,position:"relative",background:chartBg,overflow:"hidden",overflowX:"hidden",
         cursor:drawTool==='pan'?"grab":"default",touchAction:"none",userSelect:"none"}
  },
    isSplit
      /* === 分離モード (absolute positioning で確実に画面下端固定) === */
      ? [
          /* 実描画先 (display:none、drawDataChart はここに描画) */
          ce("canvas",{key:"hidden",ref:hiddenCanvasRef,style:{display:"none"}}),
          /* priceScrollArea: top:0 〜 bottom:volFixedH、縦スクロール可 */
          ce("div",{key:"pscroll",ref:priceScrollRef,
            style:{position:"absolute",top:0,left:0,right:0,bottom:volFixedH,
              overflowY:"auto",overflowX:"hidden",
              touchAction:drawTool==='pan'?"pan-y":"none"}},
            ce("canvas",{ref:priceCanvasRef,
              style:{display:"block",width:"100%",pointerEvents:"none"}}),
            ce("canvas",{ref:priceOverlayRef,
              style:{position:"absolute",top:0,left:0,width:"100%",pointerEvents:"none"}})
          ),
          /* volFixedArea: 画面下端固定 (bottom:0、volFixedH state で動的調整) */
          ce("div",{key:"volfix",
            style:{position:"absolute",bottom:0,left:0,right:0,height:volFixedH,
              overflow:"hidden",background:chartBg,borderTop:"1px solid #1a1a1a"}},
            ce("canvas",{ref:volCanvasRef,
              style:{display:"block",width:"100%",pointerEvents:"none"}}),
            ce("canvas",{ref:volOverlayRef,
              style:{position:"absolute",top:0,left:0,width:"100%",pointerEvents:"none"}}),
            ce("div",{style:{position:"absolute",right:8,bottom:6,fontSize:10,color:"#555",pointerEvents:"none"}},
              ((getUTotal(hasRef)/((view.uE||0)-(view.uS||0)||1))).toFixed(1)+'×')
          )
        ]
      /* === 従来モード === */
      : [
          ce("canvas",{key:"main",ref:canvasRef,
            style:{display:"block",width:"100%",height:"100%",pointerEvents:"none"}}),
          ce("canvas",{key:"ov",ref:overlayRef,
            style:{position:"absolute",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none"}}),
          ce("div",{key:"zoom",style:{position:"absolute",right:8,bottom:6,fontSize:10,color:"#555",pointerEvents:"none"}},
            ((getUTotal(hasRef)/((view.uE||0)-(view.uS||0)||1))).toFixed(1)+'×')
        ]
  );
}

/* EMA 前日連続化ヘルパー (B完全版)
   refData がある場合、当日 bars の ema9/22/50/200 を refBars 最終EMA値から連続計算して上書き。
   VWAP は Python 側値そのまま (Hyper SBI 2 と同じ当日リセット挙動)。
   非破壊: bars/refBars は変更せず新配列を返す。 */
function computeEnhancedBars(bars, refBars){
  if(!bars||!bars.length) return bars||[];
  if(!refBars||!refBars.length) return bars;
  var emaKeys=['ema9','ema22','ema50','ema200'];
  // refBars 末尾走査: 各EMAキーの最後の有効値を個別に取得
  var lastEma={ema9:null, ema22:null, ema50:null, ema200:null};
  for(var i=refBars.length-1; i>=0; i--){
    var rb=refBars[i];
    for(var j=0;j<emaKeys.length;j++){
      var k=emaKeys[j];
      if(lastEma[k]==null && rb[k]!=null) lastEma[k]=rb[k];
    }
    if(lastEma.ema9!=null&&lastEma.ema22!=null&&lastEma.ema50!=null&&lastEma.ema200!=null) break;
  }
  // 全て null なら連続化不可、原本返却
  if(lastEma.ema9==null&&lastEma.ema22==null&&lastEma.ema50==null&&lastEma.ema200==null) return bars;
  // α値: 2/(N+1)
  var alphas={ema9: 2/10, ema22: 2/23, ema50: 2/51, ema200: 2/201};
  var prev={ema9:lastEma.ema9, ema22:lastEma.ema22, ema50:lastEma.ema50, ema200:lastEma.ema200};
  return bars.map(function(b){
    var nb=Object.assign({}, b);
    for(var j=0;j<emaKeys.length;j++){
      var k=emaKeys[j];
      if(prev[k]!=null && b.c!=null){
        nb[k]=alphas[k]*b.c + (1-alphas[k])*prev[k];
        prev[k]=nb[k];
      }
      // prev[k]==null の場合 (前日データ欠落): 既存 b[k] をそのまま維持
    }
    return nb;
  });
}

/* DataChart 描画関数 (Canvas 2D 直接描画、HSBI2色、ズーム対応、10円固定グリッド、時刻+価格ストローク)
   C-uaxis: view は u軸単位 {uS, uE} で管理 — 連続した1本の時間軸上を pan/zoom */
function drawDataChart(canvas,bars,data,dim,tf,view,pShift,priceRange,layoutRef,strokes,selectedIdx,editingTextIdx,refBars,refData,gapVis,refStrokes,hideHint){
  // B完全版: EMA 前日連続化 (refData ありなら bars の EMA を上書き)
  bars=computeEnhancedBars(bars, refBars);
  var dpr=window.devicePixelRatio||1;
  var W=dim.w, H=dim.h;

  // レイアウト
  var padL=40, padR=40, padT=10, padB=22;
  /* 2026-04-20: pricePx 設定時は priceH を固定 (priceRange幅 / 10 * pricePx)、
     必要に応じて canvas を縦拡張 (外側コンテナで overflow-y:auto 受け)
     2026-04-20: priceH に上限 3000px を設定 (極端な価格幅で canvas 縦が巨大化するバグ抑止)
     2026-04-20: pricePx は「最低保証 px/10円」に解釈変更 — 画面に余裕あれば autoPriceH (画面フィット) を使い下部空白を解消、
                 画面を超える場合のみ minPriceH (pricePx固定) で縦スクロール */
  var PRICE_H_MAX=3000;
  var pricePx=(dim&&typeof dim.pricePx==='number'&&dim.pricePx>0)?dim.pricePx:0;
  var volH, priceH;
  if(pricePx>0 && priceRange){
    /* 最低保証モード: minPriceH (pricePx要求) と autoPriceH (画面フィット) の大きい方を採用 */
    var minPriceH=Math.max(44, Math.min(PRICE_H_MAX, Math.ceil((priceRange.max-priceRange.min)/10*pricePx)));
    volH=Math.max(44,Math.round((H-padT-padB)*0.13));
    var autoPriceH=H-padT-padB-volH-6;
    priceH=Math.max(minPriceH, autoPriceH);
    var requiredH=padT+priceH+6+volH+padB;
    if(requiredH>H)H=requiredH;  /* minPriceH が画面超え時のみ拡張→縦スクロール */
  } else {
    /* 従来通り: dim.h 基準で按分 */
    volH=Math.max(44,Math.round((H-padT-padB)*0.13));
    priceH=H-padT-padB-volH-6;
  }
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  /* 固定モード: canvas の CSS 高さも実H に合わせる (scroll用) */
  if(pricePx>0){
    try{canvas.style.height=H+'px';}catch(e){}
  } else {
    try{canvas.style.height='';}catch(e){}  /* リセット */
  }
  var ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);

  // 背景 (HSBI2 と同じ漆黒 / 2026-04-20: ca_chart_bg_v1 設定で変更可能)
  ctx.fillStyle=caLoadChartBg();
  ctx.fillRect(0,0,W,H);

  var chartW=W-padL-padR;
  var priceTop=padT, priceBot=padT+priceH;
  var volTop=priceBot+6, volBot=volTop+volH;

  // 統合chart判定
  var hasRef=!!(refBars&&refBars.length);
  /* C8a: gapVis は tf依存 (1m=1, 5m=5) で呼び出し側から受け取る */
  gapVis=gapVis||5;
  var lunchVis=gapVis;  // 昼休み圧縮もローソク1本分

  // C8a: 昼休み(11:30=690〜12:30=750)の60分を lunchVis分に圧縮した仮想時間軸 tmVis
  function tmToVis(t){
    if(t<=690)return t;
    if(t<=750)return 690+(t-690)*(lunchVis/60);
    return t-(60-lunchVis);
  }
  function visToTm(v){
    if(v<=690)return v;
    if(v<=690+lunchVis)return 690+(v-690)*(60/lunchVis);
    return v+(60-lunchVis);
  }
  /* C-uaxis: u軸 — ref [0, tmVisSpan] + gap [tmVisSpan, tmVisSpan+gapVis] + cur [tmVisSpan+gapVis, uTotal]
     hasRef無時は [0, tmVisSpan] (cur のみ)
     C8a: tmVisSpan = 390分 - (60 - lunchVis) */
  var tmVisStart=540;         // 09:00 の tmVis値
  var tmVisSpan=390-(60-lunchVis);  // 5m=335, 1m=331
  var uTotal=hasRef?(tmVisSpan*2+gapVis):tmVisSpan;

  // view は u軸単位 {uS, uE}。fallback: 未設定なら全体表示
  var uS=(view&&view.uS!=null)?view.uS:0;
  var uE=(view&&view.uE!=null)?view.uE:uTotal;
  // クランプ
  if(uS<0)uS=0; if(uE>uTotal)uE=uTotal; if(uE<=uS)uE=uS+1;
  var uSpan=uE-uS;

  function tToMin(t){var p=t.split(':');return parseInt(p[0],10)*60+parseInt(p[1],10);}
  // tm+side → u
  function tmSideToU(m, side){
    var tv=tmToVis(m)-tmVisStart;
    if(!hasRef) return tv;
    if(side==='ref') return tv;
    return tv+tmVisSpan+gapVis;
  }
  // u → x (view範囲でスケール)
  function uToX(u){return padL+(u-uS)/uSpan*chartW;}
  // tm+side → x (既存呼び出し互換: minToX(m,side))
  function minToX(m, side){return uToX(tmSideToU(m, side||'cur'));}
  function tToX(t, side){return minToX(tToMin(t), side);}

  // 表示範囲内のバー判定 (bar の u値が [uS, uE] に含まれるか)
  function barInView(b, side){
    var u=tmSideToU(tToMin(b.t), side);
    return u>=uS-0.5 && u<=uE+0.5;  // 端1bar分は残す
  }
  var visibleBars=bars.filter(function(b){return barInView(b,'cur');});
  var visibleRefBars=hasRef?refBars.filter(function(b){return barInView(b,'ref');}):[];

  // 価格軸: 固定の priceRange + 縦シフト (タイム軸操作では変化しない)
  var pmin=priceRange.min + pShift;
  var pmax=priceRange.max + pShift;
  function pToY(p){return priceTop+(1-(p-pmin)/(pmax-pmin))*priceH;}

  // 出来高レンジ (表示範囲内) — hasRef時は refBars も含めて両chartで揃える
  var vmax=0;
  visibleBars.forEach(function(b){if(b.v>vmax)vmax=b.v;});
  visibleRefBars.forEach(function(b){if(b.v>vmax)vmax=b.v;});
  if(vmax<=0) vmax=1;
  function vToY(v){return volBot-(v/vmax)*volH;}

  /* レイアウト情報を ref に書き出し (十字カーソル計算用) — C-uaxis: u軸情報も */
  if(layoutRef)layoutRef.current={padL:padL,padR:padR,padT:padT,padB:padB,
    chartW:chartW,priceTop:priceTop,priceBot:priceBot,volTop:volTop,volBot:volBot,
    priceH:priceH,pmin:pmin,pmax:pmax,
    uS:uS,uE:uE,uSpan:uSpan,uTotal:uTotal,
    tmVisStart:tmVisStart,tmVisSpan:tmVisSpan,gapVis:gapVis,
    hasRef:hasRef};

  // 10円固定グリッド + 全10円ラベル (HSBI2準拠、実線の薄い横線)
  ctx.font='10px -apple-system,Helvetica,sans-serif';
  ctx.textBaseline='middle'; ctx.textAlign='right';
  var pStep=10;
  var pStart=Math.ceil(pmin/pStep)*pStep;
  var pEnd=Math.floor(pmax/pStep)*pStep;
  var pxPerStep=(priceH/(pmax-pmin))*pStep;
  /* 2026-04-20: 必ず10円刻みでラベル表示 (ユーザー要望、pxPerStep依存の間引き廃止)
     スマホ等で密度が高すぎて文字が重なる可能性あり、その場合はズーム操作で回避 */
  var labelEvery=1;
  for(var p=pStart;p<=pEnd;p+=pStep){
    var y=pToY(p);
    /* 2026-04-20: ラウンドナンバーは段階的に太線化
       1000円刻み: 最太 (1.5px, #3c3c3c)
       100円刻み: 中太 (1.2px, #323232)
       50円刻み:  やや太 (1.1px, #2c2c2c)
       10円刻み:  従来 (1px,   #262626) */
    if(p%1000===0){ ctx.strokeStyle='#3c3c3c'; ctx.lineWidth=1.5; }
    else if(p%100===0){ ctx.strokeStyle='#323232'; ctx.lineWidth=1.2; }
    else if(p%50===0){ ctx.strokeStyle='#2c2c2c'; ctx.lineWidth=1.1; }
    else { ctx.strokeStyle='#262626'; ctx.lineWidth=1; }
    ctx.beginPath(); ctx.moveTo(padL,Math.round(y)+0.5); ctx.lineTo(padL+chartW,Math.round(y)+0.5); ctx.stroke();
    if((p/pStep)%labelEvery===0){
      ctx.fillStyle='#888';
      // 右側ラベル (textAlign='right' 前提、末端より4px内側)
      ctx.fillText(p.toFixed(0),padL+chartW+padR-4,y);
      // 左側ラベル (左padLの右端より4px内側、textAlign='right' 継承)
      ctx.fillText(p.toFixed(0),padL-4,y);
    }
  }

  // 時間グリッド: uSpan 密度でステップ可変 — 両side描画
  ctx.textBaseline='top'; ctx.textAlign='center';
  // uSpan基準のしきい値 (hasRef時は表示範囲が広いので粗く)
  var stepMin = uSpan>=300?60 : uSpan>=120?30 : uSpan>=60?15 : uSpan>=30?10 : 5;
  var gridSides = hasRef?['ref','cur']:['cur'];
  gridSides.forEach(function(sd){
    for(var m=540; m<=930; m+=stepMin){
      var u=tmSideToU(m,sd);
      if(u<uS-0.1||u>uE+0.1)continue;
      var x=uToX(u);
      if(x<padL-1||x>padL+chartW+1)continue;
      var hh=Math.floor(m/60), mm=m%60;
      var tStr=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
      ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.moveTo(x,priceTop); ctx.lineTo(x,volBot); ctx.stroke();
      ctx.fillStyle='#666'; ctx.fillText(tStr,x,volBot+4);
    }
    // 昼休み境界
    [690,750].forEach(function(m){
      var u=tmSideToU(m,sd);
      if(u<uS||u>uE)return;
      var x=uToX(u);
      ctx.strokeStyle='#2a2a2a'; ctx.setLineDash([2,3]); ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.moveTo(x,priceTop); ctx.lineTo(x,volBot); ctx.stroke();
      ctx.setLineDash([]);
    });
  });

  // gap領域の薄い縦帯 (2chart境界の視覚的区切り)
  if(hasRef){
    var gU1=tmVisSpan, gU2=tmVisSpan+gapVis;
    if(!(gU2<uS||gU1>uE)){
      var gx1=uToX(Math.max(gU1,uS));
      var gx2=uToX(Math.min(gU2,uE));
      if(gx2>gx1){
        ctx.fillStyle='rgba(255,255,255,0.03)';
        ctx.fillRect(gx1,priceTop,gx2-gx1,volBot-priceTop);
      }
    }
  }

  // HSBI2 配色
  var COL_UP='#ff0054';       // 陽線 (ピンク/ローズ)
  var COL_DN='#11ded9';       // 陰線 (シアン)

  // bar描画ヘルパー (ローソク+ヒゲ+出来高を1本分)
  // barW: u軸上の1tmVis単位のpx幅
  var barW=Math.max(1,(chartW/uSpan)*(tf==='5m'?5:1)*0.8);
  function drawBarSet(barsArr,side){
    barsArr.forEach(function(b){
      var cx=minToX(tToMin(b.t),side);
      var up=b.c>=b.o;
      var col=up?COL_UP:COL_DN;
      ctx.strokeStyle=col; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(Math.round(cx)+0.5,pToY(b.h)); ctx.lineTo(Math.round(cx)+0.5,pToY(b.l)); ctx.stroke();
      ctx.fillStyle=col;
      var y1=pToY(b.o), y2=pToY(b.c);
      var yTop=Math.min(y1,y2), bh=Math.max(1,Math.abs(y1-y2));
      ctx.fillRect(cx-barW/2,yTop,barW,bh);
      var vy=vToY(b.v);
      ctx.fillRect(cx-barW/2,vy,barW,volBot-vy);
    });
  }
  drawBarSet(visibleBars,'cur');
  if(hasRef)drawBarSet(visibleRefBars,'ref');

  // EMA + VWAP ライン
  var lines=[
    {k:'ema9',   col:'#ffffff', label:'EMA9'},
    {k:'ema22',  col:'#ffa9ff', label:'EMA22'},
    {k:'ema50',  col:'#ff00ff', label:'EMA50'},
    {k:'ema200', col:'#55017d', label:'EMA200'},
    {k:'vwap',   col:'#ffff00', label:'VWAP'}
  ];
  function drawLine(barsArr,side,lk,col){
    ctx.strokeStyle=col; ctx.lineWidth=1.2;
    ctx.beginPath();
    var first=true;
    barsArr.forEach(function(b){
      var v=b[lk]; if(v==null)return;
      var x=minToX(tToMin(b.t),side), y=pToY(v);
      if(first){ctx.moveTo(x,y); first=false;} else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
  lines.forEach(function(line){
    drawLine(visibleBars,'cur',line.k,line.col);
    if(hasRef)drawLine(visibleRefBars,'ref',line.k,line.col);
  });

  /* B-drawing: 時刻+価格座標ストローク描画 (ズーム・パンに追従)
     C3+: cur(現在chart側) と ref(過去chart側) を分けて描画。minToXをside別に渡す。 */
  function minToXCur(m){return minToX(m,'cur');}
  function minToXRef(m){return minToX(m,'ref');}
  if(strokes&&strokes.length){
    strokes.forEach(function(s,idx){
      // 編集中のテキストは重複描画を避けるためスキップ (C6: side一致も見る)
      if(editingTextIdx&&editingTextIdx.side==='cur'&&editingTextIdx.idx===idx)return;
      /* 2026-04-20: 移動中stroke は元位置に描画しない (drawCrosshair側でshifted位置に描画) */
      if(hideHint&&hideHint.side==='cur'&&hideHint.idx===idx)return;
      var tp=s.type||s.tool;
      if(tp==='freehand'||tp==='text'){
        drawAnalysisStrokeExt(ctx,s,minToXCur,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      } else {
        drawAnalysisStroke(ctx,s,minToXCur,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      }
      /* C6: selectedIdx を {side,idx} 比較 */
      if(selectedIdx&&selectedIdx.side==='cur'&&selectedIdx.idx===idx){
        drawSelectionHighlight(ctx,s,minToXCur,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      }
    });
  }
  // C6: ref側stroke描画 + selection対応
  if(hasRef&&refStrokes&&refStrokes.length){
    refStrokes.forEach(function(s,idx){
      // 編集中のテキストはスキップ
      if(editingTextIdx&&editingTextIdx.side==='ref'&&editingTextIdx.idx===idx)return;
      /* 2026-04-20: 移動中stroke スキップ (ref側) */
      if(hideHint&&hideHint.side==='ref'&&hideHint.idx===idx)return;
      var tp=s.type||s.tool;
      if(tp==='freehand'||tp==='text'){
        drawAnalysisStrokeExt(ctx,s,minToXRef,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      } else {
        drawAnalysisStroke(ctx,s,minToXRef,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      }
      if(selectedIdx&&selectedIdx.side==='ref'&&selectedIdx.idx===idx){
        drawSelectionHighlight(ctx,s,minToXRef,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      }
    });
  }

  // ヘッダー描画は廃止（ticker+date は panel 上部の HTML メタ行に表示済み）
  // 直近終値の水平ライン+ラベル: 2026-04-20 削除
}

/* B-drawing: 時刻+価格座標ストロークの描画 (画像画面と同等のツール群)
   type: 'line'|'dotted'|'arrow'|'rect'|'circle'|'marker'|'horizontal'
   anchors: [{tm, p}, {tm, p}]  (horizontal は 1点のみ、p のみ使用) */
function drawAnalysisStroke(ctx,s,minToX,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH){
  if(!s||!s.anchors||!s.anchors.length)return;
  var col=s.color||'#ff3b30';
  var w=s.width||2;
  var op=s.opacity!=null?s.opacity:1;
  ctx.globalAlpha=op;
  ctx.strokeStyle=col;
  ctx.fillStyle=col;
  ctx.lineWidth=w;
  ctx.setLineDash([]);

  if(s.type==='horizontal'){
    // 水平: 価格のみ使用、全幅
    var y=pToY(s.anchors[0].p);
    if(y>=priceTop-2&&y<=priceBot+2){
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+chartW,y); ctx.stroke();
      // 右端に価格ラベル
      var lbl=s.anchors[0].p.toFixed(0);
      ctx.font='bold 10px -apple-system,Helvetica,sans-serif';
      ctx.textBaseline='middle'; ctx.textAlign='left';
      var lw=ctx.measureText(lbl).width+8;
      ctx.globalAlpha=1;
      ctx.fillRect(padL+chartW+2,y-7,lw,14);
      ctx.fillStyle='#000';
      ctx.fillText(lbl,padL+chartW+6,y);
      ctx.fillStyle=col;
      ctx.globalAlpha=op;
    }
    ctx.globalAlpha=1; return;
  }

  // 2点ツール: line/dotted/arrow/rect/circle/marker
  if(s.anchors.length<2){ctx.globalAlpha=1;return;}
  var a1=s.anchors[0], a2=s.anchors[1];
  var x1=minToX(a1.tm), y1=pToY(a1.p);
  var x2=minToX(a2.tm), y2=pToY(a2.p);

  if(s.type==='line'){
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  } else if(s.type==='dotted'){
    ctx.setLineDash([Math.max(3,w*2), Math.max(3,w*2)]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]);
  } else if(s.type==='arrow'){
    // 線 + 矢尻
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    var ang=Math.atan2(y2-y1,x2-x1);
    var hs=Math.max(8,w*3); // 矢尻サイズ
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-hs*Math.cos(ang-Math.PI/6), y2-hs*Math.sin(ang-Math.PI/6));
    ctx.lineTo(x2-hs*Math.cos(ang+Math.PI/6), y2-hs*Math.sin(ang+Math.PI/6));
    ctx.closePath(); ctx.fill();
  } else if(s.type==='rect'){
    var rx=Math.min(x1,x2), ry=Math.min(y1,y2);
    var rw2=Math.abs(x2-x1), rh2=Math.abs(y2-y1);
    ctx.strokeRect(rx,ry,rw2,rh2);
  } else if(s.type==='circle'){
    var cx=(x1+x2)/2, cy=(y1+y2)/2;
    var rx2=Math.abs(x2-x1)/2, ry2=Math.abs(y2-y1)/2;
    ctx.beginPath();
    ctx.ellipse(cx,cy,rx2,ry2,0,0,Math.PI*2);
    ctx.stroke();
  } else if(s.type==='marker'){
    // 半透明の太線 (画像画面仕様)
    var markerW=Math.max(14,w*5);
    ctx.globalAlpha=op*0.4;
    ctx.lineWidth=markerW;
    ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.lineCap='butt';
  }
  ctx.globalAlpha=1;
}

/* freehand / text / 選択ハイライト 用の拡張描画 */
function drawAnalysisStrokeExt(ctx,s,minToX,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH){
  if(!s||!s.anchors||!s.anchors.length)return;
  var col=s.color||'#ff3b30';
  var w=s.width||2;
  var op=s.opacity!=null?s.opacity:1;
  var tp=s.type||s.tool;
  ctx.globalAlpha=op;
  ctx.strokeStyle=col;
  ctx.fillStyle=col;
  ctx.lineWidth=w;
  ctx.setLineDash([]);

  if(tp==='freehand'){
    if(s.anchors.length<2){ctx.globalAlpha=1;return;}
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    var a0=s.anchors[0];
    ctx.moveTo(minToX(a0.tm), pToY(a0.p));
    for(var i=1;i<s.anchors.length;i++){
      var a=s.anchors[i];
      ctx.lineTo(minToX(a.tm), pToY(a.p));
    }
    ctx.stroke();
    ctx.lineCap='butt'; ctx.lineJoin='miter';
  } else if(tp==='text'){
    var a=s.anchors[0];
    var x=minToX(a.tm), y=pToY(a.p);
    var fs=s.fontSize||15;
    var fb=s.fontBold?'bold ':'';
    ctx.font=fb+fs+"px -apple-system,'Helvetica Neue',sans-serif";
    ctx.textBaseline='top'; ctx.textAlign='left';
    /* 2026-04-20: boxW指定時は wordBreak wrap (幅を超える行を折返し)
       テキストエディット時のtextarea wrap表示と一致させるため */
    var rawLines=(s.text||'').split('\n');
    var displayLines=[];
    if(s.boxW&&s.boxW>0){
      rawLines.forEach(function(para){
        var cur='';
        for(var ci=0;ci<para.length;ci++){
          var test=cur+para[ci];
          if(ctx.measureText(test).width>s.boxW&&cur.length>0){
            displayLines.push(cur);
            cur=para[ci];
          }else{
            cur=test;
          }
        }
        displayLines.push(cur);
      });
    }else{
      displayLines=rawLines;
    }
    // 背景半透明ボックス (視認性向上) — 折返し後のmaxWで算出
    var maxW=0;
    displayLines.forEach(function(l){var m=ctx.measureText(l).width; if(m>maxW)maxW=m;});
    if(s.boxW&&s.boxW>maxW)maxW=s.boxW;
    var boxH=displayLines.length*fs*1.3;
    ctx.globalAlpha=op*0.6; ctx.fillStyle='#000';
    ctx.fillRect(x-3,y-2,maxW+6,boxH+4);
    ctx.globalAlpha=op; ctx.fillStyle=col;
    displayLines.forEach(function(l,i){ctx.fillText(l,x,y+i*fs*1.3);});
  }
  ctx.globalAlpha=1;
}

/* 選択ハイライト (縁取り) */
function drawSelectionHighlight(ctx,s,minToX,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH){
  if(!s||!s.anchors||!s.anchors.length)return;
  var tp=s.type||s.tool;
  ctx.save();
  ctx.strokeStyle='#4a9de3';
  ctx.lineWidth=2;
  ctx.setLineDash([4,3]);
  if(tp==='horizontal'){
    var y=pToY(s.anchors[0].p);
    ctx.strokeRect(padL-2,y-4,chartW+4,8);
  } else if(tp==='text'){
    /* C9後-fix: measureText で厳密bounding box (文字分だけ囲う)
       2026-04-20: boxW wrap時は行数を折返し後で計算 */
    var a=s.anchors[0];
    var x=minToX(a.tm), y=pToY(a.p);
    var fs=s.fontSize||15;
    var fb=s.fontBold?'bold ':'';
    var rawLines=(s.text||'').split('\n');
    ctx.save();
    ctx.font=fb+fs+"px -apple-system,'Helvetica Neue',sans-serif";
    var displayLines=[];
    if(s.boxW&&s.boxW>0){
      rawLines.forEach(function(para){
        var cur='';
        for(var ci=0;ci<para.length;ci++){
          var test=cur+para[ci];
          if(ctx.measureText(test).width>s.boxW&&cur.length>0){displayLines.push(cur);cur=para[ci];}
          else{cur=test;}
        }
        displayLines.push(cur);
      });
    }else{
      displayLines=rawLines;
    }
    var mW=0;
    displayLines.forEach(function(l){
      var w=ctx.measureText(l).width;
      if(w>mW)mW=w;
    });
    ctx.restore();
    if(s.boxW&&s.boxW>mW)mW=s.boxW;
    var tH=displayLines.length*fs*1.3;
    var PAD=4;
    ctx.strokeRect(x-PAD, y-PAD, mW+PAD*2, tH+PAD*2);
  } else if(s.anchors.length>=2){
    // bounding box
    var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    s.anchors.forEach(function(a){
      var xx=minToX(a.tm), yy=pToY(a.p);
      if(xx<minX)minX=xx; if(xx>maxX)maxX=xx;
      if(yy<minY)minY=yy; if(yy>maxY)maxY=yy;
    });
    var pad=(tp==='marker'?(s.width||2)*3:4);
    ctx.strokeRect(minX-pad,minY-pad,(maxX-minX)+pad*2,(maxY-minY)+pad*2);
  }
  ctx.setLineDash([]);
  ctx.restore();
}

/* ─── 分析モードストローク管理ヘルパー ───
   旧形式（配列）↔新形式（{'1m':[],'5m':[]}）互換 */
/* C6: 第2引数 defaultSide で未設定strokeに side('cur'|'ref') を付与 */
function migrateAnalysisStrokes(v, defaultSide){
  var ds=(defaultSide==='ref')?'ref':'cur';
  function addSide(arr){
    return (arr||[]).map(function(s){
      if(!s)return s;
      if(s.side==='cur'||s.side==='ref')return s;
      return Object.assign({},s,{side:ds});
    });
  }
  if(Array.isArray(v))return {'1m':addSide(v),'5m':[]};
  if(v&&typeof v==='object'){
    return {'1m':addSide(v['1m']),'5m':addSide(v['5m'])};
  }
  return {'1m':[],'5m':[]};
}
function cloneAnalysisStrokes(v){
  return {'1m':(v&&v['1m']||[]).slice(),'5m':(v&&v['5m']||[]).slice()};
}
function totalAnalysisStrokes(v){
  if(!v)return 0;
  return ((v['1m']||[]).length)+((v['5m']||[]).length);
}

function ImageAnnotator(props){

  var stMT=useState('analysis');
