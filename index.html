  /* 計測の追加/削除/移動確定をアンドゥ履歴に登録する */
  function measureCommit(newMeasures){
    measuresRef.current=newMeasures;
    var tk=analysisTfRef.current||'1m';
    var curTfArr=((analysisStrokesRef.current&&analysisStrokesRef.current[tk])||[]).slice();
    var ra=refAnalysisRef.current;
    var refTfArr=(ra&&ra.analysisStrokes&&(ra.analysisStrokes[tk]||[]).slice())||[];
    var hist=analysisHistRef.current[tk]||[];
    analysisHistRef.current[tk]=hist.slice(-19).concat([{cur:curTfArr,ref:refTfArr,measures:newMeasures.slice()}]);
    analysisFutRef.current[tk]=[];
    setCanUndo(analysisHistRef.current[tk].length>1);
    setCanRedo(false);
  }
  function undo(){
    var tk=analysisTfRef.current||'1m';
    var hist=analysisHistRef.current[tk]||[];
    if(hist.length<=1)return;
    var prev=hist[hist.length-2];
    var curObj=analysisStrokesRef.current||{'1m':[],'5m':[]};
    var curTfArrNow=((curObj[tk])||[]).slice();
    var ra=refAnalysisRef.current;
    var refTfArrNow=(ra&&ra.analysisStrokes&&(ra.analysisStrokes[tk]||[]).slice())||[];
    /* 現状をfutureへ退避 (計測も保存) */
    analysisFutRef.current[tk]=[{cur:curTfArrNow,ref:refTfArrNow,measures:measuresRef.current.slice()}].concat((analysisFutRef.current[tk]||[]).slice(0,19));
    analysisHistRef.current[tk]=hist.slice(0,-1);
    /* cur/ref 両方復元 */
    var nextCurObj=Object.assign({},curObj);
    nextCurObj[tk]=(prev.cur||[]).slice();
    setAnalysisStrokes(nextCurObj);
    if(ra){
      var nextRefStrokes=Object.assign({},(ra.analysisStrokes||{'1m':[],'5m':[]}));
      nextRefStrokes[tk]=(prev.ref||[]).slice();
      setRefAnalysis(Object.assign({},ra,{analysisStrokes:nextRefStrokes}));
      triggerRefAutoSave();
    }
    /* 計測を復元 (measuresControlRef.current = DataChart の setMeasures) */
    if(prev.measures!==undefined){
      var _prevMs=(prev.measures||[]).slice();
      measuresRef.current=_prevMs;
      if(measuresControlRef.current)measuresControlRef.current(_prevMs);
    }
    setCanUndo(analysisHistRef.current[tk].length>1);
    setCanRedo((analysisFutRef.current[tk]||[]).length>0);
  }
  function redo(){
    var tk=analysisTfRef.current||'1m';
    var fut=analysisFutRef.current[tk]||[];
    if(!fut.length)return;
    var next=fut[0], restFut=fut.slice(1);
    analysisFutRef.current[tk]=restFut;
    analysisHistRef.current[tk]=(analysisHistRef.current[tk]||[]).concat([{cur:(next.cur||[]).slice(),ref:(next.ref||[]).slice(),measures:(next.measures||[]).slice()}]);
    var curObj=analysisStrokesRef.current||{'1m':[],'5m':[]};
    var nextCurObj=Object.assign({},curObj);
    nextCurObj[tk]=(next.cur||[]).slice();

    if(ra){

  // ── Save & Download ──
  /* C9: 分析モード PNG出力 (統合chart再描画、bar幅12px固定、Firebase無通信)
     幅は uTotal (bar数) × 12px で決まり、uSpan全体表示。
     テキスト/線/EMAは px固定なので縦サイズ変化のみ。
     1m tf全体: ~9432px幅、5m tf全体: ~5924px幅 */
  function downloadAnalysisCombined(){
    var ad=analysisDataRef.current;
    if(!ad){window.caToast('分析データがありません','error');return;}
    var ra=refAnalysisRef.current;
    var tf=analysisTfRef.current||'1m';
    var barsKey=tf==='5m'?'bars_5m':'bars_1m';
    var bars=ad[barsKey]||[];
    if(!bars.length){window.caToast('バーデータがありません','error');return;}
    var refBars=(ra&&ra.analysisData&&ra.analysisData[barsKey])||[];
    var refData=ra?ra.analysisData:null;

    /* bar幅固定 12px → chart幅 = uTotal × 12 + padL + padR */
    var BAR_PX=12;
    var PAD_L=10, PAD_R=60;
    var HEADER_H=44;
    var H=1218;  // 高さ固定 (添付画像準拠)

    /* uTotal計算 (tf依存、getUTotalIA と同じロジック) */
    var g=(tf==='1m')?1:5;
    var tvs=390-(60-g);
    var uTotal=refBars.length?(tvs*2+g):tvs;
    var chartW=uTotal*BAR_PX;
    var W=chartW+PAD_L+PAD_R;

    var tc=document.createElement('canvas');
    tc.width=W; tc.height=H;
    var tctx=tc.getContext('2d');
    /* 背景 (2026-04-20: ca_chart_bg_v1 設定参照) */
    tctx.fillStyle=caLoadChartBg();
    tctx.fillRect(0,0,W,H);

    /* ヘッダー描画 (ticker + refDate ⇄ curDate) */
    var headerTxt=(ad.ticker||'?')+'　'+
      (ra&&ra.analysisData
        ?((ra.analysisData.date||'')+' ⇄ '+(ad.date||''))
        :(ad.date||''));
    tctx.save();
    tctx.fillStyle='#111';
    tctx.fillRect(0,0,W,HEADER_H);
    tctx.fillStyle='#ddd';
    tctx.font="bold 20px -apple-system,'Helvetica Neue',sans-serif";
    tctx.textBaseline='middle';
    tctx.fillText(headerTxt, 16, HEADER_H/2);
    tctx.strokeStyle='#222';
    tctx.lineWidth=1;
    tctx.beginPath();
    tctx.moveTo(0,HEADER_H+0.5);
    tctx.lineTo(W,HEADER_H+0.5);
    tctx.stroke();
    tctx.restore();

    /* chart描画領域 */
    var chartH=H-HEADER_H;
    var chartCanvas=document.createElement('canvas');
    chartCanvas.width=W; chartCanvas.height=chartH;

    /* window.devicePixelRatio を一時的に 1 に固定 (drawDataChart が参照するため) */
    var origDPR=window.devicePixelRatio;
    Object.defineProperty(window,'devicePixelRatio',{value:1,configurable:true});
    try{
      /* priceRange計算 (bars+refBars の外接 min/max) — B完全版: EMA 連続化後で scan */
      var mn=Infinity, mx=-Infinity;
      function scanBars(barsArr){
        barsArr.forEach(function(b){
          if(b.l<mn)mn=b.l; if(b.h>mx)mx=b.h;
          ['ema9','ema22','ema50','ema200','vwap'].forEach(function(k){
            var v=b[k]; if(v!=null){if(v<mn)mn=v;if(v>mx)mx=v;}
          });
        });
      }
      var enhBarsPng=computeEnhancedBars(bars, refBars.length?refBars:null);
      scanBars(enhBarsPng);
      if(refBars.length)scanBars(refBars);
      mn=Math.floor(mn/10)*10 - 5;
      mx=Math.ceil(mx/10)*10 + 5;
      var priceRange={min:mn, max:mx};

      var fullView={uS:0, uE:uTotal};
      var curStrokesArr=(analysisStrokesRef.current&&analysisStrokesRef.current[tf])||[];
      var refStrokesArr=(ra&&ra.analysisStrokes&&ra.analysisStrokes[tf])||[];

      var dummyLayoutRef={current:null};
      drawDataChart(
        chartCanvas,
        bars, ad,
        {w:W, h:chartH, thumbnail:true},
        tf,
        fullView,
        0,  /* pShift=0 */
        priceRange,
        dummyLayoutRef,
        curStrokesArr,
        null,
        null,
        refBars, refData,
        g,
        refStrokesArr
      );
    } finally {
      Object.defineProperty(window,'devicePixelRatio',{value:origDPR,configurable:true});
    }

    tctx.drawImage(chartCanvas, 0, HEADER_H);

    /* ファイル名 */
    var curDate=(ad.date||'').replace(/[^0-9a-zA-Z_-]/g,'');
    var refDate=ra&&ra.analysisData?(ra.analysisData.date||'').replace(/[^0-9a-zA-Z_-]/g,''):'';
    var fname=refDate?(refDate+'_to_'+curDate+'.png'):(curDate+'.png');

    tc.toBlob(function(blob){
      if(!blob){window.caToast('PNG生成失敗','error');return;}
      var url=URL.createObjectURL(blob);
      var lnk=document.createElement('a');
      lnk.href=url;
      lnk.download=fname;
      document.body.appendChild(lnk);
      lnk.click();
      document.body.removeChild(lnk);
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
    },'image/png');
  }

/* ── メモリキャッシュ（iPadのlocalStorage 5MB制限を回避）── */
var _dataMemCache={};  // id -> data object
var _thumbMemCache={}; // id -> thumb dataUrl
var CA_TICKERS_KEY='ca_tickers_v1';
var CA_META_KEY='ca_meta_v1';
var CA_DATA_PFX='ca_data_';
var CA_TRASH_KEY='ca_trash_v1';
var CA_DEF_TICKERS=['INPEX','JX金属','フジクラ','川崎重工業','IHI','ソフトバンク'];
function caLoadTickers(){try{var s=localStorage.getItem(CA_TICKERS_KEY);return s?JSON.parse(s):CA_DEF_TICKERS.slice();}catch(e){return CA_DEF_TICKERS.slice();}}
function caSaveTickers(t){try{localStorage.setItem(CA_TICKERS_KEY,JSON.stringify(t));}catch(e){}}
function caLoadMeta(){
  try{
    var s=localStorage.getItem(CA_META_KEY);if(!s)return[];
    var arr=JSON.parse(s);
    // 既存thumbをメモリキャッシュに退避
    arr.forEach(function(item){
      if(item.thumb&&typeof item.thumb==='string'&&item.thumb.length>500){
        _thumbMemCache[item.id]=item.thumb;
      }
    });
    return arr;
  }catch(e){return[];}
}
function caSaveMeta(m){
  var lite=m.map(function(item){
    // thumbはメモリキャッシュに退避、metaにはthumbUrlのみ残す
    if(item.thumb&&typeof item.thumb==='string'&&item.thumb.length>500){
      _thumbMemCache[item.id]=item.thumb;
    }
    return Object.assign({},item,{thumb:null});
  });
  try{localStorage.setItem(CA_META_KEY,JSON.stringify(lite));}catch(e){
    console.error('[caSaveMeta] save failed');
  }
}
/* 2026-04-27: Storage URL 破損時 (img onError) — meta から thumbUrl をクリア
   次回ホームマウント時に missing 処理が自動再生成 + 再UL */
function caClearBrokenThumbUrl(id){
  try{
    var s=localStorage.getItem(CA_META_KEY);if(!s)return;
    var arr=JSON.parse(s);if(!Array.isArray(arr))return;
    var changed=false;
    for(var i=0;i<arr.length;i++){
      if(arr[i].id===id&&arr[i].thumbUrl){
        arr[i].thumbUrl='';
        changed=true;
        break;
      }
    }
    if(changed)localStorage.setItem(CA_META_KEY,JSON.stringify(arr));
  }catch(e){}
}
function caLoadData(id){
  /* C8a: localStorage 層を廃止 (data は容量が大きく fullになりやすい)。mem only同期版。
     本格ロードは caLoadDataAsync を使う (IDBフォールバックあり) */
  if(_dataMemCache[id])return _dataMemCache[id];
  return null;
}
// 非同期版: メモリ → IndexedDB (C8a: localStorage層は廃止)
function caLoadDataAsync(id,cb){
  if(_dataMemCache[id]){cb(_dataMemCache[id]);return;}
  idbGet('data_'+id,function(val){
    if(val){_dataMemCache[id]=val;cb(val);}
    else{cb(null);}
  });
}
function caSaveData(id,d){
  _dataMemCache[id]=d;

/* ─── 2026-04-30: チャートパターン検索 Phase 1 (寄り天検出) ───────
   - 純粋関数: extractPhase1Features(analysisData, tf) → features
   - スコア化: scorePhase1Asagaten(features, params) → {score, hit, ...}
   - IDB キャッシュ: patFeatGet/Set/Del (key='pat_features_v1:'+id)
   - 自動計算: DraftLibrary マウント時に未計算分を順次計算
   - 設計: bar = {t:"HH:MM", o, h, l, c, v, ema9, ema22, ema50, ema200, vwap}
   - 昼休み 11:30-12:30 (60分) を経過分計算から除外 */
function _patElapsedMinExclLunch(tStart, tEnd){
  /* "HH:MM" 形式の2時刻間の経過分（昼休み60分を除外） */
  function _toMin(t){var p=t.split(':');return parseInt(p[0],10)*60+parseInt(p[1],10);}
  var s=_toMin(tStart), e=_toMin(tEnd);
  if(e<s)return 0;
  var elapsed=e-s;
  var lunchStart=11*60+30;  /* 690 */
  var lunchEnd=12*60+30;    /* 750 */
  if(s<lunchEnd && e>lunchStart){
    var overlap=Math.min(e,lunchEnd)-Math.max(s,lunchStart);
    if(overlap>0)elapsed-=overlap;
  }
  return Math.max(0,elapsed);
}
function extractPhase1Features(analysisData, tf){
  /* 寄り天検出に必要な8つの特徴量を抽出。null返却 = データ不足 */
  if(!analysisData)return null;
  var barsKey=tf==='5m'?'bars_5m':'bars_1m';
  var bars=analysisData[barsKey]||[];
  if(bars.length<5)return null;
  var b0=bars[0]; if(!b0||typeof b0.o!=='number'||!b0.t)return null;
  var open0=b0.o;
  var bLast=bars[bars.length-1]; if(!bLast||typeof bLast.c!=='number')return null;
  var close=bLast.c;
  var hod=-Infinity, lod=Infinity, hodIdx=0;
  for(var i=0;i<bars.length;i++){
    var b=bars[i];
    if(typeof b.h!=='number'||typeof b.l!=='number')continue;
    if(b.h>hod){hod=b.h; hodIdx=i;}
    if(b.l<lod)lod=b.l;
  }
  if(!isFinite(hod)||!isFinite(lod))return null;
  var hodMin=_patElapsedMinExclLunch(b0.t, bars[hodIdx].t||b0.t);
  var range=hod-lod;
  var closeRetraceRatio=range>0?(hod-close)/range:0;
  var isBearish=close<open0;
  return {
    open0:open0, close:close, hod:hod, lod:lod, hodIdx:hodIdx, hodMin:hodMin,
    range:range, closeRetraceRatio:closeRetraceRatio, isBearish:isBearish,
    tf:tf, barCount:bars.length
  };
}
function scorePhase1Asagaten(f, params){
  /* 寄り天スコア計算 (0-100点)
     params: {maxHodMin, minRetrace, requireBearish, threshold} */
  if(!f)return {score:0, hit:false};
  var maxHodMin=(params&&params.maxHodMin!=null)?params.maxHodMin:30;
  var minRetrace=(params&&params.minRetrace!=null)?params.minRetrace:0.6;
  var requireBearish=(params&&params.requireBearish!==false);
  var threshold=(params&&params.threshold!=null)?params.threshold:60;
  /* S_hodEarly: HoDが早いほど高 (60分超で0) */
  var sHodEarly=Math.max(0, 1-f.hodMin/60)*100;
  /* S_retrace: 終値後退率（線形、1.0でcap） */
  var sRetrace=Math.min(1, Math.max(0, f.closeRetraceRatio))*100;
  /* S_bearClose: 陰線終了 */
  var sBear=f.isBearish?100:0;
  /* 加重平均 (0.4/0.4/0.2) */
  var total=sHodEarly*0.4 + sRetrace*0.4 + sBear*0.2;
  var hit=(f.hodMin<=maxHodMin)
       && (f.closeRetraceRatio>=minRetrace)
       && (!requireBearish || f.isBearish)
       && (total>=threshold);
  return {
    score:Math.round(total), hit:hit,
    sHodEarly:Math.round(sHodEarly), sRetrace:Math.round(sRetrace), sBear:sBear
  };
}

/* ─── 2026-05-03: meta から年月を抽出するヘルパー ─────────
   優先順位:
   1. m.name 末尾 _YYYYMMDD → "YYYY-MM"
   2. m.analysisDate "YYYY-MM-DD" / "YYYY/MM/DD" / "YYYYMMDD" → "YYYY-MM"
   3. 不明なら "(日付不明)" */
function _extractYearMonth(m){
  if(!m)return '(日付不明)';
  /* パターン1: m.name 末尾 _YYYYMMDD */
  if(typeof m.name==='string'){
    var nm=m.name.match(/_(\d{4})(\d{2})\d{2}(?:\.|$)/);
    if(nm)return nm[1]+'-'+nm[2];
  }
  /* パターン2: m.analysisDate */
  var ad=m.analysisDate||'';
  if(typeof ad==='string' && ad){
    /* "YYYY-MM-DD" or "YYYY/MM/DD" */
    var ad1=ad.match(/^(\d{4})[-/](\d{2})/);
    if(ad1)return ad1[1]+'-'+ad1[2];
    /* "YYYYMMDD" */
    var ad2=ad.match(/^(\d{4})(\d{2})\d{2}$/);
    if(ad2)return ad2[1]+'-'+ad2[2];
  }
  return '(日付不明)';
}

/* YYYY-MM-DD → '（月）'〜'（日）'  表示専用・保存しない
   new Date(y,m,d) でローカル日付を確定 (文字列パースはブラウザ依存のためNG) */
function _dowLabel(dateStr){
  if(!dateStr||!/^\d{4}-\d{2}-\d{2}$/.test(dateStr))return '';
  var p=dateStr.split('-');
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  return ['(日)','(月)','(火)','(水)','(木)','(金)','(土)'][d.getDay()]||'';
}
/* meta オブジェクトから曜日ラベルを取得
   analysisDate(YYYY-MM-DD) → name内 YYYY-MM-DD → name内 _YYYYMMDD の順で日付を解決 */
function _metaDowLabel(m){
  var ad=m.analysisDate||'';
  if(!ad&&typeof m.name==='string'){
    var r2=m.name.match(/(?:^|[_\-])(\d{4})-(\d{2})-(\d{2})/);
    if(r2)ad=r2[1]+'-'+r2[2]+'-'+r2[3];
    if(!ad){
      var r3=m.name.match(/_(\d{4})(\d{2})(\d{2})(?:[._]|$)/);
      if(r3)ad=r3[1]+'-'+r3[2]+'-'+r3[3];
    }
  }
  return _dowLabel(ad);
}

/* 2026-05-03: 銘柄 t の最新 analysisDate (YYYY-MM-DD) と件数を返す
   - charts: meta.filter(m=>m.ticker===t)
   - latestDate: 最新の m.analysisDate (string)。全欠損または0件は null。
   - count: チャート数 */
function _tickerLatestDate(t, meta){
  var charts = meta.filter(function(m){return m.ticker===t;});
  if(charts.length===0) return {count:0, latestDate:null};
  var latest = null;
  for(var i=0;i<charts.length;i++){
    var d = charts[i].analysisDate;
    if(typeof d==='string' && d && (!latest || d > latest)) latest = d;
  }
  return {count:charts.length, latestDate:latest};
}

/* ─── 2026-04-30: Phase 2 (VWAPジグザグ検出) 純粋関数 ─────────
   - 特徴量: vwapCrossCount, maxDevRatio, symmetry 等
   - 設計: bar.c が VWAP の上下を跨いだ回数で「ジグザグ強度」を測る
   - 乖離は range 相対値で算出 (銘柄価格非依存) */
function extractPhase2VwapFeatures(analysisData, tf){
  if(!analysisData)return null;
  var barsKey=tf==='5m'?'bars_5m':'bars_1m';
  var bars=analysisData[barsKey]||[];
  if(bars.length<5)return null;
  var hod=-Infinity, lod=Infinity;
  var crosses=0;
  var maxDevYen=0;
  var sumDevYen=0, devCount=0;
  var aboveCount=0, belowCount=0;
  var lastSide=null;  /* 'above' | 'below' | null */
  for(var i=0;i<bars.length;i++){
    var b=bars[i];
    if(typeof b.h!=='number'||typeof b.l!=='number'||typeof b.c!=='number')continue;
    if(b.h>hod)hod=b.h;
    if(b.l<lod)lod=b.l;
    if(typeof b.vwap!=='number')continue;
    var dev=b.c-b.vwap;
    var absDev=Math.abs(dev);
    if(absDev>maxDevYen)maxDevYen=absDev;
    sumDevYen+=absDev; devCount++;
    var side=dev>0?'above':(dev<0?'below':null);
    if(side==='above')aboveCount++;
    else if(side==='below')belowCount++;
    if(side && lastSide && side!==lastSide)crosses++;
    if(side)lastSide=side;
  }
  if(!isFinite(hod)||!isFinite(lod)||devCount===0)return null;
  var range=hod-lod;
  var maxDevRatio=range>0?maxDevYen/range:0;
  var avgDevYen=sumDevYen/devCount;
  var totalSided=aboveCount+belowCount;
  var symmetry=totalSided>0?(1-Math.abs(aboveCount-belowCount)/totalSided):0;
  return {
    vwapCrossCount:crosses, maxDevYen:maxDevYen, maxDevRatio:maxDevRatio,
    avgDevYen:avgDevYen, aboveBarCount:aboveCount, belowBarCount:belowCount,
    symmetry:symmetry, range:range, tf:tf, barCount:bars.length
  };
}
function scorePhase2VwapZigzag(f, params){
  /* VWAPジグザグスコア計算 (0-100点)
     params: {minCrosses, maxDevRatioMax, minRange, threshold} */
  if(!f)return {score:0, hit:false};
  var minCrosses=(params&&params.minCrosses!=null)?params.minCrosses:6;
  var maxDevRatioMax=(params&&params.maxDevRatioMax!=null)?params.maxDevRatioMax:0.4;
  var minRange=(params&&params.minRange!=null)?params.minRange:30;
  var threshold=(params&&params.threshold!=null)?params.threshold:60;
  /* S_crosses: 12回以上で満点 */
  var sCrosses=Math.min(f.vwapCrossCount/12, 1)*100;
  /* S_compact: 乖離小さいほど高 */
  var sCompact=(1-Math.min(Math.max(f.maxDevRatio, 0), 1))*100;
  /* S_symmetry: 上下対称 */
  var sSym=f.symmetry*100;
  /* 加重平均 (0.4/0.4/0.2) */
  var total=sCrosses*0.4 + sCompact*0.4 + sSym*0.2;
  var hit=(f.vwapCrossCount>=minCrosses)
       && (f.maxDevRatio<=maxDevRatioMax)
       && (f.range>=minRange)
       && (total>=threshold);
  return {
    score:Math.round(total), hit:hit,
    sCrosses:Math.round(sCrosses), sCompact:Math.round(sCompact), sSym:Math.round(sSym)
  };
}

/* ─── 2026-04-30: Phase 3 (テンプレート類似度検索) 純粋関数 ─────
   - ベクトル化: 終値を z-score 正規化 → 60点リサンプリング
   - 類似度: コサイン類似度 (z-score 済なので実質ピアソン相関)
   - スコア化: (cos+1)/2 × 100 で 0〜100点 (cos=1→100, cos=0→50, cos=-1→0)
   - クエリは過去 draft 1件、その normVec と全 draft の normVec を比較 */
function _patLinearResample(arr, targetLen){
  if(!arr || arr.length===0 || targetLen<=0)return [];
  if(arr.length===1){var o=new Array(targetLen);for(var i=0;i<targetLen;i++)o[i]=arr[0];return o;}
  var out=new Array(targetLen);
  var srcLen=arr.length;
  for(var j=0;j<targetLen;j++){
    var pos=(j/(targetLen-1))*(srcLen-1);
    var lo=Math.floor(pos);
    var hi=Math.ceil(pos);
    if(lo===hi){out[j]=arr[lo];}
    else{var t=pos-lo; out[j]=arr[lo]*(1-t)+arr[hi]*t;}
  }
  return out;
}
function _patZscore(vec){
  if(!vec || vec.length===0)return {normalized:[], mean:0, std:0};
  var sum=0;
  for(var i=0;i<vec.length;i++)sum+=vec[i];
  var mean=sum/vec.length;
  var sqSum=0;
  for(var i2=0;i2<vec.length;i2++){var d=vec[i2]-mean; sqSum+=d*d;}
  var std=Math.sqrt(sqSum/vec.length);
  if(std===0){var z=new Array(vec.length);for(var i3=0;i3<vec.length;i3++)z[i3]=0;return {normalized:z, mean:mean, std:0};}
  var n=new Array(vec.length);
  for(var i4=0;i4<vec.length;i4++)n[i4]=(vec[i4]-mean)/std;
  return {normalized:n, mean:mean, std:std};
}
function extractPhase3VectorFeatures(analysisData, tf, vecLen){
  if(!analysisData)return null;
  vecLen=vecLen||60;
  var barsKey=tf==='5m'?'bars_5m':'bars_1m';
  var bars=analysisData[barsKey]||[];
  if(bars.length<5)return null;
  var closes=[];
  for(var i=0;i<bars.length;i++){
    var b=bars[i];
    if(typeof b.c==='number')closes.push(b.c);
  }
  if(closes.length<5)return null;
  var resampled=_patLinearResample(closes, vecLen);
  var z=_patZscore(resampled);
  return {
    normVec:z.normalized, mean:z.mean, std:z.std,
    tf:tf, barCount:bars.length, vecLen:vecLen
  };
}
function cosineSimilarity(a, b){
  if(!a || !b || a.length!==b.length || a.length===0)return 0;
  var dot=0, na=0, nb=0;
  for(var i=0;i<a.length;i++){dot+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i];}
  var denom=Math.sqrt(na)*Math.sqrt(nb);
  if(denom===0)return 0;
  return dot/denom;
}
function scorePhase3Template(f, queryF, params){
  /* テンプレート類似度スコア (0-100点)
     params: {threshold} */
  if(!f || !queryF || !f.normVec || !queryF.normVec){
    return {score:0, hit:false, cos:0};
  }
  var threshold=(params&&params.threshold!=null)?params.threshold:70;
  var cos=cosineSimilarity(f.normVec, queryF.normVec);
  var score=Math.round((cos+1)/2*100);
  var hit=score>=threshold;
  return {score:score, hit:hit, cos:cos};
}

/* ─── 2026-04-30: Phase 4 (DTW: 動的時間伸縮) 純粋関数 ─────────
   - DTW = Dynamic Time Warping
   - コサインの上位互換: 「形は同じだが速度が違う」パターンも検出可能
   - 計算量: O(N*M) — 60×60 = 3600 ops/比較 (コサインの約60倍だが実用範囲)
   - メモリ: O(M) — 2行ずつ swap で削減
   - スコア化: dtw=0→100, dtw=33→50, dtw=66→0 (z-score 60点ベクトルの想定値域) */
function dtwDistance(a, b){
  if(!a || !b || a.length===0 || b.length===0)return Infinity;
  var n=a.length, m=b.length;
  var prev=new Array(m+1);
  var k;
  for(k=0;k<=m;k++)prev[k]=Infinity;
  prev[0]=0;
  for(var i=1;i<=n;i++){
    var curr=new Array(m+1);
    for(k=0;k<=m;k++)curr[k]=Infinity;
    for(var j=1;j<=m;j++){
      var cost=Math.abs(a[i-1]-b[j-1]);
      var minPrev=prev[j-1];
      if(prev[j]<minPrev)minPrev=prev[j];
      if(curr[j-1]<minPrev)minPrev=curr[j-1];
      curr[j]=cost+minPrev;
    }
    prev=curr;
  }
  return prev[m];
}
function scorePhase4DTW(f, queryF, params){
  /* DTW スコア (0-100点)
     params: {threshold} */
  if(!f || !queryF || !f.normVec || !queryF.normVec){
    return {score:0, hit:false, dtw:Infinity};
  }
  var threshold=(params&&params.threshold!=null)?params.threshold:70;
  var dtw=dtwDistance(f.normVec, queryF.normVec);
  /* z-score 60点ベクトルでの距離→スコア変換
     経験的: dtw=0→100, dtw=33→50, dtw=66→0 (1.5倍の係数) */
  var score=Math.max(0, Math.round(100-dtw*1.5));
  var hit=score>=threshold;
  return {score:score, hit:hit, dtw:dtw};
}

function caGenThumb(canvasEl){
  var W=Math.min(canvasEl.width,800),ratio=W/canvasEl.width,H=Math.round(canvasEl.height*ratio);
  var tc=document.createElement('canvas');tc.width=W;tc.height=H;
  var ctx=tc.getContext('2d');
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  try{
    ctx.drawImage(canvasEl,0,0,W,H);
    return tc.toDataURL('image/png');
  }catch(e){
    /* 2026-04-20 C11: tainted canvas (SecurityError) → CORS未設定のStorage画像が混入
       fallback: 空の透明サムネイルを返す。警告はconsoleに一度だけ。 */
    if(!window._caCorsWarned){
      window._caCorsWarned=true;
      console.warn('[CORS] canvas toDataURL failed. Firebase Storage bucketにCORS設定が必要です。\n'+
        'gsutil cors set cors.json gs://YOUR_BUCKET を実行してください。'+
        '(詳細: https://firebase.google.com/docs/storage/web/download-files#cors_configuration)');
    }
    /* 空のtransparent thumbnail を返す (サムネ表示は欠けるが保存は継続可能) */
    var fc=document.createElement('canvas');fc.width=W;fc.height=H;
    try{return fc.toDataURL('image/png');}catch(e2){return '';}
  }
}

/* ============================================================
   Phase 2 (2026-04-20): 分析データ(JSON)から thumb を生成するヘルパー
   DataChart のオフスクリーンレンダリングで thumb PNG を作成
   ============================================================ */
function generateAnalysisThumb(analysisData, cb){
  try{
    if(!analysisData||!analysisData.bars_1m||!analysisData.bars_1m.length){cb('');return;}
    var W=800, H=500;
    var c=document.createElement('canvas');
    c.width=W; c.height=H;
    var bars=analysisData.bars_1m;
    /* priceRange算出 (EMA連続化を考慮しない単純版、refData無しなので問題なし) */
    var mn=Infinity, mx=-Infinity;
    bars.forEach(function(b){
      if(b.l<mn)mn=b.l; if(b.h>mx)mx=b.h;
      ['ema9','ema22','ema50','ema200','vwap'].forEach(function(k){
        var v=b[k]; if(v!=null){if(v<mn)mn=v;if(v>mx)mx=v;}
      });
    });
    if(!isFinite(mn)||!isFinite(mx)){cb('');return;}
    mn=Math.floor(mn/10)*10-5; mx=Math.ceil(mx/10)*10+5;
    var priceRange={min:mn,max:mx};
    /* uTotal (1m,hasRef=false) = 390-(60-1) = 331 */
    var uTotal=390-(60-1);
    /* DPR 固定 */
    var origDPR=window.devicePixelRatio;
    try{Object.defineProperty(window,'devicePixelRatio',{value:1,configurable:true});}catch(e){}
    try{
      drawDataChart(c, bars, analysisData, {w:W,h:H,thumbnail:true}, '1m',
        {uS:0,uE:uTotal}, 0, priceRange, {current:null},
        [], null, null, null, null, 1, null, null);
    }finally{
      try{Object.defineProperty(window,'devicePixelRatio',{value:origDPR,configurable:true});}catch(e){}
    }
    try{cb(c.toDataURL('image/png'));}
    catch(e){console.warn('[thumb] toDataURL failed:',e);cb('');}
  }catch(err){
    console.error('generateAnalysisThumb:',err);
    cb('');
  }
}

/* ============================================================
   Phase 1 (2026-04-20): PNG一括エクスポートヘルパー
   全draft を 画像+strokes 合成PNG として個別DL (参照画像・分析chartは含まない)
   ============================================================ */
/* draft の data から画像要素を非同期で生成 (orig_base64 or imageUrl) */
function _loadDraftImage(d, cb){
  if(!d){cb(null);return;}
  var src=null, needCross=false;
  if(d.orig_base64){
    src='data:'+(d.orig_mt||'image/png')+';base64,'+d.orig_base64;
  } else if(d.imageUrl){
    src=d.imageUrl; needCross=true;
  } else { cb(null); return; }
  var img=new Image();
  if(needCross)img.crossOrigin='anonymous';
  img.onload=function(){cb(img);};
  img.onerror=function(){cb(null);};
  img.src=src;
}
/* 画像+strokes を合成してPNG dataURL を返す (失敗時 null) */
function _generateCombinedPng(img, strokes){
  var c=document.createElement('canvas');
  c.width=img.naturalWidth||img.width; c.height=img.naturalHeight||img.height;
  var ctx=c.getContext('2d');
  ctx.drawImage(img,0,0);
  if(strokes&&strokes.length){
    strokes.forEach(function(s){try{drawStroke(ctx,s);}catch(e){}});
  }
  try{ return c.toDataURL('image/png'); }
  catch(e){ return null; }
}
/* ファイル名サニタイズ */
function _sanitizeFn(s){return (s||'').replace(/[\/\\?%*:|"<>\s]/g,'_');}
/* dataURL を <a download> でDL */
function _triggerDl(dataUrl, filename){
  var a=document.createElement('a');
  a.href=dataUrl; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
/* Firebase から data を取得 (IDBに無い場合のfallback) */
function _fetchDraftDataFromFb(fbCfg, id, cb){
  if(!fbCfg||!fbCfg.url||_fbIsPaused(fbCfg)){cb(null);return;}
  var auth=fbCfg.secret?'?auth='+fbCfg.secret:'';
  var url=fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-data/'+id+'.json'+auth;
  fetch(url).then(function(r){return r.ok?r.json():null;})
    .then(function(d){cb(d);})
    ["catch"](function(){cb(null);});
}
/* meta配列を1件ずつPNG化してDL連発
   onProgress(i, total, name), onDone(okCount, failCount) */
function exportAllDraftsAsPng(metaList, fbCfg, onProgress, onDone){
  var i=0, ok=0, fail=0;
  function next(){
    if(i>=metaList.length){onDone(ok,fail);return;}
    var m=metaList[i]; i++;
    if(onProgress)onProgress(i, metaList.length, m.name||m.ticker||m.id);
    function withData(d){
      if(!d){fail++;setTimeout(next,80);return;}
      _loadDraftImage(d, function(img){
        if(!img){fail++;setTimeout(next,80);return;}
        var png=_generateCombinedPng(img, d.strokes||[]);
        if(!png){fail++;setTimeout(next,80);return;}
        var dt=new Date(m.savedAt||Date.now());
        var ds=dt.getFullYear()+('0'+(dt.getMonth()+1)).slice(-2)+('0'+dt.getDate()).slice(-2);
        var fn=_sanitizeFn(ds+'_'+(m.ticker||'')+'_'+(m.name||'chart'))+'.png';
        _triggerDl(png, fn);
        ok++;
        /* ブラウザのダウンロード連打抑制 */
        setTimeout(next,400);
      });
    }
    caLoadDataAsync(m.id, function(d){
      if(d)withData(d);
      else _fetchDraftDataFromFb(fbCfg, m.id, withData);
    });
  }
  next();
}

/* 画像ファイル → {base64, mt} */
function caFileToImg(file){
  return new Promise(function(res){
    if(!file)return res(null);
    var r=new FileReader();
    r.onload=function(e){
      try{
        var result=e.target.result;
        if(!result||typeof result!=='string')return res(null);
        var ci=result.indexOf(',');
        if(ci===-1)return res(null);
        var b64=result.substring(ci+1);
        var mt=(result.substring(0,ci).match(/^data:([^;]+)/)||[])[1]||(file.type||'image/png');
        res({base64:b64,mt:mt});
      }catch(_){res(null);}
    };
    r.onerror=function(){res(null);};
    try{r.readAsDataURL(file);}catch(_){res(null);}
  });
}
function caImgSrc(img){
  if(!img)return null;
  if(img.base64&&img.mt)return 'data:'+img.mt+';base64,'+img.base64;
  return null;
}

/* ── チャートメモ内容ありチェック ── */

/* ─── Scalping Notebook 予定ローダー ───────────────────────────────
   同一ブラウザの scalping_data_v6 (localStorage) を優先取得し、
   なければ scalping_cfg_v2 の Firebase URL から日付単位で取得する。
   結果はセッション中キャッシュして重複リクエストを防ぐ。           */
var _snEventsCache={};
function _snReadCfg(){
  try{var v=JSON.parse(localStorage.getItem('scalping_cfg_v2'));if(v&&v.fbUrl)return v;}catch(e){}
  return null;
}
/* ─── SN チャート形状タグ連携 ─────────────────────────────────────────
   SN は data.charts[snStockName+"_"+date].chartShapeTags に各日の形状タグを持つ。
   CA ticker(例:"ソフトバンク") + date(YYYY-MM-DD) → SN stockName(例:"SBG") を
   コード逆引きで解決し、該当の chartShapeTags を返す。                    */
var _SN_DEFAULT_CODE_MAP={ /* SNデフォルトstockName→code */
  "INPEX":"1605","JX金属":"5016","フジクラ":"5803",
  "川崎重工":"7012","IHI":"7013","SBG":"9984"
};
/* CA ticker から候補となる SN stockName 一覧を返す */
function _caTickerToSnStockNames(caTicker, snData){
  var names=[];
  /* ①直接名前一致 */
  names.push(caTicker);
  var code=caGetCodeByTicker(caTicker);
  if(!code)return names;
  /* ②custom.stockCodes 逆引き */
  var sc=(snData&&snData.custom&&snData.custom.stockCodes)||{};
  for(var k in sc){
    var e=sc[k];
    if(e&&(e.caTicker===caTicker||String(e.code)===String(code)))names.push(k);
  }
  /* ③デフォルトマップ逆引き */
  for(var dk in _SN_DEFAULT_CODE_MAP){
    if(String(_SN_DEFAULT_CODE_MAP[dk])===String(code))names.push(dk);
  }
  return names;
}
/* meta オブジェクトから YYYY-MM-DD を解決 (analysisDate 優先、なければ name から抽出) */
function _caResolveMetaDate(m){
  if(!m)return '';
  var ad=m.analysisDate||'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(ad))return ad;
  var r=ad.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(r)return r[1]+'-'+r[2]+'-'+r[3];
  var n=String(m.name||'');
  var r2=n.match(/(?:^|[_\-])(\d{4})-(\d{2})-(\d{2})/);
  if(r2)return r2[1]+'-'+r2[2]+'-'+r2[3];
  var r3=n.match(/_(\d{4})(\d{2})(\d{2})(?:[._\(]|$)/);
  if(r3)return r3[1]+'-'+r3[2]+'-'+r3[3];
  return '';
}
/* スタンプストロークの実効テキスト (snipId参照 → 定義テキスト、編集済みは backup) */
function caSnipEffText(s, byId){
  var t=s&&s.text||'';
  if(s&&s._snippet&&s.snipId&&byId&&byId[s.snipId]&&!s._editedText)t=byId[s.snipId].text||t;
  return t;
}
/* 全チャートを走査し、矢印(pointer)付きスタンプの配置を収集 (非同期)
   cb(placements[]) : {chartId,ticker,date,tf,tipTm,time,snipId,text,color} */
function caCollectStampPlacements(charts, snippetsById, cb){
  charts=charts||[];
  var results=[]; var pending=charts.length;
  if(!pending){cb(results);return;}
  charts.forEach(function(m){
    caLoadDataAsync(m.id, function(d){
      try{
        var as=d&&d.analysisStrokes;
        ['1m','5m'].forEach(function(tf){
          var arr=(as&&as[tf])||[];
          arr.forEach(function(s){
            if(s&&s._snippet&&s.pointer&&typeof s.pointer.tipTm==='number'){
              var txt=caSnipEffText(s,snippetsById);
              var col=s.color||(snippetsById&&s.snipId&&snippetsById[s.snipId]?snippetsById[s.snipId].color:'#ff9500');
              results.push({chartId:m.id, ticker:m.ticker||'', date:_caResolveMetaDate(m), tf:tf,
                tipTm:s.pointer.tipTm, time:snipTimeStr(s.pointer.tipTm),
                snipId:s.snipId||null, text:txt, color:col});
            }
          });
        });
      }catch(e){}
      pending--; if(pending<=0)cb(results);
    });
  });
}
/* CA ticker + 日付 → SN の chartShapeTags + stockTags (文字列[])
   SN は data.charts[snStock+"_"+date] に両方を持つ。どちらも表示対象。 */
function caLoadSnChartShapeTags(caTicker, date){
  if(!caTicker||!date)return [];
  try{
    var snRaw=localStorage.getItem('scalping_data_v6');
    if(!snRaw)return [];
    var snData=JSON.parse(snRaw);
    if(!snData||!snData.charts)return [];
    var candidates=_caTickerToSnStockNames(caTicker,snData);
    for(var i=0;i<candidates.length;i++){
      var ck=candidates[i]+'_'+date;
      var cd=snData.charts[ck];
      if(!cd)continue;
      /* SN は chartShapeTags と stockTags の両方を「タグ」として扱う */
      var merged=(cd.chartShapeTags||[]).concat(cd.stockTags||[]);
      if(merged.length)return merged;
    }
  }catch(e){}
  return [];
}
/* ── コンソール診断ヘルパー (DevTools で window.caDebugSN() を実行) ── */
window.caDebugSN=function(ticker,date){
  try{

      var related=keys.filter(function(k){return cands.some(function(c){return k.indexOf(c+'_')===0;});});
      console.log('[caDebugSN] 関連キー(最大20件):',related.slice(0,20));
      if(date){

    });

};
function _snReadCategoriesMap(){
  var map={};
  try{
    var v=JSON.parse(localStorage.getItem('scalping_data_v6'));
    var cats=(v&&v.custom&&Array.isArray(v.custom.eventCategories))?v.custom.eventCategories:[];
    cats.forEach(function(c){if(c&&c.id)map[c.id]=c;});
  }catch(e){}
  return map;
}
function caLoadSnEvents(date,cb){
  if(!date){cb([]);return;}
  /* localStorage は毎回読み直す（SN編集が即反映されるよう）*/
  try{
    var d=JSON.parse(localStorage.getItem('scalping_data_v6'));
    if(d&&d.trades&&d.trades[date]){
      var evts=Array.isArray(d.trades[date].events)?d.trades[date].events:[];
      cb(evts); return;
    }
  }catch(e){}
  /* Firebase フォールバック（ネットワークリクエストはセッションキャッシュ）*/
  if(_snEventsCache[date]!==undefined){cb(_snEventsCache[date]||[]);return;}
  var cfg=_snReadCfg();
  if(!cfg||!cfg.fbUrl||cfg.fbPaused){cb([]);return;}
  var a=cfg.fbSecret?'?auth='+cfg.fbSecret:'';
  fetch(cfg.fbUrl.replace(/\/$/,'')+'/data/trades/'+date+'/events.json'+a)
    .then(function(r){return r.ok?r.json():null;})
    .then(function(data){
      var evts=Array.isArray(data)?data:(data&&typeof data==='object'?Object.values(data):[]);
      _snEventsCache[date]=evts; cb(evts);
    }).catch(function(){cb([]);});
}

    /* タグ選択パネル (折りたたみ) */
    tagOpen&&ce('div',{
      onClick:function(e){e.stopPropagation();},
      style:{borderTop:'1px solid #2a2a2a',padding:'10px 10px 8px 10px'}},
      ce(CaTagSelector,{
        chartId:m.id,
        selectedIds:tagIds,
        onChangeTags:handleChangeTags,
        onClose:function(){setTagOpen(false);},
        fbCfg:fbCfg
      })
    ),

    /* メモパネル (折りたたみ) */
    memoOpen&&ce('div',{
      onClick:function(e){e.stopPropagation();},
      style:{borderTop:'1px solid #2a2a2a',padding:'8px 10px'}},
      ce(CaMemoEditableField,{
        key:'memo_'+m.id,
        html:memoHtml,
        placeholder:'クリックしてメモを追加…',
        guardOwner:'chartMemo_'+m.id,
        hideEditButton:true,
        onSave:handleSave
      })
    )
  );
}

/* ─── 2026-04-30: PatternSearchModal (Phase 1: 寄り天検出) ──────
   props: open, onClose, meta, fbCfg, onOpenChart
   - meta は親 (DraftLibrary) から渡される draft 一覧
   - 開いた瞬間に未計算分を順次計算 → IDB 保存 → 結果表示
   - パラメータ変更時は IDB から特徴量再取得 (data 再読込なし) */
/* ─── 2026-04-30: PatternSearchModal (チャートパターン類似検索)
   - 旧: 寄り天 / VWAPジグザグ / テンプレ類似 の3タブ構成
   - 新 (2026-05-03 簡素化): テンプレ類似のみ。チャート1つ選ぶ→似た形のチャート一覧
   - クエリ: meta から1件選択 (プルダウン or エディタからの自動指定)
   - 類似度: コサイン or DTW (アルゴリズム切替UI)
   - サムネ: 結果リスト・クエリプレビューとも 160×100 (旧80×50の2倍) */
function PatternSearchModal(props){
  var open=props.open, onClose=props.onClose, meta=props.meta||[], fbCfg=props.fbCfg||{};
  var tickersList=props.tickers||[];  /* 2026-05-03: 対象銘柄選択用 */
  var onOpenChart=props.onOpenChart||function(){};
  /* 2026-04-30: C - エディタから起動時の初期クエリ */
  var initialQueryDraftId=props.initialQueryDraftId||null;
  /* 2026-05-03: 年月折り畳み (DraftLibrary と共有) */
  var expandedYM=props.expandedYM||{};
  var onToggleYM=props.onToggleYM||function(){};
  var onSetAllYM=props.onSetAllYM||function(){};
  /* パラメータ state (テンプレ類似のみ) */
  var sP=useState({threshold:70, algorithm:'cos'});
  var paramsTemplate=sP[0], setParamsTemplate=sP[1];
  /* クエリ draft id */
  var sQ=useState(null);   var queryDraftId=sQ[0], setQueryDraftId=sQ[1];
  /* 2026-05-03: B1 - クエリ選択UI 状態 (null=非表示, 'tickers'=銘柄一覧, 'charts'=チャート一覧) */
  var sPV=useState(null);  var pickerView=sPV[0], setPickerView=sPV[1];
  /* 2026-05-03: B1 - charts一覧画面で選択中の銘柄 */
  var sPT=useState(null);  var pickerTicker=sPT[0], setPickerTicker=sPT[1];
  var sTf=useState('1m');
  var tf=sTf[0], setTf=sTf[1];
  /* 計算進捗 state */
  var sCing=useState(false);   var computing=sCing[0],setComputing=sCing[1];
  var sCdone=useState(0);      var doneCount=sCdone[0],setDoneCount=sCdone[1];
  var sCtotal=useState(0);     var totalCount=sCtotal[0],setTotalCount=sCtotal[1];
  /* 結果 state: [{rec, features, scoreObj}] (hit のみ score降順) */
  var sRes=useState([]);       var results=sRes[0],setResults=sRes[1];
  /* 2026-05-03: 対象銘柄選択 (絞り込み)
     - {ticker: bool} 形式、true=計算/結果対象、未設定/false=除外
     - クエリチャート変更時にクエリ銘柄のみ ON にリセット (Q2:a) */
  var sST=useState({});        var selectedTickers=sST[0], setSelectedTickers=sST[1];
  /* 特徴量キャッシュ (このモーダルセッション内、IDB から read 済) */
  var featsRef=useRef({});  /* {id: {vec_features_1m, vec_features_5m, ...}} */
  var cancelRef=useRef(false);

  /* open 時に初期クエリ反映。queryDraftId は open 毎に必ず再設定 (前回引きずり防止) */
  useEffect(function(){
    if(!open)return;
    setQueryDraftId(initialQueryDraftId||null);
    /* 2026-05-03: B1 - picker view も毎回リセット */
    setPickerView(null);
    setPickerTicker(null);
  },[open, initialQueryDraftId]);

  /* 2026-05-03: クエリチャート変更時、対象銘柄をクエリ銘柄のみ ON にリセット (Q2:a) */
  useEffect(function(){
    if(!queryDraftId){setSelectedTickers({}); return;}
    var qm=meta.find(function(m){return m.id===queryDraftId;});
    if(qm && qm.ticker){
      var s={};
      s[qm.ticker]=true;
      setSelectedTickers(s);
    }else{
      setSelectedTickers({});
    }
  },[queryDraftId]);

  /* 開いた瞬間に計算開始 (close で cancel) */
  useEffect(function(){
    if(!open)return;
    cancelRef.current=false;
    featsRef.current={};
    setResults([]);
    setDoneCount(0);
    setTotalCount(meta.length);
    setComputing(true);
    var i=0;
    function processNext(){
      if(cancelRef.current)return;
      /* 完了時は setComputing(false) のみ。recomputeResults は依存配列の useEffect で実行 */
      if(i>=meta.length){setComputing(false); return;}
      var m=meta[i]; i++;
      patFeatGet(m.id, function(cached){
        if(cancelRef.current)return;
        /* テンプレ類似のみなので vec_features_* の存在のみ確認すれば十分だが、
           DraftLibrary 側の自動計算が他 features も保存するため判定は同じに統一 */
        var cacheValid=cached && cached._v===m._v
                    && cached.vec_features_1m!==undefined
                    && cached.vec_features_5m!==undefined;
        if(cacheValid){
          featsRef.current[m.id]=cached;
          setDoneCount(i);
          setTimeout(processNext, 0);
          return;
        }
        /* 未計算 or _v 不一致 → data 読込 → vec_features 計算 → IDB 保存
           (Phase 1/2 features は DraftLibrary 自動計算と統一するため共に計算) */
        caLoadDataAsync(m.id, function(d){
          if(cancelRef.current)return;
          if(d && d.analysisData){
            var f1m=extractPhase1Features(d.analysisData, '1m');
            var f5m=extractPhase1Features(d.analysisData, '5m');
            var v1m=extractPhase2VwapFeatures(d.analysisData, '1m');
            var v5m=extractPhase2VwapFeatures(d.analysisData, '5m');
            var c1m=extractPhase3VectorFeatures(d.analysisData, '1m');
            var c5m=extractPhase3VectorFeatures(d.analysisData, '5m');
            var rec={
              id:m.id, ticker:m.ticker||'', date:m.analysisDate||m.name||'',
              savedAt:m.savedAt||0, _v:m._v||0,
              features_1m:f1m, features_5m:f5m,
              vwap_features_1m:v1m, vwap_features_5m:v5m,
              vec_features_1m:c1m, vec_features_5m:c5m,
              computedAt:Date.now()
            };
            featsRef.current[m.id]=rec;
            patFeatSet(m.id, rec);
          }
          setDoneCount(i);
          setTimeout(processNext, 50);
        });
      });
    }
    processNext();
    return function(){cancelRef.current=true;};
  }, [open, meta.length]);

  /* パラメータ変更時に結果を再計算 */
  function recomputeResults(){
    var arr=[];
    if(!queryDraftId){setResults([]);return;}
    var queryRec=featsRef.current[queryDraftId];
    if(!queryRec){setResults([]);return;}
    var qKey=tf==='5m'?'vec_features_5m':'vec_features_1m';
    var queryF=queryRec[qKey];
    if(!queryF){setResults([]);return;}
    var useDtw=paramsTemplate.algorithm==='dtw';
    for(var k in featsRef.current){
      if(k===queryDraftId)continue;  /* クエリ自身は除外 */
      var rec=featsRef.current[k];
      if(!rec)continue;
      /* 2026-05-03: 対象銘柄フィルタ (Q5:a - 計算は全銘柄、結果のみ絞り込み) */
      if(rec.ticker && !selectedTickers[rec.ticker])continue;
      var f3=rec[qKey];
      if(!f3)continue;
      var s=useDtw?scorePhase4DTW(f3, queryF, paramsTemplate)
                  :scorePhase3Template(f3, queryF, paramsTemplate);
      /* 2026-05-03: 閾値撤廃、全件をスコア降順で表示 */
      arr.push({rec:rec, features:f3, scoreObj:s});
    }
    arr.sort(function(a,b){return b.scoreObj.score-a.scoreObj.score;});
    setResults(arr);
  }
  useEffect(function(){
    if(!open || computing)return;
    recomputeResults();
  }, [tf, computing, queryDraftId, paramsTemplate.threshold, paramsTemplate.algorithm, selectedTickers]);

  if(!open)return null;
  function updateP(k, v){setParamsTemplate(function(p){var np=Object.assign({},p);np[k]=v;return np;});}
  function getThumbSrc(id){
    var m=meta.find(function(x){return x.id===id;});
    if(!m)return null;
    if(_thumbMemCache[id])return _thumbMemCache[id];
    if(m.thumbUrl)return m.thumbUrl;
    return null;
  }
  var BT={border:"none",cursor:"pointer",fontFamily:"inherit"};
  var labelStyle={fontSize:12, color:"#c4a5f7", minWidth:120, flexShrink:0};
  var rowStyle={display:"flex", alignItems:"center", gap:10, marginBottom:10};
  /* サムネサイズ: 160×100 (旧80×50の2倍) */
  var THUMB_W=480, THUMB_H=300;  /* 2026-05-03: 1倍(160x100) → 3倍に拡大 */

  /* 2026-05-03: B1 - クエリ選択ピッカー (銘柄一覧 → チャート一覧の2段階)
     pickerView==='tickers' → 銘柄一覧, ===   'charts' → 選択銘柄のチャート一覧, null → 非表示 */
  function buildPickerOverlay(){
    if(!pickerView)return null;
    /* 銘柄ごとの件数集計 */
    var tickerCounts={};
    meta.forEach(function(m){
      var t=m.ticker||'(未分類)';
      tickerCounts[t]=(tickerCounts[t]||0)+1;
    });
    var tickerList=Object.keys(tickerCounts).sort(function(a,b){return a.localeCompare(b,'ja');});
    /* 選択銘柄のチャートを年月でグルーピング */
    var charts=pickerTicker?meta.filter(function(m){return (m.ticker||'(未分類)')===pickerTicker;}):[];
    /* 2026-05-03: チャート選択画面はすべて name 降順 (= 日付降順) で固定 */
    charts.sort(function(a,b){return (b.name||'').localeCompare(a.name||'','ja');});
    var groupsP={};
    var ymKeysP=[];
    charts.forEach(function(m){
      var ym=_extractYearMonth(m);
      if(!groupsP[ym]){groupsP[ym]=[]; ymKeysP.push(ym);}
      groupsP[ym].push(m);
    });
    ymKeysP.sort(function(a,b){
      if(a==='(日付不明)')return 1;
      if(b==='(日付不明)')return -1;
      return b.localeCompare(a);
    });
    return ce("div",{
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:9550,
        display:"flex",alignItems:"center",justifyContent:"center",padding:16},
      onClick:function(){setPickerView(null);}
    },
      ce("div",{
        onClick:function(e){e.stopPropagation();},
        style:{background:"#161616",border:"1px solid #4a1e5f",borderRadius:12,
          width:"100%",maxWidth:720,maxHeight:"92vh",display:"flex",flexDirection:"column",overflow:"hidden"}},
        /* picker header */
        ce("div",{style:{padding:"12px 16px",borderBottom:"1px solid #2a2a2a",
          display:"flex",alignItems:"center",gap:10,background:"#1a1029"}},
          pickerView==='charts' && ce("button",{
            onClick:function(){setPickerView('tickers');setPickerTicker(null);},
            style:Object.assign({},BT,{fontSize:18,color:"#c4a5f7",background:"none",padding:"0 4px",lineHeight:1})},"←"),
          ce("span",{style:{fontSize:14,fontWeight:700,color:"#c4a5f7",flex:1}},
            pickerView==='tickers'?"📂 銘柄を選んでください":(pickerTicker+" のチャート")),
          /* 2026-05-03: Stage 2 のみ全展開/全折り畳みトグル */
          pickerView==='charts' && charts.length>0 && (function(){
            var byT=(pickerTicker && expandedYM[pickerTicker]) || {};
            var allOpen=true;
            ymKeysP.forEach(function(ym, idx){
              var isLatest=(idx===0);
              var openYM=(typeof byT[ym]==='boolean')?byT[ym]:isLatest;
              if(!openYM) allOpen=false;
            });
            return ce("button",{onClick:function(){onSetAllYM(pickerTicker, ymKeysP, !allOpen);},
              style:Object.assign({},BT,{fontSize:11,fontWeight:600,padding:"4px 10px",borderRadius:6,
                background:"#2a1a3a",color:"#c4a5f7",border:"1px solid #4a1e5f"})},
              allOpen?"▶ 全折り畳み":"▼ 全展開");
          })(),
          ce("button",{onClick:function(){setPickerView(null);},
            style:Object.assign({},BT,{fontSize:20,color:"#888",background:"none",padding:"0 6px",lineHeight:1})},"×")
        ),
        /* picker body */
        pickerView==='tickers'
          ? ce("div",{style:{flex:1,overflowY:"auto",padding:"10px 14px"}},
              tickerList.length===0
                ? ce("div",{style:{textAlign:"center",fontSize:13,color:"#6e7681",padding:"30px 0"}},"銘柄がありません")
                : tickerList.map(function(t){
                    return ce("div",{key:t,
                      onClick:function(){setPickerTicker(t);setPickerView('charts');},
                      style:{display:"flex",alignItems:"center",padding:"12px 14px",borderRadius:8,
                        background:"#1a1a1a",border:"1px solid #2a2a2a",marginBottom:6,cursor:"pointer"}},
                      ce("span",{style:{flex:1,color:"#e6edf3",fontSize:14,fontWeight:700}},t),
                      ce("span",{style:{fontSize:12,color:"#888"}},tickerCounts[t]+"件"),
                      ce("span",{style:{marginLeft:10,color:"#555",fontSize:14}},"›")
                    );
                  })
            )
          : ce("div",{style:{flex:1,overflowY:"auto",padding:"10px 14px"}},
              charts.length===0
                ? ce("div",{style:{textAlign:"center",fontSize:13,color:"#6e7681",padding:"30px 0"}},"チャートがありません")
                : (function(){
                    /* 2026-05-03: 月単位折り畳み (B1ピッカー Stage 2) */
                    var byT = (pickerTicker && expandedYM[pickerTicker]) || {};
                    return ymKeysP.map(function(ym, ymIdx){
                      var isLatest=(ymIdx===0);
                      var openYM=(typeof byT[ym]==='boolean')?byT[ym]:isLatest;
                      var nodesYm=[];
                      nodesYm.push(ce("div",{key:'h-'+ym,
                        onClick:function(){onToggleYM(pickerTicker, ym, openYM);},
                        style:{fontSize:12,color:"#c4a5f7",fontWeight:700,padding:"8px 0 6px",
                          borderBottom:"1px solid #2a2a2a",marginBottom:6,
                          cursor:"pointer",userSelect:"none",display:"flex",alignItems:"center",gap:6}},
                        ce("span",{style:{fontSize:11,color:"#888",width:12,display:"inline-block",textAlign:"center"}},openYM?"▼":"▶"),
                        ce("span",null,"📅 "+ym+" "),
                        ce("span",{style:{fontSize:10,color:"#666",fontWeight:400,marginLeft:6}},"("+groupsP[ym].length+"件)")
                      ));
                      if(openYM){
                        groupsP[ym].forEach(function(m){
                          var thumbSrc=getThumbSrc(m.id);
                          nodesYm.push(ce("div",{key:m.id,
                            onClick:function(){
                              setQueryDraftId(m.id);
                              setPickerView(null);
                            },
                            style:{display:"flex",gap:12,padding:"10px",borderRadius:8,
                              background:"#1a1a1a",border:"1px solid #2a2a2a",marginBottom:6,cursor:"pointer",alignItems:"center"}},
                            thumbSrc?ce("img",{src:thumbSrc,style:{width:THUMB_W,height:THUMB_H,objectFit:"cover",borderRadius:6,background:"#000",flexShrink:0},
                              onError:function(){try{caClearBrokenThumbUrl(m.id);}catch(e){}}})
                              :ce("div",{style:{width:THUMB_W,height:THUMB_H,background:"#0a0a0a",borderRadius:6,flexShrink:0,
                                display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#444"}},"no thumb"),
                            ce("div",{style:{flex:1,minWidth:0}},
                              ce("div",{style:{fontSize:13,color:"#e6edf3",fontWeight:700,
                                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},m.name||'(無題)'),
                              ce("div",{style:{fontSize:11,color:"#888",marginTop:3}},m.analysisDate||'')
                            )
                          ));
                        });
                      }
                      return ce("div",{key:'g-'+ym},nodesYm);
                    });
                  })()
            )
      )
    );
  }

  return ce(Fragment,null,
    ce("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:9500,
    display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
    ce("div",{style:{background:"#161616",border:"1px solid #4a1e5f",borderRadius:12,
      width:"100%",maxWidth:"min(1200px, 95vw)",maxHeight:"92vh",display:"flex",flexDirection:"column",overflow:"hidden"}},
      /* header */
      ce("div",{style:{padding:"14px 16px",borderBottom:"1px solid #2a2a2a",
        display:"flex",alignItems:"center",gap:10,background:"#1a1029"}},
        ce("span",{style:{fontSize:16,fontWeight:700,color:"#c4a5f7",flex:1}},"📈 チャートパターン類似検索"),
        ce("button",{onClick:function(){cancelRef.current=true;onClose();},
          style:Object.assign({},BT,{fontSize:20,color:"#888",background:"none",padding:"0 6px",lineHeight:1})},"×")
      ),
      /* params (2026-05-03: 上下paddingを縮めて結果エリアを広く) */
      ce("div",{style:{padding:"10px 16px",borderBottom:"1px solid #2a2a2a",overflowY:"auto",flexShrink:0}},
        /* 2026-05-03: B1 - クエリ選択ボタン (タップで pickerView='tickers') */
        ce("div",{style:rowStyle},
          ce("span",{style:labelStyle},"クエリチャート"),
          ce("button",{
            onClick:function(){setPickerTicker(null);setPickerView('tickers');},
            style:Object.assign({},BT,{flex:1,background:queryDraftId?"#1a1029":"#1a1a1a",
              border:"1px solid #4a1e5f",color:queryDraftId?"#c4a5f7":"#888",
              padding:"8px 10px",borderRadius:6,fontSize:12,textAlign:"left"})},
            queryDraftId
              ? (function(){
                  var qm=meta.find(function(x){return x.id===queryDraftId;});
                  return "📂 "+(qm?(qm.ticker||'?')+' / '+(qm.name||qm.analysisDate||'(無題)'):'(不明)')+"  ▾";
                })()
              : "📂 銘柄から選択 ▾"
          ),
          queryDraftId && ce("button",{
            onClick:function(){setQueryDraftId(null);},
            title:"クエリをクリア",
            style:Object.assign({},BT,{background:"#2a2a2a",color:"#888",padding:"8px 10px",borderRadius:6,fontSize:12,marginLeft:6})},"×")
        ),
        /* クエリプレビュー (2026-05-03: モーダル幅拡大に伴い横並びに、上下padding詰めて縦幅圧縮) */
        queryDraftId && (function(){
          var qm=meta.find(function(x){return x.id===queryDraftId;});
          var qThumb=getThumbSrc(queryDraftId);
          return ce("div",{style:{display:"flex",gap:12,marginBottom:8,marginLeft:130,
            padding:"6px 10px",background:"#1a1029",borderRadius:8,border:"1px solid #4a1e5f",
            alignItems:"center"}},
            qThumb?ce("img",{src:qThumb,style:{width:THUMB_W,height:THUMB_H,objectFit:"cover",borderRadius:6,background:"#000",flexShrink:0},
              onError:function(){try{caClearBrokenThumbUrl(queryDraftId);}catch(e){}}})
              :ce("div",{style:{width:THUMB_W,height:THUMB_H,background:"#0a0a0a",borderRadius:6,flexShrink:0,
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#444"}},"no thumb"),
            ce("div",{style:{flex:1,minWidth:0,fontSize:12,color:"#c4a5f7"}},
              ce("div",{style:{fontWeight:700,fontSize:14}},"クエリ: "+(qm?(qm.ticker||'?'):'?')),
              ce("div",{style:{color:"#888",marginTop:4}},qm?(qm.analysisDate||qm.name||''):'')
            )
          );
        })(),
        /* 2026-05-03: 対象銘柄選択 (ピル/タグ式、複数選択、デフォルトはクエリ銘柄のみ) */
        queryDraftId && (function(){
          var localTickerCounts={};
          meta.forEach(function(m){
            var t=m.ticker||'(未分類)';
            localTickerCounts[t]=(localTickerCounts[t]||0)+1;
          });
          var qm=meta.find(function(x){return x.id===queryDraftId;});
          var queryTicker=qm?(qm.ticker||''):'';
          /* クエリ銘柄を先頭、残りは tickers 配列順 (ホーム左サイドの並び順 = Q4:a) */
          var sortedTickerList=[];
          if(queryTicker && localTickerCounts[queryTicker]) sortedTickerList.push(queryTicker);
          tickersList.forEach(function(t){
            if(t!==queryTicker && localTickerCounts[t]) sortedTickerList.push(t);
          });
          /* tickers 配列に無い銘柄 (削除済み等) は末尾 */
          Object.keys(localTickerCounts).forEach(function(t){
            if(t!==queryTicker && sortedTickerList.indexOf(t)===-1) sortedTickerList.push(t);
          });
          var selCount=0;
          sortedTickerList.forEach(function(t){if(selectedTickers[t])selCount++;});
          return ce("div",{style:{marginLeft:130,marginBottom:10,padding:"8px 10px",
            background:"#181020",borderRadius:8,border:"1px solid #2a1a3a"}},
            ce("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}},
              ce("span",{style:{fontSize:11,color:"#c4a5f7",fontWeight:700}},"対象銘柄"),
              ce("span",{style:{fontSize:10,color:"#888"}},selCount+"/"+sortedTickerList.length+" 選択中"),

/* ─── NotepadPage ────────────────────────────────────────────────
   localStorage key: ca_notepad_entries_v1
   エントリ構造: [{id, title, html, createdAt}]  先頭=最新
   表示: デフォルト折り畳み (見出し行のみ)、▶ タップで展開 */
var CA_NP_KEY='ca_notepad_entries_v1';
function npLoadEntries(){
  try{var s=localStorage.getItem(CA_NP_KEY);if(s){var a=JSON.parse(s);if(Array.isArray(a))return a;}}catch(e){}
  return [];
}
function npSaveEntries(arr){try{localStorage.setItem(CA_NP_KEY,JSON.stringify(arr));}catch(e){}}

/* 見出し入力: blur 時のみ親に通知 (キー入力毎の再レンダリングを避ける) */
function NpTitleInput(props){
  var value=props.value||'';
  var onBlur=props.onBlur;
  var placeholder=props.placeholder||'';
  var sV=useState(value); var local=sV[0],setLocal=sV[1];
  /* 外部 value 変更時 (削除→再追加等) にローカルを同期 */
  useEffect(function(){setLocal(value);},[value]);
  return ce('input',{
    type:'text',
    value:local,
    onChange:function(e){setLocal(e.target.value);},
    onBlur:function(e){if(typeof onBlur==='function')onBlur(e.target.value);},
    placeholder:placeholder,
    style:{flex:1,background:'transparent',border:'none',outline:'none',
      color:'#e0e0e0',fontSize:14,fontWeight:600,
      padding:'0',minWidth:0,cursor:'text',
      WebkitUserSelect:'text',userSelect:'text'}
  });
}

var CA_NP_UT_KEY='ca_notepad_ut_v1';
function npLoadUt(){try{var v=parseInt(localStorage.getItem(CA_NP_UT_KEY)||'0',10);return isNaN(v)?0:v;}catch(e){return 0;}}
function npSaveUt(ut){try{localStorage.setItem(CA_NP_UT_KEY,String(ut));}catch(e){}}

function NotepadPage(props){
  var onClose=props.onClose;
  var fbCfg=props.fbCfg||{};
  var sE=useState(npLoadEntries); var entries=sE[0],setEntries=sE[1];
  /* expanded: {id: bool}  新規エントリのみ true で初期化、他は undefined=折り畳み */
  var sEx=useState({}); var expanded=sEx[0],setExpanded=sEx[1];

  /* Firebase へ全エントリを書き込む (last-write-wins) */
  function npPushToFb(arr){
    if(!fbCfg||!fbCfg.url||fbCfg.paused)return;
    var a=fbCfg.secret?'?auth='+fbCfg.secret:'';
    var base=fbCfg.url.replace(/\/$/,'');
    var ut=Date.now();
    npSaveUt(ut);
    fetch(base+'/ca-notepad.json'+a,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({entries:arr,updatedAt:ut})}).catch(function(){});
    fetch(base+'/ca-notepad-v.json'+a,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({updatedAt:ut})}).catch(function(){});
  }

  /* マウント時: バージョン確認 → 双方向マージ */
  useEffect(function(){
    if(!fbCfg||!fbCfg.url||fbCfg.paused)return;
    var a=fbCfg.secret?'?auth='+fbCfg.secret:'';
    var base=fbCfg.url.replace(/\/$/,'');
    var localUt=npLoadUt();
    var localEntries=npLoadEntries();
    fetch(base+'/ca-notepad-v.json'+a)
      .then(function(r){return r.ok?r.json():null;})
      .then(function(v){
        var remUt=(v&&typeof v.updatedAt==='number')?v.updatedAt:0;
        if(remUt>localUt){
          /* リモートが新しい → ダウンロード */
          return fetch(base+'/ca-notepad.json'+a)
            .then(function(r){return r.ok?r.json():null;})
            .then(function(d){
              if(!d||!Array.isArray(d.entries))return;
              npSaveEntries(d.entries);
              npSaveUt(d.updatedAt||remUt);
              setEntries(d.entries);
            });
        } else if(localEntries.length>0){
          /* ローカルが同等以上、またはリモートなし → アップロード */
          var ut=localUt||Date.now();
          npSaveUt(ut);
          fetch(base+'/ca-notepad.json'+a,{method:'PUT',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({entries:localEntries,updatedAt:ut})}).catch(function(){});
          fetch(base+'/ca-notepad-v.json'+a,{method:'PUT',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({updatedAt:ut})}).catch(function(){});
        }
      }).catch(function(){});
  },[]);

  /* ブラウザバック / ca_back でホームに戻る */
  useEffect(function(){
    function onBack(){onClose();}
    window.addEventListener('ca_back',onBack);
    return function(){window.removeEventListener('ca_back',onBack);};
  },[]);

  function addEntry(){
    var id='np_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    var next=[{id:id,title:'',html:'',createdAt:Date.now()}].concat(entries);
    setEntries(next); npSaveEntries(next); npPushToFb(next);
    /* 新規エントリは展開状態で表示 */
    setExpanded(function(prev){var nx=Object.assign({},prev); nx[id]=true; return nx;});
  }
  function saveTitle(id,title){
    var next=entries.map(function(e){return e.id===id?Object.assign({},e,{title:title}):e;});
    setEntries(next); npSaveEntries(next); npPushToFb(next);
  }
  function saveEntry(id,html){
    var next=entries.map(function(e){return e.id===id?Object.assign({},e,{html:html}):e;});
    setEntries(next); npSaveEntries(next); npPushToFb(next);
  }
  function deleteEntry(id){
    window.caConfirm('このメモを削除しますか？',function(){
      var next=entries.filter(function(e){return e.id!==id;});
      setEntries(next); npSaveEntries(next); npPushToFb(next);
    },null,{yesLabel:'削除',noLabel:'キャンセル',danger:true});
  }
  function toggleExpanded(id){
    setExpanded(function(prev){
      var nx=Object.assign({},prev); nx[id]=!prev[id]; return nx;
    });
  }
  function fmtDate(ts){
    var d=new Date(ts);
    var mo=String(d.getMonth()+1).padStart(2,'0');
    var day=String(d.getDate()).padStart(2,'0');
    var h=String(d.getHours()).padStart(2,'0');
    var m=String(d.getMinutes()).padStart(2,'0');
    return d.getFullYear()+'/'+mo+'/'+day+' '+h+':'+m;
  }

  return ce('div',{style:{position:'fixed',inset:0,background:'#111',color:'#fff',
    display:'flex',flexDirection:'column',zIndex:100,overflow:'hidden'}},
    /* ── ページヘッダー ── */
    ce('div',{style:{display:'flex',alignItems:'center',gap:8,
      padding:'10px 14px',background:'#1a1a1a',borderBottom:'1px solid #2a2a2a',
      flexShrink:0}},
      ce('button',{onClick:onClose,
        style:{padding:'7px 12px',fontSize:13,fontWeight:700,
          background:'#2a2a2a',color:'#aaa',border:'1px solid #333',
          borderRadius:8,cursor:'pointer',minHeight:IS_TOUCH?40:32}},'← 戻る'),
      ce('div',{style:{flex:1,fontSize:16,fontWeight:700,color:'#fff',textAlign:'center'}},'📝 メモ帳'),
      ce('button',{onClick:addEntry,
        style:{padding:'7px 14px',fontSize:13,fontWeight:700,
          background:'#2563eb',color:'#fff',border:'none',
          borderRadius:8,cursor:'pointer',minHeight:IS_TOUCH?40:32}},'＋ 追加')
    ),
    /* ── エントリ一覧 ── */
    ce('div',{style:{flex:1,overflowY:'auto',padding:'10px 14px',
      display:'flex',flexDirection:'column',gap:6}},
      entries.length===0
        ?ce('div',{style:{textAlign:'center',color:'#444',fontSize:14,marginTop:80,lineHeight:2.2}},
            ce('div',{style:{fontSize:44,marginBottom:8}},'📝'),
            ce('div',null,'まだメモがありません'),
            ce('div',{style:{fontSize:12,color:'#333'}},'右上の「＋ 追加」ボタンでメモを作成できます')
          )
        :entries.map(function(entry){
            var isOpen=!!expanded[entry.id];
            var noTitle=!(entry.title||'').trim();
            return ce('div',{key:entry.id,
              style:{background:'#1a1a1a',border:'1px solid '+(isOpen?'#3a3a3a':'#2a2a2a'),
                borderRadius:10,overflow:'hidden',
                transition:'border-color 0.15s'}},

              /* ── 見出し行 ── */
              ce('div',{style:{display:'flex',alignItems:'center',gap:6,
                padding:'10px 12px',
                borderBottom:isOpen?'1px solid #2a2a2a':'none',
                background:isOpen?'#202020':'transparent'}},

                /* 見出し入力 */
                ce(NpTitleInput,{
                  key:'title_'+entry.id,
                  value:entry.title||'',
                  placeholder:'見出しを入力…',
                  onBlur:function(v){saveTitle(entry.id,v);}
                }),

                /* 日時 (小さく右寄せ) */
                ce('span',{style:{fontSize:10,color:'#444',flexShrink:0,whiteSpace:'nowrap'}},
                  fmtDate(entry.createdAt)),

                /* 展開トグル △▽ */
                ce('button',{
                  onClick:function(){toggleExpanded(entry.id);},
                  title:isOpen?'折り畳む':'展開する',
                  style:{
                    width:28,height:28,flexShrink:0,
                    display:'flex',alignItems:'center',justifyContent:'center',
                    background:'transparent',border:'1px solid #333',borderRadius:6,
                    cursor:'pointer',padding:0,
                    transition:'transform 0.2s'}},
                  /* SVG 三角形: 右向き→展開時は90°回転で下向き */
                  ce('svg',{
                    width:10,height:10,viewBox:'0 0 10 10',
                    style:{
                      display:'block',
                      fill:isOpen?'#a5b4fc':'#666',
                      transform:isOpen?'rotate(90deg)':'rotate(0deg)',
                      transition:'transform 0.2s, fill 0.15s'}},
                    ce('polygon',{points:'2,1 9,5 2,9'})
                  )
                ),

                /* 削除 */
                ce('button',{
                  onClick:function(){deleteEntry(entry.id);},
                  style:{width:28,height:28,flexShrink:0,
                    display:'flex',alignItems:'center',justifyContent:'center',
                    background:'transparent',color:'#555',border:'1px solid #333',
                    borderRadius:6,cursor:'pointer',fontSize:13,padding:0}
                },'🗑')
              ),

              /* ── 内容 (展開時のみ) ── */
              isOpen&&ce('div',{style:{padding:'10px 12px'}},
                ce(CaMemoEditableField,{
                  key:'npe_'+entry.id,
                  html:entry.html,
                  placeholder:'クリックして編集… (テキスト装飾・画像の貼り付け可)',
                  guardOwner:'np_'+entry.id,
                  hideEditButton:true,
                  autoEdit:!entry.html,
                  onSave:function(h){saveEntry(entry.id,h);}
                })
              )
            );
          })
    )
  );
}

/* ─── CaCalendarModal: カレンダーからチャートを探す ─── */
function CaCalendarModal(props){
  var charts=props.charts||[];
  var onOpenChart=props.onOpenChart||function(){};
  var onClose=props.onClose||function(){};

  /* デフォルト表示月: 最新チャートの月、なければ今月 */
  function _resolveDate(m){
    var ad=m.analysisDate||'';
    if(/^\d{4}-\d{2}-\d{2}$/.test(ad))return ad;
    var r=ad.match(/^(\d{4})(\d{2})(\d{2})$/);
    if(r)return r[1]+'-'+r[2]+'-'+r[3];
    var n=m.name||'';
    var r2=n.match(/(?:^|[_\-])(\d{4})-(\d{2})-(\d{2})/);
    if(r2)return r2[1]+'-'+r2[2]+'-'+r2[3];
    var r3=n.match(/_(\d{4})(\d{2})(\d{2})(?:[._]|$)/);
    if(r3)return r3[1]+'-'+r3[2]+'-'+r3[3];
    return '';
  }
  var latestDate=null;
  charts.forEach(function(m){var d=_resolveDate(m);if(d&&(!latestDate||d>latestDate))latestDate=d;});
  var defYear,defMonth;
  if(latestDate){var pts=latestDate.split('-');defYear=parseInt(pts[0],10);defMonth=parseInt(pts[1],10)-1;}
  else{var _nd=new Date();defYear=_nd.getFullYear();defMonth=_nd.getMonth();}

  var sY=useState(defYear);   var year=sY[0],setYear=sY[1];
  var sMo=useState(defMonth); var month=sMo[0],setMonth=sMo[1]; /* 0-based */
  var sSel=useState(latestDate||null); var selDate=sSel[0],setSelDate=sSel[1];

  /* date -> [chart] マップ */
  var dateMap={};
  charts.forEach(function(m){
    var d=_resolveDate(m);
    if(!d)return;
    if(!dateMap[d])dateMap[d]=[];
    dateMap[d].push(m);
  });

  /* カレンダーグリッド計算 */
  var firstDOW=new Date(year,month,1).getDay(); /* 0=日 */
  var daysInMonth=new Date(year,month+1,0).getDate();
  var cells=[];
  for(var _i=0;_i<firstDOW;_i++)cells.push(null);
  for(var _d=1;_d<=daysInMonth;_d++)cells.push(_d);
  while(cells.length%7!==0)cells.push(null);

  var MNAMES=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var DNAMES=['日','月','火','水','木','金','土'];

  function pad2(n){return n<10?'0'+n:''+n;}
  function makeDS(d){return year+'-'+pad2(month+1)+'-'+pad2(d);}

  var todayD=new Date();
  var todayStr=todayD.getFullYear()+'-'+pad2(todayD.getMonth()+1)+'-'+pad2(todayD.getDate());

  function prevMonth(){if(month===0){setMonth(11);setYear(year-1);}else setMonth(month-1);setSelDate(null);}
  function nextMonth(){if(month===11){setMonth(0);setYear(year+1);}else setMonth(month+1);setSelDate(null);}

  var selCharts=selDate?(dateMap[selDate]||[]).slice().sort(function(a,b){return(b.savedAt||0)-(a.savedAt||0);}):[];

  /* メモ・タグ表示用ヘルパー (右パネル) */
  var _calTagDefs=caLoadTagDefs();
  var _calTagDefsById={};
  _calTagDefs.forEach(function(d){_calTagDefsById[d.id]=d;});
  var _calTagMap=caLoadTagMap();
  function _calStripHtml(html){
    if(!html)return '';
    return html.replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&')
      .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();
  }

  return ReactDOM.createPortal(
    ce('div',{
      style:{position:'fixed',inset:0,zIndex:10050,background:'rgba(0,0,0,0.72)',
        display:'flex',alignItems:'center',justifyContent:'center',padding:12},
      onMouseDown:function(e){if(e.target===e.currentTarget)onClose();}
    },
      ce('div',{style:{background:'#1a1a1a',borderRadius:12,border:'1px solid #333',
        boxShadow:'0 8px 40px rgba(0,0,0,.9)',display:'flex',flexDirection:'row',
        overflow:'hidden',maxWidth:860,width:'100%',maxHeight:'min(78vh,580px)'}},

        /* 左: カレンダー */
        ce('div',{style:{padding:16,minWidth:260,maxWidth:300,flexShrink:0,
          borderRight:'1px solid #2a2a2a',display:'flex',flexDirection:'column',gap:0}},

          /* 月ナビ */
          ce('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:10}},
            ce('button',{onClick:prevMonth,style:{background:'#2a2a2a',border:'none',color:'#ccc',
              borderRadius:6,cursor:'pointer',padding:'4px 11px',fontSize:17,lineHeight:1}},'‹'),
            ce('span',{style:{flex:1,textAlign:'center',fontSize:14,fontWeight:700,color:'#eee'}},
              year+'年 '+MNAMES[month]),
            ce('button',{onClick:nextMonth,style:{background:'#2a2a2a',border:'none',color:'#ccc',
              borderRadius:6,cursor:'pointer',padding:'4px 11px',fontSize:17,lineHeight:1}},'›')
          ),

          /* 曜日ヘッダ */
          ce('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:1,marginBottom:2}},
            DNAMES.map(function(d,i){
              return ce('div',{key:i,style:{textAlign:'center',fontSize:10,fontWeight:700,padding:'1px 0',
                color:i===0?'#ef4444':i===6?'#60a5fa':'#666'}},d);
            })
          ),

          /* 日付グリッド */
          ce('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:1}},
            cells.map(function(d,i){
              if(!d)return ce('div',{key:'e'+i});
              var ds=makeDS(d);
              var hasDot=!!dateMap[ds];
              var isSel=selDate===ds;
              var isToday=todayStr===ds;
              var dow=i%7;
              var isWeekend=dow===0||dow===6;
              return ce('div',{key:i,
                onClick:function(){if(hasDot)setSelDate(ds);},
                style:{position:'relative',textAlign:'center',padding:'7px 3px 8px',
                  borderRadius:4,cursor:hasDot?'pointer':'default',
                  background:isSel?'#6366F1':(isToday?'#1e1b4b':'transparent'),
                  color:isSel?'#fff':(isWeekend?(dow===0?'#ef4444':'#60a5fa'):(hasDot?'#ddd':'#444')),
                  fontWeight:hasDot?700:400,fontSize:13,userSelect:'none'}},
                d,
                hasDot&&ce('span',{style:{position:'absolute',bottom:2,left:'50%',
                  transform:'translateX(-50%)',width:4,height:4,borderRadius:'50%',
                  background:isSel?'rgba(255,255,255,0.8)':'#ef4444',display:'block'}})
              );
            })
          )
        ),

        /* 右: 選択日のチャート */
        ce('div',{style:{flex:1,padding:16,display:'flex',flexDirection:'column',

                        var memoHtml=caGetChartMemo(m.id);

                        return ce('div',{key:m.id||idx,

                            overflow:'hidden',background:'#111',flexShrink:0}},
                          thumb

                                  maxHeight:'min(55vh,420px)',
                                  objectFit:'contain',background:'#000'},

                          (caTids.length>0||snTags.length>0)&&ce('div',{
                            style:{padding:'5px 8px 2px',display:'flex',flexWrap:'wrap',gap:4}},
                            caTids.map(function(tid){

                              return ce('span',{key:'sn'+si,style:{fontSize:10,padding:'2px 7px',
                                borderRadius:10,background:'#1c1f3a',color:'#a5b4fc',fontWeight:700,
                                whiteSpace:'nowrap',border:'1px solid #3730a3'}},

                          memoText&&ce('div',{style:{padding:'3px 8px 4px',fontSize:11,color:'#888',
