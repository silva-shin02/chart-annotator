                            alignItems:'center',gap:6}},
                            ce('span',{style:{flex:1,fontSize:10,color:'#999',overflow:'hidden',
                              textOverflow:'ellipsis',whiteSpace:'nowrap'}},m.name||''),
                            ce('button',{
                              onClick:function(){onOpenChart(m.id);onClose();},
                              style:{background:'#6366F1',color:'#fff',border:'none',
                                borderRadius:5,cursor:'pointer',fontSize:11,fontWeight:700,
                                padding:'5px 10px',flexShrink:0,whiteSpace:'nowrap'}},
                              'この日のチャートを開く')
                          )
                        );
                      })
                    )
              )
            : ce('div',{style:{flex:1,display:'flex',alignItems:'center',
                justifyContent:'center',color:'#444',fontSize:13}},
                '← 日付を選択してください'),
          ce('div',{style:{flexShrink:0,marginTop:10,display:'flex',justifyContent:'flex-end'}},
            ce('button',{onClick:onClose,
              style:{background:'#2a2a2a',color:'#aaa',border:'none',borderRadius:6,
                cursor:'pointer',fontSize:12,padding:'6px 14px'}},
              '閉じる')
          )
        )
      )
    ),
    document.body
  );
}

/* ─── CaStampLogModal: スタンプ記録の一元ビュー ───
   「どのスタンプがどの銘柄のどの日のどの時間に貼られたか」を集約表示 */
function CaStampLogModal(props){
  var charts=props.charts||[];   /* meta[] (全チャート) */
  var onOpenChart=props.onOpenChart||function(){};
  var onClose=props.onClose||function(){};

  var snippets=useMemo(function(){return caLoadSnippets();},[]);
  var snippetsById=useMemo(function(){var m={};snippets.forEach(function(s){if(s&&s.id)m[s.id]=s;});return m;},[snippets]);

  var sPl=useState(null); var placements=sPl[0],setPlacements=sPl[1]; /* null=ロード中 */
  var sSel=useState('__all__'); var selKey=sSel[0],setSelKey=sSel[1];

  useEffect(function(){
    var alive=true;
    caCollectStampPlacements(charts, snippetsById, function(res){ if(alive)setPlacements(res); });
    return function(){alive=false;};
  },[charts,snippetsById]);

  /* スタンプ種別ごとにグルーピング (key=snipId||'txt:'+text) */
  var groups=useMemo(function(){
    var g={}; var order=[];
    (placements||[]).forEach(function(p){
      var key=p.snipId?('id:'+p.snipId):('txt:'+p.text);
      if(!g[key]){g[key]={key:key,label:p.text||'(無題)',color:p.color,items:[]};order.push(key);}
      g[key].items.push(p);
    });
    order.sort(function(a,b){return g[b].items.length-g[a].items.length;});
    return {map:g,order:order};
  },[placements]);

  /* 表示中リスト (日付降順→時刻昇順) */
  var shown=useMemo(function(){
    var list=(selKey==='__all__')?(placements||[]).slice():((groups.map[selKey]&&groups.map[selKey].items)||[]).slice();
    list.sort(function(a,b){
      var dc=(b.date||'').localeCompare(a.date||'');
      if(dc!==0)return dc;
      return (a.tipTm||0)-(b.tipTm||0);
    });
    return list;
  },[selKey,placements,groups]);

  var BT={border:'none',cursor:'pointer',fontFamily:'inherit'};
  var total=(placements||[]).length;

  return ReactDOM.createPortal(
    ce('div',{onClick:onClose,
      style:{position:'fixed',inset:0,background:'rgba(0,0,0,.78)',zIndex:3000,
        display:'flex',alignItems:'center',justifyContent:'center',padding:16}},
      ce('div',{onClick:function(e){e.stopPropagation();},
        style:{background:'#1a1a1a',borderRadius:14,boxShadow:'0 8px 40px rgba(0,0,0,.9)',
          display:'flex',flexDirection:'column',maxWidth:880,width:'100%',
          maxHeight:'min(85vh,660px)',overflow:'hidden'}},
        /* ヘッダー */
        ce('div',{style:{padding:'12px 16px 10px',borderBottom:'1px solid #2a2a2a',
          display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}},
          ce('div',{style:{fontWeight:700,fontSize:14,color:'#fff'}},'📍 スタンプ記録',
            ce('span',{style:{color:'#666',fontWeight:400,fontSize:12,marginLeft:8}},
              placements==null?'読み込み中…':(total+'件'))),
          ce('button',{onClick:onClose,
            style:Object.assign({},BT,{background:'none',color:'#888',fontSize:18,padding:'0 4px'})},'✕')
        ),
        placements==null
          ?ce('div',{style:{padding:'48px 24px',textAlign:'center',color:'#666',fontSize:13}},'集計中…')
          :total===0
            ?ce('div',{style:{padding:'48px 24px',textAlign:'center',color:'#555',fontSize:13}},
                '矢印付きスタンプがまだありません')
            :ce('div',{style:{display:'flex',flex:1,minHeight:0,overflow:'hidden'}},
              /* 左: スタンプ種別 */
              ce('div',{style:{width:200,borderRight:'1px solid #2a2a2a',overflowY:'auto',
                padding:'8px 0',flexShrink:0}},
                ce('button',{onClick:function(){setSelKey('__all__');},
                  style:Object.assign({},BT,{display:'flex',alignItems:'center',gap:7,width:'100%',
                    padding:'8px 12px',textAlign:'left',background:selKey==='__all__'?'#1e2a3a':'transparent'})},
                  ce('span',{style:{fontSize:12,fontWeight:700,flex:1,
                    color:selKey==='__all__'?'#93c5fd':'#ddd'}},'すべて'),
                  ce('span',{style:{fontSize:10,color:'#555'}},total)),
                ce('div',{style:{margin:'4px 12px',borderTop:'1px solid #2a2a2a'}}),
                groups.order.map(function(key){
                  var g=groups.map[key]; var isSel=selKey===key;
                  return ce('button',{key:key,onClick:function(){setSelKey(key);},
                    style:Object.assign({},BT,{display:'flex',alignItems:'center',gap:7,width:'100%',
                      padding:'7px 12px',textAlign:'left',background:isSel?'#1e2a3a':'transparent'})},
                    ce('span',{style:{width:9,height:9,borderRadius:'50%',flexShrink:0,
                      background:g.color||'#ff9500',display:'inline-block'}}),
                    ce('span',{style:{fontSize:12,flex:1,color:isSel?'#93c5fd':'#ccc',
                      overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},g.label),
                    ce('span',{style:{fontSize:10,color:'#555',flexShrink:0}},g.items.length));
                })
              ),
              /* 右: 配置リスト (テーブル) */
              ce('div',{style:{flex:1,overflowY:'auto',padding:'10px 12px'}},
                ce('div',{style:{fontSize:11,color:'#888',marginBottom:8}},
                  (selKey==='__all__'?'すべて':(groups.map[selKey]?groups.map[selKey].label:''))+' — '+shown.length+'件'),
                ce('div',{style:{display:'flex',flexDirection:'column',gap:5}},
                  shown.map(function(p,i){
                    return ce('button',{key:p.chartId+'_'+p.tf+'_'+i,
                      onClick:function(){onOpenChart(p.chartId);onClose();},
                      style:Object.assign({},BT,{display:'flex',alignItems:'center',gap:10,
                        padding:'8px 10px',background:'#111',borderRadius:8,border:'1px solid #2a2a2a',
                        textAlign:'left',width:'100%'})},
                      ce('span',{style:{fontSize:13,fontWeight:700,color:p.color||'#ff9500',
                        minWidth:46,flexShrink:0}},p.time||'--:--'),
                      ce('span',{style:{fontSize:12,color:'#ddd',fontWeight:600,minWidth:78,flexShrink:0,
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.ticker||'—'),
                      ce('span',{style:{fontSize:11,color:'#888',minWidth:84,flexShrink:0}},p.date||'日付不明'),
                      selKey==='__all__'&&ce('span',{style:{fontSize:11,color:'#aaa',flex:1,
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.text||''),
                      ce('span',{style:{fontSize:10,color:'#555',flexShrink:0}},p.tf)
                    );
                  })
                )
              )
            )
      )
    ),
    document.body
  );
}

/* ─── CaTagSearchModal: タグからチャートを探す (CA タグ + SN タグ) ─── */
function CaTagSearchModal(props){
  var ticker=props.ticker||'';  /* 表示用ラベルのみ、フィルタには使わない */
  var charts=props.charts||[];  /* DraftLibrary から渡された全チャート or 銘柄フィルタ済み */
  var onOpenChart=props.onOpenChart||function(){};
  var onClose=props.onClose||function(){};

  function _stripHtml(h){
    if(!h)return'';
    return h.replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&')
            .replace(/\s+/g,' ').trim();
  }

  var sSel=useState(null); var selTag=sSel[0],setSelTag=sSel[1];

  /* CA タグ定義 & マップ (1回だけ読む) */
  var tagDefs=useMemo(function(){return caLoadTagDefs();},[]);
  var tagMap =useMemo(function(){return caLoadTagMap(); },[]);

  /* CA タグ → チャートリスト */
  var caTagCharts=useMemo(function(){
    var m={};
    tagDefs.forEach(function(td){m[td.id]=[];});
    charts.forEach(function(c){
      (tagMap[c.id]||[]).forEach(function(tid){if(m[tid])m[tid].push(c);});
    });
    return m;
  },[charts,tagDefs,tagMap]);

  var activeCaTags=useMemo(function(){
    return tagDefs.filter(function(td){return(caTagCharts[td.id]||[]).length>0;});
  },[tagDefs,caTagCharts]);

  /* SN タグ → チャートリスト */
  var snTagCharts=useMemo(function(){
    var m={};
    charts.forEach(function(c){
      var date=_caResolveMetaDate(c);
      if(!date||!c.ticker)return;
      try{
        var tags=caLoadSnChartShapeTags(c.ticker,date);
        tags.forEach(function(t){if(!m[t])m[t]=[];m[t].push(c);});
      }catch(e){}
    });
    return m;
  },[charts]);

  var snTagKeys=useMemo(function(){return Object.keys(snTagCharts);},[snTagCharts]);

  /* スタンプ (矢印付) → チャートリスト (非同期収集) */
  var snippetsById=useMemo(function(){var m={};caLoadSnippets().forEach(function(s){if(s&&s.id)m[s.id]=s;});return m;},[]);
  var sStamp=useState({}); var stampGroups=sStamp[0],setStampGroups=sStamp[1];
  useEffect(function(){
    var alive=true;
    var chartById={}; charts.forEach(function(c){chartById[c.id]=c;});
    caCollectStampPlacements(charts, snippetsById, function(res){
      if(!alive)return;
      var g={};
      res.forEach(function(p){
        var key=p.snipId?('id:'+p.snipId):('txt:'+p.text);
        if(!g[key]){g[key]={key:key,label:p.text||'(無題)',color:p.color,ids:{},charts:[]};}
        var c=chartById[p.chartId];
        if(c&&!g[key].ids[p.chartId]){g[key].ids[p.chartId]=1;g[key].charts.push(c);}
      });
      setStampGroups(g);
    });
    return function(){alive=false;};
  },[charts,snippetsById]);
  var stampKeys=useMemo(function(){
    return Object.keys(stampGroups).sort(function(a,b){return stampGroups[b].charts.length-stampGroups[a].charts.length;});
  },[stampGroups]);

  /* tagDefs を id → def にしたマップ */
  var tagDefsById=useMemo(function(){
    var m={};tagDefs.forEach(function(d){m[d.id]=d;});return m;
  },[tagDefs]);

  /* 選択タグに合致するチャート (日付降順) */
  var matched=useMemo(function(){
    if(!selTag)return[];
    var list=selTag.type==='ca'
      ?(caTagCharts[selTag.id]||[]).slice()
      :selTag.type==='stamp'
        ?((stampGroups[selTag.key]&&stampGroups[selTag.key].charts)||[]).slice()
        :(snTagCharts[selTag.key]||[]).slice();
    list.sort(function(a,b){
      var da=_caResolveMetaDate(a)||'';
      var db=_caResolveMetaDate(b)||'';
      return db.localeCompare(da);
    });
    return list;
  },[selTag,caTagCharts,snTagCharts,stampGroups]);

  var hasTags=activeCaTags.length>0||snTagKeys.length>0||stampKeys.length>0;
  var BT={border:'none',cursor:'pointer',fontFamily:'inherit'};

  return ce('div',{onClick:onClose,
      style:{position:'fixed',inset:0,background:'rgba(0,0,0,.78)',zIndex:10500,
        display:'flex',alignItems:'center',justifyContent:'center',padding:16}},
      ce('div',{onClick:function(e){e.stopPropagation();},
        style:{background:'#1a1a1a',borderRadius:14,
          boxShadow:'0 8px 40px rgba(0,0,0,.9)',
          display:'flex',flexDirection:'column',
          maxWidth:840,width:'100%',
          maxHeight:'min(82vh,640px)',overflow:'hidden'}},

        /* ヘッダー */
        ce('div',{style:{padding:'12px 16px 10px',borderBottom:'1px solid #2a2a2a',
          display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}},
          ce('div',{style:{fontWeight:700,fontSize:14,color:'#fff'}},
            '🏷 タグから探す',
            ticker&&ce('span',{style:{color:'#666',fontWeight:400,fontSize:12,marginLeft:8}},'— '+ticker)
          ),
          ce('button',{onClick:onClose,
            style:Object.assign({},BT,{background:'none',color:'#888',fontSize:18,padding:'0 4px'})},
            '✕')
        ),

        /* ボディ */
        !hasTags
          ?ce('div',{style:{padding:'40px 24px',textAlign:'center',color:'#555',fontSize:13}},
              'タグがまだありません')
          :ce('div',{style:{display:'flex',flex:1,minHeight:0,overflow:'hidden'}},

            /* 左: タグ一覧 */
            ce('div',{style:{width:195,borderRight:'1px solid #2a2a2a',
              overflowY:'auto',padding:'8px 0',flexShrink:0}},
              activeCaTags.length>0&&ce('div',null,
                ce('div',{style:{padding:'4px 12px 5px',fontSize:10,fontWeight:700,
                  color:'#555',letterSpacing:1,textTransform:'uppercase'}},'CA タグ'),
                activeCaTags.map(function(td){
                  var isSel=selTag&&selTag.type==='ca'&&selTag.id===td.id;
                  var cnt=(caTagCharts[td.id]||[]).length;
                  return ce('button',{key:td.id,
                    onClick:function(){setSelTag({type:'ca',id:td.id});},
                    style:Object.assign({},BT,{display:'flex',alignItems:'center',gap:7,
                      width:'100%',padding:'7px 12px',textAlign:'left',
                      background:isSel?'#1e2a3a':'transparent'})},
                    ce('span',{style:{width:9,height:9,borderRadius:'50%',flexShrink:0,
                      background:td.color,display:'inline-block'}}),
                    ce('span',{style:{fontSize:12,flex:1,
                      color:isSel?'#93c5fd':'#ccc',
                      overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},td.name),
                    ce('span',{style:{fontSize:10,color:'#555',flexShrink:0}},cnt)
                  );
                })
              ),
              snTagKeys.length>0&&ce('div',null,
                activeCaTags.length>0&&ce('div',{style:{margin:'6px 12px',borderTop:'1px solid #2a2a2a'}}),
                ce('div',{style:{padding:'4px 12px 5px',fontSize:10,fontWeight:700,
                  color:'#555',letterSpacing:1,textTransform:'uppercase'}},'SN タグ'),
                snTagKeys.map(function(t){
                  var isSel=selTag&&selTag.type==='sn'&&selTag.key===t;
                  var cnt=(snTagCharts[t]||[]).length;
                  var _i=t.indexOf(':'); var label=_i>=0?t.slice(_i+1):t;
                  return ce('button',{key:t,
                    onClick:function(){setSelTag({type:'sn',key:t,label:label});},
                    style:Object.assign({},BT,{display:'flex',alignItems:'center',gap:7,
                      width:'100%',padding:'7px 12px',textAlign:'left',
                      background:isSel?'#1c1f3a':'transparent'})},
                    ce('span',{style:{fontSize:10,color:'#a5b4fc',flexShrink:0}},'✦'),
                    ce('span',{style:{fontSize:12,flex:1,
                      color:isSel?'#a5b4fc':'#ccc',
                      overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},label),
                    ce('span',{style:{fontSize:10,color:'#555',flexShrink:0}},cnt)
                  );
                })
              ),
              stampKeys.length>0&&ce('div',null,
                (activeCaTags.length>0||snTagKeys.length>0)&&ce('div',{style:{margin:'6px 12px',borderTop:'1px solid #2a2a2a'}}),
                ce('div',{style:{padding:'4px 12px 5px',fontSize:10,fontWeight:700,
                  color:'#555',letterSpacing:1,textTransform:'uppercase'}},'スタンプ'),
                stampKeys.map(function(k){
                  var g=stampGroups[k];
                  var isSel=selTag&&selTag.type==='stamp'&&selTag.key===k;
                  return ce('button',{key:k,
                    onClick:function(){setSelTag({type:'stamp',key:k,label:g.label});},
                    style:Object.assign({},BT,{display:'flex',alignItems:'center',gap:7,
                      width:'100%',padding:'7px 12px',textAlign:'left',
                      background:isSel?'#1e2a3a':'transparent'})},
                    ce('span',{style:{fontSize:10,color:g.color||'#ff9500',flexShrink:0}},'📍'),
                    ce('span',{style:{fontSize:12,flex:1,
                      color:isSel?'#93c5fd':'#ccc',
                      overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},g.label),
                    ce('span',{style:{fontSize:10,color:'#555',flexShrink:0}},g.charts.length)
                  );
                })
              )
            ),

            /* 右: 結果チャート */
            ce('div',{style:{flex:1,overflowY:'auto',padding:12}},
              !selTag
                ?ce('div',{style:{padding:'40px 16px',textAlign:'center',color:'#555',fontSize:13}},
                    '← タグを選択してください')
                :matched.length===0
                  ?ce('div',{style:{padding:24,color:'#555',fontSize:13}},'該当チャートなし')
                  :ce('div',null,
                      ce('div',{style:{fontSize:11,color:'#888',marginBottom:8}},
                        (selTag.type==='ca'
                          ?(tagDefsById[selTag.id]?tagDefsById[selTag.id].name:'')
                          :(selTag.label||''))+' — '+matched.length+'件'),
                      ce('div',{style:{display:'flex',flexDirection:'column',gap:10}},
                        matched.map(function(m){
                          var thumb=_thumbMemCache[m.id]||m.thumbUrl||m.thumb||null;
                          var date=_caResolveMetaDate(m);
                          var caTids=tagMap[m.id]||[];
                          var snTags=date&&m.ticker?caLoadSnChartShapeTags(m.ticker,date):[];
                          var memoText=_stripHtml(caGetChartMemo(m.id));
                          return ce('div',{key:m.id,

                                  style:{width:'100%',display:'block',
                                    maxHeight:'min(45vh,320px)',
                                    objectFit:'contain',background:'#000'},
                                  onError:function(e){e.target.style.display='none';}})
                              :ce('div',{style:{width:'100%',height:70,background:'#1e1e1e',
                                  display:'flex',alignItems:'center',justifyContent:'center',
                                  color:'#444',fontSize:11}},'サムネイルなし'),
                            (caTids.length>0||snTags.length>0)&&ce('div',{
                              style:{padding:'5px 8px 2px',display:'flex',flexWrap:'wrap',gap:4}},
                              caTids.map(function(tid){
                                var td=tagDefsById[tid]; if(!td)return null;
                                return ce('span',{key:tid,style:{fontSize:10,padding:'2px 7px',
                                  borderRadius:10,background:td.color,color:'#fff',fontWeight:700,
                                  whiteSpace:'nowrap'}},td.name);
                              }),
                              snTags.map(function(t,si){
                                var _i=t.indexOf(':'); var lbl=_i>=0?t.slice(_i+1):t;
                                return ce('span',{key:'sn'+si,style:{fontSize:10,padding:'2px 7px',
                                  borderRadius:10,background:'#1c1f3a',color:'#a5b4fc',fontWeight:700,

    var pending=needRestore.length;
    var anyRestored=false;
    function onDone(){
      pending--;
      if(pending<=0&&anyRestored){setMeta(function(prev){return prev.slice();});}
    }
    needRestore.forEach(function(m){
      idbGet('thumb_'+m.id,function(val){
        if(val){
          _thumbMemCache[m.id]=val;
          anyRestored=true;
          onDone();
        } else if(m.thumbUrl){
          // IDBにない & thumbUrlあり → Firebase StorageからDLしてキャッシュ
          var tImg=new Image();
          tImg.crossOrigin='anonymous';
          tImg.onload=function(){
            var W=Math.min(tImg.width,800),ratio=W/tImg.width,H=Math.round(tImg.height*ratio);
            var tc=document.createElement('canvas');tc.width=W;tc.height=H;
            var tctx=tc.getContext('2d');tctx.imageSmoothingEnabled=true;tctx.imageSmoothingQuality='high';
            tctx.drawImage(tImg,0,0,W,H);
            try{
              var thumb=tc.toDataURL('image/png');
              caSaveThumb(m.id,thumb);
              anyRestored=true;
            }catch(e){
              if(!window._caCorsWarned){window._caCorsWarned=true;
                console.warn('[CORS] thumb cache failed. Firebase Storage bucket に CORS設定が必要');}
            }
            onDone();
          };
          tImg.onerror=function(){onDone();};
          tImg.src=m.thumbUrl;
        } else {
          /* IDBにもthumbUrlもない → データからサムネ再生成 + Storage UL */
          caLoadDataAsync(m.id,function(d){
            if(d&&d.analysisData){
              generateAnalysisThumb(d.analysisData,function(thumb){
                if(thumb){
                  caSaveThumb(m.id,thumb);anyRestored=true;
                  if(fbCfg&&fbCfg.storageBucket&&!_fbIsPaused(fbCfg)){
                    uploadThumbToStorage(fbCfg,m.id,thumb).then(function(thumbUrl){
                      if(thumbUrl){
                        setMeta(function(prev){
                          var nm=prev.map(function(x){return x.id===m.id?Object.assign({},x,{thumbUrl:thumbUrl}):x;});
                          caSaveMeta(nm);return nm;
                        });
                        fetch(fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts/'+m.id+'.json'+(fbCfg.secret?'?auth='+fbCfg.secret:''),{
                          method:'PATCH',headers:{'Content-Type':'application/json'},
                          body:JSON.stringify({thumbUrl:thumbUrl})
                        })["catch"](function(e){console.error('regen thumbUrl patch:',e);});
                      }
                    });
                  }
                }
                onDone();
              });
            } else {onDone();}
          });
        }
      });
    });
  },[]);

  // ── サムネイル再生成: thumbUrlが無いアイテムのサムネイルをデータから生成→Storage UL ──
  useEffect(function(){
    var current=caLoadMeta();
    var missing=current.filter(function(m){return !m.thumbUrl&&!_thumbMemCache[m.id];});
    if(!missing.length)return;
    var auth=fbCfg.secret?'?auth='+fbCfg.secret:'';
    var dataBase=fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-data':'';
    var idx=0;

    function genThumb(m,src){
      var tImg=new Image();
      /* 2026-04-20 C11: Storage URL由来の画像は crossOrigin必要 */
      if(src.indexOf('data:')!==0)tImg.crossOrigin='anonymous';
      tImg.onload=function(){
        var W=Math.min(tImg.width,800),ratio=W/tImg.width,H=Math.round(tImg.height*ratio);
        var tc=document.createElement('canvas');tc.width=W;tc.height=H;
        var tctx=tc.getContext('2d');tctx.imageSmoothingEnabled=true;tctx.imageSmoothingQuality='high';
        tctx.drawImage(tImg,0,0,W,H);
        try{
          var thumb=tc.toDataURL('image/png');
          caSaveThumb(m.id,thumb);
          setMeta(function(prev){return prev.map(function(x){return x.id===m.id?Object.assign({},x,{thumb:null}):x;});});
          // Firebase Storageにアップロード→thumbUrlをmetaに保存
          uploadThumbToStorage(fbCfg,m.id,thumb).then(function(thumbUrl){
            if(thumbUrl){
              setMeta(function(prev){
                var nm=prev.map(function(x){return x.id===m.id?Object.assign({},x,{thumbUrl:thumbUrl}):x;});
                caSaveMeta(nm); return nm;
              });
            }
          });
        }catch(e){
          if(!window._caCorsWarned){window._caCorsWarned=true;
            console.warn('[CORS] thumb regen failed. Firebase Storage bucketにCORS設定が必要');}
        }
        setTimeout(processNext,100);
      };
      tImg.onerror=function(){setTimeout(processNext,100);};
      tImg.src=src;
    }

    function processNext(){
      if(idx>=missing.length)return;
      var m=missing[idx]; idx++;
      caLoadDataAsync(m.id,function(d){
        if(d&&(d.orig_base64||d.base64)){
          genThumb(m,'data:'+(d.orig_mt||d.mt||'image/png')+';base64,'+(d.orig_base64||d.base64));
          return;
        }
        if(d&&d.analysisData){
          generateAnalysisThumb(d.analysisData,function(thumb){
            if(thumb){
              caSaveThumb(m.id,thumb);
              setMeta(function(prev){return prev.slice();});
              /* Storage UL → Firebase meta に thumbUrl を PATCH */
              if(fbCfg&&fbCfg.storageBucket&&!_fbIsPaused(fbCfg)){
                uploadThumbToStorage(fbCfg,m.id,thumb).then(function(thumbUrl){
                  if(thumbUrl){
                    setMeta(function(prev){
                      var nm=prev.map(function(x){return x.id===m.id?Object.assign({},x,{thumbUrl:thumbUrl}):x;});
                      caSaveMeta(nm);return nm;
                    });
                    fetch(fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts/'+m.id+'.json'+(fbCfg.secret?'?auth='+fbCfg.secret:''),{
                      method:'PATCH',headers:{'Content-Type':'application/json'},
                      body:JSON.stringify({thumbUrl:thumbUrl})
                    })["catch"](function(e){console.error('regen thumbUrl patch:',e);});
                  }
                });
              }
            }
            setTimeout(processNext,100);
          });
          return;
        }
        if(dataBase&&!_fbIsPaused(fbCfg)){
        fetch(dataBase+'/'+m.id+'.json'+auth).then(function(r){return r.ok?r.json():null;})
        .then(function(fbData){
          if(!fbData){processNext();return;}
          /* データをIDBにキャッシュ (次回リロード時のサムネ再生成高速化) */
          caSaveData(m.id,fbData);
          if(fbData.orig_base64||fbData.base64){
            genThumb(m,'data:'+(fbData.orig_mt||fbData.mt||'image/png')+';base64,'+(fbData.orig_base64||fbData.base64));
          } else if(fbData.imageUrl){
            genThumb(m,fbData.imageUrl);
          } else if(fbData.analysisData){
            /* JSON-onlyデータ → analysisDataからサムネ再生成 + Storage UL */
            generateAnalysisThumb(fbData.analysisData,function(thumb){
              if(thumb){
                caSaveThumb(m.id,thumb);
                setMeta(function(prev){return prev.slice();});
                if(fbCfg&&fbCfg.storageBucket&&!_fbIsPaused(fbCfg)){
                  uploadThumbToStorage(fbCfg,m.id,thumb).then(function(thumbUrl){
                    if(thumbUrl){
                      setMeta(function(prev){
                        var nm=prev.map(function(x){return x.id===m.id?Object.assign({},x,{thumbUrl:thumbUrl}):x;});
                        caSaveMeta(nm);return nm;
                      });
                      fetch(fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts/'+m.id+'.json'+(fbCfg.secret?'?auth='+fbCfg.secret:''),{
                        method:'PATCH',headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({thumbUrl:thumbUrl})
                      })["catch"](function(e){console.error('regen thumbUrl patch:',e);});
                    }
                  });
                }
              }
              setTimeout(processNext,100);
            });
          } else {processNext();}
        })["catch"](function(){processNext();});
        return;
      }
      processNext();
      }); /* caLoadDataAsync */
    }
    processNext();
  },[]);

  /* 2026-04-20 Phase10: addImageDirect 撤去 (旧画像mode追加、呼び出しゼロ) */

  /* 2026-04-20: JSON歩み値ファイルから新フォーマットdraft作成 (画像なし、Phase 2)
     data = {analysisData, analysisStrokes:{1m:[],5m:[]}, name, _v} */
  function addJsonDirect(file){
    if(!file){return;}
    if(!selTicker){window.caToast('銘柄を選択してください','info');return;}
    var fn=(file.name||'').toLowerCase();
    if(!/\.json$/.test(fn)&&file.type!=='application/json'){
      window.caToast('JSONファイルを選択してください','error');return;
    }
    var fr=new FileReader();
    fr.onload=function(ev){
      var j;
      try{ j=JSON.parse(ev.target.result); }
      catch(err){window.caToast('JSONパースエラー: '+err.message,'error');return;}
      if(!j||!Array.isArray(j.bars_1m)){
        window.caToast('形式が不正: bars_1m が配列ではありません','error');return;
      }
      var id=caGenId();
      var savedAt=Date.now();
      var chartName=(file.name||'chart').replace(/\.[^.]+$/,'')||'chart';
      /* 新フォーマット: 画像フィールドなし、analysisData+analysisStrokesのみ */
      var data={analysisData:j, analysisStrokes:{'1m':[],'5m':[]}, name:chartName, _v:savedAt};
      caSaveData(id,data);
      /* Phase 2: DataChartオフスクリーンレンダリングでthumb生成 */
      generateAnalysisThumb(j, function(thumb){
        var metaItem={id:id, ticker:selTicker, name:chartName, savedAt:savedAt,
          thumb:thumb||'', analysisDate:j.date||''};
        var stored=caLoadMeta().filter(function(m){return m.id!==id;});
        stored.push(metaItem);
        caSaveMeta(stored);
        setMeta(function(prev){
          var exists=prev.some(function(m){return m.id===id;});
          return exists?prev.map(function(m){return m.id===id?metaItem:m;}):prev.concat([metaItem]);
        });
        if(thumb)caSaveThumb(id,thumb);
        fbSaveDraft(id,metaItem,data);
        window.caToast('JSONを読み込みました: '+chartName,'success');
      });
    };
    fr.onerror=function(){window.caToast('ファイル読込エラー','error');};
    fr.readAsText(file);
  }

  /* 2026-04-23: JSONファイル自動振り分けインポート (ドラッグ&ドロップ / ペースト対応)
     ファイル名先頭4桁の銘柄コード → tickerCodes 逆引きでマッチ、未登録銘柄は自動追加 */
  function addJsonAutoRoute(files, onLog){
    if(!files||files.length===0)return;
    var _log=onLog||function(){};
    var fileArr=[];
    for(var fi=0;fi<files.length;fi++){
      var fn=(files[fi].name||'').toLowerCase();
      if(/\.json$/.test(fn)||files[fi].type==='application/json') fileArr.push(files[fi]);
    }
    if(fileArr.length===0){window.caToast('JSONファイルが見つかりません','error');_log({file:'',msg:'JSONファイルが見つかりません',ok:false});return;}
    var processed=0, total=fileArr.length;
    var firstTicker=null;
    var _latestTickers=caLoadTickers();
    /* 銘柄コード → 銘柄名 の逆引きマップを構築 */
    var _codes=caLoadTickerCodes();
    var _codeToTicker={};
    for(var _tk in _codes){if(_codes.hasOwnProperty(_tk)&&_codes[_tk]){_codeToTicker[_codes[_tk]]=_tk;}}
    function _resolveTickerByCode(fname){
      /* ファイル名先頭4桁を銘柄コードとして逆引き */
      var code=(fname||'').replace(/\.[^.]+$/,'').slice(0,4);
      if(code&&_codeToTicker[code])return _codeToTicker[code];
      return null;
    }
    function _resolveTickerByJson(j){
      /* j.ticker でも銘柄リスト直接マッチを試みる (フォールバック) */
      if(!j.ticker)return null;
      for(var i=0;i<_latestTickers.length;i++){
        if(_latestTickers[i]===j.ticker)return _latestTickers[i];
      }
      return null;
    }
    function _addTickerIfNeeded(name){
      if(!name)return '未分類';
      for(var i=0;i<_latestTickers.length;i++){if(_latestTickers[i]===name)return name;}
      _latestTickers.push(name);
      caSaveTickers(_latestTickers);
      setTickers(_latestTickers.slice());
      fbSyncTickers(_latestTickers.slice());
      return name;
    }
    fileArr.forEach(function(file){
      var fr=new FileReader();
      fr.onload=function(ev){
        var j;
        try{ j=JSON.parse(ev.target.result); }
        catch(err){window.caToast('JSONパースエラー ('+file.name+'): '+err.message,'error');_log({file:file.name,msg:'パースエラー: '+err.message,ok:false}); processed++; return;}
        if(!j||!Array.isArray(j.bars_1m)){
          window.caToast('形式が不正 ('+file.name+'): bars_1m が配列ではありません','error');_log({file:file.name,msg:'bars_1m が配列ではありません',ok:false}); processed++; return;
        }
        /* ticker 解決: ファイル名先頭4桁コード → j.ticker → ファイル名そのまま */
        var ticker=_resolveTickerByCode(file.name)||_resolveTickerByJson(j)||j.ticker||'未分類';
        ticker=_addTickerIfNeeded(ticker);
        if(!firstTicker)firstTicker=ticker;
        var id=caGenId();
        var savedAt=Date.now();
        var chartName=(file.name||'chart').replace(/\.[^.]+$/,'')||'chart';
        var data={analysisData:j, analysisStrokes:{'1m':[],'5m':[]}, name:chartName, _v:savedAt};
        caSaveData(id,data);
        generateAnalysisThumb(j, function(thumb){
          var metaItem={id:id, ticker:ticker, name:chartName, savedAt:savedAt,
            thumb:thumb||'', analysisDate:j.date||''};
          var stored=caLoadMeta().filter(function(m){return m.id!==id;});
          stored.push(metaItem);
          caSaveMeta(stored);
          setMeta(function(prev){
            var exists=prev.some(function(m){return m.id===id;});
            return exists?prev.map(function(m){return m.id===id?metaItem:m;}):prev.concat([metaItem]);
          });
          if(thumb)caSaveThumb(id,thumb);
          fbSaveDraft(id,metaItem,data);
          processed++;
          window.caToast(chartName+' → '+ticker,'success');
          _log({file:chartName,msg:'→ '+ticker,ok:true});
          /* 全ファイル完了後、最初のファイルの銘柄を自動選択 */
          if(processed===total&&firstTicker){setSelTicker(firstTicker);}
        });
      };
      fr.onerror=function(){window.caToast('読込エラー: '+file.name,'error'); processed++;};
      fr.readAsText(file);
    });
  }

  var auth=fbCfg.secret?'?auth='+fbCfg.secret:'';
  function makeDraftsBase(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts':null;}
  function makeDraftsDataBase(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-data':null;}
  function makeTrashBase(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-trash':null;}
  function makeTrashDataBase(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-trash-data':null;}
  function makeFbTickersUrl(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-tickers.json'+auth:null;}
  function makeDraftsVUrl(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-v.json'+auth:null;}

  var localVRef=useRef(0); // 最後に確認したバージョン

  // バージョン番号を書き込む（保存時に呼ぶ）
  function fbWriteV(){
    var vUrl=makeDraftsVUrl(); if(!vUrl||_fbIsPaused(fbCfg))return;
    var v=Date.now();
    localVRef.current=v;
    var vBody=JSON.stringify({_v:v});fetch(vUrl,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:vBody}).catch(function(){});
  }

  // ── バージョンチェック付きポーリング ──
  function pollFb(){
    if(_fbIsPaused(fbCfg))return;
    var vUrl=makeDraftsVUrl();
    if(!vUrl)return;
    // Step 1: バージョン番号だけ取得（~20バイト）
    fetch(vUrl).then(function(r){return r.ok?r.text():null;})
      .then(function(txt){
        if(!txt)return;var vData; try{vData=JSON.parse(txt);}catch(e){return;}
        if(!vData||!vData._v)return;
        var remoteV=vData._v;
        if(remoteV<=localVRef.current){setSyncStatus(null);return;}
        // Step 2: バージョン変化あり → フルメタ取得
        localVRef.current=remoteV;
        fetchFullMeta();
      }).catch(function(e){console.error('pollFb:',e);setSyncStatus(null);});
  }

  // フルメタ取得（初回ロード時 + バージョン変化時のみ）
  function fetchFullMeta(){
    if(_fbIsPaused(fbCfg))return;
    var base=makeDraftsBase(), trashBase=makeTrashBase();
    var now=Date.now();

    // ティッカー同期
    fetch(makeFbTickersUrl())
      .then(function(r){return r.ok?r.text():null;})
      .then(function(txt){
        if(!txt)return;var fbTickers; try{fbTickers=JSON.parse(txt);}catch(e){return;}
        if(fbTickers&&Array.isArray(fbTickers)&&fbTickers.length>0){setTickers(fbTickers);caSaveTickers(fbTickers);}
      }).catch(function(e){console.error('fetchFullMeta tickers:',e);});

    // ドラフトメタ同期
    fetch(base+'.json'+auth)
      .then(function(r){return r.ok?r.text():null;})
      .then(function(txt){
        setSyncStatus(null);
        if(!txt)return;var fbMeta; try{fbMeta=JSON.parse(txt);}catch(e){return;}
        if(!fbMeta||typeof fbMeta!=='object'||fbMeta.error||Array.isArray(fbMeta))return;
        var fbIds=Object.keys(fbMeta);
        var localMeta=caLoadMeta();
        var merged=[];
        fbIds.forEach(function(id){
          var d=fbMeta[id]; if(!d||typeof d!=='object')return;
          var local=localMeta.find(function(m){return m.id===id;});
          var resolvedThumb=(local&&local.thumb)?local.thumb:(d.thumbUrl||d.thumb||'');
          merged.push({id:id,ticker:d.ticker||'未分類',name:d.name||id,
            savedAt:d.savedAt||0,thumb:resolvedThumb,thumbUrl:d.thumbUrl||''});
        });
        localMeta.forEach(function(m){
          // Firebase側にないローカル項目: 直近5分以内に作成され、かつローカルデータが存在するもののみ保持
          // （別端末で削除されたものを復活させないため、データ存在チェックを追加）
          if(!fbIds.includes(m.id)&&(now-(m.savedAt||0)<300000)&&caLoadData(m.id))merged.push(m);
        });
        setMeta(merged);caSaveMeta(merged);
        /* 2026-04-23: サムネがないチャートをデータから再生成 + Storage UL */
        var noThumb=merged.filter(function(m){return !_thumbMemCache[m.id]&&!m.thumb&&!m.thumbUrl;});
        if(noThumb.length){
          var _dBase=makeDraftsDataBase();
          var _ti=0;
          function _ulThumb(_mid,_th){
            if(!fbCfg||!fbCfg.storageBucket||_fbIsPaused(fbCfg))return;
            uploadThumbToStorage(fbCfg,_mid,_th).then(function(tu){
              if(tu){
                setMeta(function(p){
                  var nm=p.map(function(x){return x.id===_mid?Object.assign({},x,{thumbUrl:tu}):x;});
                  caSaveMeta(nm);return nm;
                });
                fetch(fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts/'+_mid+'.json'+(fbCfg.secret?'?auth='+fbCfg.secret:''),{
                  method:'PATCH',headers:{'Content-Type':'application/json'},
                  body:JSON.stringify({thumbUrl:tu})
                })["catch"](function(e){console.error('regen thumbUrl patch:',e);});
              }
            });
          }
          function _genNext(){
            if(_ti>=noThumb.length)return;
            var _m=noThumb[_ti]; _ti++;
            caLoadDataAsync(_m.id,function(_d){
              if(_d&&_d.analysisData){
                generateAnalysisThumb(_d.analysisData,function(_th){
                  if(_th){caSaveThumb(_m.id,_th);setMeta(function(p){return p.slice();});_ulThumb(_m.id,_th);}
                  setTimeout(_genNext,50);
                });
              } else if(_dBase&&!_fbIsPaused(fbCfg)){
                fetch(_dBase+'/'+_m.id+'.json'+auth).then(function(r){return r.ok?r.json():null;})
                .then(function(_fb){
                  if(_fb){caSaveData(_m.id,_fb);}
                  if(_fb&&_fb.analysisData){
                    generateAnalysisThumb(_fb.analysisData,function(_th2){
                      if(_th2){caSaveThumb(_m.id,_th2);setMeta(function(p){return p.slice();});_ulThumb(_m.id,_th2);}
                      setTimeout(_genNext,50);
                    });
                  } else {setTimeout(_genNext,50);}
                }).catch(function(){setTimeout(_genNext,50);});
              } else {setTimeout(_genNext,50);}
            });
          }
          _genNext();
        }
      })
      .catch(function(e){console.error('fetchFullMeta drafts:',e);setSyncStatus(null);});

    // ゴミ箱メタ同期
    fetch(trashBase+'.json'+auth)
      .then(function(r){return r.ok?r.text():null;})
      .then(function(txt){
        if(!txt)return;var fbTrashMeta; try{fbTrashMeta=JSON.parse(txt);}catch(e){return;}
        if(!fbTrashMeta||typeof fbTrashMeta!=='object'||fbTrashMeta.error||Array.isArray(fbTrashMeta))return;
        var localTrash=caLoadTrash();
        var fbIds=Object.keys(fbTrashMeta);
        var merged=[];
        // Firebase側のゴミ箱を基準にする
        fbIds.forEach(function(id){
          var d=fbTrashMeta[id]; if(!d||typeof d!=='object')return;
          var lt=localTrash.find(function(m){return m.id===id;});
          var rt=(lt&&lt.thumb)?lt.thumb:(d.thumbUrl||d.thumb||'');
          merged.push({id:id,ticker:d.ticker||'',name:d.name||id,savedAt:d.savedAt||0,thumb:rt,thumbUrl:d.thumbUrl||''});
        });
        // ローカルのみのゴミ箱アイテム: 直近5分以内のもののみ保持
        localTrash.forEach(function(m){
          if(!fbIds.includes(m.id)&&(now-(m.deletedAt||m.savedAt||0)<300000))merged.push(m);
        });
        setTrash(merged);caSaveTrash(merged);
      }).catch(function(e){console.error('fetchFullMeta trash:',e);});
  }

  // ── 自動停止コールバック登録 ──
  // ── ポーリング開始 ──
  /* 2026-04-29 案B: visibility連動 — タブ非表示時はポーリング停止、復帰時に即時1回fetch+再開 */
  useEffect(function(){
    if(_fbIsPaused(fbCfg))return;
    var timer=null;
    function tick(){setSyncStatus('loading');pollFb();}
    function start(){
      if(timer)return;
      tick(); // 即時1回 (復帰時に最新化)
      timer=setInterval(tick,15000);
    }
    function stop(){if(timer){clearInterval(timer);timer=null;}}
    function onVis(){if(document.hidden)stop();else start();}
    // 初回: フルメタ取得 + (タブ表示中なら) ポーリング開始
    setSyncStatus('loading');
    fetchFullMeta();
    if(!document.hidden)timer=setInterval(tick,15000);
    document.addEventListener('visibilitychange',onVis);
    return function(){
      stop();

  /* ── 2026-04-30: パターン検索特徴量の自動計算 (バックグラウンド)
     meta が揃った後、未計算 or _v 不一致 or マイグレーション要 のものを順次計算 → IDB 保存
     並列度1、1000ms間隔 (UI 反応性優先で噛みすぎないよう緩め)
     fetchFullMeta 完了とは独立 (meta state 変化に追従)
     Phase 2 (vwap_features_*) / Phase 3 (vec_features_*) 追加に伴いマイグレーション判定を強化 */
  useEffect(function(){
    if(!meta || meta.length===0)return;
    var cancelled=false;
    var i=0;
    function processNext(){
      if(cancelled)return;
      if(i>=meta.length)return;
      var m=meta[i]; i++;
      patFeatGet(m.id, function(cached){
        if(cancelled)return;
        var cacheValid=cached && cached._v===m._v
                    && cached.vwap_features_1m!==undefined
                    && cached.vwap_features_5m!==undefined
                    && cached.vec_features_1m!==undefined
                    && cached.vec_features_5m!==undefined;
        if(cacheValid){
          /* キャッシュ済 → スキップ */
          setTimeout(processNext, 0);
          return;
        }
        /* 未計算 or _v 不一致 or マイグレーション要 → 全 Phase 計算 */
        caLoadDataAsync(m.id, function(d){
          if(cancelled)return;
          if(d && d.analysisData){
            var f1m=extractPhase1Features(d.analysisData, '1m');
            var f5m=extractPhase1Features(d.analysisData, '5m');
            var v1m=extractPhase2VwapFeatures(d.analysisData, '1m');
            var v5m=extractPhase2VwapFeatures(d.analysisData, '5m');
            var c1m=extractPhase3VectorFeatures(d.analysisData, '1m');
            var c5m=extractPhase3VectorFeatures(d.analysisData, '5m');
            patFeatSet(m.id, {
              id:m.id, ticker:m.ticker||'', date:m.analysisDate||m.name||'',
              savedAt:m.savedAt||0, _v:m._v||0,
              features_1m:f1m, features_5m:f5m,
              vwap_features_1m:v1m, vwap_features_5m:v5m,
              vec_features_1m:c1m, vec_features_5m:c5m,
              computedAt:Date.now()
            });
          }
          setTimeout(processNext, 1000);
        });
      });
    }
    /* マウント後3秒待ってから開始 (UI 初期描画優先) */
    var startTimer=setTimeout(processNext, 3000);
    return function(){cancelled=true;clearTimeout(startTimer);};
  },[meta.length]);

  // ── Firebase ヘルパー（meta=旧パス / data=新パス 分離）──
  function fbSaveDraft(id,metaItem,data){
    var base=makeDraftsBase(), dataBase=makeDraftsDataBase();
    if(!base||_fbIsPaused(fbCfg))return;
    /* 2026-04-27: 案A+ — Storage UL を先に試行して thumbUrl を取得
       RTDB の meta には thumb base64 を含めない (DL量削減: ~3000倍軽量化)
       UL失敗時は thumbUrl なしで保存 → ホーム missing 処理で自動復元 */
    var hasThumb=metaItem.thumb&&typeof metaItem.thumb==='string'&&metaItem.thumb.length>500;
    var ulPromise=(hasThumb&&fbCfg.storageBucket)
      ? uploadThumbToStorage(fbCfg,id,metaItem.thumb).catch(function(){return null;})
      : Promise.resolve(metaItem.thumbUrl||null);
    ulPromise.then(function(thumbUrl){
      // ① メタ書き込み（thumb は除外、thumbUrl のみ）→ TS/V書き込み
      var metaDb={ticker:metaItem.ticker,name:metaItem.name,savedAt:metaItem.savedAt};
      if(thumbUrl)metaDb.thumbUrl=thumbUrl;
      else if(metaItem.thumbUrl)metaDb.thumbUrl=metaItem.thumbUrl;
      var body=JSON.stringify(metaDb);
      fetch(base+'/'+id+'.json'+auth,{method:'PUT',headers:{'Content-Type':'application/json'},body:body})
      .then(function(){
        var tsBase=fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts';
        var tsBody=JSON.stringify({t:metaItem.savedAt||Date.now()});fetch(tsBase+'/'+id+'.json'+auth,{method:'PUT',headers:{'Content-Type':'application/json'},body:tsBody})
          .catch(function(){});
        fbWriteV();
      }).catch(function(e){console.error('fbSaveDraft:',e);});
    });
    // ② データ書き込み（メタとは独立、並行でOK）
    /* 2026-04-20 Phase10: 画像base64 uploadToStorage分岐撤去 (analysis dataのみ) */
    if(data){
      var body3=JSON.stringify(data);fetch(dataBase+'/'+id+'.json'+auth,{method:'PUT',headers:{'Content-Type':'application/json'},body:body3})
        .catch(function(e){console.error('fbSaveDraft data:',e);});
    }
  }

  function openChart(id){
    var mi=meta.find(function(m){return m.id===id;});
    var extra={_draftId:id,_ticker:mi?mi.ticker:'',_name:mi?mi.name:'',_thumb:mi?mi.thumb:'',_savedAt:mi?mi.savedAt:0};
    /* ローカルデータから画像なし draft (新フォーマット) 判定ヘルパー */
    function isJsonOnly(d){return !!(d&&d.analysisData&&!(d.orig_base64||d.base64||d.imageUrl));}
    /* 2026-04-20: 画像mode撤去後、画像draftを開く時は警告して中断 */
    function handleLegacyImageDraft(d){
      if(d&&(d.orig_base64||d.base64||d.imageUrl)&&!d.analysisData){
        window.caToast('このチャートは旧画像形式です。⚙ Firebase設定から「旧画像draftを削除」で整理してください','error');
        return true;  /* 中断 */
      }
      return false;  /* 続行 */
    }
    // 同期OFFまたはFirebase未設定 → ローカルデータのみ
    if(_fbIsPaused(fbCfg)||!fbCfg.url){
      var d0=caLoadData(id);
      if(handleLegacyImageDraft(d0))return;  /* 旧画像-only draft: 中断 */
      if(d0&&(d0.orig_base64||d0.base64)){onOpen(Object.assign({},d0,extra));return;}
      if(isJsonOnly(d0)){onOpen(Object.assign({},d0,extra));return;}  /* JSONのみdraft */
      // IndexedDB非同期フォールバック
      caLoadDataAsync(id,function(ad){
        if(handleLegacyImageDraft(ad))return;  /* 旧画像-only draft: 中断 */
        if(ad&&(ad.orig_base64||ad.base64)){onOpen(Object.assign({},ad,extra));return;}
        if(isJsonOnly(ad)){onOpen(Object.assign({},ad,extra));return;}  /* JSONのみdraft */
        window.caToast('データが見つかりません（Firebase未設定または同期停止中）','error');
      });
      return;
    }
    // 同期ON → 常にRTDBから最新のstrokesを取得
    var dataBase=makeDraftsDataBase();
    var oldBase=makeDraftsBase();
    setSyncStatus('loading');
    // ローカルデータを先に非同期で取得し、Firebase取得と合流
    caLoadDataAsync(id,function(d){
      /* 2026-04-29 案G: ts pre-check で フルDL スキップ判定 (Firebase DL量削減)
         ローカル data に analysisData + _v が揃っていて、remote ts.t ≤ local _v + 200ms なら
         最新確定 → フルDL不要で即 onOpen。失敗/差分時は従来フルDL にフォールスルー */
      function _doFullFetch(){
        fetch(dataBase+'/'+id+'.json'+auth).then(function(r){return r.ok?r.text():null;})
        .then(function(txt){
          var fbData=txt?JSON.parse(txt):null;
          if(!fbData){
            // 新パスにデータなし → 旧パスフォールバック
            return fetch(oldBase+'/'+id+'.json'+auth).then(function(r2){return r2.ok?r2.text():null;})
              .then(function(txt2){
                setSyncStatus(null);
                var fbOld=txt2?JSON.parse(txt2):null;
                var od=fbOld&&fbOld.data?fbOld.data:null;
                if(od&&(od.orig_base64||od.base64)){caSaveData(id,od);onOpen(Object.assign({},od,extra));}
                else if(d&&(d.orig_base64||d.base64)){onOpen(Object.assign({},d,extra));}
                else{window.caToast('データが見つかりません','error');}
              });
          }
          // base64が直接ある場合
          if(fbData.orig_base64||fbData.base64){
            caSaveData(id,fbData);setSyncStatus(null);
            onOpen(Object.assign({},fbData,extra));return;
          }
          /* 2026-04-20: 画像なし(JSONのみ)draft */
          if(fbData.analysisData&&!fbData.imageUrl){
            caSaveData(id,fbData);setSyncStatus(null);
            onOpen(Object.assign({},fbData,extra));return;
          }
          // imageUrl（Storage）+ リモートstrokes
          if(fbData.imageUrl){
            // ローカルに画像があればそれを使い、strokesだけリモートから取得（Storage DL不要）
            if(d&&(d.orig_base64||d.base64)){
              var merged={orig_base64:d.orig_base64||d.base64,orig_mt:d.orig_mt||d.mt||fbData.orig_mt||'image/png',
                strokes:fbData.strokes||[],name:fbData.name||'',
                analysisData:fbData.analysisData||null,
                analysisStrokes:migrateAnalysisStrokes(fbData.analysisStrokes,'cur')};  /* B-drawing */
              caSaveData(id,merged);setSyncStatus(null);
              onOpen(Object.assign({},merged,extra));return;
            }
          // ローカルに画像なし → Storageからダウンロード
          return storageUrlToBase64(fbData.imageUrl).then(function(res){
            var localData={orig_base64:res.base64,orig_mt:res.mt||fbData.orig_mt||'image/png',
              strokes:fbData.strokes||[],name:fbData.name||'',
              analysisData:fbData.analysisData||null,
              analysisStrokes:migrateAnalysisStrokes(fbData.analysisStrokes,'cur')};  /* B-drawing */
            caSaveData(id,localData);setSyncStatus(null);
            onOpen(Object.assign({},localData,extra));
          }).catch(function(e){
            // Storage URL直接変換失敗 → Image経由でbase64化を試行
            console.warn('[openChart] storageUrlToBase64 failed, trying Image fallback:',e);
            return new Promise(function(resolve,reject){
              var fi=new Image(); fi.crossOrigin='anonymous';
              fi.onload=function(){
                var tc=document.createElement('canvas');tc.width=fi.naturalWidth;tc.height=fi.naturalHeight;
                tc.getContext('2d').drawImage(fi,0,0);
                try{
                  var du=tc.toDataURL('image/png');var b64=du.split(',')[1];
                  var localData={orig_base64:b64,orig_mt:'image/png',strokes:fbData.strokes||[],name:fbData.name||'',
                    analysisData:fbData.analysisData||null,
                    analysisStrokes:migrateAnalysisStrokes(fbData.analysisStrokes,'cur')};  /* B-drawing */
                  caSaveData(id,localData);setSyncStatus(null);
                  onOpen(Object.assign({},localData,extra));resolve();
                }catch(e2){reject(e2);}
              };
              fi.onerror=function(){reject(new Error('Image load failed: '+fbData.imageUrl.substring(0,60)));};
              fi.src=fbData.imageUrl;
            });
          });
        }
        setSyncStatus(null);window.caToast('データが見つかりません','error');
      }).catch(function(e){setSyncStatus(null);console.error('[openChart] Error:',e);window.caToast('読込失敗: '+(e&&e.message?e.message:'不明なエラー'),'error');});
      }
      /* スキップ判定: 新フォーマット (analysisData あり) + _v 有効 が前提
         旧画像draft (orig_base64) や _v 欠損データは従来通りフルDL */
      var hasFullLocal=d&&d.analysisData&&typeof d._v==='number'&&d._v>0;
      if(hasFullLocal){
        var tsUrl=fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts/'+id+'.json'+auth;
        fetch(tsUrl).then(function(r){return r.ok?r.json():null;})
          .then(function(ts){
            var remoteT=(ts&&typeof ts.t==='number')?ts.t:0;
            if(remoteT&&remoteT<=d._v+200){
              /* ローカル最新確定 → フルDLスキップ */
              setSyncStatus(null);
              onOpen(Object.assign({},d,extra));
              return;
            }
            /* remote が新しい / ts 不在 → 従来フルDL */
            _doFullFetch();
          })
          .catch(function(){_doFullFetch();});
      } else {
        _doFullFetch();
      }
    }); // caLoadDataAsync
  }

/* ─── VirtualJoystick ──────────────────────────────────────── */
function VirtualJoystick(props){
  var onPanDelta=props.onPanDelta;
  var onHide=props.onHide;
  var RING_R=44, STICK_R=32, SPEED=3;
  var ringRef=useRef(null);
  var knobRef=useRef(null);
  var stateRef=useRef({active:false,off:{x:0,y:0},moveMode:false,lastTap:0,
    pos:{x:72,y:72},touchId:null});
  var rafRef=useRef(null);
  var s0=useState({x:72,y:72}); var pos=s0[0],setPos=s0[1];
  var s1=useState(false);       var moveMode=s1[0],setMoveMode=s1[1];

  function setKnob(x,y){
    if(knobRef.current)knobRef.current.style.transform="translate(calc(-50% + "+x+"px),calc(-50% + "+y+"px))";
  }

  useEffect(function(){
    function loop(){
      var s=stateRef.current;
      if(s.active&&Math.hypot(s.off.x,s.off.y)>3)
        onPanDelta(s.off.x*SPEED/STICK_R, s.off.y*SPEED/STICK_R);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
    return function(){if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[]);

  // ネイティブタッチで登録（canvas のネイティブリスナーと競合しないようにする）
  useEffect(function(){
    var ring=ringRef.current; if(!ring)return;
    function onTS(e){
      e.stopPropagation(); e.preventDefault();
      var t=e.touches[0], s=stateRef.current, now=Date.now();
      if(now-s.lastTap<400){s.moveMode=true;setMoveMode(true);}
      s.lastTap=now; s.touchId=t.identifier; s.active=true; s.off={x:0,y:0}; setKnob(0,0);
    }
    function onTM(e){
      e.stopPropagation(); e.preventDefault();
      var s=stateRef.current; if(!s.active)return;
      var t=null;
      for(var i=0;i<e.touches.length;i++){if(e.touches[i].identifier===s.touchId){t=e.touches[i];break;}}
      if(!t)return;
      if(s.moveMode){
        var r=ring.getBoundingClientRect();
        var nx=s.pos.x+(t.clientX-(r.left+r.width/2));
        var ny=s.pos.y-(t.clientY-(r.top+r.height/2)); // bottom基準なので反転
        s.pos={x:nx,y:ny}; setPos({x:nx,y:ny}); return;
      }
      var r2=ring.getBoundingClientRect();
      var ox=t.clientX-(r2.left+r2.width/2), oy=t.clientY-(r2.top+r2.height/2);
      var dist=Math.hypot(ox,oy);
      if(dist>STICK_R){ox=ox/dist*STICK_R;oy=oy/dist*STICK_R;}
      s.off={x:ox,y:oy}; setKnob(ox,oy);
    }
    function onTE(e){
      e.stopPropagation();
      var s=stateRef.current;
      s.active=false; s.off={x:0,y:0}; setKnob(0,0);
      if(s.moveMode){s.moveMode=false;setMoveMode(false);}
    }
    ring.addEventListener("touchstart",onTS,{passive:false});
    ring.addEventListener("touchmove",onTM,{passive:false});
    ring.addEventListener("touchend",onTE);
    ring.addEventListener("touchcancel",onTE);
    return function(){
      ring.removeEventListener("touchstart",onTS);
      ring.removeEventListener("touchmove",onTM);
      ring.removeEventListener("touchend",onTE);
      ring.removeEventListener("touchcancel",onTE);
    };
  },[]);

  return ReactDOM.createPortal(
    ce("div",{style:{
      position:"fixed",left:pos.x,bottom:pos.y,
      zIndex:10006,width:RING_R*2,height:RING_R*2,
      userSelect:"none",touchAction:"none",pointerEvents:"auto"
    }},
      ce("div",{ref:ringRef,
        style:{position:"relative",width:RING_R*2,height:RING_R*2,borderRadius:"50%",
          background:"rgba(255,255,255,0.08)",
          border:"2px solid "+(moveMode?"#f97316":"rgba(255,255,255,0.25)"),
          boxShadow:"0 2px 12px rgba(0,0,0,0.4)",backdropFilter:"blur(8px)"}
      },
        ce("div",{ref:knobRef,
          style:{position:"absolute",top:"50%",left:"50%",
            width:28,height:28,borderRadius:"50%",
            background:moveMode?"#f97316":"rgba(255,255,255,0.6)",
            transform:"translate(-50%,-50%)",
            boxShadow:"0 1px 4px rgba(0,0,0,0.4)",pointerEvents:"none"}
        })
      ),
      onHide&&ce("button",{
        onTouchEnd:function(e){e.stopPropagation();e.preventDefault();onHide();},
        onClick:function(e){e.stopPropagation();onHide();},
        style:{position:"absolute",top:-10,right:-10,width:20,height:20,
          borderRadius:"50%",border:"1px solid rgba(255,255,255,0.3)",
          background:"rgba(30,30,30,0.85)",color:"#aaa",
          fontSize:11,lineHeight:"20px",textAlign:"center",
          cursor:"pointer",padding:0,zIndex:1,pointerEvents:"auto",touchAction:"none"}
      },"×")
    ),
    document.body
  );
}

/* ─── App (drop zone) ──────────────────────────────────────── */
function App(){
  // 起動時に画面上部のクリックブロッカーを検出・除去
  useEffect(function(){
    
    // body直下の不要要素を検出除去（500ms後にチェック）
    var tid=setTimeout(function(){
      var root=document.getElementById('root');
      var cx=window.innerWidth/2, cy=40;
      var el=document.elementFromPoint(cx,cy);
      if(el&&el!==document.body&&el!==document.documentElement&&root&&!root.contains(el)){
        console.warn('[CA] Removed blocking element at center-top:',el.tagName,el.id,el.className,el.style.cssText);
        el.remove();
      }
    },500);
    return function(){clearTimeout(tid);};
  },[]);
  /* 2026-04-20: iPad/iOS Safari のブラウザ干渉ジェスチャーを一括無効化
     - エッジスワイプ (左右端からのバック/進む)
     - エッジスワイプ (下端からのアドレスバー再表示/タブ切替)
     - 2本指ピンチ拡大 (gesturestart/gesturechange/gestureend)
     - ダブルタップ拡大 (300ms以内の連続tap)
     2026-04-22: 上端 (clientY<EDGE) は抑制しない — ツールバー最上部タップを妨げるため */
  useEffect(function(){
    var EDGE=20;  // エッジ判定幅 (px)
    function onTouchStart(e){
      if(e.touches.length!==1)return;
      var t=e.touches[0];
      var w=window.innerWidth, h=window.innerHeight;
      if(t.clientX<EDGE||t.clientX>w-EDGE||t.clientY>h-EDGE){
        e.preventDefault();
      }
    }
    function onGesture(e){e.preventDefault();}
    var lastTap=0;
    function onTouchEnd(e){
      var now=Date.now();
      if(now-lastTap<300){e.preventDefault();}
      lastTap=now;
    }
    document.addEventListener('touchstart',onTouchStart,{passive:false});
    document.addEventListener('gesturestart',onGesture,{passive:false});
    document.addEventListener('gesturechange',onGesture,{passive:false});
    document.addEventListener('gestureend',onGesture,{passive:false});
    document.addEventListener('touchend',onTouchEnd,{passive:false});
    return function(){
      document.removeEventListener('touchstart',onTouchStart);
      document.removeEventListener('gesturestart',onGesture);
      document.removeEventListener('gesturechange',onGesture);
      document.removeEventListener('gestureend',onGesture);
      document.removeEventListener('touchend',onTouchEnd);
    };
  },[]);
  var s0=useState(function(){
    // リロード時にセッションから復元
    try{
      var s=sessionStorage.getItem('ca_session');
      if(s){var d=JSON.parse(s);if(d.orig_base64||d.base64)return d;}
    }catch(e){}
    return null;
  }); var img=s0[0],setImg=s0[1];
  var s1=useState(false); var drag=s1[0],setDrag=s1[1];
  var FB_DEFAULTS={url:'',secret:'',apiKey:'',storageBucket:'scalping-notebbok.firebasestorage.app',paused:true};
  var s2=useState(function(){try{var s=localStorage.getItem(FB_CFG_KEY);if(s){var p=JSON.parse(s);return Object.assign({},FB_DEFAULTS,p);}return FB_DEFAULTS;}catch(e){return FB_DEFAULTS;}}); var fbCfg=s2[0],setFbCfg=s2[1];
  var s3=useState(false); var showFbSettings=s3[0],setShowFbSettings=s3[1];
  /* 2026-04-20: 表示・動作設定モーダル */
  var sDS=useState(false); var showDisplaySettings=sDS[0],setShowDisplaySettings=sDS[1];
  var sNP=useState(false); var showNotepad=sNP[0],setShowNotepad=sNP[1];
  var sTM=useState(false); var showTagManager=sTM[0],setShowTagManager=sTM[1];
  var s4=useState(function(){try{return sessionStorage.getItem('ca_screen')==='drafts';}catch(e){return false;}}); var showDrafts=s4[0],setShowDrafts=s4[1];
  var s5=useState(function(){try{return sessionStorage.getItem('ca_draftTicker')||null;}catch(e){return null;}}); var draftInitTicker=s5[0],setDraftInitTicker=s5[1];
  /* 2026-04-20: URLパラメータ経由で指定された日付 (DraftLibrary で該当チャートをハイライト) */
  var s6=useState(null); var highlightDate=s6[0],setHighlightDate=s6[1];
  /* 2026-04-30: C - エディタから「似た形検索」起動時のクエリ draft id */
  var s7=useState(null); var queryFromEditor=s7[0],setQueryFromEditor=s7[1];
  var fileRef=useRef(null);
  /* ─── 起動時: URLパラメータ解析 (scalping-notebook連携) ───
     対応: ?{code}_{date}&id={id}
     - id あり & 該当チャート存在 → エディタ直接起動
     - id なし or 該当なし → コード→ticker解決して DraftLibrary で ticker + 日付ハイライト

  useEffect(function(){
    /* 既に img や drafts に復帰中なら URL 処理しない */

        if(params.date&&!hit.analysisDate){

  },[]);  /* 初回マウントのみ */

  function loadFile(file){
    if(!file||!file.type.startsWith("image/"))return;
    var reader=new FileReader();
    reader.onload=function(ev){
      var dataUrl=ev.target.result;
