<script>
/* =====================================================================
   書き込みツール – ImageAnnotator standalone
   元: Scalping Notebook の ImageAnnotator を完全移植

(function(){
'use strict';
var R = React;
var useState   = R.useState;
var useRef     = R.useRef;
var useEffect  = R.useEffect;
var Fragment   = R.Fragment;
var ce         = R.createElement;   // ← h ではなく ce を使う

var IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ─── Color Picker ─────────────────────────────────────────── */
var ANNOT_PRESET_KEY = 'scalping_annot_presets_v1';
var DEF_PRESETS = [
  "#000000","#555555","#888888","#bbbbbb","#ffffff",
  "#b71c1c","#f44336","#e91e63","#f48fb1","#ff6d00",
  "#2196f3","#0d47a1","#1b5e20","#76ff03","#ffeb3b",
  "#f57f17","#ce93d8","#1a237e","#37474f","#558b2f"
];
var LIGHT_COLS = ["#ffffff","#ffeb3b","#f48fb1","#bbbbbb","#76ff03","#ce93d8"];

function ColorPicker(props){
  var value=props.value, onChange=props.onChange, history=props.history,
      onHistory=props.onHistory, quickColors=props.quickColors, onQuickColors=props.onQuickColors;

  var s0=useState(false);  var open=s0[0],setOpen=s0[1];
  var s1=useState("preset"); var tab=s1[0],setTab=s1[1];
  var s2=useState(false);  var editMode=s2[0],setEditMode=s2[1];
  var s3=useState(value);  var customVal=s3[0],setCustomVal=s3[1];
  var s4=useState(null);   var editingSlot=s4[0],setEditingSlot=s4[1];
  var s5=useState(null);   var dragIdx=s5[0],setDragIdx=s5[1];
  var s6=useState(null);   var dragOverIdx=s6[0],setDragOverIdx=s6[1];
  var s7=useState(function(){
    try{ var p=localStorage.getItem(ANNOT_PRESET_KEY); return p?JSON.parse(p):DEF_PRESETS; }
    catch(e){ return DEF_PRESETS; }
  }); var presets=s7[0],setPresets=s7[1];

  function savePresets(p){ setPresets(p); try{localStorage.setItem(ANNOT_PRESET_KEY,JSON.stringify(p));}catch(e){} }
  function closeAll(){ setOpen(false);setEditMode(false);setEditingSlot(null);setDragIdx(null);setDragOverIdx(null); }
  function pick(c){
    onChange(c); onHistory(c);
    if(editingSlot!==null){ var nq=quickColors.slice(); nq[editingSlot]=c; onQuickColors(nq); }
    else if(!quickColors.includes(c)) onQuickColors([c].concat(quickColors).slice(0,6));
    closeAll();
  }
  function addCustom(){
    if(!presets.includes(customVal)) savePresets(presets.concat([customVal]));
    onChange(customVal); onHistory(customVal);
    if(!quickColors.includes(customVal)) onQuickColors([customVal].concat(quickColors).slice(0,6));
    setTab("preset");
  }
  function remPreset(c){ savePresets(presets.filter(function(x){return x!==c;})); }
  function reorder(f,t){
    if(f===t)return;
    var np=presets.slice(); var r=np.splice(f,1)[0]; np.splice(t,0,r); savePresets(np);
  }
  function onQClick(c,i){
    if(value===c&&quickColors[i]===c){ setEditingSlot(i);setCustomVal(c);setTab("preset");setOpen(true); }
    else{ onChange(c);onHistory(c); }
  }

  var DS=IS_TOUCH?46:40, QSZ=IS_TOUCH?30:26;

  function PDot(p2){
    var c=p2.c,i=p2.i;
    var sel=c===value,isd=dragIdx===i,iso=dragOverIdx===i&&dragIdx!==null&&dragIdx!==i;
    return ce("span",{style:{position:"relative",flexShrink:0}},
      ce("span",{
        draggable:editMode,
        onDragStart:function(e){e.dataTransfer.setData("t","");setDragIdx(i);},
        onDragOver:function(e){e.preventDefault();if(dragIdx!==null&&dragIdx!==i)setDragOverIdx(i);},
        onDrop:function(e){e.preventDefault();if(dragIdx!==null)reorder(dragIdx,i);setDragIdx(null);setDragOverIdx(null);},
        onDragEnd:function(){setDragIdx(null);setDragOverIdx(null);},
        onClick:function(){if(!editMode)pick(c);},
        style:{width:DS,height:DS,borderRadius:"50%",background:c,display:"flex",alignItems:"center",justifyContent:"center",
          cursor:editMode?"grab":"pointer",boxSizing:"border-box",opacity:isd?0.3:1,
          border:iso?"3.5px dashed #007AFF":sel&&!editMode?"3.5px solid #007AFF":"1.5px solid rgba(0,0,0,.14)"}
      },
        sel&&!editMode&&ce("span",{style:{fontSize:20,color:LIGHT_COLS.includes(c)?"#000":"#fff",fontWeight:700,lineHeight:1}},"✓"),
        editMode&&ce("span",{style:{fontSize:16,color:"rgba(255,255,255,.5)",userSelect:"none",pointerEvents:"none"}},"⠿")
      ),
      (sel&&!editMode||editMode)&&ce("span",{
        onClick:function(e){e.stopPropagation();remPreset(c);},
        style:{position:"absolute",top:-5,right:-5,width:20,height:20,borderRadius:"50%",background:"#ff3b30",color:"#fff",
          fontSize:12,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",border:"2px solid #fff",zIndex:2,lineHeight:1}
      },"✕")
    );
  }

  var GRID={display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"};

  return ce(Fragment,null,
    // Quick color dots
    ce("div",{style:{display:"flex",gap:IS_TOUCH?10:8,alignItems:"center"}},
      quickColors.map(function(c,i){
        var isA=value===c;
        return ce("span",{key:i,onClick:function(){onQClick(c,i);},
          style:{width:QSZ,height:QSZ,borderRadius:"50%",background:c,cursor:"pointer",flexShrink:0,
            boxShadow:isA?"0 0 0 2px #111,0 0 0 4px #fff,0 0 0 5.5px #6366F1":"0 1px 3px rgba(0,0,0,.4)",
            border:"2px solid rgba(255,255,255,.5)",transform:isA?"scale(1.2)":"scale(1)",transition:"transform .1s"}});
      })
    ),
    // Modal
    open&&ReactDOM.createPortal(
      ce("div",{onClick:closeAll,style:{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:11000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
        ce("div",{onClick:function(e){e.stopPropagation();},
          style:{background:"#f2f2f7",borderRadius:20,padding:"20px 20px 24px",width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,.5)"}},
          ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
            tab==="preset"
              ?ce("button",{onClick:function(){setEditMode(function(m){return !m;});},style:{fontSize:14,color:"#007AFF",fontWeight:600,background:"none",border:"none",cursor:"pointer"}},editMode?"完了":"編集")
              :ce("span",null),
            ce("span",{style:{fontSize:17,fontWeight:700,color:"#000"}},editingSlot!==null?"スロット"+(editingSlot+1)+"の色を変更":"カラーを変更"),
            ce("button",{onClick:closeAll,style:{fontSize:14,color:"#007AFF",fontWeight:600,background:"none",border:"none",cursor:"pointer"}},"閉じる")
          ),
          // Tabs
          ce("div",{style:{display:"flex",background:"rgba(0,0,0,.08)",borderRadius:11,padding:2,marginBottom:20}},
            [["preset","プリセット"],["custom","カスタム"],["history","履歴"]].map(function(pair){
              return ce("button",{key:pair[0],onClick:function(){setTab(pair[0]);setEditMode(false);},
                style:{flex:1,padding:"7px 0",fontSize:14,fontWeight:600,border:"none",borderRadius:9,cursor:"pointer",
                  background:tab===pair[0]?"#fff":"transparent",color:tab===pair[0]?"#000":"#666",
                  boxShadow:tab===pair[0]?"0 1px 5px rgba(0,0,0,.2)":"none"}},pair[1]);
            })
          ),
          tab==="preset"&&ce("div",{style:GRID},
            presets.map(function(c,i){return ce(PDot,{key:i,c:c,i:i});}),
            ce("span",{onClick:function(){setTab("custom");setEditMode(false);},
              style:{width:DS,height:DS,borderRadius:"50%",background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",border:"1.5px dashed #aaa",flexShrink:0}},
              ce("span",{style:{fontSize:24,color:"#aaa",lineHeight:1,fontWeight:300}},"+")
            )
          ),
          tab==="custom"&&ce("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:16}},
            ce("div",{style:{display:"flex",gap:12,alignItems:"center"}},
              ce("span",{style:{width:56,height:56,borderRadius:12,background:customVal,display:"block",border:"1px solid rgba(0,0,0,.12)"}}),
              ce("div",null,
                ce("div",{style:{fontSize:12,color:"#999",marginBottom:4}},"現在の色"),
                ce("div",{style:{fontSize:13,fontFamily:"monospace",color:"#333"}},customVal.toUpperCase())
              )
            ),
            ce("label",{style:{cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8}},
              ce("input",{type:"color",value:customVal,onChange:function(e){setCustomVal(e.target.value);},
                style:{width:220,height:IS_TOUCH?80:60,cursor:"pointer",border:"none",borderRadius:8}}),
              ce("span",{style:{fontSize:12,color:"#666"}},"タップして色を選択")
            ),
            ce("div",{style:{display:"flex",gap:10}},
              ce("button",{onClick:addCustom,style:{padding:"10px 20px",background:"#34C759",color:"#fff",border:"none",borderRadius:12,fontSize:15,fontWeight:600,cursor:"pointer"}},"この色を追加"),
              ce("button",{onClick:function(){pick(customVal);},style:{padding:"10px 20px",background:"#007AFF",color:"#fff",border:"none",borderRadius:12,fontSize:15,fontWeight:600,cursor:"pointer"}},"この色を使用")
            )
          ),
          tab==="history"&&(history.length>0
            ?ce("div",{style:GRID},
                history.map(function(c,i){
                  return ce("span",{key:i,onClick:function(){pick(c);},
                    style:{width:DS,height:DS,borderRadius:"50%",background:c,cursor:"pointer",
                      border:c===value?"3.5px solid #007AFF":"1.5px solid rgba(0,0,0,.14)",
                      display:"flex",alignItems:"center",justifyContent:"center",boxSizing:"border-box",flexShrink:0}},
                    c===value&&ce("span",{style:{fontSize:20,color:LIGHT_COLS.includes(c)?"#000":"#fff",fontWeight:700}},"✓")
                  );
                })
              )
            :ce("div",{style:{textAlign:"center",padding:"32px 0",color:"#aaa",fontSize:14}},"履歴なし")
          )
        )
      ),
      document.body
    )
  );
}

/* ─── Geometry ─────────────────────────────────────────────── */
function distSeg(px,py,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  if(!l2)return Math.hypot(px-x1,py-y1);
  var t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l2));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function strokeHits(s,px,py,er){
  var hw=(s.type==="marker"?s.lineW*4:s.lineW/2)+2, r=er+hw;
  switch(s.type){
    case"line":case"dotted":case"arrow":case"marker":
      return distSeg(px,py,s.x1,s.y1,s.x2,s.y2)<r;
    case"rect":
      return Math.min(distSeg(px,py,s.x1,s.y1,s.x2,s.y1),distSeg(px,py,s.x2,s.y1,s.x2,s.y2),
                      distSeg(px,py,s.x1,s.y2,s.x2,s.y2),distSeg(px,py,s.x1,s.y1,s.x1,s.y2))<r;
    case"circle":{
      var nd=Math.sqrt(Math.pow((px-s.cx)/Math.max(s.rx,1),2)+Math.pow((py-s.cy)/Math.max(s.ry,1),2));
      return Math.abs(nd-1)*Math.min(s.rx,s.ry)<r;
    }
    case"freehand":
      return (s.pts||[]).some(function(p,i){
        return i===0?Math.hypot(px-p.x,py-p.y)<r:distSeg(px,py,s.pts[i-1].x,s.pts[i-1].y,p.x,p.y)<r;
      });
    case"text":{
      var fs=s.fontSize||24,tw=s.measuredWidth||Math.max(fs*0.8*(s.text||"").length,fs),pad=er+12;
      return px>=s.x-pad&&px<=s.x+tw+pad&&py>=s.y-pad&&py<=s.y+fs*1.5+pad;
    }
    default:return false;
  }
}
function findStrokeAt(strokes,px,py,er){
  for(var i=strokes.length-1;i>=0;i--){if(strokeHits(strokes[i],px,py,er))return i;}
  return -1;
}
function getBoundsFromStrokes(idxs,strokes){
  var mx=Infinity,my=Infinity,Mx=-Infinity,My=-Infinity;
  idxs.forEach(function(i){
    var s=strokes[i]; if(!s)return;
    var pts=[];
    switch(s.type){
      case"line":case"dotted":case"arrow":case"marker":pts=[{x:s.x1,y:s.y1},{x:s.x2,y:s.y2}];break;
      case"rect":pts=[{x:s.x1,y:s.y1},{x:s.x2,y:s.y2}];break;
      case"circle":pts=[{x:s.cx-s.rx,y:s.cy-s.ry},{x:s.cx+s.rx,y:s.cy+s.ry}];break;
      case"freehand":pts=s.pts||[];break;
      case"text":{
        var fsz=s.fontSize||24;
        var bw=s.boxW||Math.max(fsz*0.8*(s.text||'').length,fsz);
        var bh=textBoxHeight(s.text,fsz,s.fontBold,s.boxW);
        pts=[{x:s.x,y:s.y},{x:s.x+bw,y:s.y+bh}];break;
      }
    }
    pts.forEach(function(p){mx=Math.min(mx,p.x);my=Math.min(my,p.y);Mx=Math.max(Mx,p.x);My=Math.max(My,p.y);});
  });
  if(mx===Infinity)return null;
  return{x:mx-10,y:my-10,w:Mx-mx+20,h:My-my+20};
}
/* テキストボックスの高さをキャンバスpxで算出 */
function textBoxHeight(text,fontSize,fontBold,boxW){
  var fs=fontSize||24, lh=fs*1.45, mW=boxW||999999;
  var tc=document.createElement("canvas").getContext("2d");
  tc.font=(fontBold?"bold ":"")+fs+"px -apple-system,sans-serif";
  var lines=0;
  (text||"").split("\n").forEach(function(para){
    if(!para.length){lines++;return;}
    var line="";
    for(var ci=0;ci<para.length;ci++){
      var test=line+para[ci];
      if(tc.measureText(test).width>mW&&line.length>0){lines++;line=para[ci];}
      else line=test;
    }
    if(line.length>0)lines++;
  });
  return Math.max(lines,1)*lh;
}
function shiftStroke(s,dx,dy){
  switch(s.type){
    case"line":case"dotted":case"arrow":case"marker":return Object.assign({},s,{x1:s.x1+dx,y1:s.y1+dy,x2:s.x2+dx,y2:s.y2+dy});
    case"rect":return Object.assign({},s,{x1:s.x1+dx,y1:s.y1+dy,x2:s.x2+dx,y2:s.y2+dy});
    case"circle":return Object.assign({},s,{cx:s.cx+dx,cy:s.cy+dy});
    case"freehand":return Object.assign({},s,{pts:s.pts.map(function(p){return{x:p.x+dx,y:p.y+dy};})});
    case"text":return Object.assign({},s,{x:s.x+dx,y:s.y+dy});
    default:return s;
  }
}
function scalePoint(px,py,ob,nb){
  var rx=ob.w>1?(px-ob.x)/ob.w:0.5, ry=ob.h>1?(py-ob.y)/ob.h:0.5;
  return{x:nb.x+rx*nb.w, y:nb.y+ry*nb.h};
}
function scaleStroke(s,ob,nb){
  function sp(px,py){return scalePoint(px,py,ob,nb);}
  switch(s.type){
    case"line":case"dotted":case"arrow":case"marker":{
      var p1=sp(s.x1,s.y1),p2=sp(s.x2,s.y2);
      return Object.assign({},s,{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y});
    }
    case"rect":{
      var pa=sp(s.x1,s.y1),pb=sp(s.x2,s.y2);
      return Object.assign({},s,{x1:pa.x,y1:pa.y,x2:pb.x,y2:pb.y});
    }
    case"circle":{
      var c2=sp(s.cx,s.cy),rx2=ob.w>1?s.rx*nb.w/ob.w:s.rx,ry2=ob.h>1?s.ry*nb.h/ob.h:s.ry;
      return Object.assign({},s,{cx:c2.x,cy:c2.y,rx:rx2,ry:ry2});
    }
    case"freehand":
      return Object.assign({},s,{pts:s.pts.map(function(p){var q=sp(p.x,p.y);return{x:q.x,y:q.y};})});
    case"text":{
      var pt=sp(s.x,s.y),sc=ob.h>1?nb.h/ob.h:1,wsc=ob.w>1?nb.w/ob.w:1;
      return Object.assign({},s,{x:pt.x,y:pt.y,
        fontSize:Math.max(4,Math.round((s.fontSize||24)*sc)),
        boxW:s.boxW?Math.max(20,Math.round(s.boxW*wsc)):s.boxW});
    }
    default:return s;
  }
}

/* ─── Draw stroke on canvas ────────────────────────────────── */
function drawStroke(ctx,s){
  ctx.save();
  ctx.globalAlpha = s.type==="marker" ? s.opacity*0.42 : s.opacity;
  ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
  ctx.lineWidth   = s.type==="marker" ? s.lineW*8 : s.lineW;
  ctx.lineCap     = s.type==="marker" ? "square" : "round";
  ctx.lineJoin    = "round";
  ctx.setLineDash(s.type==="dotted" ? [s.lineW*3,s.lineW*2] : []);
  switch(s.type){
    case"line": case"dotted": case"marker":
      ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke(); break;
    case"arrow":{
      var ang=Math.atan2(s.y2-s.y1,s.x2-s.x1),len=Math.hypot(s.x2-s.x1,s.y2-s.y1),hl=Math.min(len*.3,s.lineW*9);
      ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s.x2,s.y2);
      ctx.lineTo(s.x2-hl*Math.cos(ang-Math.PI/7),s.y2-hl*Math.sin(ang-Math.PI/7));
      ctx.lineTo(s.x2-hl*Math.cos(ang+Math.PI/7),s.y2-hl*Math.sin(ang+Math.PI/7));
      ctx.closePath(); ctx.fill(); break;
    }
    case"rect": ctx.strokeRect(s.x1,s.y1,s.x2-s.x1,s.y2-s.y1); break;
    case"circle":
      ctx.beginPath(); ctx.ellipse(s.cx,s.cy,Math.max(s.rx,1),Math.max(s.ry,1),0,0,Math.PI*2); ctx.stroke(); break;
    case"freehand":
      if(s.pts&&s.pts.length>0){
        ctx.beginPath(); ctx.moveTo(s.pts[0].x,s.pts[0].y);
        if(s.pts.length===1){ctx.lineTo(s.pts[0].x,s.pts[0].y);}
        else if(s.pts.length===2){ctx.lineTo(s.pts[1].x,s.pts[1].y);}
        else{
          for(var fi=1;fi<s.pts.length-1;fi++){
            var mx2=(s.pts[fi].x+s.pts[fi+1].x)/2, my2=(s.pts[fi].y+s.pts[fi+1].y)/2;
            ctx.quadraticCurveTo(s.pts[fi].x,s.pts[fi].y,mx2,my2);
          }
          ctx.lineTo(s.pts[s.pts.length-1].x,s.pts[s.pts.length-1].y);
        }
        ctx.stroke();
      } break;
    case"text":{
      ctx.font=(s.fontBold?"bold ":"")+(s.fontSize||24)+"px -apple-system,sans-serif";
      ctx.textBaseline="top"; ctx.setLineDash([]); ctx.globalAlpha=s.opacity||1;
      var mW=s.boxW||Math.max(ctx.canvas.width-s.x-10,60), lh=(s.fontSize||24)*1.45, yOff=0;
      (s.text||"").split("\n").forEach(function(para){
        var line="";
        for(var ci=0;ci<para.length;ci++){
          var test=line+para[ci];
          if(ctx.measureText(test).width>mW&&line.length>0){ctx.fillText(line,s.x,s.y+yOff);yOff+=lh;line=para[ci];}
          else line=test;
        }
        ctx.fillText(line,s.x,s.y+yOff); yOff+=lh;
      }); break;
    }
  }
  ctx.restore();
}

/* ─── CancelConfirmModal ────────────────────────────────────── */
function CancelConfirmModal(props){
  var onJsonSave=props.onJsonSave, onClose=props.onClose, onBack=props.onBack;
  return ReactDOM.createPortal(
    ce("div",{
      onClick:function(e){if(e.target===e.currentTarget)onBack();},
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",zIndex:20000,
        display:"flex",alignItems:"center",justifyContent:"center",padding:20}
    },
      ce("div",{style:{background:"#1c1c1e",borderRadius:18,padding:"28px 24px 20px",

/* ─── ImageAnnotator ───────────────────────────────────────── */
var TOOLS=[

];

function ImageAnnotator(props){
  var img=props.img, onSave=props.onSave, onClose=props.onClose;

  var canvasRef = useRef(null);
  var st0=useState("pan");   var tool=st0[0],setTool=st0[1];
  var st1=useState("#E53935"); var color=st1[0],setColor=st1[1];
  var st2=useState([]);      var colorHist=st2[0],setColorHist=st2[1];
  var st3=useState(function(){
    try{var q=JSON.parse(localStorage.getItem("annot_quickcolors_v1"));if(q&&q.length)return q;}catch(e){}
    return["#E53935","#1565C0","#000000","#F57F17","#1B5E20","#ffffff"];
  }); var quickColors=st3[0],setQuickColors=st3[1];
  function setQuickColorsAndSave(qc){
    setQuickColors(qc);
    try{localStorage.setItem("annot_quickcolors_v1",JSON.stringify(qc));}catch(e){}
  }
  var st4=useState(3);       var lineW=st4[0],setLineW=st4[1];
  var st5=useState(1);       var opacity=st5[0],setOpacity=st5[1];
  var st6=useState(false);    var horiz=st6[0],setHoriz=st6[1];
  var st7=useState(24);      var fontSize=st7[0],setFontSize=st7[1];
  var st8=useState("24");    var fontSizeStr=st8[0],setFontSizeStr=st8[1];
  var st9=useState(false);   var fontBold=st9[0],setFontBold=st9[1];
  var stTI=useState(null);   var textInputState=stTI[0],setTextInputState=stTI[1];
  var stFP=useState(null);   var floatPos=stFP[0],setFloatPos=stFP[1];
  var stRP=useState(null);   var refPanel=stRP[0],setRefPanel=stRP[1]; // null | {url:string|null}
  var stRD=useState(null);   var refImgDim=stRD[0],setRefImgDim=stRD[1]; // ref画像の自然サイズ
  var stRS=useState(false);  var refSlideMode=stRS[0],setRefSlideMode=stRS[1]; // true=縦スライド操作中
  var stRY=useState(0);      var refOffsetY=stRY[0],setRefOffsetY=stRY[1];     // 参照画像の縦オフセット(wrapper内論理px)
  var st10=useState(1);      var zoom=st10[0],setZoom=st10[1];
  var st11=useState({x:0,y:0}); var pan=st11[0],setPan=st11[1];
  var st12=useState(false);  var canUndo=st12[0],setCanUndo=st12[1];
  var st13=useState(false);  var canRedo=st13[0],setCanRedo=st13[1];
  var st14=useState("auto"); var dispW=st14[0],setDispW=st14[1];
  var st15=useState("auto"); var dispH=st15[0],setDispH=st15[1];
  var st16=useState(null);   var selBounds=st16[0],setSelBounds=st16[1];
  var st17=useState(new Set()); var selIdxs=st17[0],setSelIdxs=st17[1];
  var stCC=useState(false);   var cancelConfirm=stCC[0],setCancelConfirm=stCC[1];
  var stFST=useState(null);   var fbStatus=stFST[0],setFbStatus=stFST[1];
  var stLS=useState(false);   var showLocalSave=stLS[0],setShowLocalSave=stLS[1];
  var stAS=useState(null);    var autoSaveStatus=stAS[0],setAutoSaveStatus=stAS[1]; // null|'saving'|'ok'|'err'
  var stRU=useState(false);   var remoteUpdate=stRU[0],setRemoteUpdate=stRU[1];

  var dprRef=useRef(1);
  var autoSaveTimerRef=useRef(null);
  var loadedSavedAtRef=useRef(0);
  var lastLocalCommitRef=useRef(0);
  var baseRef=useRef(null);
  var overlayCanvasRef=useRef(null);
  var strokesRef=useRef([]);
  var histRef=useRef([[]]);
  var futRef=useRef([]);
  var drawRef=useRef({on:false,sx:0,sy:0});
  var lastPosRef=useRef({x:0,y:0});
  var freehandPts=useRef([]);
  var panRef=useRef(null);
  var pinchRef=useRef(null);
  var _tHandlers=useRef({ts:null,tm:null,te:null});
  var lassoModeRef=useRef("idle");
  var selDragRef=useRef({sx:0,sy:0,dx:0,dy:0});
  var resizeRef=useRef(null);
  var floatDragRef=useRef(null);
  var taRef=useRef(null);
  var zoomRef=useRef(1);
  var canvasAreaRef=useRef(null);
  var canvasDimRef=useRef({w:1,h:1});
  var ctrlPanRef=useRef(false);   // Ctrl+ドラッグ中フラグ
  var textInputRef=useRef(null);  // textInputState のミラー(stale closure回避)
  var refDragRef=useRef(null);    // 参照パネルのドラッグ
  var refFileRef=useRef(null);    // 参照画像ファイル入力
  var textDragRef=useRef(null);   // テキストツールで既存テキストをドラッグ移動
  var refSlideDragRef=useRef(null); // 参照画像の縦スライドドラッグ
  useEffect(function(){zoomRef.current=zoom;},[zoom]);

  // textInputRef を最新の textInputState に同期 + ライブプレビュー描画
  useEffect(function(){
    textInputRef.current=textInputState;
    if(!textInputState||!canvasRef.current||!baseRef.current)return;
    var txt=taRef.current?taRef.current.value:(textInputState.text||"");
    // 編集中の元ストロークは除外して rebuild（二重描画防止）
    var skipIdx=textInputState.idx;
    var baseStrokes=skipIdx>=0
      ?strokesRef.current.filter(function(_,i){return i!==skipIdx;})
      :strokesRef.current;
    rebuild(baseStrokes);
    drawStroke(canvasRef.current.getContext("2d"),{
      type:"text",x:textInputState.x,y:textInputState.y,text:txt,
      fontSize:textInputState.fontSize,fontBold:textInputState.fontBold,
      color:textInputState.color,opacity:textInputState.opacity,lineW:1,
      boxW:textInputState.boxW||undefined
    });
  },[textInputState]);

  // textarea auto-height
  useEffect(function(){
    var el=taRef.current; if(!el)return;
    function autoH(){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,320)+"px";}
    autoH(); el.addEventListener("input",autoH);
    return function(){el.removeEventListener("input",autoH);};
  },[textInputState?textInputState.idx:null]);



  // ESC & スワイプ戻る
  useEffect(function(){
    function handler(e){
      if(e.key==="Escape"){
        if(textInputState)setTextInputState(null);
        else if(onClose)onClose();
      }
    }
    function onBack(){
      // テキスト入力中なら確定、そうでなければ確認モーダル
      if(textInputState){setTextInputState(null);}
      else{setCancelConfirm(true);}
    }
    window.addEventListener("keydown",handler);
    window.addEventListener("ca_back",onBack);
    return function(){
      window.removeEventListener("keydown",handler);
      window.removeEventListener("ca_back",onBack);
    };
  },[textInputState,onClose]);

  // prevent pinch on body
  useEffect(function(){
    function handler(e){if(e.touches&&e.touches.length>=2)e.preventDefault();}
    document.addEventListener("touchmove",handler,{passive:false});
    return function(){document.removeEventListener("touchmove",handler);};
  },[]);

  // ホイール: passive:false で addEventListener（React の onWheel は passive になる場合があるため）
  useEffect(function(){
    var el=canvasAreaRef.current; if(!el)return;
    function handler(e){
      e.preventDefault();
      if(e.ctrlKey||e.metaKey){
        setPan(function(p){return{x:p.x,y:p.y-e.deltaY*0.8};});
      } else {
        var factor=e.deltaY<0?1.1:0.9;
        setZoom(function(z){return Math.min(Math.max(z*factor,0.1),20);});
      }
    }
    el.addEventListener("wheel",handler,{passive:false});
    return function(){el.removeEventListener("wheel",handler);};
  },[]);

  var imgDataRef=useRef(img); // JSON読込後も最新の画像データを保持

  // ── キャンバス初期化（初回 & JSON読込時に共用） ──
  function initCanvas(imgData){
    var c=canvasRef.current; if(!c)return;
    imgDataRef.current=imgData;
    var DPR=Math.min(window.devicePixelRatio||1,2);
    dprRef.current=DPR;
    var ctx=c.getContext("2d");
    var bImg=new Image();
    bImg.onload=function(){
      var nw=bImg.naturalWidth, nh=bImg.naturalHeight;
      c.width=Math.round(nw*DPR); c.height=Math.round(nh*DPR);
      ctx.setTransform(DPR,0,0,DPR,0,0);
      if(overlayCanvasRef.current){
        overlayCanvasRef.current.width=c.width;
        overlayCanvasRef.current.height=c.height;
        overlayCanvasRef.current.getContext("2d").setTransform(DPR,0,0,DPR,0,0);
      }
      ctx.drawImage(bImg,0,0,nw,nh);
      baseRef.current=ctx.getImageData(0,0,c.width,c.height);
      var saved=imgData.strokes||[];
      strokesRef.current=saved.slice();
      saved.forEach(function(s){drawStroke(ctx,s);});
      histRef.current=[saved.slice()]; futRef.current=[];
      setCanUndo(false); setCanRedo(false);
      setSelIdxs(new Set()); setSelBounds(null);
      canvasDimRef.current={w:nw,h:nh};
      var split=refPanel;
      var aw=(split?window.innerWidth*0.5:window.innerWidth)*0.96;
      var ah=(window.innerHeight-130)*0.96;
      var sc=Math.min(1,aw/nw,ah/nh);
      setDispW(Math.round(nw*sc));
      setDispH(Math.round(nh*sc));
      setZoom(1); setPan({x:0,y:0});
      loadedSavedAtRef.current=imgData._savedAt||imgData.savedAt||0;
      lastLocalCommitRef.current=0;
      setRemoteUpdate(false);
      // セッション保存（リロード復元用）
      try{sessionStorage.setItem('ca_session',JSON.stringify({
        orig_base64:imgData.orig_base64||imgData.base64,
        orig_mt:imgData.orig_mt||imgData.mt,
        name:imgData.name||img.name||'chart',
        strokes:saved
      }));}catch(e){}
    };
    bImg.src="data:"+(imgData.orig_mt||imgData.mt)+";base64,"+(imgData.orig_base64||imgData.base64);
  }

  // 初回ロード
  useEffect(function(){initCanvas(img);},[]);// eslint-disable-line

  var cZ=function(z){return Math.min(Math.max(z,0.1),20);};

  // 参照画像のサイズを取得 + dispW/dispH再計算
  useEffect(function(){
    if(!refPanel||!refPanel.url){setRefImgDim(null);return;}
    var ri=new Image();
    ri.onload=function(){
      setRefImgDim({w:ri.naturalWidth,h:ri.naturalHeight});
      // 参照画像追加時にメインキャンバスの表示サイズを再計算
      var dim=canvasDimRef.current;
      if(!dim||!dim.w)return;
      var aw=window.innerWidth*0.45*0.96;
      var ah=(window.innerHeight-130)*0.96;
      var sc=Math.min(1,aw/dim.w,ah/dim.h);
      setDispW(Math.round(dim.w*sc));
      setDispH(Math.round(dim.h*sc));
      setPan({x:0,y:0});
    };
    ri.src=refPanel.url;
  },[refPanel&&refPanel.url]);

  // 参照パネル削除時もdispW/dispHをリセット
  useEffect(function(){
    if(refPanel)return;
    var dim=canvasDimRef.current;
    if(!dim||!dim.w)return;
    var aw=window.innerWidth*0.96;
    var ah=(window.innerHeight-130)*0.96;
    var sc=Math.min(1,aw/dim.w,ah/dim.h);
    setDispW(Math.round(dim.w*sc));
    setDispH(Math.round(dim.h*sc));
    setPan({x:0,y:0});
  },[refPanel]);

  // キャンバス座標 → 画面(viewport)座標（参照画像が左に連結されても正確）
  function canvasToScreen(cx,cy){
    var c=canvasRef.current; if(!c)return{x:0,y:0};
    var rect=c.getBoundingClientRect();
    var natW=c.width/(dprRef.current||1), natH=c.height/(dprRef.current||1);
    var sw=rect.width/natW, sh=rect.height/natH;
    return{x:rect.left+cx*sw, y:rect.top+cy*sh};
  }

  function rebuild(strokes){
    var c=canvasRef.current; if(!c||!baseRef.current)return;
    var ctx=c.getContext("2d");
    ctx.setTransform(1,0,0,1,0,0);
    ctx.putImageData(baseRef.current,0,0);
    ctx.setTransform(dprRef.current||1,0,0,dprRef.current||1,0,0);
    strokes.forEach(function(s){drawStroke(ctx,s);});
  }
  function clearOverlay(){
    var oc=overlayCanvasRef.current; if(!oc)return;
    var ctx=oc.getContext("2d");
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,oc.width,oc.height);
    ctx.setTransform(dprRef.current||1,0,0,dprRef.current||1,0,0);
  }
  function overlayCtx(){
    var oc=overlayCanvasRef.current; if(!oc)return null;
    var ctx=oc.getContext("2d");
    ctx.setTransform(dprRef.current||1,0,0,dprRef.current||1,0,0);
    return ctx;
  }
  function triggerAutoSave(){
    var cfg=props.fbCfg; if(!cfg||!cfg.url)return;
    if(autoSaveTimerRef.current)clearTimeout(autoSaveTimerRef.current);
    autoSaveTimerRef.current=setTimeout(function(){
      var cfg2=props.fbCfg; if(!cfg2||!cfg2.url)return;
      var d=imgDataRef.current;
      var savedAt=Date.now();
      var strokes=strokesRef.current;
      setAutoSaveStatus('saving');

      // ① メインクラウド保存
      var base=cfg2.url.replace(/\/$/,'')+'/chart-annotator';
      var key=(img.name||'chart').replace(/[.#$[\]/]/g,'_');
      var auth=cfg2.secret?'?auth='+cfg2.secret:'';
      var mainData={version:1,name:img.name||'chart',
        orig_base64:d.orig_base64||d.base64,orig_mt:d.orig_mt||d.mt,
        strokes:strokes,savedAt:savedAt};
      fetch(base+'/'+key+'.json'+auth,{method:'PUT',
        headers:{'Content-Type':'application/json'},body:JSON.stringify(mainData)})
        .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);
          setAutoSaveStatus('ok');setTimeout(function(){setAutoSaveStatus(null);},2000);
        })
        .catch(function(){setAutoSaveStatus('err');setTimeout(function(){setAutoSaveStatus(null);},3000);});

      // ② ドラフト同期（ドラフトから開いた場合のみ）
      var draftId=img._draftId;
      if(draftId){
        var draftBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts';
        var thumb=canvasRef.current?caGenThumb(canvasRef.current):(img._thumb||'');
        var draftData={ticker:img._ticker||'',name:img.name||'chart',
          savedAt:savedAt,thumb:thumb,
          data:{orig_base64:d.orig_base64||d.base64,orig_mt:d.orig_mt||d.mt,strokes:strokes}};
        fetch(draftBase+'/'+draftId+'.json'+auth,{method:'PUT',
          headers:{'Content-Type':'application/json'},body:JSON.stringify(draftData)})
          .catch(function(e){console.error('draft sync:',e);});
        // ③ タイムスタンプパスにも書く（ポーリング用の軽量エンドポイント）
        var tsBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts';
        fetch(tsBase+'/'+draftId+'.json'+auth,{method:'PUT',
          headers:{'Content-Type':'application/json'},body:JSON.stringify({t:savedAt})})
          .catch(function(){});
        // ④ 自分が保存したのでloadedSavedAtを更新（ポーリングで自己検知しないように）
        loadedSavedAtRef.current=savedAt;
        setRemoteUpdate(false);
      }
    },600);
  }

  function commit(strokes){
    histRef.current=histRef.current.slice(-19).concat([strokes]);
    futRef.current=[]; setCanUndo(true); setCanRedo(false);
    lastLocalCommitRef.current=Date.now();
    triggerAutoSave();
    try{
      var s=sessionStorage.getItem('ca_session');
      if(s){var d=JSON.parse(s);d.strokes=strokes;sessionStorage.setItem('ca_session',JSON.stringify(d));}
    }catch(e){}
  }

  // タイマークリーンアップ
  useEffect(function(){
    return function(){if(autoSaveTimerRef.current)clearTimeout(autoSaveTimerRef.current);};
  },[]);

  // ── 別端末同期ポーリング（15秒ごとにタイムスタンプを確認）──
  useEffect(function(){
    var cfg=props.fbCfg;
    var draftId=img._draftId;
    if(!cfg||!cfg.url||!draftId)return;
    var auth=cfg.secret?'?auth='+cfg.secret:'';
    var tsUrl=cfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts/'+draftId+'.json'+auth;
    var draftUrl=cfg.url.replace(/\/$/,'')+'/chart-annotator-drafts/'+draftId+'.json'+auth;

    function poll(){
      fetch(tsUrl).then(function(r){return r.ok?r.json():null;})
        .then(function(ts){
          if(!ts||!ts.t)return;
          var remoteT=ts.t;
          if(remoteT<=loadedSavedAtRef.current)return; // 変更なし
          // 別端末で更新あり
          var timeSinceCommit=Date.now()-lastLocalCommitRef.current;
          if(timeSinceCommit>45000){
            // 45秒以上ローカル編集なし → サイレント自動反映
            fetch(draftUrl).then(function(r){return r.ok?r.json():null;})
              .then(function(fbItem){
                if(!fbItem||!fbItem.data||!fbItem.data.strokes)return;
                var newStrokes=fbItem.data.strokes;
                strokesRef.current=newStrokes;
                histRef.current=[newStrokes]; futRef.current=[];
                setCanUndo(false); setCanRedo(false);
                rebuild(newStrokes);
                loadedSavedAtRef.current=remoteT;
                setAutoSaveStatus('ok');
                setTimeout(function(){setAutoSaveStatus(null);},2000);
                // セッションも更新
                try{
                  var s=sessionStorage.getItem('ca_session');

  function undo(){

    histRef.current=histRef.current.slice(0,-1);

  function redo(){

  function getPos(e){

    var sx=(c.width/r.width)/DPR, sy=(c.height/r.height)/DPR;

  // ── リサイズハンドル ──
  function startResize(handleId,e){
    e.stopPropagation(); e.preventDefault();
    if(!selBounds||!canvasRef.current)return;
    var ob=Object.assign({},selBounds);
    var origStrokes=JSON.parse(JSON.stringify(strokesRef.current));
    var startX=e.clientX||(e.touches&&e.touches[0].clientX)||0;
    var startY=e.clientY||(e.touches&&e.touches[0].clientY)||0;
    resizeRef.current={handleId:handleId,ob:ob,origStrokes:origStrokes,startX:startX,startY:startY};

    // テキストストロークが単体選択 かつ ml/mr ハンドル → boxW のみ調整
    var isSingleText=selIdxs.size===1&&(function(){
      var idx=Array.from(selIdxs)[0];
      return origStrokes[idx]&&origStrokes[idx].type==="text";
    })();
    if(isSingleText&&(handleId==="ml"||handleId==="mr")){
      var tIdx=Array.from(selIdxs)[0];
      var origBoxW=origStrokes[tIdx].boxW||400;
      var origTX=origStrokes[tIdx].x;
      var rect0=canvasRef.current.getBoundingClientRect();
      var sw0=canvasRef.current.width/rect0.width/(dprRef.current||1);
      function onMovT(ev){
        ev.preventDefault&&ev.preventDefault();
        var cx0=ev.clientX||(ev.touches&&ev.touches[0].clientX)||0;
        var ddx=(cx0-startX)*sw0;
        var ns;
        if(handleId==="mr"){
          ns=origStrokes.map(function(s,i){return i===tIdx?Object.assign({},s,{boxW:Math.max(40,origBoxW+ddx)}):s;});
        } else {
          ns=origStrokes.map(function(s,i){return i===tIdx?Object.assign({},s,{x:origTX+ddx,boxW:Math.max(40,origBoxW-ddx)}):s;});
        }
        strokesRef.current=ns; rebuild(ns);
        var newIdxs=new Set([tIdx]);
        setSelBounds(getBoundsFromStrokes(newIdxs,ns));
      }
      function onUpT(){
        commit(strokesRef.current); resizeRef.current=null;
        window.removeEventListener("mousemove",onMovT);
        window.removeEventListener("mouseup",onUpT);
        window.removeEventListener("touchmove",onMovT);
        window.removeEventListener("touchend",onUpT);
      }
      window.addEventListener("mousemove",onMovT);
      window.addEventListener("mouseup",onUpT);
      window.addEventListener("touchmove",onMovT,{passive:false});
      window.addEventListener("touchend",onUpT);
      return;
    }

    function onMov(ev){
      ev.preventDefault&&ev.preventDefault();
      var cx=ev.clientX||(ev.touches&&ev.touches[0].clientX)||0;
      var cy=ev.clientY||(ev.touches&&ev.touches[0].clientY)||0;
      var rect=canvasRef.current.getBoundingClientRect();
      var sw=canvasRef.current.width/rect.width/(dprRef.current||1), sh=canvasRef.current.height/rect.height/(dprRef.current||1);
      var sdx=(cx-resizeRef.current.startX)*sw, sdy=(cy-resizeRef.current.startY)*sh;
      var rb=resizeRef.current, nb=Object.assign({},rb.ob), hid=rb.handleId;
      if(hid.includes("l")){nb.x=rb.ob.x+sdx;nb.w=Math.max(10,rb.ob.w-sdx);}
      if(hid.includes("r")) nb.w=Math.max(10,rb.ob.w+sdx);
      if(hid.includes("t")){nb.y=rb.ob.y+sdy;nb.h=Math.max(10,rb.ob.h-sdy);}
      if(hid.includes("b")) nb.h=Math.max(10,rb.ob.h+sdy);
      var ns=rb.origStrokes.map(function(s,i){return selIdxs.has(i)?scaleStroke(s,rb.ob,nb):s;});
      strokesRef.current=ns; setSelBounds(nb); rebuild(ns);
    }
    function onUp(){
      commit(strokesRef.current); resizeRef.current=null;
      window.removeEventListener("mousemove",onMov);
      window.removeEventListener("mouseup",onUp);
      window.removeEventListener("touchmove",onMov);
      window.removeEventListener("touchend",onUp);
    }
    window.addEventListener("mousemove",onMov);
    window.addEventListener("mouseup",onUp);
    window.addEventListener("touchmove",onMov,{passive:false});
    window.addEventListener("touchend",onUp);
  }

  // ── Text confirm ──
  function confirmText(){
    if(!textInputState)return;
    var ti=Object.assign({},textInputState,{text:taRef.current?taRef.current.value:textInputState.text});
    if(!ti.text.trim()){rebuild(strokesRef.current);setTextInputState(null);return;}
    var tmpCtx=document.createElement("canvas").getContext("2d");
    tmpCtx.font=(ti.fontBold?"bold ":"")+ti.fontSize+"px -apple-system,sans-serif";
    var measW=tmpCtx.measureText(ti.text.trim()).width;
    var ns2={type:"text",x:ti.x,y:ti.y,text:ti.text.trim(),
      fontSize:ti.fontSize,fontBold:ti.fontBold,color:ti.color,opacity:ti.opacity,
      lineW:1,measuredWidth:measW,boxW:ti.boxW||400};
    var arr;
    if(ti.idx>=0){ arr=strokesRef.current.map(function(s,i){return i===ti.idx?ns2:s;}); }
    else { arr=strokesRef.current.concat([ns2]); }
    strokesRef.current=arr; commit(arr); rebuild(arr); setTextInputState(null);
  }

  // ── Build stroke ──
  function buildStroke(x1,y1,x2,y2){
    var b={color:color,lineW:lineW,opacity:opacity};
    switch(tool){
      case"line":   return Object.assign({},b,{type:"line",  x1:x1,y1:y1,x2:x2,y2:y2});
      case"dotted": return Object.assign({},b,{type:"dotted",x1:x1,y1:y1,x2:x2,y2:y2});
      case"arrow":  return Object.assign({},b,{type:"arrow", x1:x1,y1:y1,x2:x2,y2:y2});
      case"rect":   return Object.assign({},b,{type:"rect",  x1:x1,y1:y1,x2:x2,y2:y2});
      case"circle": return Object.assign({},b,{type:"circle",cx:(x1+x2)/2,cy:(y1+y2)/2,rx:Math.abs(x2-x1)/2,ry:Math.abs(y2-y1)/2});
      case"marker": return Object.assign({},b,{type:"marker",x1:x1,y1:y1,x2:x2,y2:y2});
      default:return null;
    }
  }

  // ── Event handlers ──
  var onStart=function(e){
    if(e.touches&&e.touches.length>=2)return;

    if((e.ctrlKey||e.metaKey)&&tool!=="pan"){
      var src00=e.touches?e.touches[0]:e;
      panRef.current={sx:src00.clientX,sy:src00.clientY,px:pan.x,py:pan.y};
      ctrlPanRef.current=true; return;
    }
    if(tool==="pan"){
      var src0=e.touches?e.touches[0]:e;
      panRef.current={sx:src0.clientX,sy:src0.clientY,px:pan.x,py:pan.y}; return;
    }
    var pos=getPos(e); lastPosRef.current=pos;
    if(tool==="lasso"){
      var er=IS_TOUCH?20:12;
      if(selBounds&&pos.x>=selBounds.x&&pos.x<=selBounds.x+selBounds.w&&pos.y>=selBounds.y&&pos.y<=selBounds.y+selBounds.h){
        selDragRef.current={sx:pos.x,sy:pos.y,dx:0,dy:0}; lassoModeRef.current="dragging_sel"; return;
      }
      var hitIdx=findStrokeAt(strokesRef.current,pos.x,pos.y,er);
      if(hitIdx>=0){
        var ni=new Set([hitIdx]);
        setSelIdxs(ni); setSelBounds(getBoundsFromStrokes(ni,strokesRef.current));
        selDragRef.current={sx:pos.x,sy:pos.y,dx:0,dy:0}; lassoModeRef.current="dragging_sel"; return;
      }
      setSelIdxs(new Set()); setSelBounds(null); rebuild(strokesRef.current);
      // 空白クリック → パンモード開始
      var src0L=e.touches?e.touches[0]:e;
      panRef.current={sx:src0L.clientX,sy:src0L.clientY,px:pan.x,py:pan.y};
      lassoModeRef.current="panning"; return;
    }
    if(tool==="text"){
      var erT=IS_TOUCH?20:12, hiT=findStrokeAt(strokesRef.current,pos.x,pos.y,erT);
      var srcT=e.touches?e.touches[0]:e;
      var defBoxW=Math.round(canvasDimRef.current.w*0.6);
      if(hiT>=0&&strokesRef.current[hiT].type==="text"){
        var tsT=strokesRef.current[hiT];
        // まずドラッグ追跡モードに入る（ドラッグなら移動、クリックのみなら編集）
        textDragRef.current={
          idx:hiT, sx:pos.x, sy:pos.y,
          origX:tsT.x, origY:tsT.y,
          moved:false, stroke:tsT
        };
      } else {
        setTextInputState({x:pos.x,y:pos.y,idx:-1,text:"",
          fontSize:fontSize,fontBold:fontBold,color:color,opacity:opacity,
          boxW:null,
          screenX:srcT.clientX,screenY:srcT.clientY});
      }
      return;
    }
    drawRef.current={on:true,sx:pos.x,sy:pos.y};
    if(tool==="freehand"){
      freehandPts.current=[pos];
    }
  };

  var onMove=function(e){
    if(e.touches&&e.touches.length>=2)return;
    e.preventDefault();
    // Ctrl+ドラッグ中
    if(ctrlPanRef.current&&panRef.current){
      var src1c=e.touches?e.touches[0]:e;
      setPan({x:panRef.current.px+(src1c.clientX-panRef.current.sx),y:panRef.current.py+(src1c.clientY-panRef.current.sy)}); return;
    }
    if(tool==="pan"&&panRef.current){
      var src1=e.touches?e.touches[0]:e;
      setPan({x:panRef.current.px+(src1.clientX-panRef.current.sx),y:panRef.current.py+(src1.clientY-panRef.current.sy)}); return;
    }
    var rawPos=getPos(e); lastPosRef.current=rawPos;
    // テキストツール: 既存テキストのドラッグ移動
    if(tool==="text"&&textDragRef.current){
      var tdx=rawPos.x-textDragRef.current.sx, tdy=rawPos.y-textDragRef.current.sy;
      if(!textDragRef.current.moved&&Math.hypot(tdx,tdy)>4) textDragRef.current.moved=true;
      if(textDragRef.current.moved){
        var tNx=textDragRef.current.origX+tdx, tNy=textDragRef.current.origY+tdy;
        rebuild(strokesRef.current.map(function(s,i){
          return i===textDragRef.current.idx?Object.assign({},s,{x:tNx,y:tNy}):s;
        }));
      }
      return;
    }
    if(tool==="lasso"){
      var mode2=lassoModeRef.current;
      if(mode2==="panning"&&panRef.current){
        var src1L=e.touches?e.touches[0]:e;
        setPan({x:panRef.current.px+(src1L.clientX-panRef.current.sx),y:panRef.current.py+(src1L.clientY-panRef.current.sy)}); return;
      }
      if(mode2==="dragging_sel"){
        var dx2=rawPos.x-selDragRef.current.sx,dy2=rawPos.y-selDragRef.current.sy;
        if(Math.hypot(dx2,dy2)>4)lassoModeRef.current="moving";
      } else if(mode2==="moving"){
        var mdx=rawPos.x-selDragRef.current.sx, mdy=rawPos.y-selDragRef.current.sy;
        selDragRef.current.dx=mdx; selDragRef.current.dy=mdy;
        var oc2=overlayCtx();
        if(oc2){clearOverlay();Array.from(selIdxs).forEach(function(i){drawStroke(oc2,shiftStroke(strokesRef.current[i],mdx,mdy));});}
        else{rebuild(strokesRef.current.filter(function(_,i){return !selIdxs.has(i);}));
          var mctx=canvasRef.current.getContext("2d");
          Array.from(selIdxs).forEach(function(i){drawStroke(mctx,shiftStroke(strokesRef.current[i],mdx,mdy));});}
      }
      return;
    }
    if(!drawRef.current.on)return;
    var pos2=snapPos(rawPos);
    var sdx=drawRef.current.sx, sdy=drawRef.current.sy;
    if(tool==="freehand"){
      var lp=freehandPts.current[freehandPts.current.length-1];
      if(!lp||Math.hypot(rawPos.x-lp.x,rawPos.y-lp.y)>1){
        freehandPts.current.push(rawPos);
        var oc_f=overlayCtx();
        if(oc_f){
          clearOverlay();
          drawStroke(oc_f,{type:"freehand",pts:freehandPts.current,color:color,lineW:lineW,opacity:opacity});
        }
      }
    } else if(tool==="eraser"){
      var er2=lineW*5;
      var after=strokesRef.current.filter(function(s){return !strokeHits(s,rawPos.x,rawPos.y,er2);});
      if(after.length!==strokesRef.current.length){strokesRef.current=after;rebuild(after);}
    } else {
      var ps=buildStroke(sdx,sdy,pos2.x,pos2.y);
      if(ps){
        var oc3=overlayCtx();
        if(oc3){clearOverlay();drawStroke(oc3,ps);}
        else{rebuild(strokesRef.current);drawStroke(canvasRef.current.getContext("2d"),ps);}
      }
    }
  };

  var onEnd=function(e){
    if(ctrlPanRef.current){ctrlPanRef.current=false;panRef.current=null;return;}
    // テキストツール: ドラッグ移動 or クリックで編集
    if(tool==="text"&&textDragRef.current){
      var td=textDragRef.current; textDragRef.current=null;
      if(td.moved){
        // ドラッグ → 移動をコミット
        var rawPosT=lastPosRef.current;
        var nx=td.origX+(rawPosT.x-td.sx), ny=td.origY+(rawPosT.y-td.sy);
        var ns=strokesRef.current.map(function(s,i){return i===td.idx?Object.assign({},s,{x:nx,y:ny}):s;});
        strokesRef.current=ns; commit(ns); rebuild(ns);
      } else {
        // クリックのみ → 編集モードへ
        var tsT2=strokesRef.current[td.idx];
        var sp2=canvasToScreen(tsT2.x,tsT2.y);
        var defBW=Math.round(canvasDimRef.current.w*0.6);
        setTextInputState({x:tsT2.x,y:tsT2.y,idx:td.idx,text:tsT2.text,
          fontSize:tsT2.fontSize||24,fontBold:tsT2.fontBold||false,

    }

    if(tool==="lasso"){
      var mode3=lassoModeRef.current;
      if(mode3==="panning"){panRef.current=null;lassoModeRef.current="idle";return;}
      if(mode3==="moving"){
        var edx=selDragRef.current.dx,edy=selDragRef.current.dy;
        var ens=strokesRef.current.map(function(s,i){return selIdxs.has(i)?shiftStroke(s,edx,edy):s;});
        strokesRef.current=ens;
        var enb=selBounds?Object.assign({},selBounds,{x:selBounds.x+edx,y:selBounds.y+edy}):null;
        setSelBounds(enb); commit(ens); rebuild(ens); lassoModeRef.current="idle";

          var ltIdx=Array.from(selIdxs)[0];
          var ltS=strokesRef.current[ltIdx];
          if(ltS&&ltS.type==="text"){
            var ltSp=canvasToScreen(ltS.x,ltS.y);
            var ltBW=ltS.boxW||Math.round(canvasDimRef.current.w*0.6);
            setTextInputState({

              fontSize:ltS.fontSize||24,fontBold:ltS.fontBold||false,
              color:ltS.color||color,opacity:ltS.opacity||1,
              boxW:ltBW,screenX:ltSp.x,screenY:ltSp.y

          }

    }
    if(!drawRef.current.on)return;
    drawRef.current.on=false;
    var esx=drawRef.current.sx, esy=drawRef.current.sy;
    var rawPos2=e.changedTouches&&e.changedTouches.length
      ?getPos(Object.assign({},e,{touches:e.changedTouches}))

    if(tool==="freehand"){
      if(freehandPts.current.length>1){
        var fs2={type:"freehand",pts:freehandPts.current.slice(),color:color,lineW:lineW,opacity:opacity};
        var fns=strokesRef.current.concat([fs2]);

      var ep=snapPos(rawPos2);

      } else {clearOverlay(); rebuild(strokesRef.current);}
    }
  };

  var onTS=function(e){

  // ── タッチイベント: stable refパターン（onTS/TM/TE 定義後に置くこと）──
  useEffect(function(){
    var el=canvasRef.current; if(!el)return;
    function _ts(e){if(_tHandlers.current.ts)_tHandlers.current.ts(e);}
    function _tm(e){if(_tHandlers.current.tm)_tHandlers.current.tm(e);}
    function _te(e){if(_tHandlers.current.te)_tHandlers.current.te(e);}

  // ── Save & Download ──
  function done(){
    // 1. 全ストロークを描画してフラット化
    rebuild(strokesRef.current);
    var c3=canvasRef.current;
    var ctx3=c3.getContext("2d");

    // 2. フラット化後の画像データを新しいベースとして保存

      // 参照画像をメインキャンバスと同じ高さにスケール
      var rw=Math.round(refImgDim.w*ch/refImgDim.h);
      // refOffsetY（wrapper論理px）→ キャンバスpx に変換
      var offsetPx=Math.round(refOffsetY*(ch/(dispH||ch)));

var CA_TICKERS_KEY='ca_tickers_v1';
var CA_META_KEY='ca_meta_v1';
var CA_DATA_PFX='ca_data_';
var CA_TRASH_KEY='ca_trash_v1';
var CA_DEF_TICKERS=['INPEX','JX金属','フジクラ','川崎重工業','IHI','ソフトバンク'];
function caLoadTickers(){try{var s=localStorage.getItem(CA_TICKERS_KEY);return s?JSON.parse(s):CA_DEF_TICKERS.slice();}catch(e){return CA_DEF_TICKERS.slice();}}
function caSaveTickers(t){try{localStorage.setItem(CA_TICKERS_KEY,JSON.stringify(t));}catch(e){}}
function caLoadMeta(){try{var s=localStorage.getItem(CA_META_KEY);return s?JSON.parse(s):[];}catch(e){return[];}}
function caSaveMeta(m){try{localStorage.setItem(CA_META_KEY,JSON.stringify(m));}catch(e){}}
function caLoadData(id){try{var s=localStorage.getItem(CA_DATA_PFX+id);return s?JSON.parse(s):null;}catch(e){return null;}}
function caSaveData(id,d){try{localStorage.setItem(CA_DATA_PFX+id,JSON.stringify(d));}catch(e){}}
function caDeleteData(id){try{localStorage.removeItem(CA_DATA_PFX+id);}catch(e){}}
function caLoadTrash(){try{var s=localStorage.getItem(CA_TRASH_KEY);return s?JSON.parse(s):[];}catch(e){return[];}}
function caSaveTrash(t){try{localStorage.setItem(CA_TRASH_KEY,JSON.stringify(t));}catch(e){}}
function caGenId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function caGenThumb(canvasEl){
  var W=600,ratio=W/canvasEl.width,H=Math.round(canvasEl.height*ratio);
  var tc=document.createElement('canvas');tc.width=W;tc.height=H;
  tc.getContext('2d').drawImage(canvasEl,0,0,W,H);
  return tc.toDataURL('image/png');
}

  var sortMode=s9[0],setSortMode=s9[1];
  function changeSortMode(v){setSortMode(v);try{localStorage.setItem(CA_SORT_KEY,v);}catch(e){}}
  var inputRef=useRef(null);
  var dragSrcRef=useRef(null);

  var auth=fbCfg.secret?'?auth='+fbCfg.secret:'';
  function makeDraftsBase(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-drafts':null;}
  function makeTrashBase(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-trash':null;}
  function makeFbTickersUrl(){return fbCfg.url?fbCfg.url.replace(/\/$/,'')+'/chart-annotator-tickers.json'+auth:null;}

  // ── Firebase 全同期（削除も含む）──
  function fetchFromFirebase(){
    if(!fbCfg.url)return;
    var base=makeDraftsBase(), trashBase=makeTrashBase();
    var now=Date.now();

    // ティッカー同期（Firebase が正源泉）
    fetch(makeFbTickersUrl())
      .then(function(r){return r.ok?r.json():null;})
      .then(function(fbTickers){
        if(fbTickers&&Array.isArray(fbTickers)){setTickers(fbTickers);caSaveTickers(fbTickers);}
      }).catch(function(){});

    // ドラフトメタ同期（削除も反映）
    fetch(base+'.json'+auth)
      .then(function(r){return r.ok?r.json():null;})
      .then(function(fbData){
        setSyncStatus(null);
        if(fbData===null)return; // ネットワークエラー時は何もしない
        var fbIds=Object.keys(fbData||{});
        var localMeta=caLoadMeta();
        // Firebase にあるアイテムを正として組み立て
        var merged=[];
        fbIds.forEach(function(id){
          var d=fbData[id]; if(!d)return;
          var local=localMeta.find(function(m){return m.id===id;});
          // サムネイル・名前は Firebase を優先
          merged.push({id:id,ticker:d.ticker||'未分類',name:d.name||id,
            savedAt:d.savedAt||0,thumb:d.thumb||''});
          // データは Firebase の方が新しければ更新
          if(d.data&&(!local||(d.savedAt||0)>(local.savedAt||0)))caSaveData(id,d.data);
        });
        // ローカルのみの新規アイテム（90秒以内）は同期待ちとして保持
        localMeta.forEach(function(m){
          if(!fbIds.includes(m.id)&&(now-(m.savedAt||0)<90000))merged.push(m);
        });
        setMeta(merged);caSaveMeta(merged);
      })
      .catch(function(){setSyncStatus(null);});

    // ゴミ箱同期
    fetch(trashBase+'.json'+auth)
      .then(function(r){return r.ok?r.json():null;})
      .then(function(fbTrash){
        if(!fbTrash)return;
        var localTrash=caLoadTrash();
        var fbIds=Object.keys(fbTrash);
        var merged=localTrash.slice();
        fbIds.forEach(function(id){
          var d=fbTrash[id]; if(!d)return;
          if(!merged.find(function(m){return m.id===id;}))
            merged.push({id:id,ticker:d.ticker||'',name:d.name||id,savedAt:d.savedAt||0,thumb:d.thumb||''});
        });
        setTrash(merged);caSaveTrash(merged);
      }).catch(function(){});
  }

  useEffect(function(){
    if(!fbCfg.url)return;
    setSyncStatus('loading');
    fetchFromFirebase();
    var timer=setInterval(function(){setSyncStatus('loading');fetchFromFirebase();},15000);
    return function(){clearInterval(timer);};
  },[]);

  // ── Firebase ヘルパー ──
  function fbSaveDraft(id,metaItem,data){
    var base=makeDraftsBase(); if(!base)return;
    fetch(base+'/'+id+'.json'+auth,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ticker:metaItem.ticker,name:metaItem.name,
        savedAt:metaItem.savedAt,thumb:metaItem.thumb,data:data})})
      .catch(function(e){console.error('fbSaveDraft:',e);});
  }
  function fbDeleteDraft(id){

  }
  function fbMoveToTrash(id,item){
    var base=makeTrashBase(); if(!base)return;
    fetch(base+'/'+id+'.json'+auth,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(item)}).catch(function(){});
  }
  function fbRestoreFromTrash(id){
    // ゴミ箱から削除（ドラフトへの復元は別途）
    var base=makeTrashBase(); if(!base)return;
    fetch(base+'/'+id+'.json'+auth,{method:'DELETE'}).catch(function(){});
  }
  function fbSyncTickers(t){
    var u=makeFbTickersUrl(); if(!u)return;

  }

  // ── 銘柄操作 ──
  function addTicker(){

      nt2.push(trashItem);caSaveTrash(nt2);setTrash(nt2);
      caDeleteData(m.id);fbDeleteDraft(m.id);fbMoveToTrash(m.id,trashItem);
    });
    var nm=meta.filter(function(m){return m.ticker!==t;});
    setMeta(nm);caSaveMeta(nm);
    var nt=tickers.filter(function(x){return x!==t;});
    setTickers(nt);caSaveTickers(nt);fbSyncTickers(nt);
    if(selTicker===t)setSelTicker(null);
  }

  // ── チャート操作 ──
  function deleteChart(id){
    var mi=meta.find(function(m){return m.id===id;});
    if(!mi)return;
    var data=caLoadData(id);
    var trashItem={id:id,ticker:mi.ticker,name:mi.name,savedAt:mi.savedAt,thumb:mi.thumb,
      deletedAt:Date.now(),data:data};
    var nt=caLoadTrash().filter(function(x){return x.id!==id;});
    nt.push(trashItem);caSaveTrash(nt);setTrash(nt);
    caDeleteData(id);fbDeleteDraft(id);fbMoveToTrash(id,trashItem);
    var nm=meta.filter(function(m){return m.id!==id;});

  function restoreChart(id){
    var ti=trash.find(function(m){return m.id===id;}); if(!ti)return;

    var nm=caLoadMeta().filter(function(m){return m.id!==id;});

      }).catch(function(){setSyncStatus(null);alert('読込失敗');});

  // ── ドラッグ並び替え ──

  var chartsUnsorted=selTicker?meta.filter(function(m){return m.ticker===selTicker;}):[];
  var charts=chartsUnsorted.slice().sort(function(a,b){
    switch(sortMode){
      case 'name_desc': return (b.name||'').localeCompare(a.name||'','ja');
      case 'name_asc':  return (a.name||'').localeCompare(b.name||'','ja');

  var BT={border:"none",cursor:"pointer",fontFamily:"inherit"};

      ce("button",{onClick:onClose,style:Object.assign({},BT,{
        fontSize:22,color:"#888",background:"none",padding:"0 4px",lineHeight:1})},"←"),
      ce("span",{style:{fontSize:16,fontWeight:700,color:"#fff",flex:1}},
        showTrash?"🗑 ゴミ箱":"📋 編集中のチャート"),
      fbCfg.url&&ce("span",{style:{fontSize:10,padding:"3px 7px",borderRadius:5,

}
/* ─── LocalSaveModal ────────────────────────────────────────── */

              tickers.map(function(t){return ce("option",{key:t,value:t},t);}),
              tickers.length===0&&ce("option",{value:""},"（銘柄なし）")
            )
          ),
          ce("div",null,
            ce("div",{style:{fontSize:11,color:"#888",marginBottom:6,fontWeight:600}},"チャート名"),
            ce("input",{type:"text",value:name,onChange:function(e){setName(e.target.value);},
              style:{width:"100%",padding:"10px 12px",background:"#2a2a2a",border:"1px solid #3a3a3a",
                borderRadius:10,color:"#fff",fontSize:14,outline:"none",boxSizing:"border-box"}})
          ),
          ce("div",{style:{display:"flex",gap:10,marginTop:4}},
            ce("button",{onClick:onClose,
              style:{flex:1,padding:"12px 0",fontSize:14,fontWeight:600,background:"#2a2a2a",
                color:"#ccc",border:"1px solid #3a3a3a",borderRadius:12,cursor:"pointer",fontFamily:"inherit"}},"キャンセル"),
            ce("button",{onClick:doSave,
              style:{flex:2,padding:"12px 0",fontSize:14,fontWeight:700,background:"#16a34a",
                color:"#fff",border:"none",borderRadius:12,cursor:"pointer",fontFamily:"inherit"}},"保存")
          )
        )
      )
    ),
    document.body
  );
}

/* ─── VirtualJoystick ──────────────────────────────────────── */
function VirtualJoystick(props){
  var onPanDelta=props.onPanDelta;
  var RING_R=44, STICK_R=32, SPEED=3;
  var ringRef=useRef(null);
  var knobRef=useRef(null);
  var stateRef=useRef({active:false,off:{x:0,y:0},moveMode:false,lastTap:0,
    pos:{x:72,y:72},touchId:null});
  var rafRef=useRef(null);
  var s0=useState({x:72,y:72}); var pos=s0[0],setPos=s0[1];
  var s1=useState(false);       var moveMode=s1[0],setMoveMode=s1[1];

  function setKnob(x,y){
    if(knobRef.current)knobRef.current.style.transform="translate(calc(-50% + "+x+"px),calc(-50% + "+y+"px))";
  }

  useEffect(function(){
    function loop(){
      var s=stateRef.current;
      if(s.active&&Math.hypot(s.off.x,s.off.y)>3)
        onPanDelta(s.off.x*SPEED/STICK_R, s.off.y*SPEED/STICK_R);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
    return function(){if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[]);

  // ネイティブタッチで登録（canvas のネイティブリスナーと競合しないようにする）
  useEffect(function(){
    var ring=ringRef.current; if(!ring)return;
    function onTS(e){
      e.stopPropagation(); e.preventDefault();
      var t=e.touches[0], s=stateRef.current, now=Date.now();
      if(now-s.lastTap<400){s.moveMode=true;setMoveMode(true);}
      s.lastTap=now; s.touchId=t.identifier; s.active=true; s.off={x:0,y:0}; setKnob(0,0);
    }
    function onTM(e){
      e.stopPropagation(); e.preventDefault();
      var s=stateRef.current; if(!s.active)return;
      var t=null;
      for(var i=0;i<e.touches.length;i++){if(e.touches[i].identifier===s.touchId){t=e.touches[i];break;}}
      if(!t)return;
      if(s.moveMode){
        var r=ring.getBoundingClientRect();
        var nx=s.pos.x+(t.clientX-(r.left+r.width/2));
        var ny=s.pos.y-(t.clientY-(r.top+r.height/2)); // bottom基準なので反転
        s.pos={x:nx,y:ny}; setPos({x:nx,y:ny}); return;
      }
      var r2=ring.getBoundingClientRect();
      var ox=t.clientX-(r2.left+r2.width/2), oy=t.clientY-(r2.top+r2.height/2);
      var dist=Math.hypot(ox,oy);
      if(dist>STICK_R){ox=ox/dist*STICK_R;oy=oy/dist*STICK_R;}
      s.off={x:ox,y:oy}; setKnob(ox,oy);
    }
    function onTE(e){
      e.stopPropagation();
      var s=stateRef.current;
      s.active=false; s.off={x:0,y:0}; setKnob(0,0);
      if(s.moveMode){s.moveMode=false;setMoveMode(false);}
    }
    ring.addEventListener("touchstart",onTS,{passive:false});
    ring.addEventListener("touchmove",onTM,{passive:false});
    ring.addEventListener("touchend",onTE);
    ring.addEventListener("touchcancel",onTE);
    return function(){
      ring.removeEventListener("touchstart",onTS);
      ring.removeEventListener("touchmove",onTM);
      ring.removeEventListener("touchend",onTE);
      ring.removeEventListener("touchcancel",onTE);
    };
  },[]);

  return ReactDOM.createPortal(
    ce("div",{style:{
      position:"fixed",left:pos.x,bottom:pos.y,
      zIndex:10006,width:RING_R*2,height:RING_R*2,
      userSelect:"none",touchAction:"none",pointerEvents:"auto"
    }},
      ce("div",{ref:ringRef,
        style:{position:"relative",width:RING_R*2,height:RING_R*2,borderRadius:"50%",
          background:"rgba(255,255,255,0.08)",
          border:"2px solid "+(moveMode?"#f97316":"rgba(255,255,255,0.25)"),
          boxShadow:"0 2px 12px rgba(0,0,0,0.4)",backdropFilter:"blur(8px)"}
      },
        ce("div",{ref:knobRef,
          style:{position:"absolute",top:"50%",left:"50%",
            width:28,height:28,borderRadius:"50%",
            background:moveMode?"#f97316":"rgba(255,255,255,0.6)",
            transform:"translate(-50%,-50%)",
            boxShadow:"0 1px 4px rgba(0,0,0,0.4)",pointerEvents:"none"}
        })
      )
    ),
    document.body
  );
}

/* ─── App (drop zone) ──────────────────────────────────────── */
function App(){
  var s0=useState(function(){
    // リロード時にセッションから復元
    try{
      var s=sessionStorage.getItem('ca_session');
      if(s){var d=JSON.parse(s);if(d.orig_base64||d.base64)return d;}
    }catch(e){}
    return null;
  }); var img=s0[0],setImg=s0[1];
  var s1=useState(false); var drag=s1[0],setDrag=s1[1];
  var s2=useState(function(){try{var s=localStorage.getItem(FB_CFG_KEY);return s?JSON.parse(s):{url:'',secret:''};}catch(e){return{url:'',secret:''};}}); var fbCfg=s2[0],setFbCfg=s2[1];
  var s3=useState(false); var showFbSettings=s3[0],setShowFbSettings=s3[1];
  var s4=useState(false); var showDrafts=s4[0],setShowDrafts=s4[1];
  var fileRef=useRef(null);

  function loadFile(file){
    if(!file||!file.type.startsWith("image/"))return;
    var reader=new FileReader();
    reader.onload=function(ev){
      var dataUrl=ev.target.result;
      var parts=dataUrl.split(",");
      var b64=parts[1];
      var mt=parts[0].match(/data:([^;]+)/)[1];
      setImg({base64:b64,mt:mt,name:file.name.replace(/\.[^.]+$/,""),strokes:[]});
    };
    reader.readAsDataURL(file);
  }

  // clipboard paste
  useEffect(function(){
    function pasteHandler(e){
      var items=e.clipboardData&&e.clipboardData.items;
      if(!items)return;
      for(var i=0;i<items.length;i++){
        if(items[i].type.startsWith("image/")){
          var f=items[i].getAsFile();
          if(f){loadFile(f);break;}
        }
      }
    }
    window.addEventListener("paste",pasteHandler);
    return function(){window.removeEventListener("paste",pasteHandler);};
  },[]);

  // ── スワイプ戻る/進むを横取り ──
  useEffect(function(){
    function onPopState(){
      // 常にガードエントリを再積みしてブラウザから離れるのを防ぐ
      window.history.pushState({caApp:true},'');
      // アプリ内の「戻る」処理をトリガー
      window.dispatchEvent(new CustomEvent('ca_back'));
    }
    window.addEventListener('popstate',onPopState);
    return function(){window.removeEventListener('popstate',onPopState);};
  },[]);

  if(img){
    return ce(ImageAnnotator,{
      img:img,
      fbCfg:fbCfg,
      onSave:function(saved){setImg(function(prev){return Object.assign({},prev,saved);});},
      onClose:function(){
        try{sessionStorage.removeItem('ca_session');}catch(e){}
        var fromDraft=!!(img&&img._draftId);
        setImg(null);
        if(fromDraft)setShowDrafts(true);
      }
    });
  }

  if(showDrafts){
    return ce(DraftLibrary,{
      fbCfg:fbCfg,
      onOpen:function(d){setImg(d);setShowDrafts(false);},
      onClose:function(){setShowDrafts(false);}
    });
  }

  var BTN={padding:"12px 0",fontSize:14,fontWeight:700,border:"none",borderRadius:12,cursor:"pointer",width:"100%"};

  return ce("div",{style:{width:"100%",height:"100%",display:"flex",flexDirection:"column",
    alignItems:"center",justifyContent:"center",gap:0,background:"#111",padding:24}},

    ce("div",{style:{fontSize:10,color:"#555",letterSpacing:3,fontWeight:700,marginBottom:12}},"チャート分析ツール 完全版"),

    /* 編集中のチャートボタン */
    ce("button",{
      onClick:function(){setShowDrafts(true);},
      style:{width:"100%",maxWidth:480,padding:"13px 0",marginBottom:16,fontSize:15,fontWeight:700,
        background:"#1e2a3a",color:"#a5b4fc",border:"1px solid #2d3f5a",borderRadius:12,cursor:"pointer",
        display:"flex",alignItems:"center",justifyContent:"center",gap:8,fontFamily:"inherit"}
    },
      ce("span",null,"📋"),
      ce("span",null,"編集中のチャート"),
      ce("span",{style:{fontSize:12,color:"#4a6080",marginLeft:4}},
        (function(){var m=caLoadMeta();return m.length>0?m.length+"件":""}())
      )
    ),

    /* ドロップゾーン */
    ce("div",{
      onDragOver:function(e){e.preventDefault();setDrag(true);},
      onDragLeave:function(){setDrag(false);},
      onDrop:function(e){e.preventDefault();setDrag(false);loadFile(e.dataTransfer.files[0]);},
      onClick:function(){fileRef.current&&fileRef.current.click();},
      style:{border:"2px dashed "+(drag?"#6366F1":"#333"),borderRadius:16,
        background:drag?"rgba(99,102,241,.08)":"#1a1a1a",
        width:"100%",maxWidth:480,minHeight:220,
        display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        gap:14,cursor:"pointer",transition:"border-color .2s,background .2s",padding:28}
    },
      ce("div",{style:{fontSize:48,transition:"transform .2s",transform:drag?"scale(1.1) translateY(-4px)":"none"}},drag?"📊":"✏️"),
      ce("div",{style:{fontSize:16,fontWeight:700,color:drag?"#a5b4fc":"#ccc"}},"チャート画像を貼る"),
      ce("div",{style:{fontSize:12,color:"#555",textAlign:"center",lineHeight:1.9,whiteSpace:"pre-line"}},
        drag?"ここにドロップしてください":"ドラッグ＆ドロップ / クリックしてファイルを選択\nCtrl+V でクリップボードから貼り付けも可"
      ),
      !drag&&ce("button",{
        onClick:function(e){e.stopPropagation();fileRef.current&&fileRef.current.click();},
        style:{padding:"9px 22px",fontSize:13,fontWeight:700,background:"#222",border:"1.5px solid #444",
          borderRadius:8,color:"#aaa",cursor:"pointer"}
      },"📁 ファイルを選択")
    ),
    ce("input",{ref:fileRef,type:"file",accept:"image/*",style:{display:"none"},
      onChange:function(e){loadFile(e.target.files[0]);e.target.value="";}}),

    /* ── Firebase 設定 ── */
    ce("div",{style:{width:"100%",maxWidth:480,marginTop:14,
      background:"#161616",border:"1px solid #2a2a2a",borderRadius:14,padding:"12px 16px",
      display:"flex",alignItems:"center",gap:10}},
      ce("span",{style:{fontSize:13,fontWeight:700,color:fbCfg.url?"#fb923c":"#888",flex:1}},
        fbCfg.url?"🔥 Firebase 接続済み":"☁ Firebase 未設定"),
      fbCfg.url&&ce("span",{style:{fontSize:10,color:"#555",overflow:"hidden",
        textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:160}},fbCfg.url),
      ce("button",{
        onClick:function(){setShowFbSettings(true);},
        style:{fontSize:12,fontWeight:700,padding:"7px 14px",
          background:fbCfg.url?"#431407":"#222",color:fbCfg.url?"#fb923c":"#aaa",
          border:"1px solid #333",borderRadius:8,cursor:"pointer",fontFamily:"inherit",flexShrink:0}
      },"⚙ 設定")
    ),

    ce("div",{style:{marginTop:16,fontSize:11,color:"#3a3a3a",textAlign:"center",lineHeight:2.2}},
      "直線 / 点線 / 矢印 / 四角 / 丸 / マーカー / フリー / テキスト / 選択・変形 / 消しゴム",ce("br",null),
      "⇺水平スナップ ・ Undo/Redo ・ ズーム＆パン ・ PNG ダウンロード"
    ),

    /* Firebase設定モーダル */
    showFbSettings&&ce(FbSettingsModal,{
      cfg:fbCfg,
      onSave:function(nc){setFbCfg(nc);},
      onClose:function(){setShowFbSettings(false);}
    })
  );
}

// ── スワイプ戻る/進む ガード ──
// ブラウザ履歴にダミーエントリを積み、popstate を横取りしてアプリ内処理に転換する
if(window.history&&window.history.pushState){
  window.history.replaceState({caApp:true},'');
  window.history.pushState({caApp:true},'');
}

// ── 画面端スワイプ（iOS戻る/Android戻る）を防止 ──
document.addEventListener('touchstart',function(e){
  if(e.touches&&e.touches.length===1){
    var x=e.touches[0].clientX;
    if(x<22||x>window.innerWidth-22)e.preventDefault();
  }
},{passive:false,capture:true});

ReactDOM.createRoot(document.getElementById('root')).render(ce(App,null));
})();
</script>
