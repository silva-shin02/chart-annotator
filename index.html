          var d1x=bx-ax,d1y=by-ay,d2x=dx-cx,d2y=dy-cy;
          var den=d1x*d2y-d1y*d2x;
          if(Math.abs(den)<1e-10)return false;
          var t=((cx-ax)*d2y-(cy-ay)*d2x)/den;
          var u=((cx-ax)*d1y-(cy-ay)*d1x)/den;
          return t>=0&&t<=1&&u>=0&&u<=1;
        }
        function _segInPoly(ax,ay,bx,by){
          /* 端点がポリゴン内、またはセグメントがポリゴン辺と交差 */
          if(_pInPoly(ax,ay)||_pInPoly(bx,by))return true;
          for(var pi=0,pj=poly.length-1;pi<poly.length;pj=pi++){
            if(_segCross(ax,ay,bx,by,poly[pi].x,poly[pi].y,poly[pj].x,poly[pj].y))return true;
          }
          return false;
        }
        var anc=s.anchors;
        /* freehand: 全点チェック (既存動作) */
        if(tp==='freehand'){
          for(var ai=0;ai<anc.length;ai++){
            var scr=_ancToScr(anc[ai]);
            if(_pInPoly(scr.x,scr.y)){hits.push({side:side,idx:idx});return;}
          }
          return;
        }
        /* horizontal: 全幅に伸びる水平線 → 複数点でチェック */
        if(tp==='horizontal'){
          if(!anc.length)return;
          var scr0=_ancToScr(anc[0]);
          var xL=L.padL+rect.left, xR=(L.padL+L.chartW)+rect.left;
          var hPts=[xL,(xL+xR)/2,xR];
          for(var hi=0;hi<hPts.length;hi++){
            if(_pInPoly(hPts[hi],scr0.y)){hits.push({side:side,idx:idx});return;}
          }
          return;
        }
        if(anc.length<2)return;
        var pa=_ancToScr(anc[0]), pb=_ancToScr(anc[1]);
        /* rect: 4角すべて + 4辺の交差チェック */
        if(tp==='rect'){
          var c1={x:pa.x,y:pa.y},c2={x:pb.x,y:pa.y},c3={x:pb.x,y:pb.y},c4={x:pa.x,y:pb.y};
          var corners=[c1,c2,c3,c4];
          for(var ci=0;ci<4;ci++){if(_pInPoly(corners[ci].x,corners[ci].y)){hits.push({side:side,idx:idx});return;}}
          /* 4辺 × ポリゴン辺 交差 */
          var edges=[[c1,c2],[c2,c3],[c3,c4],[c4,c1]];
          for(var ei=0;ei<4;ei++){
            for(var pi2=0,pj2=poly.length-1;pi2<poly.length;pj2=pi2++){
              if(_segCross(edges[ei][0].x,edges[ei][0].y,edges[ei][1].x,edges[ei][1].y,
                           poly[pi2].x,poly[pi2].y,poly[pj2].x,poly[pj2].y)){
                hits.push({side:side,idx:idx});return;
              }
            }
          }
          return;
        }
        /* circle: 中心+上下左右4点チェック */
        if(tp==='circle'){
          var cx=(pa.x+pb.x)/2, cy=(pa.y+pb.y)/2;
          var erx=Math.abs(pb.x-pa.x)/2, ery=Math.abs(pb.y-pa.y)/2;
          var cPts=[{x:cx,y:cy},{x:cx+erx,y:cy},{x:cx-erx,y:cy},{x:cx,y:cy+ery},{x:cx,y:cy-ery}];
          for(var cpi=0;cpi<cPts.length;cpi++){
            if(_pInPoly(cPts[cpi].x,cPts[cpi].y)){hits.push({side:side,idx:idx});return;}
          }
          return;
        }
        /* line/dotted/arrow/marker/trade: 端点 + セグメント交差 */
        if(_segInPoly(pa.x,pa.y,pb.x,pb.y)){hits.push({side:side,idx:idx});return;}
      }
      if(strokes)strokes.forEach(function(s,i){_checkStroke(s,i,'cur');});
      if(refStrokes)refStrokes.forEach(function(s,i){_checkStroke(s,i,'ref');});
      if(hits.length>0){setLassoSel(hits);setSelectedIdx(null);}
      else{setLassoSel(null);}
      drawCrosshair();
      return;
    }
    lassoPathRef.current=null;
    /* 2026-04-23: 投げ縄マルチ移動確定 */
    if(lassoMoveRef.current){
      var lm=lassoMoveRef.current;
      lassoMoveRef.current=null;
      if(lm.dtm||lm.dp){
        var moveItems=lm.origItems.map(function(it){
          var arr=(it.side==='ref')?(refStrokes||[]):(strokes||[]);
          var s=arr[it.idx]; if(!s)return null;
          return {side:it.side,idx:it.idx,stroke:Object.assign({},s,{
            anchors:it.anchors.map(function(a){return {tm:a.tm+(lm.dtm||0), p:a.p+(lm.dp||0)};})
          })};
        }).filter(Boolean);
        if(onStrokeUpdateMany)onStrokeUpdateMany(moveItems);
      }
      drawCrosshair();
      return;
    }
    // eraser ドラッグ終了: 1件以上消したら履歴コミット
    if(drawRef.current.on&&drawRef.current.eraser){
      if(drawRef.current.didDelete&&props.onEraserSessionEnd){
        props.onEraserSessionEnd();
      }
      drawRef.current={on:false};
      drawCrosshair();
      return;
    }
    // lasso/text 移動終了 → 確定 (C6: side対応、C8a: text toolの移動/edit切替)
    /* 計測ティックドラッグ終了 */
    if(measureTickDragRef.current){
      var tdrUp=measureTickDragRef.current;
      if(tdrUp.curP!=null){
        var _newMsTick=measures.map(function(m){
          if(m.id!==tdrUp.msrId)return m;
          return Object.assign({},m,tdrUp.end==='start'?{startP:tdrUp.curP}:{endP:tdrUp.curP});
        });
        setMeasures(_newMsTick);
        onMeasureCommit(_newMsTick);
      }
      measureTickDragRef.current=null;
      return;
    }
    /* 計測ツール: ドラッグ終了 → 確定 */
    if(measureDragRef.current){
      var md=measureDragRef.current;
      var mdiff=md.curP-md.startP;
      if(Math.abs(mdiff)>=0.5){
        var newM={id:'meas_'+Date.now(),
          startP:md.startP,endP:md.curP,
          startTm:md.startTm,startSide:md.startSide};
        var _newMsAdd=measures.concat([newM]);
        setMeasures(_newMsAdd);
        onMeasureCommit(_newMsAdd);
      }
      measureDragRef.current=null;
      drawCrosshair();
      return;
    }
    if(moveRef.current){
      var m=moveRef.current;
      /* 2026-04-21: ハンドルドラッグでdtm=dp=0ならcommitスキップ (タップのみ、Firebase無駄書き回避) */
      var isZeroDelta=m.handleId&&Math.abs(m.dtm||0)<0.001&&Math.abs(m.dp||0)<0.001;
      if(m.moving&&onStrokeUpdate&&!isZeroDelta){
        var srcArr=(m.side==='ref')?(refStrokes||[]):(strokes||[]);
        var s=srcArr[m.idx];
        if(s){
          var newStroke;
          if(m.handleId){
            /* 2026-04-21: ハンドルドラッグ → 該当anchor(s)のみ更新 */
            newStroke=applyHandleTransform(s,m.handleId,m.dtm,m.dp);
          }else{
            newStroke=Object.assign({},s,{
              anchors:s.anchors.map(function(a){return {tm:a.tm+m.dtm, p:a.p+m.dp};})
            });
          }
          onStrokeUpdate(m.side,m.idx,newStroke);
        }
      } else if(m._isTextTool&&m._editReq&&props.onRequestTextInput){
        /* textツール: 未移動 (moving=false) ならedit portal open */
        props.onRequestTextInput(m._editReq);
      }
      moveRef.current=null;
      /* 2026-04-20: 移動終了したら元位置表示抑制を解除 */
      setMoveHint(null);
      drawCrosshair();
      return;
    }
    // ドラッグ描画終了 → ストローク確定 (C6: side埋め込み)
    if(drawRef.current.on){
      var d=drawRef.current;
      var commitSide=d.side||'cur';
      if(d.freehand){
        // freehand: 2点以上あれば確定
        if(d.pts&&d.pts.length>=2){
          var stroke={id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
            type:'freehand',side:commitSide,anchors:d.pts,
            color:drawColor,width:drawWidth,opacity:drawOpacity};
          if(onStrokeAdd)onStrokeAdd(stroke);
        }
      } else {
        // 微小ドラッグは無視 (誤クリック防止) — C-uaxis: minToXWithSide経由
        var L=layoutRef.current;
        var minDragOK=false;
        if(L){
          var sx=minToXWithSide(d.sTM,commitSide);
          var sy=L.priceTop+(1-(d.sP-L.pmin)/(L.pmax-L.pmin))*L.priceH;
          var cx=minToXWithSide(d.cTM,commitSide);
          var cy=L.priceTop+(1-(d.cP-L.pmin)/(L.pmax-L.pmin))*L.priceH;
          minDragOK=Math.hypot(cx-sx,cy-sy)>=3;
        }
        if(minDragOK){
          var stroke={id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
            type:drawTool,side:commitSide,
            anchors:[{tm:d.sTM,p:d.sP},{tm:d.cTM,p:d.cP}],
            color:drawColor,width:drawWidth,opacity:drawOpacity};
          /* 2026-04-26: トレードに _tf と _dir を付与 */
          if(drawTool==='trade'){stroke._tf=tf;stroke._dir=props.tradeDir||'short';}
          if(onStrokeAdd)onStrokeAdd(stroke);
        }
      }
      drawRef.current={on:false};
      drawCrosshair();
    }
    /* 左右同時押しでなければ pending のテキスト/スタンプを確定 */
    if(!bothBtnPanRef.current){
      var _pt=pendingTextReqRef.current;
      if(_pt&&props.onRequestTextInput)props.onRequestTextInput(_pt);
      var _ps=pendingSnipRef.current;
      if(_ps){
        _ps.fn(_ps.stroke);
        /* スタンプ配置直後: まず「配置ステージ」へ (ドラッグで位置調整→空白タップで矢印へ) */
        var _sid=_ps.stroke&&_ps.stroke.id;
        var _sside=_ps.stroke&&_ps.stroke.side||'cur';
        if(_sid&&_sside==='cur')setPtrEdit({strokeId:_sid,phase:'placing',side:'cur'});
      }
    }
    pendingTextReqRef.current=null;
    pendingSnipRef.current=null;
    panStartRef.current=null;
    ctrlPanRef.current=false;
    bothBtnPanRef.current=false;
  }
  // タッチ (iPad/スマホ) - 1本指: 描画、2本指: ピンチズーム＋パン
  function onTouchStart(e){
    if(props.textInputActive)return;
    /* 2026-04-30: 3本指トリプルタップで移動(pan)ツール切替 (旧ダブル→トリプルに変更、誤発火低減)
       - 3本指タッチstart が 600ms以内に3回発生したら発火
       - 同一シーケンス内の連続触りは50ms以内フィルタで除外 */
    if(e.touches.length===3){
      var _now=Date.now();
      var _hist=threeTapHistRef.current;
      _hist=_hist.filter(function(h){return _now-h<600;});
      if(!(_hist.length>0&&_now-_hist[_hist.length-1]<50)){
        _hist.push(_now);
        threeTapHistRef.current=_hist;
        if(_hist.length>=3){
          threeTapHistRef.current=[];
          if(e.preventDefault)e.preventDefault();
          if(props.onThreeFingerDoubleTap)props.onThreeFingerDoubleTap();
          // ピンチ/描画/移動状態を全てキャンセルして即時return
          drawRef.current={on:false};
          panStartRef.current=null;
          moveRef.current=null;
          pinchRef.current=null;
          return;
        }
      }
    }
    if(e.touches.length===2){
      /* 2026-04-30: 2本指トリプルタップで消しゴムツール切替 (旧ダブル→トリプルに変更、誤発火低減)
         — 2本指touchstart が 600ms以内に3回発生したら発火
         — 同一シーケンス内の連続触りは50ms以内フィルタで除外 */
      var _now2=Date.now();
      var _hist2=twoTapHistRef.current;
      _hist2=_hist2.filter(function(h){return _now2-h<600;});
      if(!(_hist2.length>0&&_now2-_hist2[_hist2.length-1]<50)){
        _hist2.push(_now2);
        twoTapHistRef.current=_hist2;
        if(_hist2.length>=3){
          twoTapHistRef.current=[];
          if(e.preventDefault)e.preventDefault();
          if(props.onTwoFingerDoubleTap)props.onTwoFingerDoubleTap();
          drawRef.current={on:false};
          panStartRef.current=null;
          moveRef.current=null;
          pinchRef.current=null;
          return;
        }
      }
      // ピンチ開始
      if(e.preventDefault)e.preventDefault();
      var t1=e.touches[0], t2=e.touches[1];
      var dx=t2.clientX-t1.clientX, dy=t2.clientY-t1.clientY;
      var d0=Math.hypot(dx,dy);
      var cx0=(t1.clientX+t2.clientX)/2, cy0=(t1.clientY+t2.clientY)/2;
      var tpC=pxToTimePrice(cx0,cy0);
      /* C8a: gap帯も pinch 中心OK (xToSideTmが境界にclamp済) */
      if(!tpC||tpC.u==null)return;
      /* 2026-04-21: 地図モデル — zoom を直接操作、pCenter は p→固定の方式 */
      pinchRef.current={
        d0:d0, cx0:cx0, cy0:cy0,
        uS0:view.uS, ps0:pShift, zoom0:zoomRef.current,
        uCenter:tpC.u,           // ピンチ開始時の指位置のu値 (ズーム中この u が cxRatio位置に固定)
        pCenter:(tpC.p!=null?tpC.p:null),  // ピンチ中心の価格 (price領域外ならnull)
        side:tpC.side             // 参考 (cur/ref)
      };
      // 既存の描画/パン/移動をキャンセル
      drawRef.current={on:false};
      panStartRef.current=null;
      moveRef.current=null;
      return;
    }
    if(e.touches.length!==1)return;
    var t=e.touches[0];
    onMouseDown({clientX:t.clientX,clientY:t.clientY,ctrlKey:false,metaKey:false});
  }
  function onTouchMove(e){
    if(props.textInputActive)return;
    // ピンチ中 — 2026-04-21: 地図モデル (X/Y同倍率 zoom)
    if(pinchRef.current&&e.touches.length>=2){
      if(e.preventDefault)e.preventDefault();
      var t1=e.touches[0], t2=e.touches[1];
      var dxp=t2.clientX-t1.clientX, dyp=t2.clientY-t1.clientY;
      var d=Math.hypot(dxp,dyp);
      var cx=(t1.clientX+t2.clientX)/2, cy=(t1.clientY+t2.clientY)/2;
      var pr=pinchRef.current;
      if(!d||!pr.d0)return;
      var r=d/pr.d0;
      if(r<0.1)r=0.1; if(r>20)r=20;
      var L=layoutRef.current;
      if(!L||!containerRef.current){return;}
      /* 2026-04-21: 新zoom = 元zoom * r、Z_MIN/Z_MAX でclamp */
      var newZ=pr.zoom0*r;
      if(newZ<Z_MIN)newZ=Z_MIN;
      if(newZ>Z_MAX)newZ=Z_MAX;
      /* 新 uSpan (新zoom基準、tfはclosure外から取得) */
      var bStep=(tf==='5m'?5:1);
      var newUSpan=L.chartW*bStep*0.8/(Z_BASE_BAR_PX*newZ);
      var uTotalNow=L.uTotal||getUTotal(hasRef);
      if(newUSpan>uTotalNow)newUSpan=uTotalNow;
      var rect=getCanvasRect();
      var cxLocal=pr.cx0-rect.left;
      var cxRatio=(cxLocal-L.padL)/L.chartW;
      if(cxRatio<0)cxRatio=0; if(cxRatio>1)cxRatio=1;
      /* uCenter (ピンチ開始時の指位置の u) を cxRatio 位置に固定 */
      var newUS=pr.uCenter-cxRatio*newUSpan;
      var newUE=newUS+newUSpan;
      if(newUS<0){newUS=0;newUE=newUS+newUSpan;}
      if(newUE>uTotalNow){newUE=uTotalNow;newUS=Math.max(0,newUE-newUSpan);}
      setZoom(newZ);
      setView({uS:newUS,uE:newUE});
      /* 価格軸縦シフト: pCenter (ピンチ開始時の指位置の価格) を
         現在の指中点位置 (cy) に固定するように pShift 計算
         新pxPerYen = (Z_BASE_PRICE_PX/10)*newZ
         cy_local = cy - rect.top
         dpmax_new = pCenter + (cy_local-L.priceTop) * (1/newPxPerYen)
         pShift = dpmax_new - dataPmax */
      var newPxPerYen=(Z_BASE_PRICE_PX/10)*newZ;
      if(pr.pCenter!=null){
        var cyLocal=cy-rect.top;
        var cyOffset=cyLocal-L.priceTop;
        if(cyOffset<0)cyOffset=0;
        if(cyOffset>L.priceH)cyOffset=L.priceH;
        var newDpmax=pr.pCenter + cyOffset/newPxPerYen;
        var newPS=newDpmax - L.dataPmax;
        setPShift(clampPShiftForZoom(newPS, newZ, L.priceH, L.dataPmin, L.dataPmax));
      }else{
        /* price領域外スタートの場合は単純に y 移動量で pShift 変化 */
        var nextPs=pr.ps0 + (cy-pr.cy0)/newPxPerYen;
        setPShift(clampPShiftForZoom(nextPs, newZ, L.priceH, L.dataPmin, L.dataPmax));
      }
      return;
    }
    if(!e.touches.length)return;
    var t=e.touches[0];
    onMouseMove({clientX:t.clientX,clientY:t.clientY});
  }
  function onTouchEnd(e){
    if(pinchRef.current){
      if(!e.touches||e.touches.length<2){pinchRef.current=null;panStartRef.current=null;}
      return;
    }
    onMouseUp();
  }
  // ペンのホバー (Apple Pencil / S Pen 等) - 触れず浮かせている時に十字カーソル追従
  function onPointerMoveHover(e){
    if(props.textInputActive)return;
    if(e.pointerType!=='pen'||e.buttons!==0)return;
    if(!containerRef.current)return;
    var rect=getCanvasRect();
    cursorRef.current={x:e.clientX-rect.left,y:e.clientY-rect.top};
    notifyExternalCursorFromLocal();
    if(!rafRef.current){
      rafRef.current=requestAnimationFrame(function(){drawCrosshair();rafRef.current=null;});
    }
  }
  // ダブルクリック: (機能削除、ユーザー要望)

  /* ツール切替時 / データ切替時: 選択状態をリセット */
  useEffect(function(){setSelectedIdx(null);setLassoSel(null);ptrDragRef.current=null;setPtrEdit(null);},[drawTool,data,tf]);
  /* 選択(fromSelect)由来の矢印編集: 対象スタンプが選択解除されたら編集を終了 */
  useEffect(function(){
    var pe=ptrEditRef.current;
    if(pe&&pe.fromSelect){
      var cur=selectedIdx&&selectedIdx.side==='cur'?(strokes||[])[selectedIdx.idx]:null;
      if(!cur||cur.id!==pe.strokeId){ptrDragRef.current=null;setPtrEdit(null);}
    }
  },[selectedIdx,strokes]);

  /* Delete/Escapeキー: 選択削除・解除 (C6: side対応) */
  useEffect(function(){
    function onKey(e){
      if(e.key==='Escape'){if(ptrEditRef.current){ptrDragRef.current=null;setPtrEdit(null);return;}setSelectedIdx(null);setLassoSel(null);return;}
      if(e.key==='Delete'||e.key==='Backspace'){
        // input/textarea にフォーカス中は無視
        var ae=document.activeElement;
        if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable))return;
        /* 2026-04-23: lassoSel マルチ削除 */
        if(lassoSel&&lassoSel.length>0){
          if(onStrokeDeleteMany)onStrokeDeleteMany(lassoSel);
          setLassoSel(null);
          return;
        }
        if(selectedIdx!=null){
          if(onStrokeDelete)onStrokeDelete(selectedIdx.side,selectedIdx.idx);
          setSelectedIdx(null);
        }
      }
    }
    window.addEventListener('keydown',onKey);
    return function(){window.removeEventListener('keydown',onKey);};
  },[selectedIdx,lassoSel,onStrokeDelete,onStrokeDeleteMany]);

  /* 2026-04-21: 横スクロールバー描画 (出来高エリア境目)
     表示: top = priceBot+3 (divY と同位置の水平線付近)、
            left = padL、width = chartW、height = 8px
     thumb: uS/uTotal と uSpan/uTotal から位置と幅を算出
     ドラッグで uS 更新、pShift は変えず横のみ */
  function renderHorizScrollbar(){
    var L=layoutRef.current;
    if(!L)return null;
    var barTop=L.priceBot+3-4;  /* 境界線の上下中央に 8px バーを配置 */
    var barLeft=L.padL;
    var barW=L.chartW;
    var thumbRatio=Math.min(1, L.uSpan/L.uTotal);
    var thumbLeft=barLeft + (L.uS/L.uTotal)*barW;
    var thumbW=Math.max(24, thumbRatio*barW);
    if(thumbW>barW)thumbW=barW;
    if(thumbLeft+thumbW>barLeft+barW)thumbLeft=barLeft+barW-thumbW;
    function onThumbDown(e){
      e.preventDefault(); e.stopPropagation();
      var startX=e.clientX;
      var startUS=L.uS;
      var pxPerU=barW/L.uTotal;
      function onMove(ev){
        var dx=ev.clientX-startX;
        var newUS=startUS + dx/pxPerU;
        if(newUS<0)newUS=0;
        if(newUS>L.uTotal-L.uSpan)newUS=Math.max(0, L.uTotal-L.uSpan);
        setView({uS:newUS, uE:newUS+L.uSpan});
      }
      function onUp(){
        window.removeEventListener('mousemove',onMove);
        window.removeEventListener('mouseup',onUp);
      }
      window.addEventListener('mousemove',onMove);
      window.addEventListener('mouseup',onUp);
    }
    return ce("div",{
      key:"h-scrollbar",
      style:{position:"absolute",left:barLeft,top:barTop,width:barW,height:8,
        background:"rgba(255,255,255,0.04)",borderRadius:4,
        pointerEvents:"auto",zIndex:2}
    },
      ce("div",{
        onMouseDown:onThumbDown,
        onTouchStart:function(e){
          if(e.touches.length!==1)return;
          e.stopPropagation();
          var t=e.touches[0];
          onThumbDown({clientX:t.clientX,clientY:t.clientY,
            preventDefault:function(){if(e.preventDefault)e.preventDefault();},
            stopPropagation:function(){e.stopPropagation();}});
        },
        style:{position:"absolute",left:thumbLeft-barLeft,top:0,width:thumbW,height:8,
          background:"rgba(165,180,252,0.5)",borderRadius:4,cursor:"grab",
          pointerEvents:"auto"}
      })
    );
  }
  /* 縦スクロールバー (価格軸右側)
     表示: right = padR-2 or padL+chartW+2、top = priceTop、width = 6、height = priceH
     thumb: dpmin-dataPmin-α / (dataSpan+α*2) から位置、visSpan/totalSpan から高さ */
  function renderVertScrollbar(){
    var L=layoutRef.current;
    if(!L||!priceRange)return null;
    var dataSpan=L.dataPmax-L.dataPmin;
    if(dataSpan<=0)return null;
    /* clamp 範囲 = [dataPmin - dataSpan*0.5, dataPmax + dataSpan*0.5] の仮想領域内で、
       現在の表示範囲 [dpmin, dpmax] の位置を示す */
    var virtMin=L.dataPmin-dataSpan*0.5;
    var virtMax=L.dataPmax+dataSpan*0.5;
    var virtSpan=virtMax-virtMin;
    var barLeft=L.padL+L.chartW+2;
    var barTop=L.priceTop;
    var barH=L.priceH;
    if(barH<20)return null;
    var thumbRatio=Math.min(1, (L.priceH/L.pxPerYen)/virtSpan);
    /* thumbTop は画面上端 dpmax が virtMax に近いほど top 側 (小さい値) */
    var topFromVirtMax=virtMax-L.dpmax;
    var thumbTop=barTop + (topFromVirtMax/virtSpan)*barH;
    var thumbH=Math.max(24, thumbRatio*barH);
    if(thumbH>barH)thumbH=barH;
    if(thumbTop<barTop)thumbTop=barTop;
    if(thumbTop+thumbH>barTop+barH)thumbTop=barTop+barH-thumbH;
    function onThumbDown(e){
      e.preventDefault(); e.stopPropagation();
      var startY=e.clientY;
      var startPS=pShift;
      var pxPerYenVirt=barH/virtSpan;
      function onMove(ev){
        var dy=ev.clientY-startY;
        /* dy 下方向 → thumb 下に移動 → 表示範囲が下方向 (より低い価格) →
           dpmax 減少 → pShift 減少 */
        var dYen=-dy/pxPerYenVirt;
        var nextPs=startPS + dYen;
        setPShift(clampPShift(nextPs, L));
      }
      function onUp(){
        window.removeEventListener('mousemove',onMove);
        window.removeEventListener('mouseup',onUp);
      }
      window.addEventListener('mousemove',onMove);
      window.addEventListener('mouseup',onUp);
    }
    return ce("div",{
      key:"v-scrollbar",
      style:{position:"absolute",left:barLeft,top:barTop,width:6,height:barH,
        background:"rgba(255,255,255,0.04)",borderRadius:3,
        pointerEvents:"auto",zIndex:2}
    },
      ce("div",{
        onMouseDown:onThumbDown,
        onTouchStart:function(e){
          if(e.touches.length!==1)return;
          e.stopPropagation();
          var t=e.touches[0];
          onThumbDown({clientX:t.clientX,clientY:t.clientY,
            preventDefault:function(){if(e.preventDefault)e.preventDefault();},
            stopPropagation:function(){e.stopPropagation();}});
        },
        style:{position:"absolute",left:0,top:thumbTop-barTop,width:6,height:thumbH,
          background:"rgba(165,180,252,0.5)",borderRadius:3,cursor:"grab",
          pointerEvents:"auto"}
      })
    );
  }

  if(!data||(!bars.length&&!hasRef)){
    return ce("div",{ref:containerRef,style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"#555"}},
      ce("div",null,"データなし"));
  }

  return ce("div",{
    ref:containerRef,
    onMouseDown:onMouseDown,
    onMouseMove:onMouseMove,
    onMouseUp:onMouseUp,
    onMouseLeave:function(){onMouseUp();onChartMouseLeave();},
    onContextMenu:function(e){e.preventDefault();},
    onTouchStart:onTouchStart,
    onTouchMove:onTouchMove,
    onTouchEnd:onTouchEnd,
    onTouchCancel:onTouchEnd,
    onPointerMove:onPointerMoveHover,
    onPointerLeave:function(e){
      // ペンのホバーがチャート外に出たら十字カーソル消す
      if(e.pointerType==='pen'){
        cursorRef.current=null;
        if(props.onExternalCursorChange)props.onExternalCursorChange(null);

      }
    },
    style:{flex:1,position:"relative",background:chartBg,overflow:"hidden",overflowX:"hidden",
       cursor:drawTool==='pan'?"grab":"default",touchAction:"none",userSelect:"none",
       /* 2026-04-20: iPad Safari の長押しメニュー (コピー/選択部分を検索等) を抑止 */
       WebkitTouchCallout:"none",WebkitUserSelect:"none"}
  },
    ce("canvas",{ref:canvasRef,
      style:{display:"block",width:"100%",height:"100%",pointerEvents:"none"}}),
    ce("canvas",{ref:overlayRef,
      style:{position:"absolute",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none"}}),
    /* 2026-04-22: ズームコントロールはツールバー Row2 (濃さの右) に移植済
       (IndexedDataChart は zoom を props 経由で受け取り、親側でUIレンダリング) */
    /* 2026-04-21: 横スクロールバー (出来高エリア境目) */
    renderHorizScrollbar(),
    /* 2026-04-21: 縦スクロールバー (価格軸右側) */
    renderVertScrollbar(),
    /* 2026-04-23: 投げ縄マルチ選択時の色変更バー */
    lassoSel&&lassoSel.length>0&&ce("div",{
      onMouseDown:function(ev){ev.stopPropagation();},
      onTouchStart:function(ev){ev.stopPropagation();},
      style:{position:"absolute",top:8,left:"50%",transform:"translateX(-50%)",
        display:"flex",gap:4,padding:"6px 10px",background:"rgba(28,28,30,0.95)",
        borderRadius:10,border:"1px solid #6366F1",zIndex:100,alignItems:"center",

    },
      ce("span",{style:{fontSize:11,color:"#a5b4fc",fontWeight:600,marginRight:4}},lassoSel.length+"件選択"),
      quickColors.map(function(c){

    measures.map(function(msr){

/* EMA 前日連続化ヘルパー (B完全版)
   refData がある場合、当日 bars の ema9/22/50/200 を refBars 最終EMA値から連続計算して上書き。
   VWAP は Python 側値そのまま (Hyper SBI 2 と同じ当日リセット挙動)。
   非破壊: bars/refBars は変更せず新配列を返す。 */
function computeEnhancedBars(bars, refBars){
  if(!bars||!bars.length) return bars||[];
  if(!refBars||!refBars.length) return bars;
  var emaKeys=['ema9','ema22','ema50','ema200'];
  // refBars 末尾走査: 各EMAキーの最後の有効値を個別に取得
  var lastEma={ema9:null, ema22:null, ema50:null, ema200:null};
  for(var i=refBars.length-1; i>=0; i--){
    var rb=refBars[i];
    for(var j=0;j<emaKeys.length;j++){
      var k=emaKeys[j];
      if(lastEma[k]==null && rb[k]!=null) lastEma[k]=rb[k];
    }
    if(lastEma.ema9!=null&&lastEma.ema22!=null&&lastEma.ema50!=null&&lastEma.ema200!=null) break;
  }
  // 全て null なら連続化不可、原本返却
  if(lastEma.ema9==null&&lastEma.ema22==null&&lastEma.ema50==null&&lastEma.ema200==null) return bars;
  // α値: 2/(N+1)
  var alphas={ema9: 2/10, ema22: 2/23, ema50: 2/51, ema200: 2/201};
  var prev={ema9:lastEma.ema9, ema22:lastEma.ema22, ema50:lastEma.ema50, ema200:lastEma.ema200};
  return bars.map(function(b){
    var nb=Object.assign({}, b);
    for(var j=0;j<emaKeys.length;j++){
      var k=emaKeys[j];
      if(prev[k]!=null && b.c!=null){
        nb[k]=alphas[k]*b.c + (1-alphas[k])*prev[k];
        prev[k]=nb[k];
      }
      // prev[k]==null の場合 (前日データ欠落): 既存 b[k] をそのまま維持
    }
    return nb;
  });
}

/* DataChart 描画関数 (Canvas 2D 直接描画、HSBI2色、ズーム対応、10円固定グリッド、時刻+価格ストローク)
   C-uaxis: view は u軸単位 {uS, uE} で管理 — 連続した1本の時間軸上を pan/zoom
   2026-04-21: 地図モデルズーム化 — dim.zoom で X/Y 同倍率
               barW = Z_BASE_BAR_PX * zoom, pxPerYen = (Z_BASE_PRICE_PX/10) * zoom
               uSpan は zoom と chartW から派生 (view.uE は setView で同期されている前提) */
function drawDataChart(canvas,bars,data,dim,tf,view,pShift,priceRange,layoutRef,strokes,selectedIdx,editingTextIdx,refBars,refData,gapVis,refStrokes,hideHint,lassoSel,snippetsById){
  // B完全版: EMA 前日連続化 (refData ありなら bars の EMA を上書き)
  bars=computeEnhancedBars(bars, refBars);
  var dpr=window.devicePixelRatio||1;
  var W=dim.w, H=dim.h;

  // レイアウト
  var padL=40, padR=40, padT=10, padB=22;
  /* 2026-04-21: pricePx の意味変更 — 価格軸ラベル最小間隔px (旧 priceRange 縮減は廃止) */
  var minLabelGapPx=(dim&&typeof dim.pricePx==='number'&&dim.pricePx>0)?dim.pricePx:0;
  /* 2026-04-22: サムネイル専用モード — 地図モデル無効化、X/Y独立フィット (地図モデル導入前と同じ挙動)
     dim.thumbnail=true で有効
       - barW は uSpan 派生 (従来式): (chartW/uSpan) * baseStep * 0.8
       - pxPerYen は priceH/pSpan で X/Y 独立フィット
       - ctx._strokeZoom = 1.0 (書込オブジェクト zoom 連動 OFF)
       - pStep = 10 固定 (価格軸ラベル密度切替 OFF)
       - pShift = 0 強制、uS=0, uE=uTotal */
  var isThumbnail=!!(dim&&dim.thumbnail);
  /* 地図モデル zoom (通常モード用、サムネモードでは未使用) */
  var zoom=(dim&&typeof dim.zoom==='number'&&dim.zoom>0)?dim.zoom:1.0;
  /* 2026-04-22: 出来高エリア高さを 13%→18% に拡大 (getFitZoom側1484行と同値) */
  var volH=Math.max(44,Math.round((H-padT-padB)*0.18));
  var priceH=H-padT-padB-volH-6;
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  try{canvas.style.height='';}catch(e){}  /* リセット */
  var ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);

  // 背景 (HSBI2 と同じ漆黒 / 2026-04-20: ca_chart_bg_v1 設定で変更可能)
  ctx.fillStyle=caLoadChartBg();
  ctx.fillRect(0,0,W,H);

  var chartW=W-padL-padR;
  var priceTop=padT, priceBot=padT+priceH;
  var volTop=priceBot+6, volBot=volTop+volH;

  // 統合chart判定
  var hasRef=!!(refBars&&refBars.length);
  /* C8a: gapVis は tf依存 (1m=1, 5m=5) で呼び出し側から受け取る */
  gapVis=gapVis||5;
  var lunchVis=gapVis;  // 昼休み圧縮もローソク1本分

  // C8a: 昼休み(11:30=690〜12:30=750)の60分を lunchVis分に圧縮した仮想時間軸 tmVis
  function tmToVis(t){
    if(t<=690)return t;
    if(t<=750)return 690+(t-690)*(lunchVis/60);
    return t-(60-lunchVis);
  }
  function visToTm(v){
    if(v<=690)return v;
    if(v<=690+lunchVis)return 690+(v-690)*(60/lunchVis);
    return v+(60-lunchVis);
  }
  /* C-uaxis: u軸 — ref [0, tmVisSpan] + gap [tmVisSpan, tmVisSpan+gapVis] + cur [tmVisSpan+gapVis, uTotal]
     hasRef無時は [0, tmVisSpan] (cur のみ)
     C8a: tmVisSpan = 390分 - (60 - lunchVis) */
  var tmVisStart=540;         // 09:00 の tmVis値
  var tmVisSpan=390-(60-lunchVis);  // 5m=335, 1m=331
  var uTotal=hasRef?(tmVisSpan*2+gapVis):tmVisSpan;

  /* 2026-04-21: 地図モデルズーム — uSpan は zoom から派生
     uSpan = chartW * baseStep * 0.8 / (Z_BASE_BAR_PX * zoom)
     barW  = Z_BASE_BAR_PX * zoom  (ローソク実幅)
     1uあたり px = (Z_BASE_BAR_PX/0.8) * zoom / baseStep
     2026-04-22: サムネモード (isThumbnail) では uSpan=uTotal 固定 (X軸全体フィット) */
  var _baseStep=(tf==='5m'?5:1);
  var uPxUnit=(Z_BASE_BAR_PX/0.8)*zoom/_baseStep;  /* 1u = ??px */
  var uSpanFromZoom=chartW/uPxUnit;

  // view は u軸単位 {uS, uE}。fallback: 未設定なら全体表示
  // 2026-04-21: uSpan は zoom から算出、uE は uS+uSpan で上書き
  var uS, uSpan, uE;
  if(isThumbnail){
    /* サムネ: X軸全データフィット (従来式) */
    uS=0; uSpan=uTotal; uE=uTotal;
  }else{
    uS=(view&&view.uS!=null)?view.uS:0;
    uSpan=uSpanFromZoom;
    if(uSpan>uTotal){uSpan=uTotal; uS=0;}
    uE=uS+uSpan;
    if(uS<0){uS=0; uE=uSpan;}
    if(uE>uTotal){uE=uTotal; uS=Math.max(0,uE-uSpan);}
  }

  function tToMin(t){var p=t.split(':');return parseInt(p[0],10)*60+parseInt(p[1],10);}
  // tm+side → u
  function tmSideToU(m, side){
    var tv=tmToVis(m)-tmVisStart;
    if(!hasRef) return tv;
    if(side==='ref') return tv;
    return tv+tmVisSpan+gapVis;
  }
  /* 2026-04-20: 1本目/最終本目の見切れ解消用マージン
     uToX で padL+halfBarPx から描画エリア innerW にマッピング
     2026-04-21: halfBarPx = barW/2 (地図モデル、zoom連動)
     2026-04-22: サムネモードは halfBarPx を uSpan 派生で算出 (従来式) */
  var _halfBarPx;
  if(isThumbnail){
    _halfBarPx=Math.min((chartW/uSpan)*_baseStep*0.5, chartW*0.04);
  }else{
    _halfBarPx=Math.min((Z_BASE_BAR_PX*zoom)*0.5, chartW*0.04);
  }
  var _innerW=chartW-_halfBarPx*2;
  // u → x (view範囲でスケール、左右に半本分マージン)
  function uToX(u){return padL+_halfBarPx+(u-uS)/uSpan*_innerW;}
  // tm+side → x (既存呼び出し互換: minToX(m,side))
  function minToX(m, side){return uToX(tmSideToU(m, side||'cur'));}
  function tToX(t, side){return minToX(tToMin(t), side);}

  // 表示範囲内のバー判定 (bar の u値が [uS, uE] に含まれるか)
  function barInView(b, side){
    var u=tmSideToU(tToMin(b.t), side);
    return u>=uS-0.5 && u<=uE+0.5;  // 端1bar分は残す
  }
  var visibleBars=bars.filter(function(b){return barInView(b,'cur');});
  var visibleRefBars=hasRef?refBars.filter(function(b){return barInView(b,'ref');}):[];

  /* 2026-04-21: 地図モデル 価格軸 — pxPerYen = (Z_BASE_PRICE_PX/10) * zoom で縦寸法を決定
     pShift は「画面上端の表示価格(dpmax)の priceRange.max からのオフセット」と再解釈
     dpmax = priceRange.max + pShift (上端価格、pShift>0 で上に余白拡大)
     dpmin = dpmax - priceH/pxPerYen (下端価格)
     pToY(p) = priceTop + (dpmax - p) * pxPerYen
     layoutRef の pmin/pmax は「画面に映る範囲」(既存ロジック互換)
     2026-04-22: サムネモード — pmin/pmax = priceRange そのまま (X/Y独立フィット、従来式)、pShift 無視 */
  var pxPerYen, dpmax, dpmin, pmin, pmax;
  if(isThumbnail){
    pmin=priceRange.min; pmax=priceRange.max;
    pxPerYen=priceH/(pmax-pmin);
    dpmax=pmax; dpmin=pmin;
  }else{
    pxPerYen=(Z_BASE_PRICE_PX/10)*zoom;
    dpmax=priceRange.max + pShift;
    dpmin=dpmax - priceH/pxPerYen;
    pmin=dpmin; pmax=dpmax;
  }
  function pToY(p){return priceTop+(dpmax-p)*pxPerYen;}

  // 出来高レンジ (表示範囲内) — hasRef時は refBars も含めて両chartで揃える
  var vmax=0;
  visibleBars.forEach(function(b){if(b.v>vmax)vmax=b.v;});
  visibleRefBars.forEach(function(b){if(b.v>vmax)vmax=b.v;});
  if(vmax<=0) vmax=1;
  function vToY(v){return volBot-(v/vmax)*volH;}

  /* レイアウト情報を ref に書き出し (十字カーソル計算用) — C-uaxis: u軸情報も
     2026-04-20: halfBarPx/innerW 追加 (1本目/最終本目の見切れ解消マージン、minToXWithSide/xToSideTm 整合用)
     2026-04-21: zoom, pxPerYen, uPxUnit, dataPmin/dataPmax, dpmin/dpmax 追加 — スクロールバー・hit test 用 */
  if(layoutRef)layoutRef.current={padL:padL,padR:padR,padT:padT,padB:padB,
    chartW:chartW,priceTop:priceTop,priceBot:priceBot,volTop:volTop,volBot:volBot,
    priceH:priceH,pmin:pmin,pmax:pmax,
    uS:uS,uE:uE,uSpan:uSpan,uTotal:uTotal,
    tmVisStart:tmVisStart,tmVisSpan:tmVisSpan,gapVis:gapVis,
    halfBarPx:_halfBarPx,innerW:_innerW,
    hasRef:hasRef,
    zoom:zoom, pxPerYen:pxPerYen, uPxUnit:uPxUnit,
    dataPmin:priceRange.min, dataPmax:priceRange.max,
    dpmin:dpmin, dpmax:dpmax};

  /* 2026-04-21: 価格軸ラベル密度自動切替 (minLabelGapPx 基準)
     10/20/50/100/500/1000円 から、pxPerStep >= minLabelGapPx を満たす最小pStepを採用
     minLabelGapPx=0 のとき自動切替OFF (常に10円)
     2026-04-22: サムネモードは pStep=10 固定 */
  var pStepCandidates=[10,20,50,100,500,1000];
  var pStep=10;
  if(!isThumbnail && minLabelGapPx>0){
    for(var ci=0;ci<pStepCandidates.length;ci++){
      if(pStepCandidates[ci]*pxPerYen>=minLabelGapPx){pStep=pStepCandidates[ci];break;}
      pStep=pStepCandidates[ci];
    }
  }
  ctx.font='10px -apple-system,Helvetica,sans-serif';
  ctx.textBaseline='middle'; ctx.textAlign='right';
  var pStart=Math.ceil(pmin/pStep)*pStep;
  var pEnd=Math.floor(pmax/pStep)*pStep;
  /* 2026-04-21: pStep はラベル密度自動切替で 10/20/50/100/500/1000 から選択済み
     ラウンドナンバー強調 (1000円=最太、100/50円=中太、それ以外=細) */
  for(var p=pStart;p<=pEnd;p+=pStep){
    var y=pToY(p);
    var _isR1000=(p%1000===0), _isR100=(p%100===0), _isR50=(p%50===0);
    if(_isR1000){      ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=1.8; }
    else if(_isR100){  ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1.3; }
    else if(_isR50){   ctx.strokeStyle='rgba(255,255,255,0.09)'; ctx.lineWidth=1.0; }
    else {             ctx.strokeStyle='#262626';                 ctx.lineWidth=0.8; }
    ctx.beginPath(); ctx.moveTo(padL,Math.round(y)+0.5); ctx.lineTo(padL+chartW,Math.round(y)+0.5); ctx.stroke();
    ctx.fillStyle=_isR1000?'#ccc':_isR100?'#aaa':_isR50?'#888':'#666';
    ctx.font=_isR1000?'bold 11px -apple-system,Helvetica,sans-serif':_isR100?'bold 10px -apple-system,Helvetica,sans-serif':_isR50?'10px -apple-system,Helvetica,sans-serif':'10px -apple-system,Helvetica,sans-serif';
    // 右側ラベル (textAlign='right' 前提、末端より4px内側)
    ctx.fillText(p.toFixed(0),padL+chartW+padR-4,y);
    // 左側ラベル (左padLの右端より4px内側、textAlign='right' 継承)
    ctx.fillText(p.toFixed(0),padL-4,y);
  }
  ctx.font='10px -apple-system,Helvetica,sans-serif';

  // 時間グリッド: uSpan 密度でステップ可変 — 両side描画
  ctx.textBaseline='top'; ctx.textAlign='center';
  // uSpan基準のしきい値 (hasRef時は表示範囲が広いので粗く)
  var stepMin = uSpan>=300?60 : uSpan>=120?30 : uSpan>=60?15 : uSpan>=30?10 : 5;
  var gridSides = hasRef?['ref','cur']:['cur'];
  gridSides.forEach(function(sd){
    for(var m=540; m<=930; m+=stepMin){
      /* 2026-04-20: 昼休み(11:30-12:30)はループ内で全スキップ、11:30/12:30 は境界ブロックで描画 */
      if(m>=690 && m<=750)continue;
      var u=tmSideToU(m,sd);
      if(u<uS-0.1||u>uE+0.1)continue;
      var x=uToX(u);
      if(x<padL-1||x>padL+chartW+1)continue;
      var hh=Math.floor(m/60), mm=m%60;
      var tStr=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
      ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.moveTo(x,priceTop); ctx.lineTo(x,volBot); ctx.stroke();
      ctx.fillStyle='#666'; ctx.fillText(tStr,x,volBot+4);
    }
    // 昼休み境界 (11:30, 12:30) — 縦線 + 時刻ラベル強制表示 (ここでのみ描画)
    [690,750].forEach(function(m){
      var u=tmSideToU(m,sd);
      if(u<uS||u>uE)return;
      var x=uToX(u);
      ctx.strokeStyle='#2a2a2a'; ctx.setLineDash([2,3]); ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.moveTo(x,priceTop); ctx.lineTo(x,volBot); ctx.stroke();
      ctx.setLineDash([]);
      if(x>=padL-1&&x<=padL+chartW+1){
        var hh2=Math.floor(m/60), mm2=m%60;
        var tStr2=(hh2<10?'0':'')+hh2+':'+(mm2<10?'0':'')+mm2;
        ctx.fillStyle='#666'; ctx.fillText(tStr2,x,volBot+4);
      }
    });
  });

  // gap領域の薄い縦帯 (2chart境界の視覚的区切り)
  if(hasRef){
    var gU1=tmVisSpan, gU2=tmVisSpan+gapVis;
    if(!(gU2<uS||gU1>uE)){
      var gx1=uToX(Math.max(gU1,uS));
      var gx2=uToX(Math.min(gU2,uE));
      if(gx2>gx1){
        ctx.fillStyle='rgba(255,255,255,0.03)';
        ctx.fillRect(gx1,priceTop,gx2-gx1,volBot-priceTop);
      }
    }
  }

  // HSBI2 配色
  var COL_UP='#ff0054';       // 陽線 (ピンク/ローズ)
  var COL_DN='#11ded9';       // 陰線 (シアン)

  // bar描画ヘルパー (ローソク+ヒゲ+出来高を1本分)
  // 2026-04-21: barW = Z_BASE_BAR_PX * zoom (地図モデル、チャート幅uSpan非依存)
  // 2026-04-22: サムネモードは従来式 (chartW/uSpan * baseStep * 0.8) で画面幅フィット
  var barW;
  if(isThumbnail){
    barW=Math.max(1,(chartW/uSpan)*_baseStep*0.8);
  }else{
    barW=Math.max(1, Z_BASE_BAR_PX*zoom);
  }
  function drawBarSet(barsArr,side){
    /* 出来高 (vol エリア、clip なしで描画) */
    barsArr.forEach(function(b){
      var cx=minToX(tToMin(b.t),side);
      var up=b.c>=b.o;
      var col=up?COL_UP:COL_DN;
      ctx.fillStyle=col;
      var vy=vToY(b.v);
      /* 2026-04-22: ローソク本体と左右端ピクセルを揃えるため整数丸め */
      var _lxV=Math.round(cx-barW/2), _rxV=Math.round(cx+barW/2);
      ctx.fillRect(_lxV, vy, _rxV-_lxV, volBot-vy);
    });
    /* ローソク本体+ヒゲ (price エリア内のみに制限 — clip) */
    ctx.save();
    ctx.beginPath();
    ctx.rect(padL,priceTop,chartW,priceH);
    ctx.clip();
    barsArr.forEach(function(b){
      var cx=minToX(tToMin(b.t),side);
      var up=b.c>=b.o;
      var col=up?COL_UP:COL_DN;
      ctx.strokeStyle=col; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(Math.round(cx)+0.5,pToY(b.h)); ctx.lineTo(Math.round(cx)+0.5,pToY(b.l)); ctx.stroke();
      ctx.fillStyle=col;
      var y1=pToY(b.o), y2=pToY(b.c);
      var yTop=Math.min(y1,y2), bh=Math.abs(y1-y2);
      /* 2026-04-21: doji (o≈c、大引け等) の可視化: 2px最小高 + barWより少し横に伸ばして視認性確保 */
      if(bh<2){
        var dojiExt=1;
        ctx.fillRect(cx-barW/2-dojiExt, y1-1, barW+dojiExt*2, 2);
      }else{
        /* 2026-04-22: 出来高バーと左右端ピクセルを揃えるため整数丸め */
        var _lxB=Math.round(cx-barW/2), _rxB=Math.round(cx+barW/2);
        ctx.fillRect(_lxB, yTop, _rxB-_lxB, bh);
      }
    });
    ctx.restore();
  }
  drawBarSet(visibleBars,'cur');
  if(hasRef)drawBarSet(visibleRefBars,'ref');

  // EMA + VWAP ライン (price エリア内のみ — clip)
  ctx.save();
  ctx.beginPath();
  ctx.rect(padL,priceTop,chartW,priceH);
  ctx.clip();
  var lines=[
    {k:'ema9',   col:'#ffffff', label:'EMA9'},
    {k:'ema22',  col:'#ffa9ff', label:'EMA22'},
    {k:'ema50',  col:'#ff00ff', label:'EMA50'},
    {k:'ema200', col:'#55017d', label:'EMA200'},
    {k:'vwap',   col:'#ffff00', label:'VWAP'}
  ];
  function drawLine(barsArr,side,lk,col){
    ctx.strokeStyle=col; ctx.lineWidth=1.2;
    ctx.beginPath();
    var first=true;
    barsArr.forEach(function(b){
      var v=b[lk]; if(v==null)return;
      var x=minToX(tToMin(b.t),side), y=pToY(v);
      if(first){ctx.moveTo(x,y); first=false;} else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
  lines.forEach(function(line){
    drawLine(visibleBars,'cur',line.k,line.col);
    if(hasRef)drawLine(visibleRefBars,'ref',line.k,line.col);
  });

  /* B-drawing: 時刻+価格座標ストローク描画 (ズーム・パンに追従)
     C3+: cur(現在chart側) と ref(過去chart側) を分けて描画。minToXをside別に渡す。
     2026-04-21: 地図モデルズーム化 — ctx._strokeZoom に zoom を設定、
                 drawAnalysisStroke/Ext 内で width/fontSize/boxW/dash/矢尻/markerW を zoom 倍する
     2026-04-22: サムネモードは _strokeZoom=1.0 固定 (書込オブジェクト zoom連動OFF) */
  ctx._strokeZoom=isThumbnail?1.0:zoom;
  ctx._snippetsById=snippetsById||null;
  function minToXCur(m){return minToX(m,'cur');}
  function minToXRef(m){return minToX(m,'ref');}
  if(strokes&&strokes.length){
    strokes.forEach(function(s,idx){
      // 編集中のテキストは重複描画を避けるためスキップ (C6: side一致も見る)
      if(editingTextIdx&&editingTextIdx.side==='cur'&&editingTextIdx.idx===idx)return;
      /* 2026-04-20: 移動中stroke は元位置に描画しない (drawCrosshair側でshifted位置に描画) */
      if(hideHint&&hideHint.side==='cur'&&hideHint.idx===idx)return;
      var tp=s.type||s.tool;
      if(tp==='freehand'||tp==='text'){
        drawAnalysisStrokeExt(ctx,s,minToXCur,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      } else {
        drawAnalysisStroke(ctx,s,minToXCur,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      }
      /* C6: selectedIdx を {side,idx} 比較 */
      if(selectedIdx&&selectedIdx.side==='cur'&&selectedIdx.idx===idx){
        drawSelectionHighlight(ctx,s,minToXCur,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      }
    });
    /* 2026-04-26: 投げ縄マルチ選択 — 統合バウンディングボックス */
    drawUnifiedLassoBox(ctx,strokes,lassoSel,'cur',minToXCur,pToY);
  }
  // C6: ref側stroke描画 + selection対応
  if(hasRef&&refStrokes&&refStrokes.length){
    refStrokes.forEach(function(s,idx){
      // 編集中のテキストはスキップ
      if(editingTextIdx&&editingTextIdx.side==='ref'&&editingTextIdx.idx===idx)return;
      /* 2026-04-20: 移動中stroke スキップ (ref側) */
      if(hideHint&&hideHint.side==='ref'&&hideHint.idx===idx)return;
      var tp=s.type||s.tool;
      if(tp==='freehand'||tp==='text'){
        drawAnalysisStrokeExt(ctx,s,minToXRef,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      } else {
        drawAnalysisStroke(ctx,s,minToXRef,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      }
      if(selectedIdx&&selectedIdx.side==='ref'&&selectedIdx.idx===idx){
        drawSelectionHighlight(ctx,s,minToXRef,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH);
      }
    });
    /* 2026-04-26: 投げ縄マルチ選択 — 統合バウンディングボックス (ref) */
    drawUnifiedLassoBox(ctx,refStrokes,lassoSel,'ref',minToXRef,pToY);
  }
  /* 2026-04-20: EMA/VWAP/strokes の clip 解除 (drawBarSet 直後の ctx.save で始まった clip) */
  ctx.restore();

  /* 2026-04-20: 出来高エリアと価格エリアの境界に白い太線 (2px) を引く */
  ctx.strokeStyle='#ffffff';
  ctx.lineWidth=2;
  ctx.beginPath();
  var divY=priceBot+3;  /* priceBot と volTop の中間 */
  ctx.moveTo(padL, divY);
  ctx.lineTo(padL+chartW, divY);
  ctx.stroke();

  // ヘッダー描画は廃止（ticker+date は panel 上部の HTML メタ行に表示済み）
  // 直近終値の水平ライン+ラベル: 2026-04-20 削除
}

/* B-drawing: 時刻+価格座標ストロークの描画 (画像画面と同等のツール群)
   type: 'line'|'dotted'|'arrow'|'rect'|'circle'|'marker'|'horizontal'
   anchors: [{tm, p}, {tm, p}]  (horizontal は 1点のみ、p のみ使用) */
function drawAnalysisStroke(ctx,s,minToX,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH){
  if(!s||!s.anchors||!s.anchors.length)return;
  /* 2026-04-21: 地図モデルズーム連動 (ctx._strokeZoom)
     width/dash/矢尻/markerW/horizontal右端ラベル を zoom 倍する */
  var Z=(ctx&&typeof ctx._strokeZoom==='number'&&ctx._strokeZoom>0)?ctx._strokeZoom:1.0;
  var col=s.color||'#ff3b30';
  var w=(s.width||2)*Z;
  var op=s.opacity!=null?s.opacity:1;
  ctx.globalAlpha=op;
  ctx.strokeStyle=col;
  ctx.fillStyle=col;
  ctx.lineWidth=w;
  ctx.setLineDash([]);

  if(s.type==='horizontal'){
    // 水平: 価格のみ使用、全幅
    var y=pToY(s.anchors[0].p);
    if(y>=priceTop-2&&y<=priceBot+2){
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+chartW,y); ctx.stroke();
      // 右端に価格ラベル (zoom連動)
      var lbl=s.anchors[0].p.toFixed(0);
      var lblFs=10*Z;
      ctx.font='bold '+lblFs+'px -apple-system,Helvetica,sans-serif';
      ctx.textBaseline='middle'; ctx.textAlign='left';
      var lw=ctx.measureText(lbl).width+8*Z;
      ctx.globalAlpha=1;
      ctx.fillRect(padL+chartW+2,y-7*Z,lw,14*Z);
      ctx.fillStyle='#000';
      ctx.fillText(lbl,padL+chartW+6,y);
      ctx.fillStyle=col;
      ctx.globalAlpha=op;
    }
    ctx.globalAlpha=1; return;
  }

  // 2点ツール: line/dotted/arrow/rect/circle/marker
  if(s.anchors.length<2){ctx.globalAlpha=1;return;}
  var a1=s.anchors[0], a2=s.anchors[1];
  var x1=minToX(a1.tm), y1=pToY(a1.p);
  var x2=minToX(a2.tm), y2=pToY(a2.p);

  if(s.type==='line'){
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  } else if(s.type==='dotted'){
    /* 2026-04-21: dashパターンも zoom 連動 */
    var dashLen=Math.max(3*Z, w*2);
    ctx.setLineDash([dashLen, dashLen]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]);
  } else if(s.type==='arrow'){
    // 線 + 矢尻 (矢尻サイズも zoom 連動) — 2026-04-27: 起点(x1,y1)側に矢尻
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    var ang=Math.atan2(y1-y2,x1-x2); // 終点→起点の向き
    var hs=Math.max(8*Z, w*3); // 矢尻サイズ (zoom連動)
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x1-hs*Math.cos(ang-Math.PI/6), y1-hs*Math.sin(ang-Math.PI/6));
    ctx.lineTo(x1-hs*Math.cos(ang+Math.PI/6), y1-hs*Math.sin(ang+Math.PI/6));
    ctx.closePath(); ctx.fill();
  } else if(s.type==='rect'){
    var rx=Math.min(x1,x2), ry=Math.min(y1,y2);
    var rw2=Math.abs(x2-x1), rh2=Math.abs(y2-y1);
    ctx.strokeRect(rx,ry,rw2,rh2);
  } else if(s.type==='circle'){
    var cx=(x1+x2)/2, cy=(y1+y2)/2;
    var rx2=Math.abs(x2-x1)/2, ry2=Math.abs(y2-y1)/2;
    ctx.beginPath();
    ctx.ellipse(cx,cy,rx2,ry2,0,0,Math.PI*2);
    ctx.stroke();
  } else if(s.type==='marker'){
    // 半透明の太線 (画像画面仕様、zoom 連動)
    var markerW=Math.max(14*Z, w*5);
    ctx.globalAlpha=op*0.4;
    ctx.lineWidth=markerW;
    ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.lineCap='butt';
  } else if(s.type==='trade'){
    /* 2026-04-26: トレードマーカー — エントリー▼/イグジット▲ + 接続線 + P&Lラベル */
    var isShort=(s._dir||'short')==='short';
    var entryP=s.anchors[0].p, exitP=s.anchors[1].p;
    var pnl=isShort?(entryP-exitP):(exitP-entryP);
    var isWin=pnl>0;
    var triH=Math.max(8*Z,8), triW=Math.max(6*Z,6);
    /* 接続点線 */
    var dashT=Math.max(3*Z,3);
    ctx.setLineDash([dashT,dashT]);
    ctx.globalAlpha=op*0.5;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=op;
    /* エントリーマーカー (anchor[0]) */
    ctx.fillStyle=isShort?'#ef4444':'#22c55e'; /* short=赤▼, long=緑▲ */
    ctx.beginPath();
    if(isShort){
      /* ▼ 下三角 */
      ctx.moveTo(x1,y1+triH); ctx.lineTo(x1-triW,y1-triH*0.3); ctx.lineTo(x1+triW,y1-triH*0.3);
    } else {
      /* ▲ 上三角 */
      ctx.moveTo(x1,y1-triH); ctx.lineTo(x1-triW,y1+triH*0.3); ctx.lineTo(x1+triW,y1+triH*0.3);
    }
    ctx.closePath(); ctx.fill();
    /* イグジットマーカー (anchor[1]) */
    ctx.fillStyle=isShort?'#22c55e':'#ef4444'; /* short=緑▲, long=赤▼ */
    ctx.beginPath();
    if(isShort){
      /* ▲ 上三角 */
      ctx.moveTo(x2,y2-triH); ctx.lineTo(x2-triW,y2+triH*0.3); ctx.lineTo(x2+triW,y2+triH*0.3);
    } else {
      /* ▼ 下三角 */
      ctx.moveTo(x2,y2+triH); ctx.lineTo(x2-triW,y2-triH*0.3); ctx.lineTo(x2+triW,y2-triH*0.3);
    }
    ctx.closePath(); ctx.fill();
    /* P&Lラベル */
    var dtmT=Math.abs(s.anchors[1].tm-s.anchors[0].tm);
    var stepT=(s._tf==='5m')?5:1;
    var barCountT=Math.round(dtmT/stepT);
    var pnlSign=pnl>=0?'+':'';
    var pnlTxt=pnlSign+pnl.toFixed(1)+'円';
    if(barCountT>0)pnlTxt+=' / '+barCountT+'本';
    var mx2=(x1+x2)/2, my2=(y1+y2)/2;
    var lblFsT=Math.max(11*Z,11);
    ctx.font='bold '+lblFsT+'px -apple-system,Helvetica,sans-serif';
    ctx.textBaseline='bottom'; ctx.textAlign='center';
    var lblWT=ctx.measureText(pnlTxt).width+10*Z;
    var lblHT=lblFsT+6*Z;
    ctx.globalAlpha=0.9;
    ctx.fillStyle=isWin?'#14532d':'#7f1d1d';
    ctx.fillRect(mx2-lblWT/2,my2-lblHT-3*Z,lblWT,lblHT);
    ctx.fillStyle=isWin?'#4ade80':'#fca5a5';
    ctx.globalAlpha=1;
    ctx.fillText(pnlTxt,mx2,my2-5*Z);
  }
  ctx.globalAlpha=1;
}

/* freehand / text / 選択ハイライト 用の拡張描画 */
function drawAnalysisStrokeExt(ctx,s,minToX,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH){
  if(!s||!s.anchors||!s.anchors.length)return;
  /* 2026-04-21: 地図モデルズーム連動 */
  var Z=(ctx&&typeof ctx._strokeZoom==='number'&&ctx._strokeZoom>0)?ctx._strokeZoom:1.0;
  var col=s.color||'#ff3b30';
  /* 2026-05: 案C - スタンプID参照ルックアップ */
  var resolvedText=s.text||'';
  if(s._snippet&&s.snipId&&ctx&&ctx._snippetsById){
    var _sn=ctx._snippetsById[s.snipId];
    if(_sn){
      if(_sn.color&&!s._editedColor)col=_sn.color;
      if(_sn.text&&!s._editedText)resolvedText=_sn.text;
    }
  }
  var w=(s.width||2)*Z;
  var op=s.opacity!=null?s.opacity:1;
  var tp=s.type||s.tool;
  ctx.globalAlpha=op;
  ctx.strokeStyle=col;
  ctx.fillStyle=col;
  ctx.lineWidth=w;
  ctx.setLineDash([]);

  if(tp==='freehand'){
    if(s.anchors.length<2){ctx.globalAlpha=1;return;}
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    var a0=s.anchors[0];
    ctx.moveTo(minToX(a0.tm), pToY(a0.p));
    for(var i=1;i<s.anchors.length;i++){
      var a=s.anchors[i];
      ctx.lineTo(minToX(a.tm), pToY(a.p));
    }
    ctx.stroke();
    ctx.lineCap='butt'; ctx.lineJoin='miter';
  } else if(tp==='text'){
    var a=s.anchors[0];
    var x=minToX(a.tm), y=pToY(a.p);
    /* 2026-04-21: fontSize も zoom 連動 */
    var fs=(s.fontSize||15)*Z;
    var fb=s.fontBold?'bold ':'';
    ctx.font=fb+fs+"px -apple-system,'Helvetica Neue',sans-serif";
    ctx.textBaseline='top'; ctx.textAlign='left';
    /* 2026-04-20: boxW指定時は wordBreak wrap (幅を超える行を折返し)
       テキストエディット時のtextarea wrap表示と一致させるため
       2026-04-21: boxW も zoom 連動 */
    var boxWZ=(s.boxW&&s.boxW>0)?s.boxW*Z:0;
    /* スタンプ矢印: pointer有時は文頭に時間プレフィックスを表示 (保存テキストは不変) */
    var dispText=snippetDisplayText(s, resolvedText);
    var rawLines=dispText.split('\n');
    var displayLines=[];
    if(boxWZ>0){
      rawLines.forEach(function(para){
        var cur='';
        for(var ci=0;ci<para.length;ci++){
          var test=cur+para[ci];
          if(ctx.measureText(test).width>boxWZ&&cur.length>0){
            displayLines.push(cur);
            cur=para[ci];
          }else{
            cur=test;
          }
        }
        displayLines.push(cur);
      });
    }else{
      displayLines=rawLines;
    }
    // 背景半透明ボックス (視認性向上) — 折返し後のmaxWで算出
    var maxW=0;
    displayLines.forEach(function(l){var m=ctx.measureText(l).width; if(m>maxW)maxW=m;});
    if(boxWZ>maxW)maxW=boxWZ;
    var boxH=displayLines.length*fs*1.3;
    /* 2026-04-21: テキスト背景 透明化 (旧: rgba(0,0,0,0.6) fillRect) */
    /* 2026-04-27: _snippet フラグ時は枠線描画 (枠色=テキスト色) */
    if(s._snippet){
      var bpad=3*Z;
      ctx.save();
      ctx.strokeStyle=col;
      ctx.lineWidth=Math.max(1,1.5*Z);
      ctx.setLineDash([]);
      ctx.globalAlpha=op*0.7;
      ctx.strokeRect(x-bpad,y-bpad,maxW+bpad*2,boxH+bpad*2);
      ctx.restore();
      ctx.globalAlpha=op;
      /* スタンプ矢印: 枠の root点 → 矢先(tipTm,tipP) */
      if(s.pointer&&typeof s.pointer.tipTm==='number'&&typeof s.pointer.tipP==='number'){
        var pbox={x:x-bpad,y:y-bpad,w:maxW+bpad*2,h:boxH+bpad*2};
        var rpt=pointerRootPtZ(pbox,s.pointer,Z);
        var tpx=minToX(s.pointer.tipTm), tpy=pToY(s.pointer.tipP);
        ctx.globalAlpha=op;
        drawPointerArrow(ctx,rpt.x,rpt.y,tpx,tpy,col,Math.max(1.5,2*Z));
      }
    }
    ctx.fillStyle=col;
    displayLines.forEach(function(l,i){ctx.fillText(l,x,y+i*fs*1.3);});
  }
  ctx.globalAlpha=1;
}

/* 2026-04-21: 選択・変形モード ハンドル操作ヘルパー
   line/dotted/arrow/marker: 起点p1・終点p2 の2ハンドル
   rect/circle: bbox 4隅(tl/tr/bl/br) + 4辺中央(tm/bm/ml/mr) の8ハンドル
   (anchors[0], anchors[1] は bbox 対角の2点、描画側で min/max を取る) */

/* ハンドルの論理座標 (tm, p) を返す。側 side (cur/ref) は呼出側が処理 */
function getHandleAnchors(s){
  if(!s||!s.anchors||s.anchors.length<2)return [];
  var tp=s.type||s.tool;
  var a1=s.anchors[0], a2=s.anchors[1];
  if(tp==='line'||tp==='dotted'||tp==='arrow'||tp==='marker'||tp==='trade'){
    return [
      {id:'p1', tm:a1.tm, p:a1.p, cur:'move'},
      {id:'p2', tm:a2.tm, p:a2.p, cur:'move'}
    ];
  }
  if(tp==='rect'||tp==='circle'){
    var tmMin=Math.min(a1.tm,a2.tm), tmMax=Math.max(a1.tm,a2.tm);
    var pMin=Math.min(a1.p,a2.p), pMax=Math.max(a1.p,a2.p);
    var tmMid=(tmMin+tmMax)/2, pMid=(pMin+pMax)/2;
    return [
      {id:'tl', tm:tmMin, p:pMax, cur:'nwse-resize'},
      {id:'tm', tm:tmMid, p:pMax, cur:'ns-resize'},
      {id:'tr', tm:tmMax, p:pMax, cur:'nesw-resize'},
      {id:'ml', tm:tmMin, p:pMid, cur:'ew-resize'},
      {id:'mr', tm:tmMax, p:pMid, cur:'ew-resize'},
      {id:'bl', tm:tmMin, p:pMin, cur:'nesw-resize'},
      {id:'bm', tm:tmMid, p:pMin, cur:'ns-resize'},
      {id:'br', tm:tmMax, p:pMin, cur:'nwse-resize'}
    ];
  }
  return [];
}

/* ─── スタンプ矢印 (pointer) ヘルパー ─────────────────────────────
   スタンプに矢印を付け、矢先のチャート時間 tipTm を記録する機能。
   s.pointer = {rootSide:'top|right|bottom|left', rootFrac:0..1, tipTm:分, tipP:価格} */
function snipTimeStr(tm){
  if(typeof tm!=='number'||isNaN(tm))return '';
  /* 先に分単位で1回だけ丸める。時=floor/分=round と別々に丸めると
     tm=659.6 で hh=10・mm=0 となり 11:00 が "10:00" に化けるため(桁上げ不整合)。 */
  var r=Math.round(tm);
  var hh=Math.floor(r/60), mm=((r%60)+60)%60;
  return hh+':'+(mm<10?'0'+mm:mm);
}
/* スタンプ表示テキスト: pointer有時のみ時間プレフィックスを付ける (保存テキストは変更しない) */
function snippetDisplayText(s, baseText){
  baseText=baseText||'';
  if(s&&s._snippet&&s.pointer&&typeof s.pointer.tipTm==='number'){
    var t=snipTimeStr(s.pointer.tipTm);
    if(t)return t+' '+baseText;
  }
  return baseText;
}
/* 枠 box={x,y,w,h} の辺+割合 → 周上の点 */
function pointerRootPt(box, side, frac){
  frac=Math.max(0,Math.min(1,(typeof frac==='number'?frac:0.5)));
  if(side==='top')   return {x:box.x+box.w*frac, y:box.y};
  if(side==='bottom')return {x:box.x+box.w*frac, y:box.y+box.h};
  if(side==='left')  return {x:box.x,            y:box.y+box.h*frac};
  return {x:box.x+box.w, y:box.y+box.h*frac}; /* right */
}
/* 点(px,py) を 枠 box の周(4辺)に投影し、最寄りの {side,frac} を返す */
function projectBoxPerimeter(box, px, py){
  function cl(v,a,b){return Math.max(a,Math.min(b,v));}
  var cands=[
    {side:'top',    x:cl(px,box.x,box.x+box.w), y:box.y},
    {side:'bottom', x:cl(px,box.x,box.x+box.w), y:box.y+box.h},
    {side:'left',   x:box.x,                    y:cl(py,box.y,box.y+box.h)},
    {side:'right',  x:box.x+box.w,              y:cl(py,box.y,box.y+box.h)}
  ];
  var best=cands[0], bd=Infinity;
  cands.forEach(function(c){var d=Math.hypot(px-c.x,py-c.y);if(d<bd){bd=d;best=c;}});
  var frac=(best.side==='top'||best.side==='bottom')
    ?(box.w>0?(best.x-box.x)/box.w:0.5)
    :(box.h>0?(best.y-box.y)/box.h:0.5);
  return {side:best.side, frac:Math.max(0,Math.min(1,frac))};
}
/* root を「辺の始点からの論理px距離 rootOff」で解決 (文字数/プレフィックスで枠幅が変わっても
   左端=アンカー基準なので位置が動かない)。rootOff 未設定の旧データは従来の rootFrac で解決。
   Z は box 構築時のズーム倍率 (box は Z倍済みpx、rootOff は論理px) */
function pointerRootPtZ(box, pointer, Z){
  pointer=pointer||{};
  var side=pointer.rootSide||'bottom';
  Z=(typeof Z==='number'&&Z>0)?Z:1;
  if(typeof pointer.rootOff==='number'){
    if(side==='top'||side==='bottom'){
      var x=Math.max(box.x, Math.min(box.x+box.w, box.x+pointer.rootOff*Z));
      return {x:x, y:(side==='top'?box.y:box.y+box.h)};
    }
    var y=Math.max(box.y, Math.min(box.y+box.h, box.y+pointer.rootOff*Z));
    return {x:(side==='left'?box.x:box.x+box.w), y:y};
  }
  return pointerRootPt(box, side, pointer.rootFrac);
}
/* 投影して {side, off(論理px), frac} を返す (rootOff 保存用) */
function projectBoxPerimeterOff(box, px, py, Z){
  Z=(typeof Z==='number'&&Z>0)?Z:1;
  var pr=projectBoxPerimeter(box, px, py);
  var horiz=(pr.side==='top'||pr.side==='bottom');
  var off=horiz?(px-box.x)/Z:(py-box.y)/Z;
  var maxOff=horiz?box.w/Z:box.h/Z;
  off=Math.max(0, Math.min(maxOff, off));
  return {side:pr.side, off:off, frac:pr.frac};
}
/* 矢印を描く (root点 → tip点)。標準の矢印ツールと同じ矢じり形状 */
function drawPointerArrow(ctx, rx, ry, tx, ty, col, w){
  var dx=tx-rx, dy=ty-ry, len=Math.hypot(dx,dy);
  ctx.save();
  ctx.setLineDash([]);
  ctx.strokeStyle=col; ctx.fillStyle=col;
  ctx.lineWidth=w; ctx.lineCap='butt'; ctx.lineJoin='miter';
  ctx.globalAlpha=1;
  if(len<1){ctx.restore();return;}
  var ang=Math.atan2(ty-ry,tx-rx);       // root→tip の向き
  var hs=Math.max(9, w*3.4);             // 矢じりの長さ (標準矢印準拠)
  var spread=Math.PI/6;                  // 30° (標準矢印と同じ)
  /* 線は矢じりの根元手前で止める → 先端の突き抜けを防ぐ */
  var bx=tx-hs*0.86*Math.cos(ang), by=ty-hs*0.86*Math.sin(ang);
  ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(bx,by); ctx.stroke();
  /* 矢じり (tip を頂点とする三角形) */
  ctx.beginPath();
  ctx.moveTo(tx,ty);
  ctx.lineTo(tx-hs*Math.cos(ang-spread), ty-hs*Math.sin(ang-spread));
  ctx.lineTo(tx-hs*Math.cos(ang+spread), ty-hs*Math.sin(ang+spread));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ハンドルドラッグで stroke.anchors を更新した新strokeを返す (純粋関数) */
function applyHandleTransform(s, handleId, dtm, dp){
  if(!s||!s.anchors||s.anchors.length<2)return s;
  var a1=s.anchors[0], a2=s.anchors[1];
  var tp=s.type||s.tool;
  if(tp==='line'||tp==='dotted'||tp==='arrow'||tp==='marker'||tp==='trade'){
    if(handleId==='p1')return Object.assign({},s,{anchors:[{tm:a1.tm+dtm,p:a1.p+dp},a2]});
    if(handleId==='p2')return Object.assign({},s,{anchors:[a1,{tm:a2.tm+dtm,p:a2.p+dp}]});
    return s;
  }
  if(tp==='rect'||tp==='circle'){
    var tmMin=Math.min(a1.tm,a2.tm), tmMax=Math.max(a1.tm,a2.tm);
    var pMin=Math.min(a1.p,a2.p), pMax=Math.max(a1.p,a2.p);
    switch(handleId){
      case 'tl': tmMin+=dtm; pMax+=dp; break;
      case 'tr': tmMax+=dtm; pMax+=dp; break;
      case 'bl': tmMin+=dtm; pMin+=dp; break;
      case 'br': tmMax+=dtm; pMin+=dp; break;
      case 'tm': pMax+=dp; break;
      case 'bm': pMin+=dp; break;
      case 'ml': tmMin+=dtm; break;
      case 'mr': tmMax+=dtm; break;
      default: return s;
    }
    return Object.assign({},s,{anchors:[{tm:tmMin,p:pMin},{tm:tmMax,p:pMax}]});
  }
  return s;
}

/* 2026-04-26: ストロークのスクリーン座標バウンディングボックス算出 */
function getStrokeScreenBounds(ctx,s,minToX,pToY){
  if(!s||!s.anchors||!s.anchors.length)return null;
  var tp=s.type||s.tool;
  if(tp==='text'){
    var a=s.anchors[0];
    var x=minToX(a.tm), y=pToY(a.p);
    var fs=s.fontSize||15;
    var fb=s.fontBold?'bold ':'';
    var rawLines=snippetDisplayText(s, s.text||'').split('\n');
    ctx.save();
    ctx.font=fb+fs+"px -apple-system,'Helvetica Neue',sans-serif";
    var displayLines=[];
    if(s.boxW&&s.boxW>0){
      rawLines.forEach(function(para){
        var cur='';
        for(var ci=0;ci<para.length;ci++){
          var test=cur+para[ci];
          if(ctx.measureText(test).width>s.boxW&&cur.length>0){displayLines.push(cur);cur=para[ci];}
          else{cur=test;}
        }
        displayLines.push(cur);
      });
    }else{displayLines=rawLines;}
    var mW=0;
    displayLines.forEach(function(l){var w=ctx.measureText(l).width;if(w>mW)mW=w;});
    ctx.restore();
    if(s.boxW&&s.boxW>mW)mW=s.boxW;
    var tH=displayLines.length*fs*1.3;
    return {x1:x, y1:y, x2:x+mW, y2:y+tH};
  }
  if(tp==='horizontal'){
    var hy=pToY(s.anchors[0].p);
    return {x1:0, y1:hy-4, x2:9999, y2:hy+4};
  }
  /* freehand: 全ポイントのmin/max */
  if(tp==='freehand'){
    var fxMin=Infinity,fxMax=-Infinity,fyMin=Infinity,fyMax=-Infinity;
    s.anchors.forEach(function(a){
      var xx=minToX(a.tm),yy=pToY(a.p);
      if(xx<fxMin)fxMin=xx;if(xx>fxMax)fxMax=xx;
      if(yy<fyMin)fyMin=yy;if(yy>fyMax)fyMax=yy;
    });
    return {x1:fxMin,y1:fyMin,x2:fxMax,y2:fyMax};
  }
  /* 2点ツール: anchors min/max */
  if(s.anchors.length>=2){
    var ax1=minToX(s.anchors[0].tm),ay1=pToY(s.anchors[0].p);
    var ax2=minToX(s.anchors[1].tm),ay2=pToY(s.anchors[1].p);
    return {x1:Math.min(ax1,ax2),y1:Math.min(ay1,ay2),x2:Math.max(ax1,ax2),y2:Math.max(ay1,ay2)};
  }
  return null;
}

/* 2026-04-26: 投げ縄マルチ選択 — 統合バウンディングボックス1つを描画 */
function drawUnifiedLassoBox(ctx,strokes,lassoSel,side,minToX,pToY){
  if(!lassoSel||lassoSel.length===0)return;
  var items=lassoSel.filter(function(ls){return ls.side===side;});
  if(items.length===0)return;
  var gx1=Infinity,gy1=Infinity,gx2=-Infinity,gy2=-Infinity;
  items.forEach(function(ls){
    var s=strokes[ls.idx];
    if(!s)return;
    var b=getStrokeScreenBounds(ctx,s,minToX,pToY);
    if(!b)return;
    if(b.x1<gx1)gx1=b.x1; if(b.y1<gy1)gy1=b.y1;
    if(b.x2>gx2)gx2=b.x2; if(b.y2>gy2)gy2=b.y2;
  });
  if(gx1===Infinity)return;
  var PAD=6;
  ctx.save();
  ctx.strokeStyle='#4a9de3';
  ctx.lineWidth=2;
  ctx.setLineDash([5,4]);
  ctx.strokeRect(gx1-PAD,gy1-PAD,gx2-gx1+PAD*2,gy2-gy1+PAD*2);
  ctx.setLineDash([]);
  /* 選択件数バッジ */
  var badge=items.length+'件選択';
  ctx.font='bold 11px -apple-system,Helvetica,sans-serif';
  ctx.textBaseline='bottom';ctx.textAlign='left';
  var bw=ctx.measureText(badge).width+8;
  ctx.fillStyle='#1e3a5f';
  ctx.fillRect(gx1-PAD,gy1-PAD-18,bw,16);
  ctx.fillStyle='#93c5fd';
  ctx.fillText(badge,gx1-PAD+4,gy1-PAD-4);

}

/* 選択ハイライト (縁取り) */
function drawSelectionHighlight(ctx,s,minToX,pToY,padL,padR,padT,padB,chartW,priceTop,priceBot,priceH){
  if(!s||!s.anchors||!s.anchors.length)return;
  var tp=s.type||s.tool;
  ctx.save();
  ctx.strokeStyle='#4a9de3';
  ctx.lineWidth=2;
  ctx.setLineDash([4,3]);
  if(tp==='horizontal'){
    var y=pToY(s.anchors[0].p);
    ctx.strokeRect(padL-2,y-4,chartW+4,8);
  } else if(tp==='text'){
    /* C9後-fix: measureText で厳密bounding box (文字分だけ囲う)
       2026-04-20: boxW wrap時は行数を折返し後で計算 */
    var a=s.anchors[0];
    var x=minToX(a.tm), y=pToY(a.p);
    var fs=s.fontSize||15;
    var fb=s.fontBold?'bold ':'';
    var rawLines=snippetDisplayText(s, s.text||'').split('\n');
    ctx.save();
    ctx.font=fb+fs+"px -apple-system,'Helvetica Neue',sans-serif";
    var displayLines=[];
    if(s.boxW&&s.boxW>0){
      rawLines.forEach(function(para){
        var cur='';
        for(var ci=0;ci<para.length;ci++){
          var test=cur+para[ci];
          if(ctx.measureText(test).width>s.boxW&&cur.length>0){displayLines.push(cur);cur=para[ci];}
          else{cur=test;}
        }
        displayLines.push(cur);
      });
    }else{
      displayLines=rawLines;
    }
    var mW=0;
    displayLines.forEach(function(l){
      var w=ctx.measureText(l).width;
      if(w>mW)mW=w;
    });
    ctx.restore();
    if(s.boxW&&s.boxW>mW)mW=s.boxW;
    var tH=displayLines.length*fs*1.3;
    var PAD=4;
    ctx.strokeRect(x-PAD, y-PAD, mW+PAD*2, tH+PAD*2);
  } else if(s.anchors.length>=2){
    /* 2026-04-22: line/dotted/arrow/ruler/zone は枠線不要 (形状が明瞭で冗長) — ハンドル(○)のみ表示 */
    if(tp!=='line'&&tp!=='dotted'&&tp!=='arrow'&&tp!=='trade'){
      // bounding box
      var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
      s.anchors.forEach(function(a){
        var xx=minToX(a.tm), yy=pToY(a.p);
        if(xx<minX)minX=xx; if(xx>maxX)maxX=xx;
        if(yy<minY)minY=yy; if(yy>maxY)maxY=yy;
      });
      var pad=(tp==='marker'?(s.width||2)*3:4);
      ctx.strokeRect(minX-pad,minY-pad,(maxX-minX)+pad*2,(maxY-minY)+pad*2);
    }
  }
  ctx.setLineDash([]);

  /* 2026-04-21: 操作ハンドル描画 (line/dotted/arrow/marker は2点、rect/circle は8点) */
  var handles=getHandleAnchors(s);
  if(handles.length){
    var HS=IS_TOUCH?14:10;
    handles.forEach(function(h){
      var hx=minToX(h.tm), hy=pToY(h.p);
      ctx.fillStyle='#ffffff';
      ctx.strokeStyle='#4a9de3';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.arc(hx, hy, HS/2, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
    });
  }
  ctx.restore();
}

/* ─── 分析モードストローク管理ヘルパー ───
   旧形式（配列）↔新形式（{'1m':[],'5m':[]}）互換 */
/* C6: 第2引数 defaultSide で未設定strokeに side('cur'|'ref') を付与 */
function migrateAnalysisStrokes(v, defaultSide){
  var ds=(defaultSide==='ref')?'ref':'cur';
  function addSide(arr){
    return (arr||[]).map(function(s){
      if(!s)return s;
      if(s.side==='cur'||s.side==='ref')return s;
      return Object.assign({},s,{side:ds});
    });
  }
  if(Array.isArray(v))return {'1m':addSide(v),'5m':[]};
  if(v&&typeof v==='object'){
    return {'1m':addSide(v['1m']),'5m':addSide(v['5m'])};
  }
  return {'1m':[],'5m':[]};
}
function cloneAnalysisStrokes(v){
  return {'1m':(v&&v['1m']||[]).slice(),'5m':(v&&v['5m']||[]).slice()};
}
function totalAnalysisStrokes(v){
  if(!v)return 0;
  return ((v['1m']||[]).length)+((v['5m']||[]).length);
}

function ImageAnnotator(props){
  var img=props.img, onSave=props.onSave, onClose=props.onClose;

     img._sim=true で起動。当日足をカットオフ時刻まで開示(slice)して1本ずつ表示。
     永続化は一切しない(draftId無し起動 + autosave gate)。前日チャートは自動でref連結。 */
  var simMode=!!(img&&img._sim);

  /* 2026-04-20 Step3: 画像mode canvasRef 撤去 */
  /* B1: モードタブ — 2026-04-20: 画像mode完全撤去、常時 'analysis' */
  /* B2: 分析モードの state (img にある場合はそこから復元 = Firebase同期対応) */
  var stAD=useState(function(){return (img&&img.analysisData)||null;});
  var analysisData=stAD[0],setAnalysisData=stAD[1];
  var stAT=useState('1m'); var analysisTf=stAT[0],setAnalysisTf=stAT[1];
  /* シミュレーション: 当日足の開示カットオフ時刻(分)。-1=未開示(0本)。→/←/スライダーで変化 */
  var sSimCut=useState(-1); var simCutoffTm=sSimCut[0],setSimCutoffTm=sSimCut[1];

  /* 分割表示 (似た形) */
  var sSC=useState(null); var splitChart=sSC[0],setSplitChart=sSC[1];
  var sSS=useState(function(){return {'1m':[],'5m':[]};});
  var splitStrokes=sSS[0],setSplitStrokes=sSS[1];
  /* 2026-05-21: splitStrokes をクロージャ外から常に最新参照できるよう Ref に同期 */
  var splitStrokesRef=useRef(splitStrokes);
  splitStrokesRef.current=splitStrokes; // 毎レンダー更新 (stale closure 防止)
  var splitAutoSaveTimerRef=useRef(null);
  var sSA=useState('top'); var splitActive=sSA[0],setSplitActive=sSA[1];
  var sSR=useState(0.5); var splitRatio=sSR[0],setSplitRatio=sSR[1];
  var sSP=useState(false); var showSplitPicker=sSP[0],setShowSplitPicker=sSP[1];

  var sJH=useState(function(){return localStorage.getItem('ca_js_hidden')==='1';});
  var jsHidden=sJH[0],setJsHidden=sJH[1];
  function hideJs(){try{localStorage.setItem('ca_js_hidden','1');}catch(e){}setJsHidden(true);}
  function showJs(){try{localStorage.setItem('ca_js_hidden','0');}catch(e){}setJsHidden(false);}
  var analysisFileRef=useRef(null);
  /* 十字カーソル表示 ON/OFF (デフォルトON、端末問わず) */
  var stAX=useState(true); var showCrosshair=stAX[0],setShowCrosshair=stAX[1];
  var analysisDataRef=useRef(analysisData);  // triggerAutoSave内で最新値参照用
  useEffect(function(){analysisDataRef.current=analysisData;},[analysisData]);
  /* C8a-bugfix2: refAnalysisRef の宣言は stRA (line 2348) の後ろに移動した
     (元位置ではvar hoistingで refAnalysis=undefined を保持してしまい、
      ref側書込時に refAnalysisRef.current=null で早期returnする不具合があった) */
  /* C6: ref側ストローク書込用のauto-saveタイマー (帯域抑制のため1.5s debounce) */
  var refAutoSaveTimerRef=useRef(null);
  /* C6: ref側analysisStrokesをFirebaseにPATCH (帯域抑制: analysisStrokesのみ送信)
     同時にローカル IDB/memキャッシュにも反映 (再ロード時の stale 回避) */
  function triggerRefAutoSave(){
    if(simMode)return;  /* シミュレーション中は前日(ref)側も一切保存しない */
    var cfg=props.fbCfg;
    if(refAutoSaveTimerRef.current)clearTimeout(refAutoSaveTimerRef.current);
    refAutoSaveTimerRef.current=setTimeout(function(){
      var ref=refAnalysisRef.current;
      if(!ref||!ref.id)return;
      var newStrokes=ref.analysisStrokes||{'1m':[],'5m':[]};
      /* ローカルキャッシュ (IDB+mem) を最新化: 既存dataを読み取って analysisStrokes だけ差し替え */
      try{
        caLoadDataAsync(ref.id,function(d){
          if(d){
            var merged=Object.assign({},d,{analysisStrokes:newStrokes});
            caSaveData(ref.id,merged);
          }
        });
      }catch(e){console.warn('ref local cache update:',e);}
      /* Firebase PATCH: paused中はFB書込のみスキップ (ローカルは更新済) */
      var cfg2=props.fbCfg;
      if(_fbIsPaused(cfg2))return;
      var auth=cfg2.secret?'?auth='+cfg2.secret:'';
      var dataBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts-data';
      var tsBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts';
      /* 2026-04-20 C8: ref書き込みも楽観ロック pre-check
         ref.loadedSavedAt 未管理のため、ref._savedAt (読込時にセット) を基準に */
      var refBase=ref._savedAt||0;
      fetch(tsBase+'/'+ref.id+'.json'+auth).then(function(r){return r.ok?r.json():null;})
        .then(function(tsPre){
          var remoteT=tsPre&&tsPre.t;
          if(remoteT&&remoteT>refBase+200){
            /* 別端末先行書き込み検出 → silent skip (次回ポーリングで取得) */
            console.warn('ref autoSave: version conflict, skipping write',ref.id);
            return;
          }
          /* OK、PATCH実行 */
          var patchBody=JSON.stringify({analysisStrokes:newStrokes});
          fetch(dataBase+'/'+ref.id+'.json'+auth,{method:'PATCH',
            headers:{'Content-Type':'application/json'},body:patchBody})
            .catch(function(e){console.error('ref draft strokes sync:',e);});
          /* _v bump + ts 更新 (他端末同期用) */
          var savedAt=Date.now();
          fetch(tsBase+'/'+ref.id+'.json'+auth,{method:'PUT',
            headers:{'Content-Type':'application/json'},body:JSON.stringify({t:savedAt})}).catch(function(){});
          /* refAnalysis._savedAt を更新 (次回 pre-check 基準) */
          var curRef=refAnalysisRef.current;
          if(curRef&&curRef.id===ref.id){
            refAnalysisRef.current=Object.assign({},curRef,{_savedAt:savedAt});
          }
        })
        .catch(function(){
          /* pre-check失敗時は従来通り書き込み続行 (安全側) */
          var patchBody=JSON.stringify({analysisStrokes:newStrokes});
          fetch(dataBase+'/'+ref.id+'.json'+auth,{method:'PATCH',
            headers:{'Content-Type':'application/json'},body:patchBody})
            .catch(function(e){console.error('ref draft strokes sync:',e);});
          var savedAt=Date.now();
          fetch(tsBase+'/'+ref.id+'.json'+auth,{method:'PUT',
            headers:{'Content-Type':'application/json'},body:JSON.stringify({t:savedAt})}).catch(function(){});
        });
    },1500);
  }
  /* C6: refAnalysis.analysisStrokes を更新するhelper (tf別書換) */
  function updateRefAnalysisStrokes(newStrokesObj){
    setRefAnalysis(function(prev){
      if(!prev)return prev;
      return Object.assign({},prev,{analysisStrokes:newStrokesObj});
    });
    triggerRefAutoSave();
  }
  /* 前日チャート自動ロード
     strictOnly=true: 現在より「過去日付」のチャートのみ採用(無ければ何もしない=ref無し)。シミュ用。
     silent=true: トースト通知を出さない。 */
  function loadPrevChart(strictOnly,silent){
    var ticker=img._ticker||(analysisData&&analysisData.ticker)||'';
    var currentId=img._draftId||savedDraftIdRef.current||null;
    var currentDate=(analysisData&&analysisData.date)||'';
    if(!ticker){if(!silent)window.caToast('銘柄が設定されていません','info');return;}
    var allMeta=caLoadMeta();
    var candidates=allMeta.filter(function(m){
      return m.ticker===ticker&&m.id!==currentId;
    });
    if(candidates.length===0){if(!silent)window.caToast('同銘柄の他のチャートがありません','info');return;}
    /* meta から有効な YYYY-MM-DD を取り出すヘルパー
       優先順位: analysisDate(YYYY-MM-DD) → analysisDate(YYYYMMDD) → name内 YYYY-MM-DD → name内 _YYYYMMDD
       analysisDate が未設定の古いチャートでも name に日付が含まれていれば比較できる */
    function _effDate(m){
      var ad=m.analysisDate||'';
      if(/^\d{4}-\d{2}-\d{2}$/.test(ad))return ad;
      var r=ad.match(/^(\d{4})(\d{2})(\d{2})$/);
      if(r)return r[1]+'-'+r[2]+'-'+r[3];
      var n=m.name||'';
      var r2=n.match(/(?:^|[_\-])(\d{4})-(\d{2})-(\d{2})/);
      if(r2)return r2[1]+'-'+r2[2]+'-'+r2[3];
      var r3=n.match(/_(\d{4})(\d{2})(\d{2})(?:[._]|$)/);
      if(r3)return r3[1]+'-'+r3[2]+'-'+r3[3];
      return '';
    }
    /* 有効日付で降順ソート、日付不明は savedAt 降順で後方へ */
    candidates.sort(function(a,b){
      var da=_effDate(a), db=_effDate(b);
      if(da&&db)return db.localeCompare(da);
      if(da)return -1;
      if(db)return 1;
      return (b.savedAt||0)-(a.savedAt||0);
    });
    /* 現在より前のチャートを探す (analysisDate or name から抽出した有効日付で比較) */
    var prev=null;
    if(currentDate){
      for(var i=0;i<candidates.length;i++){
        var cd=_effDate(candidates[i]);
        if(cd&&cd<currentDate){prev=candidates[i];break;}
      }
    }
    if(!prev&&!strictOnly){
      var curSavedAt=img.savedAt||0;
      var bySaved=candidates.slice().sort(function(a,b){return b.savedAt-a.savedAt;});
      for(var j=0;j<bySaved.length;j++){
        if(bySaved[j].savedAt<curSavedAt){prev=bySaved[j];break;}
      }
    }
    if(!prev&&!strictOnly&&candidates.length>0)prev=candidates[candidates.length-1];

    if(!prev){if(!silent)window.caToast('前日チャートが見つかりません','info');return;}
    function applyRef(d){
      setRefAnalysis({
        id:prev.id,ticker:prev.ticker,name:prev.name,
        analysisData:d.analysisData,
        analysisStrokes:migrateAnalysisStrokes(d.analysisStrokes,'ref'),

      if(!fbCfg2.url){window.caToast('前日チャートのデータが見つかりません','info');return;}

  /* ───────── シミュレーション(練習)モード ───────── */
  function _simTmin(t){var p=String(t).split(':');return (+p[0])*60+(+p[1]);}
  function simBarsForTf(){
    if(!analysisData)return [];
    return (analysisTf==='5m'?analysisData.bars_5m:analysisData.bars_1m)||[];
  }
  /* 当日足を開示カットオフ時刻まで slice (指標線は各足が値を持つので自動追従) */
  function simCutBars(arr){
    if(!simMode)return arr;
    if(simCutoffTm<0)return [];
    return (arr||[]).filter(function(b){return _simTmin(b.t)<=simCutoffTm;});
  }
  /* 現在の時間足で何本開示済みか (足は時刻昇順前提) */
  function simRevealedCount(){
    var arr=simBarsForTf();
    if(simCutoffTm<0)return 0;
    var n=0; for(var i=0;i<arr.length;i++){ if(_simTmin(arr[i].t)<=simCutoffTm)n++; else break; }
    return n;
  }
  /* n本目まで開示 (0=空)。カットオフは「時刻」で保持し tf切替でも整合 (スライダー用=絶対指定) */
  function simStepTo(count){
    var arr=simBarsForTf();
    count=Math.max(0,Math.min(arr.length,count));
    setSimCutoffTm(count<=0?-1:_simTmin(arr[count-1].t));
  }
  /* ←/→/キー用: 直近のカットオフ値から相対移動 (関数updaterで連打/オートリピートでもコマ落ちしない) */
  function simStepBy(delta){
    var arr=simBarsForTf();
    setSimCutoffTm(function(prevCut){
      var n=0;
      if(prevCut>=0){for(var i=0;i<arr.length;i++){ if(_simTmin(arr[i].t)<=prevCut)n++; else break; }}
      var nc=Math.max(0,Math.min(arr.length,n+delta));
      return nc<=0?-1:_simTmin(arr[nc-1].t);
    });
  }
  function simNext(){simStepBy(1);}
  function simPrev(){simStepBy(-1);}
  /* 起動時: 直前営業日を自動で ref(前日チャート) に連結 (過去日のみ・silent) */
  var simInitRef=useRef(false);

    if(simMode&&analysisData&&!simInitRef.current){
      simInitRef.current=true;

      else if(e.key==='ArrowLeft'){simPrev();e.preventDefault();}

  },[simMode,analysisTf,simCutoffTm]);
  /* 分割表示: 類似チャートをロードしてセット */
  function loadSplitChart(id){

      var dataBase=fbCfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts-data';
      var auth=fbCfg2.secret?'?auth='+fbCfg2.secret:'';

        .then(function(fbData){
          if(fbData&&fbData.analysisData)apply(fbData);
          else window.caToast('データが見つかりません','info');
        }).catch(function(){window.caToast('読込失敗','error');});

  /* 分割表示: 閉じるときに下チャートのストロークを保存 */
  function closeSplitView(){
    if(splitChart){
      caLoadDataAsync(splitChart.id,function(d){
        var nd=Object.assign({},d||{analysisData:splitChart.analysisData},{analysisStrokes:splitStrokes});

  /* 分割表示: ディバイダードラッグ */
  function onDividerMouseDown(e){
    e.preventDefault();e.stopPropagation();
    var startY=e.clientY,startRatio=splitRatio;
    function onMove(em){
      var el=splitContainerRef.current;

      /* 2026-04-20 C8: 楽観ロック pre-check
         remoteのts (version相当) を取得して自分のloadedSavedAtと比較
         remoteT > local → 別端末が先に書き込んだ → 競合、書き込み拒否でbanner */
      var tsPreUrl=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts/'+draftId+'.json'+auth;
      fetch(tsPreUrl).then(function(r){return r.ok?r.json():null;})
        .then(function(tsPre){
          var remoteT=tsPre&&tsPre.t;
          if(remoteT&&remoteT>loadedSavedAtRef.current+200){
            /* +200ms の grace period (自分直前の書き込みと端末時刻差を吸収) */
            setRemoteUpdate(true);
            setAutoSaveStatus(null);
            return;
          }
          doActualWrite();
        })
        .catch(function(){doActualWrite();}); /* pre-check失敗時は書き込み続行 (安全側) */

      function doActualWrite(){
        var draftBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts';
        var draftDataBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts-data';
        /* 2026-04-26: サムネ修正 A-E
           A. PUT→PATCH (既存キー thumbUrl/analysisDate を破壊しない)
           B. autoSave内で uploadThumbToStorage → thumbUrl を PATCH body に含める
           C. analysisDate を PATCH body に含める
           D. thumb(base64) を meta に書かない (IDBのみ)
           E. 毎回 generateAnalysisThumb で最新サムネ生成 */
        var _nowThumb=Date.now();
        var _shouldUpload=cfg2.storageBucket&&
          (!lastThumbUploadAtRef.current||(_nowThumb-lastThumbUploadAtRef.current>30000));
        function proceedWithThumb(thumb){
          if(thumb)caSaveThumb(draftId,thumb);  /* ローカル IDB のみ */
          var analysisDate=(analysisDataRef.current&&analysisDataRef.current.date)||'';
          var metaPatch={
            ticker:img._ticker||'',
            name:img._name||img.name||'chart',
            savedAt:savedAt

          if(analysisDate)metaPatch.analysisDate=analysisDate;
          function sendPatch(){
            fetch(draftBase+'/'+draftId+'.json'+auth,{method:'PATCH',
              headers:{'Content-Type':'application/json'},body:JSON.stringify(metaPatch)})
              .catch(function(e){console.error('draft meta sync:',e);});
          }
          if(_shouldUpload&&thumb){
            uploadThumbToStorage(cfg2,draftId,thumb).then(function(url){
              if(url){
                metaPatch.thumbUrl=url;
                lastThumbUploadAtRef.current=_nowThumb;
                lastThumbUrlRef.current=url;
              }
              sendPatch();
            }).catch(function(){sendPatch();});
          } else {
            sendPatch();  /* PATCH なので既存 thumbUrl は保持される */
          }
        }
        /* E: 毎回再生成 (cachedThumb優先ロジック撤去) */
        if(analysisDataRef.current){
          generateAnalysisThumb(analysisDataRef.current,function(thumb){proceedWithThumb(thumb||'');});
        } else {
          proceedWithThumb('');
        }
        // data — 2026-04-20 C8: _v を同梱 (polling側で競合検出に利用)
        var draftData={name:img._name||img.name||'chart',_v:savedAt};
        /* B2+: 分析データ同梱 */
        if(analysisDataRef.current)draftData.analysisData=analysisDataRef.current;
        /* B-drawing: 分析画面のストロークも同梱 (tf別オブジェクト) */
        if(analysisStrokesRef.current&&totalAnalysisStrokes(analysisStrokesRef.current)>0)draftData.analysisStrokes=analysisStrokesRef.current;
        var dataBody=JSON.stringify(draftData);fetch(draftDataBase+'/'+draftId+'.json'+auth,{method:'PUT',
          headers:{'Content-Type':'application/json'},body:dataBody})
          .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);
            setAutoSaveStatus('ok');setTimeout(function(){setAutoSaveStatus(null);},2000);

          .catch(function(e){console.error('draft data sync:',e);

        var tsBase=cfg2.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts';

  // ── 別端末同期ポーリング（60秒ごとにタイムスタンプを確認）──
  useEffect(function(){
    var cfg=props.fbCfg;
    var draftId=img._draftId;
    if(_fbIsPaused(cfg)||!draftId)return;
    var auth=cfg.secret?'?auth='+cfg.secret:'';
    var tsUrl=cfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-ts/'+draftId+'.json'+auth;
    var dataUrl=cfg.url.replace(/\/$/,'')+'/chart-annotator-drafts-data/'+draftId+'.json'+auth;

    function poll(){
      fetch(tsUrl).then(function(r){return r.ok?r.json():null;})
        .then(function(ts){
          if(!ts||!ts.t)return;
          var remoteT=ts.t;
          if(remoteT<=loadedSavedAtRef.current)return;
          var timeSinceCommit=Date.now()-lastLocalCommitRef.current;
          if(timeSinceCommit>45000){
            fetch(dataUrl).then(function(r){return r.ok?r.text():null;})
              .then(function(txt){
                if(!txt)return;var fbData; try{fbData=JSON.parse(txt);}catch(e){return;}
                if(!fbData||typeof fbData!=='object'||fbData.error)return;
                /* 2026-04-20 Step1: 画像mode strokes同期撤去 (分析データのみ同期) */
                /* B2+: 分析データも同期 (自動保存トリガーは skip) */
                if(fbData.analysisData!==undefined){
                  analysisDataInitSkip.current=true;
                  setAnalysisData(fbData.analysisData||null);
                }
                /* B-drawing: 分析ストロークも同期 */
                if(fbData.analysisStrokes!==undefined){
                  analysisStrokesInitSkip.current=true;
                  setAnalysisStrokes(migrateAnalysisStrokes(fbData.analysisStrokes,'cur'));
                }
                loadedSavedAtRef.current=remoteT;
                /* 2026-04-20 C8: pull成功 → loadedVersionも同期 (以後の書き込みpre-checkの基準) */
                loadedVersionRef.current=(typeof fbData._v==='number')?fbData._v:remoteT;
                setRemoteUpdate(false);
                setAutoSaveStatus('ok');
                setTimeout(function(){setAutoSaveStatus(null);},2000);
                /* 2026-04-20 Step1: sessionStorage strokes保存撤去 (画像mode廃止) */
              }).catch(function(){});
          } else {
            setRemoteUpdate(true);
          }
        }).catch(function(){});
    }

    /* 2026-04-20 C8: 楽観ロックと併用でポーリング間隔を5秒に短縮 (競合検出率向上) */
    /* 2026-04-29 案B: visibility連動 — タブ非表示時はポーリング停止、復帰時に即時1回poll+再開 */
    var timer=null;
    function start(){
      if(timer)return;
      poll(); // 即時1回 (復帰時に最新化)
      timer=setInterval(poll,5000);
    }
    function stop(){if(timer){clearInterval(timer);timer=null;}}
    function onVis(){if(document.hidden)stop();else start();}
    if(!document.hidden)timer=setInterval(poll,5000);
    document.addEventListener('visibilitychange',onVis);
    return function(){
      stop();
      document.removeEventListener('visibilitychange',onVis);
    };
  },[]);
  /* 分析モード用: ストローク変更を「現在のtfの履歴」に commit (C6: {cur,ref} 統合スナップショット)
     curStrokesObj: setAnalysisStrokes直後の全体オブジェクト
     refStrokesObj: setRefAnalysis直後の ref.analysisStrokes (refAnalysis無ければ null) */
  function analysisCommit(curStrokesObj, refStrokesObj){
    var tk=analysisTfRef.current||'1m';
    var curTfArr=((curStrokesObj&&curStrokesObj[tk])||[]).slice();
    /* refStrokesObj 未指定なら最新refAnalysisから取得 */
